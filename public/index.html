[hidden]{display:none!important}.mini{width:48px;height:48px;border-radius:15px;background:linear-gradient(140deg,var(--g1),var(--g2));display:grid;place-items:center;margin-bottom:16px;transition:.35s}.card:hover .mini{transform:rotate(-8deg) scale(1.08)}.dark .mini{background:linear-gradient(140deg,var(--g2),var(--g3))}.mini svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.legal{max-width:800px;padding-top:56px;padding-bottom:70px}.legal h1{font-size:clamp(34px,5vw,56px);margin:18px 0 8px}.legal h2{font-size:23px;margin:34px 0 10px}.legal p,.legal li{color:var(--mut)}.legal ul{padding-inline-start:22px;margin:8px 0}.legal li{margin:6px 0}.upd{font-size:14px;font-weight:700;color:var(--g2)}.back{font-weight:800;text-decoration:none;color:var(--g2)}

var T={uk:{title:"Useful Habit — Харчові добавки та комплекси: огляди, склад і особливості",desc:"Огляди харчових добавок і комплексів: склад, призначення компонентів, характеристики, застереження та порівняння продуктів різних виробників.",
nav:["Головна","Про нас","Огляди та статті","Поради","Як це працює","Важлива інформація"],
hk:"Інформація • Огляди • Продукти",h1:"Харчові добавки та комплекси: <em>огляди, склад і особливості</em>",hp:"Досліджуйте світ харчових добавок і спеціалізованих продуктів. Ми розбираємо склад, пояснюємо призначення компонентів, розглядаємо характеристики та застереження, порівнюємо комплекси й продукти різних виробників.<br><br>Зрозуміла інформація, практичні огляди та порівняння, які допомагають краще ознайомитися з асортиментом і зробити усвідомлений вибір.",c1:"Про нас",c2:"Як це працює",ch:["Добавки — не ліки","Комерційні зв’язки розкриті","Жодних гарантій результату"],
ak:"Про нас",at:"Хто ми і чим займаємося",al:"Useful Habit — вебсайт, який публікує власні огляди та гіди з харчових добавок. Ми розповідаємо лише про те, що відповідає дійсності, і не приписуємо собі кваліфікацій чи статусів, яких не можемо підтвердити.",
about:[["Місія","Пояснювати добавки зрозуміло й чесно, щоб ви могли порівняти варіанти та самостійно вирішити."],["Що ви отримуєте","Огляди простою мовою зі складом, призначенням, застереженнями та джерелами — й чіткі позначки на будь-якому комерційному контенті."],["Принципи","Ясність замість гучних слів. Жодних тверджень про лікування чи гарантований результат. Кожен комерційний зв’язок розкривається."],["Достовірність","Ми прагнемо до точної й актуальної інформації, спираємося на офіційні та первинні джерела, датуємо матеріали й оновлюємо або прибираємо застарілі."],["Комерційна модель","Сайт може просувати продукти третіх сторін, і ми можемо отримувати за це винагороду. Ми завжди повідомляємо про це в матеріалі, а винагорода не змінює фактів, які ми наводимо."],["Чим ми не є","Ми не аптека, не клініка й не медична установа та не надаємо медичних порад. Продукти постачають їхні продавці, які визначають ціну, умови та наявність."]],
rk:"Огляди та статті",rt:"Розбираємо добавки так, як розповіли б другу",rl:"Що написано на етикетці, що кажуть джерела і на що варто звернути увагу — все це в кожному огляді. Усі матеріали влаштовані однаково, тож порівнювати легко.",
inc:[["Що в складі","Що саме в баночці й у якій кількості — так, як вказав виробник, без красивих слів."],["Для чого призначена","Для чого добавку позиціонує виробник. Без обіцянок щось вилікувати."],["Що кажуть джерела","Дивимося на дослідження й офіційні дані та даємо посилання, щоб ви могли перевірити самі."],["Кому бути обережним","Вагітним, тим, хто приймає ліки чи має хронічні стани, — спершу до лікаря. Пишемо про це прямо."],["Ціна й умови","Скільки це коштує й на яких умовах продає продавець, із датою, коли ми це перевіряли."],["Чесно про заробіток","Якщо ми можемо отримати винагороду за продукт, ви прочитаєте про це на початку огляду."]],
tk:"Поради",tt:"Як обирати добавки з розумом",tl:"Прості звички, які допомагають не купитися на гучні слова. Це загальні освітні поради, а не персональні медичні рекомендації.",
tips:[["Читайте етикетку","Дивіться не лише на гучний напис спереду, а на склад і кількість на порцію."],["Це не ліки","Добавки не призначені для діагностики, лікування чи профілактики хвороб."],["Спитайте фахівця","Вагітні, ті, хто приймає ліки, і ті, хто має захворювання, — спершу до лікаря чи фармацевта."],["Остерігайтеся чудес","«Гарантовано», «миттєво», «лікує все» — тривожні сигнали. Як і відгуки, які неможливо перевірити."],["Перевіряйте продавця","Чи є зрозумілі контакти, умови повернення й повна ціна — до того, як платити?"],["Дивіться на дату","Рекомендації змінюються. Довіряйте матеріалам із датою та названими джерелами."]],

imp:[["Інформаційний характер","Огляди та гіди мають загальний освітній характер і не підлаштовані під конкретну людину."],["Не ліки і не медична порада","Добавки не є ліками і не призначені для діагностики, лікування чи профілактики будь-яких хвороб. Useful Habit не є медичною установою, а матеріали сайту не є медичною порадою."],["Без гарантій результату","Реакція організму індивідуальна. Ми не гарантуємо жодного результату."],["Комерційні зв’язки","Ми можемо отримувати винагороду від третіх сторін у зв’язку з продуктами, які розглядаємо. Це розкривається в самому матеріалі."],["Продавці та умови","Продукти постачають їхні продавці, які визначають ціну, умови та наявність. Перевіряйте їх самостійно перед покупкою."],["Відповідальність","У межах, дозволених чинним законодавством, ми не відповідаємо за контент, продукти чи послуги третіх сторін. Ніщо тут не обмежує відповідальності, яку неможливо обмежити законом, зокрема обов’язкових прав споживачів."],["Регіональна доступність","Правила щодо добавок відрізняються за країнами; деякі продукти чи твердження можуть бути заборонені не скрізь."],["Актуальність і зміни","Інформація може застаріти або змінитися без попередження."],["Дані та умови","Як ми працюємо з даними — у <a href=\"#privacy\">Політиці конфіденційності</a>, а правила користування сайтом — в <a href=\"#terms\">Умовах використання</a>."]],

legal:{privacy:{t:"Політика конфіденційності",s:[
["Загальні положення","Ця Політика пояснює, які персональні дані обробляє вебсайт Useful Habit (далі — «Сайт»), навіщо, на якій підставі, кому їх можуть передавати та які права ви маєте. Власник Сайту — Useful Habit (далі — «ми»). Контакт: useful.habit@outlook.com. Політику складено відповідно до Закону України «Про захист персональних даних». Користуючись Сайтом, ви підтверджуєте, що ознайомилися з нею. Якщо ви не згодні — припиніть користування Сайтом."],
["Дані, які ви надаєте самі","Ми отримуємо лише те, що ви вирішили надіслати:|ім’я, номер телефону, електронну пошту та текст повідомлення — якщо ви пишете нам листом або заповнюєте форму на Сайті;|будь-яку іншу інформацію, яку ви додали до звернення."],
["Дані, що збираються автоматично","Під час візиту можуть оброблятися:|IP-адреса, тип пристрою, браузер, мова, сторінки, які ви відкривали, час і тривалість візиту;|джерело переходу, зокрема UTM-мітки та рекламні ідентифікатори кліку (наприклад, gclid, fbclid);|файли cookie та подібні технології (розділ 7)."],
["Чого ми не збираємо","Ми не просимо й не збираємо дані про стан здоров’я, діагнози, переконання чи інші особливі категорії даних. Будь ласка, не вказуйте їх у формах і повідомленнях."],
["Цілі та підстави обробки","Ми обробляємо дані, щоб:|відповісти на ваш лист чи запит (підстава — ваша згода або дії на ваше прохання);|передати ваш запит партнеру чи продавцю продукту, якщо ви надіслали форму із відповідним повідомленням (підстава — ваша згода);|забезпечувати роботу та безпеку Сайту й запобігати шахрайству та автоматичним зверненням (необхідність захисту законних інтересів, якщо вони не порушують ваших прав);|аналізувати відвідуваність і вдосконалювати Сайт (лише за вашою згодою);|вимірювати ефективність реклами (лише за вашою згодою);|виконувати вимоги законодавства."],
["Кому ми можемо передавати дані","Ми не продаємо ваші дані. Вони можуть передаватися:|партнерам і продавцям продуктів — лише якщо ви самі надіслали їм запит через форму; про це сказано поруч із формою, а далі ці особи самостійно відповідають за обробку за своїми політиками;|постачальникам послуг (хостинг, пошта, захист від спаму, аналітика та рекламні системи, зокрема Google і Meta) — лише в обсязі, потрібному для їхніх послуг;|органам влади — коли цього вимагає закон.|Частина постачальників може перебувати поза Україною. У такому разі передача здійснюється з дотриманням законодавства про захист персональних даних."],
["Файли cookie","Cookie — невеликі файли в вашому браузері. Ми розрізняємо:|необхідні — для роботи Сайту (наприклад, збереження вибору мови), згоди не потребують;|аналітичні — показують, як використовують Сайт (наприклад, Google Analytics 4);|рекламні — вимірюють рекламу й показують релевантні оголошення (наприклад, Meta Pixel, Google Ads).|Аналітичні та рекламні cookie вмикаються лише після вашої згоди, яку можна змінити або відкликати будь-коли, а також у налаштуваннях браузера. Google і Meta обробляють дані за власними політиками, і ми не контролюємо цього."],
["Строки зберігання","Ми зберігаємо дані не довше, ніж потрібно для цілей обробки:|листування — до 3 років;|дані запитів із форм — до 12 місяців після останньої взаємодії, якщо закон чи розгляд спору не вимагають довше;|технічні журнали — до 12 місяців;|cookie — за строками в налаштуваннях згоди.|Після цього дані видаляються або знеособлюються."],
["Ваші права","Відповідно до статті 8 Закону України «Про захист персональних даних» ви маєте право:|знати про джерела збирання, місцезнаходження та мету обробки своїх даних;|отримувати інформацію про умови доступу до даних, зокрема про третіх осіб, яким їх передають;|на доступ до своїх даних;|вимагати зміни чи знищення даних, якщо вони недостовірні або обробляються незаконно;|відкликати згоду в будь-який час;|вносити застереження щодо обмеження обробки під час надання згоди;|звернутися зі скаргою до Уповноваженого Верховної Ради України з прав людини або до суду.|Щоб скористатися правами, напишіть на useful.habit@outlook.com. Ми відповімо у строки, встановлені законом."],
["Безпека","Ми застосовуємо розумні організаційні й технічні заходи: захищене з’єднання HTTPS та обмеження доступу до даних. Проте жодна передача інтернетом не є абсолютно безпечною."],
["Діти","Сайт не призначений для осіб віком до 18 років, і ми свідомо не збираємо їхніх даних. Якщо вам відомо, що дитина надіслала нам дані, напишіть — ми їх видалимо."],
["Зміни до Політики","Актуальна редакція завжди опублікована на цій сторінці з датою. Якщо зміни стосуються обробки, що потребує згоди, ми застосуємо їх лише після отримання нової згоди."],
["Контакти","З питань обробки даних пишіть на useful.habit@outlook.com."]]},
terms:{t:"Умови використання",s:[
["Загальні положення","Ці Умови регулюють користування сайтом Useful Habit (далі — «Сайт»). Користуючись Сайтом, ви погоджуєтеся з Умовами; якщо не погоджуєтеся — не користуйтеся Сайтом. Сайт призначений для осіб віком від 18 років."],
["Що таке Сайт","Сайт публікує огляди, статті та поради про харчові добавки в інформаційних цілях. Useful Habit не є виробником, продавцем чи постачальником добавок, аптекою чи медичним закладом і не здійснює продажу, доставки чи приймання платежів за такі продукти."],
["Не медична порада","Матеріали мають загальний освітній характер і не є медичною, фармацевтичною, дієтологічною чи іншою професійною порадою. Вони не призначені для діагностики, лікування чи профілактики захворювань. Харчові добавки не є лікарськими засобами. Перед застосуванням добавок, особливо під час вагітності, годування груддю, прийому ліків, за хронічних станів чи алергії, порадьтеся з лікарем. Не відкладайте звернення до лікаря і не припиняйте лікування через інформацію з Сайту."],
["Відсутність гарантій","Реакція організму індивідуальна. Ми не гарантуємо жодного результату від продуктів, про які йдеться на Сайті, а також повноти, безпомилковості чи актуальності матеріалів, хоча й прагнемо до цього."],
["Комерційні зв’язки","Сайт може містити посилання на ресурси третіх сторін і комерційні відносини з ними. Якщо ми можемо отримати винагороду (наприклад, комісію чи оплату за переданий запит або покупку), ми зазначаємо це в матеріалі до переходу за посиланням. Винагорода не змінює фактів, які ми наводимо, але ви маєте враховувати, що в нас може бути фінансова зацікавленість."],
["Сторонні ресурси й продукти","Ціни, умови, наявність, склад, маркування, доставку, повернення та якість товарів визначають і забезпечують їхні продавці та виробники. Договір купівлі-продажу ви укладаєте безпосередньо з ними, і для вас діють їхні умови та політики конфіденційності. Перевіряйте їх перед покупкою. Ми не контролюємо сторонні ресурси і не відповідаємо за їхній зміст чи дії."],
["Правила користування","Ви погоджуєтеся не:|використовувати Сайт у незаконних цілях чи з порушенням прав третіх осіб;|втручатися в роботу Сайту, обходити захист або збирати дані автоматизованими засобами без дозволу;|надсилати завідомо недостовірні дані чи дані інших осіб без їхньої згоди;|поширювати шкідливе програмне забезпечення."],
["Інтелектуальна власність","Тексти, дизайн, логотип Useful Habit та інші матеріали Сайту охороняються законодавством про авторське право. Копіювання, поширення й переробка без письмового дозволу заборонені, окрім цитування в межах, дозволених законом, із посиланням на Сайт. Назви та торгові марки продуктів належать їхнім власникам і згадуються лише для ідентифікації."],
["Відповідальність","У межах, дозволених чинним законодавством, ми не відповідаємо за збитки внаслідок використання інформації з Сайту, його недоступності чи дій третіх сторін. Ці Умови не обмежують відповідальності, яку не можна обмежити законом, і не позбавляють вас обов’язкових прав споживача."],
["Зміни","Ми можемо змінювати Сайт і ці Умови. Нова редакція діє з моменту публікації на цій сторінці з вказаною датою; продовження користування означає згоду з нею."],
["Право та спори","Ці Умови регулюються законодавством України. Спори вирішуються шляхом переговорів, а в разі неможливості — в суді відповідно до законодавства України."],
["Контакти","З будь-яких питань і скарг пишіть на useful.habit@outlook.com."]]}}}};

about:[["Mission","To explain supplements clearly and honestly, so you can compare options and decide for yourself."],["What you get","Plain-language reviews with composition, purpose, cautions and sources, and clear labels on any commercial content."],["Principles","Clarity over hype. No claims of cure or guaranteed results. Every commercial relationship is disclosed."],["Accuracy","We aim for accurate, current information, rely on official and primary sources, date our materials and update or remove outdated ones."],["Commercial model","The site may promote third-party products and we may receive compensation for it. We always say so in the material, and compensation does not change the facts we present."],["What we are not","We are not a pharmacy, clinic or medical institution and we do not give medical advice. Products are supplied by their sellers, who set price, terms and availability."]],

hk:"Информация • Обзоры • Продукты",h1:"Пищевые добавки и комплексы: <em>обзоры, состав и особенности</em>",hp:"Исследуйте мир пищевых добавок и специализированных продуктов. Мы разбираем состав, объясняем назначение компонентов, рассматриваем характеристики и предостережения, сравниваем комплексы и продукты разных производителей.<br><br>Понятная информация, практические обзоры и сравнения помогают лучше познакомиться с ассортиментом и сделать осознанный выбор.",c1:"О нас",c2:"Как это работает",ch:["Добавки — не лекарства","Коммерческие связи раскрыты","Никаких гарантий результата"],
ak:"О нас",at:"Кто мы и чем занимаемся",al:"Useful Habit — сайт, публикующий собственные обзоры и гайды по пищевым добавкам. Мы рассказываем только то, что соответствует действительности, и не приписываем себе квалификаций и статусов, которые не можем подтвердить.",
about:[["Миссия","Объяснять добавки понятно и честно, чтобы вы могли сравнить варианты и решить самостоятельно."],["Что вы получаете","Обзоры простым языком: состав, назначение, предостережения, источники и чёткие пометки на любом коммерческом контенте."],["Принципы","Ясность вместо громких слов. Никаких утверждений о лечении и гарантированном результате. Каждая коммерческая связь раскрывается."],["Достоверность","Мы стремимся к точной и актуальной информации, опираемся на официальные и первичные источники, датируем материалы и обновляем или убираем устаревшие."],["Коммерческая модель","Сайт может продвигать продукты третьих сторон, и мы можем получать за это вознаграждение. Мы всегда сообщаем об этом в материале, а вознаграждение не меняет приводимых нами фактов."],["Чем мы не являемся","Мы не аптека, не клиника и не медицинское учреждение и не даём медицинских советов. Продукты поставляют их продавцы, которые определяют цену, условия и наличие."]],
rk:"Обзоры и статьи",rt:"Разбираем добавки так, как рассказали бы другу",rl:"Что написано на этикетке, что говорят источники и на что стоит обратить внимание — всё это в каждом обзоре. Все материалы устроены одинаково, поэтому сравнивать легко.",
inc:[["Что в составе","Что именно в баночке и в каком количестве — так, как указал производитель, без красивых слов."],["Для чего предназначена","Для чего добавку позиционирует производитель. Без обещаний что-то вылечить."],["Что говорят источники","Смотрим на исследования и официальные данные и даём ссылки, чтобы вы могли проверить сами."],["Кому быть осторожным","Беременным, тем, кто принимает лекарства или имеет хронические состояния, — сначала к врачу. Пишем об этом прямо."],["Цена и условия","Сколько это стоит и на каких условиях продаёт продавец, с датой, когда мы это проверяли."],["Честно о заработке","Если мы можем получить вознаграждение за продукт, вы прочитаете об этом в начале обзора."]],
tk:"Советы",tt:"Как разумно выбирать добавки",tl:"Простые привычки, которые помогают не поддаться громким словам. Это общие образовательные советы, а не персональные медицинские рекомендации.",
tips:[["Читайте этикетку","Смотрите не только на громкую надпись спереди, но и на состав и количество на порцию."],["Это не лекарство","Добавки не предназначены для диагностики, лечения или профилактики болезней."],["Спросите специалиста","Беременным, принимающим лекарства и имеющим заболевания — сначала к врачу или фармацевту."],["Остерегайтесь чудес","«Гарантированно», «мгновенно», «лечит всё» — тревожные сигналы. Как и отзывы, которые невозможно проверить."],["Проверяйте продавца","Есть ли понятные контакты, условия возврата и полная цена до оплаты?"],["Смотрите на дату","Рекомендации меняются. Доверяйте материалам с датой и названными источниками."]],
tn:"Информация здесь не заменяет консультацию квалифицированного медицинского специалиста.",
wk:"Как это работает",wt:"Четыре шага, ничего скрытого",steps:[["Заходите и читаете","Открываете обзор или гайд и сразу видите, что это за продукт и что написано на этикетке."],["Сравниваете","Пользуетесь чек-листом: состав, предостережения, источники, условия продавца."],["Проверяете сами","Заглядываете в источники и на сайт продавца. Мы даём ссылки, а решение — за вами."],["Видите пометки","Если в материале есть партнёрская ссылка или мы можем получить вознаграждение, об этом чётко написано до перехода."]],
wn:"Наличие, цену и условия определяют продавцы. Useful Habit не продаёт, не доставляет и не контролирует сторонние продукты или услуги.",
ik:"Важная информация",it:"Простые факты об этом сайте",il:"Чем является этот сайт, как он может зарабатывать и где заканчивается наша ответственность.",
imp:[["Информационный характер","Обзоры и гайды носят общий образовательный характер и не подстроены под конкретного человека."],["Не лекарства и не медицинский совет","Добавки не являются лекарствами и не предназначены для диагностики, лечения или профилактики каких-либо болезней. Useful Habit не является медицинским учреждением, а материалы сайта не являются медицинским советом."],["Без гарантий результата","Реакция организма индивидуальна. Мы не гарантируем никакого результата."],["Коммерческие связи","Мы можем получать вознаграждение от третьих сторон в связи с рассматриваемыми продуктами. Это раскрывается в самом материале."],["Продавцы и условия","Продукты поставляют их продавцы, которые определяют цену, условия и наличие. Проверяйте их самостоятельно перед покупкой."],["Ответственность","В пределах, разрешённых действующим законодательством, мы не отвечаем за контент, продукты или услуги третьих сторон. Ничто здесь не ограничивает ответственность, которую нельзя ограничить законом, включая обязательные права потребителей."],["Региональная доступность","Правила в отношении добавок различаются по странам; некоторые продукты или утверждения могут быть разрешены не везде."],["Актуальность и изменения","Информация может устареть или измениться без предупреждения."],["Данные и условия","Как мы работаем с данными — в <a href=\"#privacy\">Политике конфиденциальности</a>, а правила пользования сайтом — в <a href=\"#terms\">Условиях использования</a>."]],
in:"Эта страница описывает реальную деятельность сайта. Она не служит способом избежать ответственности или рекламных правил.",
fd:"Обзоры и гайды по пищевым добавкам простым языком.",fh1:"Навигация",fh2:"Правовая информация",fh3:"Контакты",fp:"Политика конфиденциальности",ft:"Условия использования",fr:"Все права защищены.",back:"← На главную",upd:"Редакция от 30 октября 2026 года",lnote:"Правовые документы пока доступны только на украинском языке."};
T.pl={title:"Useful Habit — Suplementy diety i kompleksy: recenzje, skład i cechy",desc:"Recenzje suplementów diety i kompleksów: skład, przeznaczenie składników, charakterystyka, przeciwwskazania i porównania produktów różnych producentów.",
nav:["Strona główna","O nas","Recenzje i artykuły","Porady","Jak to działa","Ważne informacje"],
hk:"Informacje • Recenzje • Produkty",h1:"Suplementy diety i kompleksy: <em>recenzje, skład i cechy</em>",hp:"Poznaj świat suplementów diety i produktów specjalistycznych. Analizujemy skład, wyjaśniamy przeznaczenie składników, omawiamy cechy i zastrzeżenia oraz porównujemy kompleksy i produkty różnych producentów.<br><br>Zrozumiałe informacje, praktyczne recenzje i porównania pomagają lepiej poznać ofertę i dokonać świadomego wyboru.",c1:"O nas",c2:"Jak to działa",ch:["Suplementy nie są lekami","Powiązania komercyjne ujawnione","Brak gwarancji efektów"],
ak:"O nas",at:"Kim jesteśmy i czym się zajmujemy",al:"Useful Habit to serwis publikujący własne recenzje i poradniki o suplementach diety. Mówimy tylko to, co zgadza się z prawdą, i nie przypisujemy sobie kwalifikacji ani statusu, których nie możemy potwierdzić.",
about:[["Misja","Wyjaśniać suplementy jasno i uczciwie, abyś mógł porównać opcje i zdecydować samodzielnie."],["Co zyskujesz","Recenzje prostym językiem: skład, przeznaczenie, zastrzeżenia, źródła i wyraźne oznaczenia treści komercyjnych."],["Zasady","Jasność zamiast głośnych słów. Żadnych twierdzeń o leczeniu ani gwarantowanym efekcie. Każda relacja komercyjna jest ujawniona."],["Rzetelność","Dążymy do dokładnych i aktualnych informacji, opieramy się na źródłach oficjalnych i pierwotnych, datujemy materiały i aktualizujemy lub usuwamy nieaktualne."],["Model komercyjny","Serwis może promować produkty podmiotów trzecich, a my możemy otrzymywać za to wynagrodzenie. Zawsze informujemy o tym w materiale, a wynagrodzenie nie zmienia przedstawianych faktów."],["Czym nie jesteśmy","Nie jesteśmy apteką, kliniką ani placówką medyczną i nie udzielamy porad medycznych. Produkty dostarczają ich sprzedawcy, którzy ustalają cenę, warunki i dostępność."]],
rk:"Recenzje i artykuły",rt:"Omawiamy suplementy tak, jak wyjaśnilibyśmy je przyjacielowi",rl:"Co jest na etykiecie, co mówią źródła i na co warto zwrócić uwagę — każda recenzja to zawiera. Wszystkie materiały mają tę samą strukturę, więc łatwo je porównywać.",
inc:[["Co jest w składzie","Co dokładnie jest w opakowaniu i w jakiej ilości — tak, jak podał producent, bez ozdobników."],["Do czego służy","Do czego producent przeznacza suplement. Bez obietnic wyleczenia czegokolwiek."],["Co mówią źródła","Sprawdzamy badania i dane oficjalne oraz podajemy linki, abyś mógł zweryfikować samodzielnie."],["Kto powinien uważać","Kobiety w ciąży, osoby przyjmujące leki lub z chorobami przewlekłymi — najpierw lekarz. Piszemy o tym wprost."],["Cena i warunki","Ile kosztuje i na jakich warunkach oferuje to sprzedawca, z datą sprawdzenia."],["Uczciwie o zarobku","Jeśli możemy zarobić na produkcie, przeczytasz o tym na początku recenzji."]],
tk:"Porady",tt:"Jak rozsądnie wybierać suplementy",tl:"Proste nawyki, które pomagają nie dać się nabrać na głośne hasła. To ogólne porady edukacyjne, a nie indywidualne zalecenia medyczne.",
tips:[["Czytaj etykietę","Patrz nie tylko na głośne hasło z przodu, ale na skład i ilość w porcji."],["To nie lek","Suplementy nie służą do diagnozowania, leczenia ani zapobiegania chorobom."],["Zapytaj specjalistę","Kobiety w ciąży, osoby przyjmujące leki i chorujące — najpierw lekarz lub farmaceuta."],["Uważaj na cuda","„Gwarantowane”, „natychmiast”, „leczy wszystko” to sygnały ostrzegawcze. Podobnie jak opinie, których nie da się zweryfikować."],["Sprawdź sprzedawcę","Czy są jasne dane kontaktowe, warunki zwrotu i pełna cena przed zapłatą?"],["Zwróć uwagę na datę","Zalecenia się zmieniają. Ufaj materiałom z datą i podanymi źródłami."]],
tn:"Informacje tutaj nie zastępują konsultacji z wykwalifikowanym pracownikiem ochrony zdrowia.",
wk:"Jak to działa",wt:"Cztery kroki, nic ukrytego",steps:[["Wchodzisz i czytasz","Otwierasz recenzję lub poradnik i od razu widzisz, co to za produkt i co jest na etykiecie."],["Porównujesz","Korzystasz z listy kontrolnej: skład, zastrzeżenia, źródła, warunki sprzedawcy."],["Sprawdzasz sam","Zaglądasz do źródeł i na stronę sprzedawcy. My dajemy linki, decyzja należy do Ciebie."],["Widzisz oznaczenia","Jeśli materiał zawiera link partnerski lub możemy otrzymać wynagrodzenie, jest to wyraźnie napisane przed kliknięciem."]],
wn:"Dostępność, cenę i warunki określają sprzedawcy. Useful Habit nie sprzedaje, nie dostarcza ani nie kontroluje produktów i usług podmiotów trzecich.",
ik:"Ważne informacje",it:"Proste fakty o tym serwisie",il:"Czym jest ten serwis, jak może zarabiać i gdzie kończy się nasza odpowiedzialność.",
imp:[["Charakter informacyjny","Recenzje i poradniki mają charakter ogólny i edukacyjny i nie są dostosowane do konkretnej osoby."],["To nie leki ani porada medyczna","Suplementy nie są lekami i nie służą do diagnozowania, leczenia ani zapobiegania żadnym chorobom. Useful Habit nie jest placówką medyczną, a materiały serwisu nie stanowią porady medycznej."],["Brak gwarancji efektów","Reakcje organizmu są indywidualne. Nie gwarantujemy żadnego rezultatu."],["Powiązania komercyjne","Możemy otrzymywać wynagrodzenie od podmiotów trzecich w związku z omawianymi produktami. Jest to ujawniane w samym materiale."],["Sprzedawcy i warunki","Produkty dostarczają ich sprzedawcy, którzy ustalają cenę, warunki i dostępność. Sprawdź je samodzielnie przed zakupem."],["Odpowiedzialność","W granicach dozwolonych obowiązującym prawem nie odpowiadamy za treści, produkty ani usługi podmiotów trzecich. Nic tu nie ogranicza odpowiedzialności, której nie można ograniczyć prawem, w tym obowiązkowych praw konsumentów."],["Dostępność regionalna","Przepisy dotyczące suplementów różnią się w zależności od kraju; niektóre produkty lub twierdzenia mogą nie być dozwolone wszędzie."],["Aktualność i zmiany","Informacje mogą się zdezaktualizować lub zmienić bez uprzedzenia."],["Dane i warunki","Sposób postępowania z danymi opisuje <a href=\"#privacy\">Polityka prywatności</a>, a zasady korzystania z serwisu — <a href=\"#terms\">Warunki korzystania</a>."]],
in:"Ta strona opisuje rzeczywistą działalność serwisu. Nie służy do unikania odpowiedzialności ani zasad reklamowych.",
fd:"Recenzje i poradniki o suplementach diety prostym językiem.",fh1:"Nawigacja",fh2:"Informacje prawne",fh3:"Kontakt",fp:"Polityka prywatności",ft:"Warunki korzystania",fr:"Wszelkie prawa zastrzeżone.",back:"← Na stronę główną",upd:"Wersja z 30 października 2026 r.",lnote:"Dokumenty prawne są obecnie dostępne tylko w języku ukraińskim."};
T.es={title:"Useful Habit — Suplementos alimenticios y complejos: reseñas, composición y características",desc:"Reseñas de suplementos alimenticios y complejos: composición, finalidad de los componentes, características, advertencias y comparación de productos de distintos fabricantes.",
nav:["Inicio","Sobre nosotros","Reseñas y artículos","Consejos","Cómo funciona","Información importante"],
hk:"Información • Reseñas • Productos",h1:"Suplementos alimenticios y complejos: <em>reseñas, composición y características</em>",hp:"Explora el mundo de los suplementos alimenticios y los productos especializados. Analizamos la composición, explicamos para qué sirve cada componente, repasamos características y advertencias y comparamos complejos y productos de distintos fabricantes.<br><br>Información clara, reseñas prácticas y comparaciones que te ayudan a conocer la oferta y a elegir con criterio.",c1:"Sobre nosotros",c2:"Cómo funciona",ch:["Los suplementos no son medicamentos","Vínculos comerciales declarados","Sin garantía de resultados"],
ak:"Sobre nosotros",at:"Quiénes somos y qué hacemos",al:"Useful Habit es un sitio web que publica reseñas y guías propias sobre suplementos alimenticios. Contamos solo lo que se ajusta a la realidad y no nos atribuimos cualificaciones ni estatus que no podamos acreditar.",
about:[["Misión","Explicar los suplementos con claridad y honestidad para que puedas comparar opciones y decidir por ti mismo."],["Qué obtienes","Reseñas en lenguaje sencillo con composición, finalidad, advertencias y fuentes, y etiquetas claras en cualquier contenido comercial."],["Principios","Claridad antes que grandes palabras. Sin afirmaciones de curación ni de resultados garantizados. Cada relación comercial se declara."],["Veracidad","Buscamos información precisa y actual, nos basamos en fuentes oficiales y primarias, fechamos los materiales y actualizamos o retiramos los que quedan obsoletos."],["Modelo comercial","El sitio puede promocionar productos de terceros y podemos recibir una compensación por ello. Siempre lo indicamos en el material, y la compensación no cambia los hechos que presentamos."],["Lo que no somos","No somos una farmacia, clínica ni institución médica y no damos consejo médico. Los productos los suministran sus vendedores, que fijan precio, condiciones y disponibilidad."]],
rk:"Reseñas y artículos",rt:"Analizamos los suplementos como se lo explicaríamos a un amigo",rl:"Qué dice la etiqueta, qué dicen las fuentes y a qué conviene prestar atención: todo eso está en cada reseña. Todos los materiales tienen la misma estructura, así que comparar es fácil.",
inc:[["Qué contiene","Qué hay exactamente en el bote y en qué cantidad, según indica el fabricante, sin palabras grandilocuentes."],["Para qué está pensado","Para qué lo presenta el fabricante. Sin promesas de curar nada."],["Qué dicen las fuentes","Revisamos estudios y datos oficiales y damos enlaces para que puedas comprobarlo tú mismo."],["Quién debe tener cuidado","Embarazadas, personas que toman medicamentos o con afecciones crónicas: primero al médico. Lo decimos claramente."],["Precio y condiciones","Cuánto cuesta y en qué condiciones lo ofrece el vendedor, con la fecha en que lo comprobamos."],["Claros sobre lo que ganamos","Si podemos obtener ingresos por un producto, lo leerás al principio de la reseña."]],
tk:"Consejos",tt:"Cómo elegir suplementos con criterio",tl:"Hábitos sencillos para no dejarse llevar por las grandes palabras. Son consejos educativos generales, no recomendaciones médicas personales.",
tips:[["Lee la etiqueta","No te quedes con el eslogan de la parte frontal: mira la composición y la cantidad por porción."],["No es un medicamento","Los suplementos no sirven para diagnosticar, tratar ni prevenir enfermedades."],["Consulta a un profesional","Si estás embarazada, tomas medicamentos o tienes una afección, primero habla con un médico o farmacéutico."],["Cuidado con los milagros","«Garantizado», «al instante», «lo cura todo» son señales de alerta. También las opiniones imposibles de verificar."],["Comprueba al vendedor","¿Hay contacto claro, condiciones de devolución y precio total antes de pagar?"],["Mira la fecha","Las recomendaciones cambian. Confía en materiales con fecha y fuentes citadas."]],
tn:"La información aquí no sustituye la consulta con un profesional sanitario cualificado.",
wk:"Cómo funciona",wt:"Cuatro pasos, nada oculto",steps:[["Entras y lees","Abres una reseña o guía y ves enseguida qué producto es y qué dice la etiqueta."],["Comparas","Usas la lista de comprobación: composición, advertencias, fuentes, condiciones del vendedor."],["Compruebas tú mismo","Consultas las fuentes y la web del vendedor. Nosotros damos los enlaces; la decisión es tuya."],["Ves las etiquetas","Si el material incluye un enlace de afiliado o podemos recibir una compensación, se indica con claridad antes de hacer clic."]],
wn:"La disponibilidad, el precio y las condiciones los determinan los vendedores. Useful Habit no vende, no entrega ni controla productos o servicios de terceros.",
ik:"Información importante",it:"Datos claros sobre este sitio",il:"Qué es este sitio, cómo puede obtener ingresos y dónde termina nuestra responsabilidad.",
imp:[["Carácter informativo","Las reseñas y guías son generales y educativas y no están adaptadas a una persona concreta."],["No son medicamentos ni consejo médico","Los suplementos no son medicamentos ni sirven para diagnosticar, tratar, curar o prevenir enfermedades. Useful Habit no es una institución médica y sus materiales no constituyen consejo médico."],["Sin garantía de resultados","La respuesta del organismo es individual. No garantizamos ningún resultado."],["Relaciones comerciales","Podemos recibir compensación de terceros en relación con los productos que tratamos. Se indica en el propio material."],["Vendedores y condiciones","Los productos los suministran sus vendedores, que fijan precio, condiciones y disponibilidad. Compruébalos tú mismo antes de comprar."],["Responsabilidad","En la medida permitida por la ley aplicable, no respondemos por contenidos, productos o servicios de terceros. Nada aquí limita la responsabilidad que no pueda limitarse por ley, incluidos los derechos obligatorios de los consumidores."],["Disponibilidad regional","Las normas sobre suplementos varían según el país; algunos productos o afirmaciones pueden no estar permitidos en todas partes."],["Vigencia y cambios","La información puede quedar obsoleta o cambiar sin previo aviso."],["Datos y condiciones","Cómo tratamos los datos se describe en la <a href=\"#privacy\">Política de privacidad</a>, y las normas de uso del sitio en los <a href=\"#terms\">Términos de uso</a>."]],

T.pt={title:"Useful Habit — Suplementos alimentares e complexos: análises, composição e características",desc:"Análises de suplementos alimentares e complexos: composição, finalidade dos componentes, características, advertências e comparação de produtos de diferentes fabricantes.",

hk:"Informação • Análises • Produtos",h1:"Suplementos alimentares e complexos: <em>análises, composição e características</em>",hp:"Explore o mundo dos suplementos alimentares e dos produtos especializados. Analisamos a composição, explicamos a finalidade de cada componente, abordamos características e advertências e comparamos complexos e produtos de diferentes fabricantes.<br><br>Informação clara, análises práticas e comparações que ajudam a conhecer a oferta e a fazer uma escolha consciente.",c1:"Sobre nós",c2:"Como funciona",ch:["Suplementos não são medicamentos","Ligações comerciais divulgadas","Sem garantia de resultados"],
ak:"Sobre nós",at:"Quem somos e o que fazemos",al:"A Useful Habit é um site que publica análises e guias próprios sobre suplementos alimentares. Contamos apenas o que corresponde à verdade e não atribuímos a nós mesmos qualificações ou estatutos que não possamos comprovar.",
about:[["Missão","Explicar os suplementos com clareza e honestidade, para que possa comparar opções e decidir por si."],["O que recebe","Análises em linguagem simples com composição, finalidade, advertências e fontes, e indicações claras em qualquer conteúdo comercial."],["Princípios","Clareza em vez de palavras ruidosas. Sem afirmações de cura nem de resultados garantidos. Toda a relação comercial é divulgada."],["Rigor","Procuramos informação exata e atual, apoiamo-nos em fontes oficiais e primárias, datamos os materiais e atualizamos ou retiramos os desatualizados."],["Modelo comercial","O site pode promover produtos de terceiros e podemos receber uma compensação por isso. Indicamo-lo sempre no material, e a compensação não altera os factos que apresentamos."],["O que não somos","Não somos uma farmácia, clínica ou instituição médica e não damos aconselhamento médico. Os produtos são fornecidos pelos seus vendedores, que definem preço, condições e disponibilidade."]],
rk:"Análises e artigos",rt:"Analisamos os suplementos como os explicaríamos a um amigo",rl:"O que diz o rótulo, o que dizem as fontes e o que merece atenção — cada análise inclui tudo isso. Todos os materiais têm a mesma estrutura, por isso comparar é fácil.",
inc:[["O que contém","O que há exatamente no frasco e em que quantidade, como indica o fabricante, sem palavras bonitas."],["Para que serve","Para que o fabricante apresenta o suplemento. Sem promessas de curar o que quer que seja."],["O que dizem as fontes","Vemos estudos e dados oficiais e damos ligações para que possa verificar por si."],["Quem deve ter cuidado","Grávidas, pessoas que tomam medicamentos ou com doenças crónicas — primeiro o médico. Dizemo-lo diretamente."],["Preço e condições","Quanto custa e em que condições o vendedor o oferece, com a data em que verificámos."],["Honestos sobre o que ganhamos","Se pudermos ganhar com um produto, lerá isso no início da análise."]],
tk:"Dicas",tt:"Como escolher suplementos com juízo",tl:"Hábitos simples que ajudam a não cair em palavras ruidosas. São dicas educativas gerais, não recomendações médicas pessoais.",
tips:[["Leia o rótulo","Não se fique pelo slogan da frente: veja a composição e a quantidade por dose."],["Não é um medicamento","Os suplementos não servem para diagnosticar, tratar nem prevenir doenças."],["Pergunte a um profissional","Se está grávida, toma medicamentos ou tem uma doença, fale primeiro com um médico ou farmacêutico."],["Cuidado com milagres","«Garantido», «instantâneo», «cura tudo» são sinais de alerta. Tal como opiniões impossíveis de verificar."],["Verifique o vendedor","Há contactos claros, condições de devolução e preço total antes de pagar?"],["Veja a data","As recomendações mudam. Confie em materiais com data e fontes indicadas."]],
tn:"A informação aqui não substitui a consulta com um profissional de saúde qualificado.",
wk:"Como funciona",wt:"Quatro passos, nada escondido",steps:[["Entra e lê","Abre uma análise ou guia e vê logo que produto é e o que diz o rótulo."],["Compara","Usa a lista de verificação: composição, advertências, fontes, condições do vendedor."],["Verifica por si","Consulta as fontes e o site do vendedor. Nós damos as ligações; a decisão é sua."],["Vê as indicações","Se o material tem uma ligação de parceiro ou podemos receber compensação, isso está escrito com clareza antes de clicar."]],
wn:"A disponibilidade, o preço e as condições são definidos pelos vendedores. A Useful Habit não vende, não entrega nem controla produtos ou serviços de terceiros.",
ik:"Informação importante",it:"Factos simples sobre este site",il:"O que é este site, como pode ganhar dinheiro e onde termina a nossa responsabilidade.",
imp:[["Carácter informativo","As análises e os guias são gerais e educativos e não estão adaptados a uma pessoa em concreto."],["Não são medicamentos nem aconselhamento médico","Os suplementos não são medicamentos e não se destinam a diagnosticar, tratar, curar ou prevenir doenças. A Useful Habit não é uma instituição médica e os seus materiais não constituem aconselhamento médico."],["Sem garantia de resultados","A resposta do organismo é individual. Não garantimos qualquer resultado."],["Relações comerciais","Podemos receber compensação de terceiros relacionada com os produtos que abordamos. Isto é divulgado no próprio material."],["Vendedores e condições","Os produtos são fornecidos pelos seus vendedores, que definem preço, condições e disponibilidade. Verifique-os por si antes de comprar."],["Responsabilidade","Na medida permitida pela lei aplicável, não nos responsabilizamos por conteúdos, produtos ou serviços de terceiros. Nada aqui limita a responsabilidade que não pode ser limitada por lei, incluindo os direitos obrigatórios dos consumidores."],["Disponibilidade regional","As regras sobre suplementos variam consoante o país; alguns produtos ou alegações podem não ser permitidos em todo o lado."],["Atualidade e alterações","A informação pode ficar desatualizada ou mudar sem aviso."],["Dados e condições","O tratamento de dados está descrito na <a href=\"#privacy\">Política de privacidade</a> e as regras de utilização do site nos <a href=\"#terms\">Termos de utilização</a>."]],
in:"Esta página descreve a atividade real do site. Não serve para evitar responsabilidade nem regras de publicidade.",

T.fr={title:"Useful Habit — Compléments alimentaires et complexes : avis, composition et caractéristiques",desc:"Avis sur les compléments alimentaires et complexes : composition, rôle des composants, caractéristiques, mises en garde et comparaison de produits de différents fabricants.",
nav:["Accueil","À propos","Avis et articles","Conseils","Comment ça marche","Informations importantes"],
hk:"Information • Avis • Produits",h1:"Compléments alimentaires et complexes : <em>avis, composition et caractéristiques</em>",hp:"Explorez le monde des compléments alimentaires et des produits spécialisés. Nous décortiquons la composition, expliquons le rôle de chaque composant, examinons les caractéristiques et les mises en garde, et comparons les complexes et produits de différents fabricants.<br><br>Une information claire, des avis pratiques et des comparaisons pour mieux connaître l’offre et faire un choix éclairé.",c1:"À propos",c2:"Comment ça marche",ch:["Les compléments ne sont pas des médicaments","Liens commerciaux divulgués","Aucune garantie de résultat"],
ak:"À propos",at:"Qui nous sommes et ce que nous faisons",al:"Useful Habit est un site qui publie ses propres avis et guides sur les compléments alimentaires. Nous ne disons que ce qui est vrai et ne nous attribuons aucune qualification ni statut que nous ne pouvons justifier.",
about:[["Mission","Expliquer les compléments avec clarté et honnêteté, pour que vous puissiez comparer les options et décider par vous-même."],["Ce que vous obtenez","Des avis en langage simple avec composition, usage, mises en garde et sources, et des mentions claires sur tout contenu commercial."],["Principes","La clarté plutôt que les grands mots. Aucune promesse de guérison ni de résultat garanti. Chaque lien commercial est divulgué."],["Fiabilité","Nous visons une information exacte et à jour, nous appuyons sur des sources officielles et primaires, datons nos contenus et mettons à jour ou retirons ceux qui sont obsolètes."],["Modèle commercial","Le site peut promouvoir des produits de tiers et nous pouvons percevoir une rémunération. Nous l’indiquons toujours dans le contenu, et la rémunération ne change pas les faits présentés."],["Ce que nous ne sommes pas","Nous ne sommes ni une pharmacie, ni une clinique, ni un établissement médical et ne donnons pas de conseils médicaux. Les produits sont fournis par leurs vendeurs, qui fixent prix, conditions et disponibilité."]],
rk:"Avis et articles",rt:"Nous décortiquons les compléments comme nous les expliquerions à un ami",rl:"Ce que dit l’étiquette, ce que disent les sources et ce qui mérite votre attention : chaque avis le couvre. Tous les contenus suivent la même structure, ce qui facilite la comparaison.",
inc:[["Ce qu’il contient","Ce qu’il y a exactement dans le pot et en quelle quantité, tel qu’indiqué par le fabricant, sans belles formules."],["À quoi il sert","L’usage que le fabricant lui donne. Sans promesse de guérir quoi que ce soit."],["Ce que disent les sources","Nous examinons les études et données officielles et donnons des liens pour que vous puissiez vérifier."],["Qui doit être prudent","Femmes enceintes, personnes sous traitement ou atteintes de maladies chroniques : d’abord le médecin. Nous le disons clairement."],["Prix et conditions","Combien cela coûte et à quelles conditions le vendeur le propose, avec la date de vérification."],["Honnêtes sur nos revenus","Si nous pouvons gagner de l’argent sur un produit, vous le lirez au début de l’avis."]],
tk:"Conseils",tt:"Comment bien choisir ses compléments",tl:"Des habitudes simples pour ne pas se laisser séduire par les grands mots. Ce sont des conseils éducatifs généraux, pas des recommandations médicales personnelles.",
tips:[["Lisez l’étiquette","Ne vous arrêtez pas au slogan de face : regardez la composition et la quantité par portion."],["Ce n’est pas un médicament","Les compléments ne servent pas à diagnostiquer, traiter ou prévenir des maladies."],["Demandez à un professionnel","Si vous êtes enceinte, prenez des médicaments ou avez une maladie, consultez d’abord un médecin ou un pharmacien."],["Méfiez-vous des miracles","« Garanti », « instantané », « guérit tout » sont des signaux d’alerte. Tout comme les avis invérifiables."],["Vérifiez le vendeur","Y a-t-il des contacts clairs, des conditions de retour et le prix total avant de payer ?"],["Regardez la date","Les recommandations évoluent. Fiez-vous aux contenus datés et aux sources citées."]],
tn:"Les informations ici ne remplacent pas la consultation d’un professionnel de santé qualifié.",
wk:"Comment ça marche",wt:"Quatre étapes, rien de caché",steps:[["Vous lisez","Vous ouvrez un avis ou un guide et voyez tout de suite de quel produit il s’agit et ce que dit l’étiquette."],["Vous comparez","Vous utilisez la liste de contrôle : composition, mises en garde, sources, conditions du vendeur."],["Vous vérifiez","Vous consultez les sources et le site du vendeur. Nous donnons les liens, la décision vous appartient."],["Vous voyez les mentions","Si un contenu comporte un lien partenaire ou si nous pouvons percevoir une rémunération, c’est indiqué clairement avant le clic."]],
wn:"La disponibilité, le prix et les conditions sont fixés par les vendeurs. Useful Habit ne vend, ne livre ni ne contrôle les produits ou services de tiers.",
ik:"Informations importantes",it:"Des faits simples sur ce site",il:"Ce qu’est ce site, comment il peut gagner de l’argent et où s’arrête notre responsabilité.",
imp:[["Nature informative","Les avis et guides sont généraux et éducatifs et ne sont pas adaptés à une personne en particulier."],["Pas des médicaments, pas un avis médical","Les compléments ne sont pas des médicaments et ne sont pas destinés à diagnostiquer, traiter, guérir ou prévenir une maladie. Useful Habit n’est pas un établissement médical et ses contenus ne constituent pas un avis médical."],["Aucune garantie de résultat","La réponse de l’organisme est individuelle. Nous ne garantissons aucun résultat."],["Relations commerciales","Nous pouvons recevoir une rémunération de tiers en lien avec les produits traités. Cela est indiqué dans le contenu même."],["Vendeurs et conditions","Les produits sont fournis par leurs vendeurs, qui fixent prix, conditions et disponibilité. Vérifiez-les vous-même avant d’acheter."],["Responsabilité","Dans la mesure permise par la loi applicable, nous ne sommes pas responsables des contenus, produits ou services de tiers. Rien ici ne limite une responsabilité qui ne peut l’être légalement, y compris les droits impératifs des consommateurs."],["Disponibilité régionale","Les règles sur les compléments varient selon les pays ; certains produits ou allégations peuvent ne pas être autorisés partout."],["Actualité et modifications","Les informations peuvent devenir obsolètes ou changer sans préavis."],["Données et conditions","Le traitement des données est décrit dans la <a href=\"#privacy\">Politique de confidentialité</a> et les règles d’utilisation du site dans les <a href=\"#terms\">Conditions d’utilisation</a>."]],
in:"Cette page décrit l’activité réelle du site. Elle ne sert pas à échapper à la responsabilité ni aux règles publicitaires.",
fd:"Avis et guides sur les compléments alimentaires en langage simple.",fh1:"Navigation",fh2:"Mentions légales",fh3:"Contact",fp:"Politique de confidentialité",ft:"Conditions d’utilisation",fr:"Tous droits réservés.",back:"← Retour à l’accueil",upd:"Version du 30 octobre 2026",lnote:"Les documents juridiques ne sont actuellement disponibles qu’en ukrainien."};
T.it={title:"Useful Habit — Integratori alimentari e complessi: recensioni, composizione e caratteristiche",desc:"Recensioni di integratori alimentari e complessi: composizione, funzione dei componenti, caratteristiche, avvertenze e confronto tra prodotti di diversi produttori.",
nav:["Home","Chi siamo","Recensioni e articoli","Consigli","Come funziona","Informazioni importanti"],
hk:"Informazione • Recensioni • Prodotti",h1:"Integratori alimentari e complessi: <em>recensioni, composizione e caratteristiche</em>",hp:"Scopri il mondo degli integratori alimentari e dei prodotti specializzati. Analizziamo la composizione, spieghiamo a cosa serve ogni componente, esaminiamo caratteristiche e avvertenze e confrontiamo complessi e prodotti di diversi produttori.<br><br>Informazioni chiare, recensioni pratiche e confronti che aiutano a conoscere l’offerta e a scegliere in modo consapevole.",c1:"Chi siamo",c2:"Come funziona",ch:["Gli integratori non sono farmaci","Legami commerciali dichiarati","Nessuna garanzia di risultato"],
ak:"Chi siamo",at:"Chi siamo e cosa facciamo",al:"Useful Habit è un sito che pubblica recensioni e guide proprie sugli integratori alimentari. Diciamo solo ciò che corrisponde al vero e non ci attribuiamo qualifiche o titoli che non possiamo dimostrare.",
about:[["Missione","Spiegare gli integratori in modo chiaro e onesto, così da poter confrontare le opzioni e decidere da soli."],["Cosa ottieni","Recensioni in linguaggio semplice con composizione, funzione, avvertenze e fonti, e indicazioni chiare su ogni contenuto commerciale."],["Principi","Chiarezza anziché paroloni. Nessuna promessa di guarigione o di risultati garantiti. Ogni rapporto commerciale è dichiarato."],["Affidabilità","Puntiamo a informazioni accurate e aggiornate, ci basiamo su fonti ufficiali e primarie, datiamo i materiali e aggiorniamo o rimuoviamo quelli superati."],["Modello commerciale","Il sito può promuovere prodotti di terzi e possiamo ricevere un compenso. Lo indichiamo sempre nel contenuto e il compenso non cambia i fatti che presentiamo."],["Cosa non siamo","Non siamo una farmacia, una clinica o una struttura medica e non diamo consigli medici. I prodotti sono forniti dai rispettivi venditori, che stabiliscono prezzo, condizioni e disponibilità."]],
rk:"Recensioni e articoli",rt:"Analizziamo gli integratori come li spiegheremmo a un amico",rl:"Cosa c’è scritto sull’etichetta, cosa dicono le fonti e a cosa fare attenzione: ogni recensione lo copre. Tutti i contenuti hanno la stessa struttura, quindi confrontare è facile.",
inc:[["Cosa contiene","Cosa c’è esattamente nel barattolo e in quale quantità, come indicato dal produttore, senza belle parole."],["A cosa serve","Per cosa il produttore presenta l’integratore. Senza promesse di curare qualcosa."],["Cosa dicono le fonti","Guardiamo studi e dati ufficiali e forniamo i link per poter verificare da soli."],["Chi deve fare attenzione","Donne in gravidanza, chi assume farmaci o ha patologie croniche: prima il medico. Lo diciamo chiaramente."],["Prezzo e condizioni","Quanto costa e a quali condizioni lo offre il venditore, con la data della verifica."],["Onesti sui guadagni","Se possiamo guadagnare da un prodotto, lo leggerai all’inizio della recensione."]],
tk:"Consigli",tt:"Come scegliere gli integratori con criterio",tl:"Semplici abitudini che aiutano a non farsi attirare dai paroloni. Sono consigli educativi generali, non raccomandazioni mediche personali.",
tips:[["Leggi l’etichetta","Non fermarti allo slogan sul fronte: guarda composizione e quantità per dose."],["Non è un farmaco","Gli integratori non servono a diagnosticare, curare o prevenire malattie."],["Chiedi a un professionista","Se sei in gravidanza, assumi farmaci o hai una patologia, parlane prima con un medico o un farmacista."],["Attenzione ai miracoli","«Garantito», «immediato», «cura tutto» sono segnali d’allarme. Così come le recensioni non verificabili."],["Controlla il venditore","Ci sono contatti chiari, condizioni di reso e prezzo totale prima di pagare?"],["Guarda la data","Le raccomandazioni cambiano. Fidati di contenuti datati e con fonti indicate."]],
tn:"Le informazioni qui presenti non sostituiscono la consulenza di un professionista sanitario qualificato.",
wk:"Come funziona",wt:"Quattro passi, niente di nascosto",steps:[["Entri e leggi","Apri una recensione o una guida e vedi subito di che prodotto si tratta e cosa dice l’etichetta."],["Confronti","Usi la lista di controllo: composizione, avvertenze, fonti, condizioni del venditore."],["Verifichi da solo","Consulti le fonti e il sito del venditore. Noi diamo i link, la decisione è tua."],["Vedi le indicazioni","Se un contenuto ha un link partner o possiamo ricevere un compenso, è scritto chiaramente prima del clic."]],
wn:"Disponibilità, prezzo e condizioni sono stabiliti dai venditori. Useful Habit non vende, non consegna e non controlla prodotti o servizi di terzi.",
ik:"Informazioni importanti",it:"Fatti semplici su questo sito",il:"Cos’è questo sito, come può guadagnare e dove finisce la nostra responsabilità.",
imp:[["Carattere informativo","Recensioni e guide sono generali ed educative e non sono adattate a una persona specifica."],["Non farmaci né consiglio medico","Gli integratori non sono farmaci e non sono destinati a diagnosticare, curare, guarire o prevenire alcuna malattia. Useful Habit non è una struttura medica e i suoi contenuti non costituiscono consiglio medico."],["Nessuna garanzia di risultato","La risposta dell’organismo è individuale. Non garantiamo alcun risultato."],["Rapporti commerciali","Possiamo ricevere compensi da terzi in relazione ai prodotti trattati. Ciò è dichiarato nel contenuto stesso."],["Venditori e condizioni","I prodotti sono forniti dai rispettivi venditori, che stabiliscono prezzo, condizioni e disponibilità. Verificali tu stesso prima di acquistare."],["Responsabilità","Nei limiti consentiti dalla legge applicabile, non rispondiamo di contenuti, prodotti o servizi di terzi. Nulla qui limita la responsabilità che non può essere limitata per legge, inclusi i diritti inderogabili dei consumatori."],["Disponibilità regionale","Le norme sugli integratori variano da paese a paese; alcuni prodotti o dichiarazioni potrebbero non essere consentiti ovunque."],["Aggiornamento e modifiche","Le informazioni possono diventare obsolete o cambiare senza preavviso."],["Dati e condizioni","Il trattamento dei dati è descritto nell’<a href=\"#privacy\">Informativa sulla privacy</a> e le regole d’uso del sito nei <a href=\"#terms\">Termini di utilizzo</a>."]],
in:"Questa pagina descrive l’attività reale del sito. Non serve a eludere responsabilità o regole pubblicitarie.",

hk:"Informații • Recenzii • Produse",h1:"Suplimente alimentare și complexe: <em>recenzii, compoziție și particularități</em>",hp:"Descoperă lumea suplimentelor alimentare și a produselor specializate. Analizăm compoziția, explicăm rolul fiecărui component, discutăm caracteristicile și avertismentele și comparăm complexe și produse ale diferiților producători.<br><br>Informații clare, recenzii practice și comparații care te ajută să cunoști oferta și să alegi în cunoștință de cauză.",c1:"Despre noi",c2:"Cum funcționează",ch:["Suplimentele nu sunt medicamente","Legături comerciale dezvăluite","Fără garanția unui rezultat"],
ak:"Despre noi",at:"Cine suntem și ce facem",al:"Useful Habit este un site care publică recenzii și ghiduri proprii despre suplimente alimentare. Spunem doar ce corespunde adevărului și nu ne atribuim calificări sau statut pe care nu le putem dovedi.",
about:[["Misiune","Să explicăm suplimentele clar și onest, ca să poți compara variantele și să decizi singur."],["Ce primești","Recenzii pe înțelesul tuturor cu compoziție, destinație, avertismente și surse, plus marcaje clare pe orice conținut comercial."],["Principii","Claritate în loc de vorbe mari. Fără afirmații de vindecare sau rezultate garantate. Fiecare relație comercială este dezvăluită."],["Acuratețe","Urmărim informații exacte și actuale, ne bazăm pe surse oficiale și primare, datăm materialele și le actualizăm sau le retragem pe cele depășite."],["Model comercial","Site-ul poate promova produse ale unor terți și putem primi un comision pentru aceasta. Menționăm mereu în material, iar comisionul nu schimbă faptele prezentate."],["Ce nu suntem","Nu suntem farmacie, clinică sau instituție medicală și nu oferim sfaturi medicale. Produsele sunt furnizate de vânzătorii lor, care stabilesc prețul, condițiile și disponibilitatea."]],
rk:"Recenzii și articole",rt:"Analizăm suplimentele așa cum le-am explica unui prieten",rl:"Ce scrie pe etichetă, ce spun sursele și la ce merită să fii atent — fiecare recenzie acoperă acestea. Toate materialele au aceeași structură, deci compararea e simplă.",
inc:[["Ce conține","Ce se află exact în borcan și în ce cantitate, așa cum indică producătorul, fără vorbe frumoase."],["Pentru ce este destinat","Pentru ce îl prezintă producătorul. Fără promisiuni că vindecă ceva."],["Ce spun sursele","Ne uităm la studii și date oficiale și oferim linkuri ca să verifici singur."],["Cine trebuie să fie atent","Gravidele, cei care iau medicamente sau au afecțiuni cronice — mai întâi medicul. Spunem asta direct."],["Preț și condiții","Cât costă și în ce condiții îl oferă vânzătorul, cu data verificării."],["Sinceri despre câștig","Dacă putem câștiga de pe urma unui produs, vei citi despre asta la începutul recenziei."]],
tk:"Sfaturi",tt:"Cum alegi suplimentele cu cap",tl:"Obiceiuri simple care te ajută să nu te lași păcălit de vorbe mari. Sunt sfaturi educative generale, nu recomandări medicale personale.",
tips:[["Citește eticheta","Nu te opri la sloganul din față: uită-te la compoziție și cantitatea pe porție."],["Nu este medicament","Suplimentele nu sunt destinate diagnosticării, tratării sau prevenirii bolilor."],["Întreabă un specialist","Dacă ești gravidă, iei medicamente sau ai o afecțiune, vorbește mai întâi cu medicul sau farmacistul."],["Ferește-te de minuni","„Garantat”, „instantaneu”, „vindecă totul” sunt semnale de alarmă. La fel și recenziile care nu pot fi verificate."],["Verifică vânzătorul","Există contacte clare, condiții de returnare și prețul total înainte de plată?"],["Uită-te la dată","Recomandările se schimbă. Ai încredere în materiale cu dată și surse indicate."]],
tn:"Informațiile de aici nu înlocuiesc consultul unui specialist în sănătate calificat.",
wk:"Cum funcționează",wt:"Patru pași, nimic ascuns",steps:[["Intri și citești","Deschizi o recenzie sau un ghid și vezi imediat ce produs este și ce scrie pe etichetă."],["Compari","Folosești lista de verificare: compoziție, avertismente, surse, condițiile vânzătorului."],["Verifici singur","Te uiți la surse și pe site-ul vânzătorului. Noi dăm linkurile, decizia e a ta."],["Vezi marcajele","Dacă materialul conține un link de partener sau putem primi un comision, este scris clar înainte de click."]],
wn:"Disponibilitatea, prețul și condițiile sunt stabilite de vânzători. Useful Habit nu vinde, nu livrează și nu controlează produse sau servicii ale terților.",
ik:"Informații importante",it:"Fapte simple despre acest site",il:"Ce este acest site, cum poate câștiga bani și unde se termină răspunderea noastră.",
imp:[["Caracter informativ","Recenziile și ghidurile sunt generale și educative și nu sunt adaptate unei persoane anume."],["Nu sunt medicamente și nu sunt sfat medical","Suplimentele nu sunt medicamente și nu sunt destinate diagnosticării, tratării, vindecării sau prevenirii vreunei boli. Useful Habit nu este o instituție medicală, iar materialele sale nu constituie sfat medical."],["Fără garanția rezultatului","Răspunsul organismului este individual. Nu garantăm niciun rezultat."],["Relații comerciale","Putem primi comision de la terți în legătură cu produsele tratate. Acest lucru este dezvăluit în materialul însuși."],["Vânzători și condiții","Produsele sunt furnizate de vânzătorii lor, care stabilesc prețul, condițiile și disponibilitatea. Verifică-le singur înainte de cumpărare."],["Răspundere","În măsura permisă de legea aplicabilă, nu răspundem pentru conținutul, produsele sau serviciile terților. Nimic aici nu limitează răspunderea care nu poate fi limitată prin lege, inclusiv drepturile obligatorii ale consumatorilor."],["Disponibilitate regională","Regulile privind suplimentele diferă de la o țară la alta; unele produse sau afirmații pot să nu fie permise peste tot."],["Actualitate și modificări","Informațiile pot deveni depășite sau se pot schimba fără înștiințare."],["Date și condiții","Modul în care tratăm datele este descris în <a href=\"#privacy\">Politica de confidențialitate</a>, iar regulile de utilizare a site-ului în <a href=\"#terms\">Termenii de utilizare</a>."]],
in:"Această pagină descrie activitatea reală a site-ului. Nu servește la evitarea răspunderii sau a regulilor de publicitate.",
fd:"Recenzii și ghiduri despre suplimente alimentare pe înțelesul tuturor.",fh1:"Navigare",fh2:"Informații juridice",fh3:"Contact",fp:"Politica de confidențialitate",ft:"Termeni de utilizare",fr:"Toate drepturile rezervate.",back:"← Înapoi acasă",upd:"Versiunea din 30 octombrie 2026",lnote:"Documentele juridice sunt disponibile momentan doar în limba ucraineană."};
T.bg={title:"Useful Habit — Хранителни добавки и комплекси: прегледи, състав и особености",desc:"Прегледи на хранителни добавки и комплекси: състав, предназначение на компонентите, характеристики, предупреждения и сравнение на продукти на различни производители.",
nav:["Начало","За нас","Прегледи и статии","Съвети","Как работи","Важна информация"],
hk:"Информация • Прегледи • Продукти",h1:"Хранителни добавки и комплекси: <em>прегледи, състав и особености</em>",hp:"Открийте света на хранителните добавки и специализираните продукти. Разглеждаме състава, обясняваме предназначението на компонентите, представяме характеристики и предупреждения и сравняваме комплекси и продукти на различни производители.<br><br>Ясна информация, практични прегледи и сравнения, които помагат да се запознаете с асортимента и да направите информиран избор.",c1:"За нас",c2:"Как работи",ch:["Добавките не са лекарства","Търговските връзки са разкрити","Без гаранции за резултат"],
ak:"За нас",at:"Кои сме ние и с какво се занимаваме",al:"Useful Habit е уебсайт, който публикува собствени прегледи и ръководства за хранителни добавки. Разказваме само онова, което отговаря на истината, и не си приписваме квалификации или статут, които не можем да докажем.",
about:[["Мисия","Да обясняваме добавките ясно и честно, за да можете да сравните вариантите и да решите сами."],["Какво получавате","Прегледи на разбираем език със състав, предназначение, предупреждения и източници, както и ясни означения върху всяко търговско съдържание."],["Принципи","Яснота вместо шумни думи. Без твърдения за лечение или гарантиран резултат. Всяка търговска връзка се разкрива."],["Достоверност","Стремим се към точна и актуална информация, опираме се на официални и първични източници, датираме материалите и обновяваме или премахваме остарелите."],["Търговски модел","Сайтът може да популяризира продукти на трети страни и може да получаваме възнаграждение за това. Винаги го отбелязваме в материала, а възнаграждението не променя фактите, които представяме."],["Какво не сме","Не сме аптека, клиника или медицинско заведение и не даваме медицински съвети. Продуктите се доставят от техните продавачи, които определят цена, условия и наличност."]],
rk:"Прегледи и статии",rt:"Разглеждаме добавките така, както бихме ги обяснили на приятел",rl:"Какво пише на етикета, какво казват източниците и на какво си струва да обърнете внимание — всеки преглед го включва. Всички материали са устроени по един и същи начин, така че сравняването е лесно.",
inc:[["Какво е в състава","Какво точно има в бурканчето и в какво количество — както е посочил производителят, без красиви думи."],["За какво е предназначена","За какво производителят представя добавката. Без обещания да лекува нещо."],["Какво казват източниците","Разглеждаме проучвания и официални данни и даваме връзки, за да проверите сами."],["Кой да внимава","Бременни, хора, които приемат лекарства или имат хронични състояния — първо при лекар. Казваме го направо."],["Цена и условия","Колко струва и при какви условия го предлага продавачът, с датата на проверка."],["Честно за приходите","Ако можем да получим възнаграждение за продукт, ще прочетете за това в началото на прегледа."]],
tk:"Съвети",tt:"Как да избираме добавки разумно",tl:"Прости навици, които помагат да не се хванете на шумни думи. Това са общи образователни съвети, а не лични медицински препоръки.",
tips:[["Четете етикета","Не гледайте само шумния надпис отпред, а състава и количеството в порция."],["Това не е лекарство","Добавките не са предназначени за диагностика, лечение или профилактика на болести."],["Питайте специалист","Ако сте бременна, приемате лекарства или имате заболяване — първо при лекар или фармацевт."],["Пазете се от чудеса","„Гарантирано“, „мигновено“, „лекува всичко“ са тревожни сигнали. Както и отзиви, които не могат да се проверят."],["Проверявайте продавача","Има ли ясни контакти, условия за връщане и пълна цена преди плащане?"],["Гледайте датата","Препоръките се променят. Вярвайте на материали с дата и посочени източници."]],
tn:"Информацията тук не замества консултацията с квалифициран медицински специалист.",
wk:"Как работи",wt:"Четири стъпки, нищо скрито",steps:[["Влизате и четете","Отваряте преглед или ръководство и веднага виждате какъв е продуктът и какво пише на етикета."],["Сравнявате","Ползвате контролния списък: състав, предупреждения, източници, условия на продавача."],["Проверявате сами","Поглеждате източниците и сайта на продавача. Ние даваме връзки, решението е ваше."],["Виждате означенията","Ако в материала има партньорска връзка или можем да получим възнаграждение, това е написано ясно преди да кликнете."]],
wn:"Наличността, цената и условията се определят от продавачите. Useful Habit не продава, не доставя и не контролира продукти или услуги на трети страни.",
ik:"Важна информация",it:"Прости факти за този сайт",il:"Какво представлява този сайт, как може да печели и докъде стига нашата отговорност.",
imp:[["Информационен характер","Прегледите и ръководствата са с общ образователен характер и не са съобразени с конкретен човек."],["Не са лекарства и не са медицински съвет","Добавките не са лекарства и не са предназначени за диагностика, лечение или профилактика на каквито и да било болести. Useful Habit не е медицинско заведение, а материалите на сайта не са медицински съвет."],["Без гаранции за резултат","Реакцията на организма е индивидуална. Не гарантираме никакъв резултат."],["Търговски връзки","Можем да получаваме възнаграждение от трети страни във връзка с разглежданите продукти. Това се разкрива в самия материал."],["Продавачи и условия","Продуктите се доставят от техните продавачи, които определят цена, условия и наличност. Проверете ги сами преди покупка."],["Отговорност","В рамките на допустимото от приложимото законодателство не носим отговорност за съдържание, продукти или услуги на трети страни. Нищо тук не ограничава отговорност, която не може да бъде ограничена със закон, включително задължителните права на потребителите."],["Регионална наличност","Правилата за добавки се различават по държави; някои продукти или твърдения може да не са разрешени навсякъде."],["Актуалност и промени","Информацията може да остарее или да се промени без предупреждение."],["Данни и условия","Как работим с данните е описано в <a href=\"#privacy\">Политиката за поверителност</a>, а правилата за ползване на сайта — в <a href=\"#terms\">Условията за ползване</a>."]],
in:"Тази страница описва реалната дейност на сайта. Тя не служи като начин да се избегне отговорност или рекламни правила.",
fd:"Прегледи и ръководства за хранителни добавки на разбираем език.",fh1:"Навигация",fh2:"Правна информация",fh3:"Контакти",fp:"Политика за поверителност",ft:"Условия за ползване",fr:"Всички права запазени.",back:"← Към началото",upd:"Редакция от 30 октомври 2026 г.",lnote:"Правните документи засега са налични само на украински език."};
