T.kk={title:"Useful Habit — Тағамдық қоспалар мен кешендер: шолулар, құрамы және ерекшеліктері",desc:"Тағамдық қоспалар мен кешендерге шолулар: құрамы, компоненттердің міндеті, сипаттамалары, ескертулер және әртүрлі өндірушілердің өнімдерін салыстыру.",
nav:["Басты бет","Біз туралы","Шолулар мен мақалалар","Кеңестер","Бұл қалай жұмыс істейді","Маңызды ақпарат"],
hk:"Ақпарат • Шолулар • Өнімдер",h1:"Тағамдық қоспалар мен кешендер: <em>шолулар, құрамы және ерекшеліктері</em>",hp:"Тағамдық қоспалар мен арнайы өнімдер әлемін зерттеңіз. Біз құрамын талдаймыз, әр компоненттің міндетін түсіндіреміз, сипаттамалары мен ескертулерін қарастырамыз және әртүрлі өндірушілердің кешендері мен өнімдерін салыстырамыз.<br><br>Түсінікті ақпарат, практикалық шолулар мен салыстырулар ұсынысты жақсырақ танып, саналы таңдау жасауға көмектеседі.",c1:"Біз туралы",c2:"Бұл қалай жұмыс істейді",ch:["Қоспалар — дәрі емес","Коммерциялық байланыстар ашық көрсетілген","Нәтижеге кепілдік жоқ"],
ak:"Біз туралы",at:"Біз кімбіз және немен айналысамыз",al:"Useful Habit — тағамдық қоспалар туралы өзіміздің шолулар мен нұсқаулықтарды жариялайтын сайт. Біз тек шындыққа сай нәрсені айтамыз және растай алмайтын біліктілік пен мәртебені өзімізге таңбаймыз.",
about:[["Миссия","Қоспаларды түсінікті әрі адал түсіндіру, сонда сіз нұсқаларды салыстырып, өзіңіз шешім қабылдай аласыз."],["Не аласыз","Құрамы, мақсаты, ескертулері мен дереккөздері бар қарапайым тілдегі шолулар және кез келген коммерциялық мазмұнда айқын белгілер."],["Принциптер","Қатты сөздің орнына айқындық. Емдеу немесе кепілді нәтиже туралы тұжырымдар жоқ. Әрбір коммерциялық қатынас ашық көрсетіледі."],["Анықтық","Біз нақты әрі өзекті ақпаратқа ұмтыламыз, ресми және алғашқы дереккөздерге сүйенеміз, материалдарға күн қоямыз және ескіргендерін жаңартамыз немесе алып тастаймыз."],["Коммерциялық модель","Сайт үшінші тараптардың өнімдерін жарнамалауы мүмкін, ал біз оған сыйақы алуымыз мүмкін. Біз мұны әрқашан материалда көрсетеміз, ал сыйақы біз келтіретін фактілерді өзгертпейді."],["Біз кім емеспіз","Біз дәріхана, клиника не медициналық мекеме емеспіз және медициналық кеңес бермейміз. Өнімдерді сатушылары жеткізеді, олар бағаны, шарттарды және қолжетімділікті белгілейді."]],
rk:"Шолулар мен мақалалар",rt:"Қоспаларды досымызға түсіндіргендей талдаймыз",rl:"Затбелгіде не жазылған, дереккөздер не дейді және неге назар аударған жөн — осының бәрі әр шолуда бар. Барлық материалдар бірдей құрылымда, сондықтан салыстыру оңай.",
inc:[["Құрамында не бар","Банкада нақты не бар және қандай мөлшерде — өндіруші көрсеткендей, әдемі сөздерсіз."],["Не үшін арналған","Өндіруші қоспаны не үшін ұсынады. Бірдеңені емдеуге уәде жоқ."],["Дереккөздер не дейді","Зерттеулер мен ресми деректерді қарап, өзіңіз тексере алуыңыз үшін сілтемелер береміз."],["Кімге сақ болу керек","Жүктілер, дәрі қабылдайтындар немесе созылмалы жағдайы барлар — алдымен дәрігерге. Мұны тура айтамыз."],["Бағасы мен шарттары","Қанша тұрады және сатушы қандай шартпен ұсынады, тексерген күнімен бірге."],["Табыс туралы адал","Егер өнімнен табыс таба алсақ, мұны шолудың басында оқисыз."]],
tk:"Кеңестер",tt:"Қоспаларды саналы таңдау жолы",tl:"Қатты сөздерге алданбауға көмектесетін қарапайым әдеттер. Бұл жалпы білім беру кеңестері, жеке медициналық ұсыныстар емес.",
tips:[["Затбелгіні оқыңыз","Алдыңғы жақтағы қатты ұранға ғана емес, құрамы мен бір порциядағы мөлшеріне қараңыз."],["Бұл дәрі емес","Қоспалар аурулардың диагнозын қою, емдеу немесе алдын алу үшін арналмаған."],["Маманнан сұраңыз","Жүкті болсаңыз, дәрі қабылдасаңыз немесе ауруыңыз болса, алдымен дәрігермен немесе фармацевтпен кеңесіңіз."],["Керемет уәделерден сақ болыңыз","«Кепілді», «лезде», «бәрін емдейді» — алаңдататын белгілер. Тексеріп болмайтын пікірлер де солай."],["Сатушыны тексеріңіз","Төлемге дейін айқын байланыс, қайтару шарттары және толық баға бар ма?"],["Күніне қараңыз","Ұсыныстар өзгереді. Күні мен аталған дереккөздері бар материалдарға сеніңіз."]],
tn:"Мұндағы ақпарат білікті медицина маманымен кеңесті алмастырмайды.",
wk:"Бұл қалай жұмыс істейді",wt:"Төрт қадам, жасырын ештеңе жоқ",steps:[["Кіріп оқисыз","Шолуды немесе нұсқаулықты ашып, бұл қандай өнім екенін және затбелгіде не жазылғанын бірден көресіз."],["Салыстырасыз","Тексеру тізімін қолданасыз: құрамы, ескертулер, дереккөздер, сатушы шарттары."],["Өзіңіз тексересіз","Дереккөздер мен сатушының сайтына қарайсыз. Біз сілтеме береміз, шешім — сізде."],["Белгілерді байқайсыз","Материалда серіктестік сілтеме болса немесе біз сыйақы ала алсақ, бұл басар алдында айқын жазылады."]],
wn:"Қолжетімділікті, бағаны және шарттарды сатушылар белгілейді. Useful Habit үшінші тараптардың өнімдері мен қызметтерін сатпайды, жеткізбейді және бақыламайды.",
ik:"Маңызды ақпарат",it:"Осы сайт туралы қарапайым фактілер",il:"Бұл сайт не, ол қалай табыс таба алады және біздің жауапкершілігіміз қайда аяқталады.",
imp:[["Ақпараттық сипаты","Шолулар мен нұсқаулықтар жалпы білім беру сипатында және нақты адамға бейімделмеген."],["Дәрі емес және медициналық кеңес емес","Қоспалар дәрі емес және ешқандай ауруды диагностикалауға, емдеуге немесе алдын алуға арналмаған. Useful Habit медициналық мекеме емес, ал сайт материалдары медициналық кеңес болып табылмайды."],["Нәтижеге кепілдік жоқ","Организмнің реакциясы жеке. Біз ешқандай нәтижеге кепілдік бермейміз."],["Коммерциялық байланыстар","Қарастырылатын өнімдерге байланысты үшінші тараптардан сыйақы алуымыз мүмкін. Бұл материалдың өзінде көрсетіледі."],["Сатушылар және шарттар","Өнімдерді сатушылары жеткізеді, олар бағаны, шарттарды және қолжетімділікті белгілейді. Сатып алар алдында өзіңіз тексеріңіз."],["Жауапкершілік","Қолданыстағы заңнама рұқсат ететін шекте үшінші тараптардың мазмұны, өнімдері немесе қызметтері үшін жауап бермейміз. Мұндағы ешнәрсе заңмен шектеуге болмайтын жауапкершілікті, соның ішінде тұтынушылардың міндетті құқықтарын шектемейді."],["Өңірлік қолжетімділік","Қоспаларға қатысты ережелер елдерге қарай әртүрлі; кейбір өнімдер не тұжырымдар барлық жерде рұқсат етілмеуі мүмкін."],["Өзектілік және өзгерістер","Ақпарат ескіруі немесе ескертусіз өзгеруі мүмкін."],["Деректер және шарттар","Деректермен қалай жұмыс істейтініміз <a href=\"#privacy\">Құпиялылық саясатында</a>, ал сайтты пайдалану ережелері <a href=\"#terms\">Пайдалану шарттарында</a> сипатталған."]],
in:"Бұл бет сайттың нақты қызметін сипаттайды. Ол жауапкершіліктен немесе жарнама ережелерінен жалтару тәсілі емес.",
fd:"Тағамдық қоспалар туралы қарапайым тілдегі шолулар мен нұсқаулықтар.",fh1:"Навигация",fh2:"Құқықтық ақпарат",fh3:"Байланыс",fp:"Құпиялылық саясаты",ft:"Пайдалану шарттары",fr:"Барлық құқықтар қорғалған.",back:"← Басты бетке",upd:"2026 жылғы 30 қазандағы редакция",lnote:"Құқықтық құжаттар әзірге тек украин тілінде қолжетімді."};
T.uz={title:"Useful Habit — Oziq-ovqat qo‘shimchalari va komplekslar: sharhlar, tarkib va xususiyatlar",desc:"Oziq-ovqat qo‘shimchalari va komplekslar sharhlari: tarkibi, komponentlarning vazifasi, xususiyatlari, ogohlantirishlar va turli ishlab chiqaruvchilar mahsulotlarini taqqoslash.",
nav:["Bosh sahifa","Biz haqimizda","Sharhlar va maqolalar","Maslahatlar","Bu qanday ishlaydi","Muhim ma’lumot"],
hk:"Ma’lumot • Sharhlar • Mahsulotlar",h1:"Oziq-ovqat qo‘shimchalari va komplekslar: <em>sharhlar, tarkib va xususiyatlar</em>",hp:"Oziq-ovqat qo‘shimchalari va maxsus mahsulotlar olamini kashf eting. Biz tarkibni tahlil qilamiz, har bir komponentning vazifasini tushuntiramiz, xususiyatlari va ogohlantirishlarini ko‘rib chiqamiz hamda turli ishlab chiqaruvchilarning kompleks va mahsulotlarini taqqoslaymiz.<br><br>Tushunarli ma’lumot, amaliy sharhlar va taqqoslashlar assortiment bilan yaxshiroq tanishish va ongli tanlov qilishga yordam beradi.",c1:"Biz haqimizda",c2:"Bu qanday ishlaydi",ch:["Qo‘shimchalar dori emas","Tijoriy aloqalar oshkor etilgan","Natija kafolati yo‘q"],
ak:"Biz haqimizda",at:"Biz kimmiz va nima bilan shug‘ullanamiz",al:"Useful Habit — oziq-ovqat qo‘shimchalari haqida o‘z sharhlari va qo‘llanmalarini e’lon qiladigan sayt. Biz faqat haqiqatga mos narsani aytamiz va tasdiqlay olmaydigan malaka yoki maqomni o‘zimizga nisbat bermaymiz.",
about:[["Missiya","Qo‘shimchalarni tushunarli va halol tushuntirish, shunda siz variantlarni solishtirib, o‘zingiz qaror qilasiz."],["Nima olasiz","Tarkibi, vazifasi, ogohlantirishlari va manbalari bilan oddiy tildagi sharhlar hamda har qanday tijoriy kontentda aniq belgilar."],["Tamoyillar","Baland so‘zlar o‘rniga aniqlik. Davolash yoki kafolatlangan natija haqida da’volar yo‘q. Har bir tijoriy munosabat oshkor etiladi."],["Ishonchlilik","Aniq va dolzarb ma’lumotga intilamiz, rasmiy va birlamchi manbalarga tayanamiz, materiallarga sana qo‘yamiz va eskirganlarini yangilaymiz yoki olib tashlaymiz."],["Tijorat modeli","Sayt uchinchi tomon mahsulotlarini targ‘ib qilishi mumkin, biz buning uchun haq olishimiz mumkin. Buni doim materialda ko‘rsatamiz, haq esa keltirilgan faktlarni o‘zgartirmaydi."],["Biz kim emasmiz","Biz dorixona, klinika yoki tibbiyot muassasasi emasmiz va tibbiy maslahat bermaymiz. Mahsulotlarni sotuvchilari yetkazib beradi, ular narx, shart va mavjudlikni belgilaydi."]],
rk:"Sharhlar va maqolalar",rt:"Qo‘shimchalarni do‘stimizga tushuntirgandek tahlil qilamiz",rl:"Etiketkada nima yozilgan, manbalar nima deydi va nimaga e’tibor berish kerak — barchasi har bir sharhda bor. Barcha materiallar bir xil tuzilgan, shuning uchun solishtirish oson.",
inc:[["Tarkibida nima bor","Idishda aynan nima bor va qancha miqdorda — ishlab chiqaruvchi ko‘rsatganidek, chiroyli so‘zlarsiz."],["Nima uchun mo‘ljallangan","Ishlab chiqaruvchi qo‘shimchani nima uchun taqdim etadi. Biror narsani davolash va’dasi yo‘q."],["Manbalar nima deydi","Tadqiqotlar va rasmiy ma’lumotlarni ko‘rib, o‘zingiz tekshirishingiz uchun havolalar beramiz."],["Kim ehtiyot bo‘lishi kerak","Homilador ayollar, dori qabul qiluvchilar yoki surunkali kasalligi borlar — avval shifokorga. Buni ochiq aytamiz."],["Narx va shartlar","Qancha turadi va sotuvchi qanday shartlarda taklif qiladi, tekshirilgan sana bilan."],["Daromad haqida halol","Agar mahsulotdan daromad topsak, buni sharh boshida o‘qiysiz."]],
tk:"Maslahatlar",tt:"Qo‘shimchalarni oqilona tanlash",tl:"Baland so‘zlarga aldanmaslikka yordam beradigan oddiy odatlar. Bu umumiy ta’limiy maslahatlar, shaxsiy tibbiy tavsiyalar emas.",
tips:[["Etiketkani o‘qing","Old tomondagi baland shiorgagina emas, tarkib va bir porsiyadagi miqdorga qarang."],["Bu dori emas","Qo‘shimchalar kasalliklarni aniqlash, davolash yoki oldini olish uchun mo‘ljallanmagan."],["Mutaxassisdan so‘rang","Homilador bo‘lsangiz, dori qabul qilsangiz yoki kasalligingiz bo‘lsa, avval shifokor yoki farmatsevt bilan maslahatlashing."],["Mo‘jizalardan ehtiyot bo‘ling","“Kafolatlangan”, “zudlik bilan”, “hamma narsani davolaydi” — ogohlantiruvchi belgilar. Tekshirib bo‘lmaydigan sharhlar ham shunday."],["Sotuvchini tekshiring","To‘lovdan oldin aniq aloqa, qaytarish shartlari va to‘liq narx bormi?"],["Sanaga qarang","Tavsiyalar o‘zgaradi. Sanasi va ko‘rsatilgan manbalari bor materiallarga ishoning."]],
tn:"Bu yerdagi ma’lumot malakali sog‘liqni saqlash mutaxassisi bilan maslahatni almashtirmaydi.",
wk:"Bu qanday ishlaydi",wt:"To‘rt qadam, yashirin narsa yo‘q",steps:[["Kirib o‘qiysiz","Sharh yoki qo‘llanmani ochasiz va bu qanday mahsulot ekanini hamda etiketkada nima yozilganini darhol ko‘rasiz."],["Solishtirasiz","Tekshiruv ro‘yxatidan foydalanasiz: tarkib, ogohlantirishlar, manbalar, sotuvchi shartlari."],["O‘zingiz tekshirasiz","Manbalar va sotuvchi saytiga qaraysiz. Biz havola beramiz, qaror sizniki."],["Belgilarni ko‘rasiz","Materialda hamkor havolasi bo‘lsa yoki biz haq olishimiz mumkin bo‘lsa, bu bosishdan oldin aniq yoziladi."]],
wn:"Mavjudlik, narx va shartlarni sotuvchilar belgilaydi. Useful Habit uchinchi tomon mahsulot yoki xizmatlarini sotmaydi, yetkazib bermaydi va nazorat qilmaydi.",
ik:"Muhim ma’lumot",it:"Ushbu sayt haqida oddiy faktlar",il:"Bu sayt nima, u qanday daromad topishi mumkin va javobgarligimiz qayerda tugaydi.",
imp:[["Axborot xarakteri","Sharhlar va qo‘llanmalar umumiy ta’limiy xususiyatga ega va muayyan shaxsga moslashtirilmagan."],["Dori emas va tibbiy maslahat emas","Qo‘shimchalar dori emas va hech qanday kasallikni aniqlash, davolash yoki oldini olish uchun mo‘ljallanmagan. Useful Habit tibbiyot muassasasi emas, sayt materiallari tibbiy maslahat hisoblanmaydi."],["Natija kafolati yo‘q","Organizm reaksiyasi individual. Hech qanday natijani kafolatlamaymiz."],["Tijoriy aloqalar","Ko‘rib chiqilayotgan mahsulotlar bilan bog‘liq holda uchinchi tomonlardan haq olishimiz mumkin. Bu materialning o‘zida ko‘rsatiladi."],["Sotuvchilar va shartlar","Mahsulotlarni sotuvchilari yetkazib beradi, ular narx, shart va mavjudlikni belgilaydi. Xariddan oldin o‘zingiz tekshiring."],["Javobgarlik","Amaldagi qonunchilik ruxsat bergan doirada uchinchi tomonlarning kontenti, mahsulotlari yoki xizmatlari uchun javob bermaymiz. Bu yerda hech narsa qonun bilan cheklab bo‘lmaydigan javobgarlikni, jumladan iste’molchilarning majburiy huquqlarini cheklamaydi."],["Hududiy mavjudlik","Qo‘shimchalar bo‘yicha qoidalar mamlakatlarga qarab farq qiladi; ayrim mahsulotlar yoki da’volar hamma joyda ruxsat etilmasligi mumkin."],["Dolzarblik va o‘zgarishlar","Ma’lumot eskirishi yoki ogohlantirishsiz o‘zgarishi mumkin."],["Ma’lumotlar va shartlar","Ma’lumotlar bilan qanday ishlashimiz <a href=\"#privacy\">Maxfiylik siyosati</a>da, saytdan foydalanish qoidalari esa <a href=\"#terms\">Foydalanish shartlari</a>da bayon etilgan."]],
in:"Ushbu sahifa saytning haqiqiy faoliyatini tasvirlaydi. U javobgarlikdan yoki reklama qoidalaridan qochish usuli emas.",
fd:"Oziq-ovqat qo‘shimchalari haqida oddiy tildagi sharhlar va qo‘llanmalar.",fh1:"Navigatsiya",fh2:"Huquqiy ma’lumot",fh3:"Aloqa",fp:"Maxfiylik siyosati",ft:"Foydalanish shartlari",fr:"Barcha huquqlar himoyalangan.",back:"← Bosh sahifaga",upd:"2026-yil 30-oktyabr tahriri",lnote:"Huquqiy hujjatlar hozircha faqat ukrain tilida mavjud."};
T.sw={title:"Useful Habit — Virutubisho na mchanganyiko: tathmini, viambato na sifa",desc:"Tathmini za virutubisho vya lishe na mchanganyiko: viambato, madhumuni ya vipengele, sifa, tahadhari na ulinganisho wa bidhaa za watengenezaji mbalimbali.",
nav:["Mwanzo","Kuhusu Sisi","Tathmini na Makala","Vidokezo","Jinsi Inavyofanya Kazi","Taarifa Muhimu"],
hk:"Taarifa • Tathmini • Bidhaa",h1:"Virutubisho vya lishe na mchanganyiko: <em>tathmini, viambato na sifa</em>",hp:"Gundua ulimwengu wa virutubisho vya lishe na bidhaa maalum. Tunachambua viambato, tunaeleza kazi ya kila kipengele, tunaangalia sifa na tahadhari, na kulinganisha mchanganyiko na bidhaa za watengenezaji mbalimbali.<br><br>Taarifa wazi, tathmini za vitendo na ulinganisho unaokusaidia kuifahamu bidhaa na kufanya uchaguzi wenye uelewa.",c1:"Kuhusu Sisi",c2:"Jinsi Inavyofanya Kazi",ch:["Virutubisho si dawa","Uhusiano wa kibiashara umewekwa wazi","Hakuna uhakikisho wa matokeo"],
ak:"Kuhusu Sisi",at:"Sisi ni nani na tunafanya nini",al:"Useful Habit ni tovuti inayochapisha tathmini na miongozo yake yenyewe kuhusu virutubisho vya lishe. Tunasema tu yaliyo kweli na hatujidai sifa au hadhi ambazo hatuwezi kuthibitisha.",
about:[["Dhamira","Kueleza virutubisho kwa uwazi na uaminifu ili uweze kulinganisha chaguo na kuamua mwenyewe."],["Unachopata","Tathmini kwa lugha rahisi zenye viambato, madhumuni, tahadhari na vyanzo, pamoja na alama wazi kwenye maudhui yoyote ya kibiashara."],["Kanuni","Uwazi badala ya maneno makubwa. Hakuna madai ya kuponya wala matokeo yaliyohakikishwa. Kila uhusiano wa kibiashara unawekwa wazi."],["Usahihi","Tunalenga taarifa sahihi na za kisasa, tunategemea vyanzo rasmi na vya msingi, tunaweka tarehe kwenye nyenzo na kusasisha au kuondoa zilizopitwa na wakati."],["Mfumo wa kibiashara","Tovuti inaweza kutangaza bidhaa za watu wengine na tunaweza kupokea fidia kwa hilo. Tunalisema kila mara kwenye nyenzo, na fidia haibadilishi ukweli tunaoutoa."],["Tusivyo","Si duka la dawa, kliniki wala taasisi ya matibabu, na hatutoi ushauri wa kitabibu. Bidhaa hutolewa na wauzaji wake, wanaoweka bei, masharti na upatikanaji."]],
rk:"Tathmini na Makala",rt:"Tunachambua virutubisho kama tungemweleza rafiki",rl:"Kilichoandikwa kwenye lebo, vyanzo vinavyosema nini, na mambo yanayostahili kuzingatiwa — kila tathmini inavishughulikia. Nyenzo zote zina muundo mmoja, hivyo kulinganisha ni rahisi.",
inc:[["Kilichomo ndani","Hasa nini kiko kwenye chombo na kwa kiasi gani — kama mtengenezaji alivyoeleza, bila maneno ya mapambo."],["Kimekusudiwa nini","Mtengenezaji anakiweka kwa ajili ya nini. Bila ahadi ya kuponya chochote."],["Vyanzo vinasema nini","Tunatazama tafiti na data rasmi na kutoa viungo ili uweze kuthibitisha mwenyewe."],["Nani achukue tahadhari","Wajawazito, wanaotumia dawa au wenye hali sugu — kwanza daktari. Tunasema hivyo wazi."],["Bei na masharti","Gharama yake na masharti ambayo muuzaji anatoa, pamoja na tarehe tuliyothibitisha."],["Waaminifu kuhusu mapato","Tukiweza kupata mapato kutoka kwa bidhaa, utasoma hilo mwanzoni mwa tathmini."]],
tk:"Vidokezo",tt:"Jinsi ya kuchagua virutubisho kwa busara",tl:"Mazoea rahisi yanayokusaidia kutodanganywa na maneno makubwa. Haya ni vidokezo vya jumla vya elimu, si mapendekezo ya kitabibu ya kibinafsi.",
tips:[["Soma lebo","Usitazame kauli mbiu kubwa ya mbele pekee, bali viambato na kiasi kwa kila kipimo."],["Si dawa","Virutubisho havikusudiwi kugundua, kutibu au kuzuia magonjwa."],["Muulize mtaalamu","Kama una mimba, unatumia dawa au una ugonjwa, zungumza kwanza na daktari au mfamasia."],["Jihadhari na miujiza","“Imehakikishwa”, “papo hapo”, “inaponya kila kitu” ni ishara za hatari. Vivyo hivyo maoni yasiyoweza kuthibitishwa."],["Hakiki muuzaji","Je, kuna mawasiliano wazi, masharti ya kurudisha na bei kamili kabla ya kulipa?"],["Tazama tarehe","Mapendekezo hubadilika. Amini nyenzo zenye tarehe na vyanzo vilivyotajwa."]],
tn:"Taarifa za hapa haziwezi kuchukua nafasi ya ushauri wa mtaalamu wa afya aliyehitimu.",
wk:"Jinsi Inavyofanya Kazi",wt:"Hatua nne, hakuna kilichofichwa",steps:[["Unaingia na kusoma","Unafungua tathmini au mwongozo na kuona mara moja bidhaa ni ipi na lebo inasema nini."],["Unalinganisha","Unatumia orodha ya ukaguzi: viambato, tahadhari, vyanzo, masharti ya muuzaji."],["Unahakiki mwenyewe","Unatazama vyanzo na tovuti ya muuzaji. Sisi tunatoa viungo, uamuzi ni wako."],["Unaona alama","Kama nyenzo ina kiungo cha mshirika au tunaweza kupata fidia, hilo huandikwa wazi kabla ya kubofya."]],
wn:"Upatikanaji, bei na masharti huwekwa na wauzaji. Useful Habit haiuzi, haisafirishi wala kudhibiti bidhaa au huduma za watu wengine.",
ik:"Taarifa Muhimu",it:"Ukweli rahisi kuhusu tovuti hii",il:"Tovuti hii ni nini, inaweza kupata mapato vipi, na wajibu wetu unaishia wapi.",
imp:[["Asili ya kutoa taarifa","Tathmini na miongozo ni ya jumla na ya kielimu, na haijarekebishwa kwa mtu mmoja mmoja."],["Si dawa wala ushauri wa kitabibu","Virutubisho si dawa na havikusudiwi kugundua, kutibu, kuponya au kuzuia ugonjwa wowote. Useful Habit si taasisi ya matibabu na nyenzo zake si ushauri wa kitabibu."],["Hakuna uhakikisho wa matokeo","Mwitikio wa mwili hutofautiana. Hatuhakikishi matokeo yoyote."],["Uhusiano wa kibiashara","Tunaweza kupokea fidia kutoka kwa watu wengine kuhusiana na bidhaa tunazozijadili. Hili linawekwa wazi kwenye nyenzo yenyewe."],["Wauzaji na masharti","Bidhaa hutolewa na wauzaji wake, wanaoweka bei, masharti na upatikanaji. Vihakiki wewe mwenyewe kabla ya kununua."],["Wajibu","Kwa kiwango kinachoruhusiwa na sheria husika, hatuwajibiki kwa maudhui, bidhaa au huduma za watu wengine. Hakuna kilichopo hapa kinachopunguza wajibu usioweza kupunguzwa kisheria, ikiwemo haki za lazima za watumiaji."],["Upatikanaji kikanda","Kanuni za virutubisho hutofautiana kati ya nchi; baadhi ya bidhaa au madai yanaweza kutoruhusiwa kila mahali."],["Usasa na mabadiliko","Taarifa zinaweza kupitwa na wakati au kubadilika bila taarifa."],["Data na masharti","Jinsi tunavyoshughulikia data imeelezwa kwenye <a href=\"#privacy\">Sera ya Faragha</a>, na kanuni za kutumia tovuti kwenye <a href=\"#terms\">Masharti ya Matumizi</a>."]],
in:"Ukurasa huu unaelezea shughuli halisi za tovuti. Si njia ya kukwepa wajibu au kanuni za matangazo.",
fd:"Tathmini na miongozo ya virutubisho vya lishe kwa lugha rahisi.",fh1:"Urambazaji",fh2:"Taarifa za kisheria",fh3:"Mawasiliano",fp:"Sera ya Faragha",ft:"Masharti ya Matumizi",fr:"Haki zote zimehifadhiwa.",back:"← Rudi mwanzo",upd:"Toleo la tarehe 30 Oktoba 2026",lnote:"Nyaraka za kisheria kwa sasa zinapatikana kwa Kiukreni pekee."};
T.th={title:"Useful Habit — อาหารเสริมและสูตรผสม: รีวิว ส่วนประกอบ และคุณสมบัติ",desc:"รีวิวอาหารเสริมและสูตรผสม: ส่วนประกอบ หน้าที่ของแต่ละส่วนผสม คุณสมบัติ ข้อควรระวัง และการเปรียบเทียบผลิตภัณฑ์จากผู้ผลิตหลายราย",
nav:["หน้าแรก","เกี่ยวกับเรา","รีวิวและบทความ","เคล็ดลับ","ทำงานอย่างไร","ข้อมูลสำคัญ"],
hk:"ข้อมูล • รีวิว • ผลิตภัณฑ์",h1:"อาหารเสริมและสูตรผสม: <em>รีวิว ส่วนประกอบ และคุณสมบัติ</em>",hp:"สำรวจโลกของอาหารเสริมและผลิตภัณฑ์เฉพาะทาง เราวิเคราะห์ส่วนประกอบ อธิบายหน้าที่ของแต่ละส่วนผสม พิจารณาคุณสมบัติและข้อควรระวัง รวมถึงเปรียบเทียบสูตรผสมและผลิตภัณฑ์จากผู้ผลิตหลายราย<br><br>ข้อมูลที่เข้าใจง่าย รีวิวเชิงปฏิบัติ และการเปรียบเทียบ ช่วยให้คุณรู้จักผลิตภัณฑ์ได้ดีขึ้นและเลือกอย่างรอบคอบ",c1:"เกี่ยวกับเรา",c2:"ทำงานอย่างไร",ch:["อาหารเสริมไม่ใช่ยา","เปิดเผยความสัมพันธ์เชิงพาณิชย์","ไม่รับประกันผลลัพธ์"],
ak:"เกี่ยวกับเรา",at:"เราคือใครและทำอะไร",al:"Useful Habit เป็นเว็บไซต์ที่เผยแพร่รีวิวและคู่มือของเราเองเกี่ยวกับอาหารเสริม เราบอกเฉพาะสิ่งที่เป็นความจริง และไม่อ้างคุณวุฒิหรือสถานะที่เราไม่สามารถยืนยันได้",
about:[["พันธกิจ","อธิบายอาหารเสริมอย่างชัดเจนและตรงไปตรงมา เพื่อให้คุณเปรียบเทียบตัวเลือกและตัดสินใจได้ด้วยตนเอง"],["สิ่งที่คุณได้รับ","รีวิวภาษาเข้าใจง่ายพร้อมส่วนประกอบ วัตถุประสงค์ ข้อควรระวัง และแหล่งอ้างอิง รวมถึงป้ายระบุชัดเจนบนเนื้อหาเชิงพาณิชย์ทุกชิ้น"],["หลักการ","ชัดเจนแทนคำโฆษณาเกินจริง ไม่อ้างว่ารักษาโรคหรือรับประกันผล ทุกความสัมพันธ์เชิงพาณิชย์ถูกเปิดเผย"],["ความถูกต้อง","เรามุ่งนำเสนอข้อมูลที่ถูกต้องและทันสมัย อ้างอิงแหล่งข้อมูลทางการและปฐมภูมิ ระบุวันที่ของเนื้อหา และอัปเดตหรือถอนเนื้อหาที่ล้าสมัย"],["รูปแบบธุรกิจ","เว็บไซต์อาจโปรโมตผลิตภัณฑ์ของบุคคลที่สาม และเราอาจได้รับค่าตอบแทนจากสิ่งนั้น เราจะระบุไว้ในเนื้อหาเสมอ และค่าตอบแทนไม่เปลี่ยนข้อเท็จจริงที่เรานำเสนอ"],["สิ่งที่เราไม่ใช่","เราไม่ใช่ร้านขายยา คลินิก หรือสถานพยาบาล และไม่ให้คำแนะนำทางการแพทย์ ผลิตภัณฑ์จัดหาโดยผู้ขาย ซึ่งเป็นผู้กำหนดราคา เงื่อนไข และความพร้อมจำหน่าย"]],
rk:"รีวิวและบทความ",rt:"เราแจกแจงอาหารเสริมเหมือนอธิบายให้เพื่อนฟัง",rl:"ฉลากเขียนว่าอะไร แหล่งข้อมูลบอกอะไร และอะไรที่ควรใส่ใจ — ทุกรีวิวครอบคลุมเรื่องเหล่านี้ เนื้อหาทั้งหมดมีโครงสร้างเดียวกัน จึงเปรียบเทียบได้ง่าย",
inc:[["มีอะไรอยู่ข้างใน","ในกระปุกมีอะไรบ้างและปริมาณเท่าไร ตามที่ผู้ผลิตระบุ ไม่มีคำหรูหรา"],["ใช้เพื่ออะไร","ผู้ผลิตวางตำแหน่งอาหารเสริมนี้เพื่ออะไร ไม่มีคำสัญญาว่ารักษาโรคใด"],["แหล่งข้อมูลบอกอะไร","เราดูงานวิจัยและข้อมูลทางการ พร้อมให้ลิงก์เพื่อให้คุณตรวจสอบเองได้"],["ใครควรระวัง","หญิงตั้งครรภ์ ผู้ที่ใช้ยา หรือมีโรคเรื้อรัง — ปรึกษาแพทย์ก่อน เราพูดเรื่องนี้ตรง ๆ"],["ราคาและเงื่อนไข","ราคาเท่าไรและผู้ขายเสนอเงื่อนไขอย่างไร พร้อมวันที่ที่เราตรวจสอบ"],["ซื่อสัตย์เรื่องรายได้","หากเราอาจมีรายได้จากผลิตภัณฑ์ คุณจะอ่านเรื่องนี้ได้ตั้งแต่ต้นรีวิว"]],
tk:"เคล็ดลับ",tt:"เลือกอาหารเสริมอย่างฉลาด",tl:"นิสัยง่าย ๆ ที่ช่วยให้ไม่หลงเชื่อคำโฆษณาใหญ่โต เป็นเคล็ดลับให้ความรู้ทั่วไป ไม่ใช่คำแนะนำทางการแพทย์เฉพาะบุคคล",
tips:[["อ่านฉลาก","อย่าดูแค่สโลแกนตัวใหญ่ด้านหน้า แต่ดูส่วนประกอบและปริมาณต่อหนึ่งหน่วยบริโภค"],["ไม่ใช่ยา","อาหารเสริมไม่ได้มีไว้วินิจฉัย รักษา หรือป้องกันโรค"],["ถามผู้เชี่ยวชาญ","หากตั้งครรภ์ ใช้ยา หรือมีโรคประจำตัว ให้ปรึกษาแพทย์หรือเภสัชกรก่อน"],["ระวังคำอัศจรรย์","“รับประกัน” “เห็นผลทันที” “รักษาได้ทุกโรค” เป็นสัญญาณเตือน เช่นเดียวกับรีวิวที่ตรวจสอบไม่ได้"],["ตรวจสอบผู้ขาย","มีช่องทางติดต่อชัดเจน เงื่อนไขการคืนสินค้า และราคารวมก่อนชำระเงินหรือไม่"],["ดูวันที่","คำแนะนำเปลี่ยนแปลงได้ เชื่อถือเนื้อหาที่มีวันที่และระบุแหล่งที่มา"]],
tn:"ข้อมูลที่นี่ไม่สามารถทดแทนการปรึกษาผู้เชี่ยวชาญด้านสุขภาพที่มีคุณวุฒิ",
wk:"ทำงานอย่างไร",wt:"สี่ขั้นตอน ไม่มีอะไรซ่อน",steps:[["เข้ามาอ่าน","เปิดรีวิวหรือคู่มือ แล้วเห็นทันทีว่าผลิตภัณฑ์คืออะไรและฉลากเขียนว่าอย่างไร"],["เปรียบเทียบ","ใช้เช็กลิสต์: ส่วนประกอบ ข้อควรระวัง แหล่งอ้างอิง เงื่อนไขของผู้ขาย"],["ตรวจสอบเอง","ดูแหล่งอ้างอิงและเว็บไซต์ของผู้ขาย เราให้ลิงก์ การตัดสินใจเป็นของคุณ"],["สังเกตป้ายระบุ","หากเนื้อหามีลิงก์พันธมิตรหรือเราอาจได้รับค่าตอบแทน จะระบุชัดเจนก่อนคุณคลิก"]],
wn:"ความพร้อมจำหน่าย ราคา และเงื่อนไขกำหนดโดยผู้ขาย Useful Habit ไม่ขาย ไม่จัดส่ง และไม่ควบคุมผลิตภัณฑ์หรือบริการของบุคคลที่สาม",
ik:"ข้อมูลสำคัญ",it:"ข้อเท็จจริงง่าย ๆ เกี่ยวกับเว็บไซต์นี้",il:"เว็บไซต์นี้คืออะไร อาจมีรายได้อย่างไร และความรับผิดชอบของเราสิ้นสุดที่ใด",
imp:[["ลักษณะเชิงข้อมูล","รีวิวและคู่มือเป็นข้อมูลทั่วไปเพื่อการให้ความรู้ และไม่ได้ปรับให้เหมาะกับบุคคลใดโดยเฉพาะ"],["ไม่ใช่ยาและไม่ใช่คำแนะนำทางการแพทย์","อาหารเสริมไม่ใช่ยา และไม่ได้มีไว้วินิจฉัย รักษา บำบัด หรือป้องกันโรคใด ๆ Useful Habit ไม่ใช่สถานพยาบาล และเนื้อหาในเว็บไซต์ไม่ใช่คำแนะนำทางการแพทย์"],["ไม่รับประกันผลลัพธ์","การตอบสนองของร่างกายแตกต่างกันในแต่ละคน เราไม่รับประกันผลลัพธ์ใด ๆ"],["ความสัมพันธ์เชิงพาณิชย์","เราอาจได้รับค่าตอบแทนจากบุคคลที่สามที่เกี่ยวข้องกับผลิตภัณฑ์ที่เรากล่าวถึง ซึ่งเปิดเผยไว้ในเนื้อหานั้นเอง"],["ผู้ขายและเงื่อนไข","ผลิตภัณฑ์จัดหาโดยผู้ขาย ซึ่งเป็นผู้กำหนดราคา เงื่อนไข และความพร้อมจำหน่าย โปรดตรวจสอบด้วยตนเองก่อนซื้อ"],["ความรับผิดชอบ","ภายในขอบเขตที่กฎหมายที่ใช้บังคับอนุญาต เราไม่รับผิดชอบต่อเนื้อหา ผลิตภัณฑ์ หรือบริการของบุคคลที่สาม ไม่มีสิ่งใดในที่นี้จำกัดความรับผิดที่กฎหมายไม่อนุญาตให้จำกัด รวมถึงสิทธิของผู้บริโภคตามกฎหมาย"],["ความพร้อมจำหน่ายตามภูมิภาค","กฎเกี่ยวกับอาหารเสริมแตกต่างกันในแต่ละประเทศ ผลิตภัณฑ์หรือข้ออ้างบางอย่างอาจไม่ได้รับอนุญาตในทุกที่"],["ความทันสมัยและการเปลี่ยนแปลง","ข้อมูลอาจล้าสมัยหรือเปลี่ยนแปลงโดยไม่แจ้งล่วงหน้า"],["ข้อมูลและเงื่อนไข","วิธีที่เราจัดการข้อมูลอธิบายไว้ใน<a href=\"#privacy\">นโยบายความเป็นส่วนตัว</a> และกฎการใช้เว็บไซต์อยู่ใน<a href=\"#terms\">ข้อกำหนดการใช้งาน</a>"]],

fd:"รีวิวและคู่มืออาหารเสริมด้วยภาษาเข้าใจง่าย",fh1:"การนำทาง",fh2:"ข้อมูลทางกฎหมาย",fh3:"ติดต่อ",fp:"นโยบายความเป็นส่วนตัว",ft:"ข้อกำหนดการใช้งาน",fr:"สงวนลิขสิทธิ์",back:"← กลับหน้าแรก",upd:"ฉบับวันที่ 30 ตุลาคม 2026",lnote:"เอกสารทางกฎหมายมีให้บริการเป็นภาษายูเครนเท่านั้นในขณะนี้"};

T.ar={title:"Useful Habit — المكملات الغذائية والمركّبات: مراجعات وتركيبة وخصائص",desc:"مراجعات للمكملات الغذائية والمركّبات: التركيبة، ودور المكوّنات، والخصائص، والتحذيرات، ومقارنة منتجات عدة جهات مصنّعة.",
nav:["الرئيسية","من نحن","المراجعات والمقالات","نصائح","كيف يعمل","معلومات مهمة"],
hk:"معلومات • مراجعات • منتجات",h1:"المكملات الغذائية والمركّبات: <em>مراجعات وتركيبة وخصائص</em>",hp:"اكتشف عالم المكملات الغذائية والمنتجات المتخصصة. نحلّل التركيبة، ونشرح دور كل مكوّن، ونستعرض الخصائص والتحذيرات، ونقارن بين المركّبات ومنتجات جهات مصنّعة مختلفة.<br><br>معلومات واضحة ومراجعات عملية ومقارنات تساعدك على التعرّف على ما هو متاح واتخاذ قرار واعٍ.",c1:"من نحن",c2:"كيف يعمل",ch:["المكملات ليست أدوية","العلاقات التجارية معلنة","لا ضمان للنتائج"],
ak:"من نحن",at:"من نحن وماذا نفعل",al:"Useful Habit موقع ينشر مراجعاته وأدلّته الخاصة عن المكملات الغذائية. نقول فقط ما يطابق الحقيقة، ولا ننسب لأنفسنا مؤهلات أو صفات لا نستطيع إثباتها.",
about:[["مهمتنا","شرح المكملات بوضوح وصدق لتتمكن من المقارنة بين الخيارات وتقرر بنفسك."],["ما تحصل عليه","مراجعات بلغة بسيطة تتضمن التركيبة والغرض والتحذيرات والمصادر، مع علامات واضحة على أي محتوى تجاري."],["مبادئنا","الوضوح بدل المبالغة. لا ادعاءات بالعلاج ولا بنتائج مضمونة. يُعلَن عن كل علاقة تجارية."],["الدقة","نسعى إلى معلومات دقيقة وحديثة، ونعتمد على مصادر رسمية وأولية، ونضع تاريخًا للمواد ونحدّث المواد القديمة أو نزيلها."],["النموذج التجاري","قد يروّج الموقع لمنتجات أطراف ثالثة وقد نتلقى مقابلًا على ذلك. نذكر هذا دائمًا في المادة، ولا يغيّر المقابل الحقائق التي نعرضها."],["ما لسنا عليه","لسنا صيدلية ولا عيادة ولا مؤسسة طبية ولا نقدّم نصائح طبية. تُورَّد المنتجات من قِبل بائعيها الذين يحددون السعر والشروط والتوفر."]],
rk:"المراجعات والمقالات",rt:"نحلّل المكملات كما نشرحها لصديق",rl:"ما المكتوب على الملصق، وما تقوله المصادر، وما يستحق الانتباه — كل مراجعة تغطي ذلك. جميع المواد بالبنية نفسها، لذا تسهل المقارنة.",
inc:[["ما في التركيبة","ما الموجود تحديدًا في العبوة وبأي كمية — كما ذكرته الجهة المصنّعة، دون عبارات مزخرفة."],["الغرض منه","الغرض الذي تقدّم الجهة المصنّعة المكمّل من أجله. دون وعود بعلاج أي شيء."],["ماذا تقول المصادر","ننظر في الدراسات والبيانات الرسمية ونوفّر الروابط لتتحقق بنفسك."],["من عليه الحذر","الحوامل ومن يتناولون أدوية أو لديهم حالات مزمنة — الطبيب أولًا. نقول ذلك بوضوح."],["السعر والشروط","كم يكلّف وبأي شروط يعرضه البائع، مع تاريخ التحقق."],["صراحة بشأن الربح","إن كان بإمكاننا الربح من منتج ما، فستقرأ ذلك في بداية المراجعة."]],
tk:"نصائح",tt:"كيف تختار المكملات بحكمة",tl:"عادات بسيطة تساعدك على عدم الانخداع بالعبارات الرنانة. هذه نصائح تثقيفية عامة وليست توصيات طبية شخصية.",
tips:[["اقرأ الملصق","لا تكتفِ بالشعار البارز في الواجهة، بل انظر إلى التركيبة والكمية في كل حصة."],["ليس دواءً","المكملات غير مخصصة لتشخيص الأمراض أو علاجها أو الوقاية منها."],["اسأل مختصًا","إن كنتِ حاملًا أو تتناولين أدوية أو لديك مرض، فاستشر الطبيب أو الصيدلي أولًا."],["احذر المعجزات","«مضمون» و«فوري» و«يعالج كل شيء» علامات تحذير. وكذلك التقييمات التي لا يمكن التحقق منها."],["تحقق من البائع","هل توجد وسائل اتصال واضحة وشروط إرجاع وسعر إجمالي قبل الدفع؟"],["انظر إلى التاريخ","التوصيات تتغير. ثق بالمواد المؤرَّخة والتي تذكر مصادرها."]],
tn:"المعلومات هنا لا تغني عن استشارة مختص صحي مؤهل.",
wk:"كيف يعمل",wt:"أربع خطوات، دون أي شيء مخفي",steps:[["تدخل وتقرأ","تفتح مراجعة أو دليلًا وترى فورًا ما المنتج وما المكتوب على ملصقه."],["تقارن","تستخدم قائمة التحقق: التركيبة والتحذيرات والمصادر وشروط البائع."],["تتحقق بنفسك","تطّلع على المصادر وموقع البائع. نحن نوفّر الروابط والقرار قرارك."],["تلاحظ العلامات","إذا تضمنت المادة رابط شريك أو كان بإمكاننا تلقي مقابل، فيُذكر ذلك بوضوح قبل النقر."]],
wn:"يحدد البائعون التوفر والسعر والشروط. لا تبيع Useful Habit منتجات أو خدمات الأطراف الثالثة ولا توصّلها ولا تتحكم بها.",
ik:"معلومات مهمة",it:"حقائق بسيطة عن هذا الموقع",il:"ما هذا الموقع، وكيف يمكن أن يربح، وأين تنتهي مسؤوليتنا.",
imp:[["الطابع الإعلامي","المراجعات والأدلة عامة وتثقيفية وغير مخصصة لشخص بعينه."],["ليست أدوية ولا نصيحة طبية","المكملات ليست أدوية وغير مخصصة لتشخيص أي مرض أو علاجه أو الشفاء منه أو الوقاية منه. Useful Habit ليس مؤسسة طبية ومواد الموقع ليست نصيحة طبية."],["لا ضمان للنتائج","استجابة الجسم تختلف من شخص لآخر. لا نضمن أي نتيجة."],["العلاقات التجارية","قد نتلقى مقابلًا من أطراف ثالثة فيما يتعلق بالمنتجات التي نتناولها. يُفصَح عن ذلك في المادة نفسها."],["البائعون والشروط","تُورَّد المنتجات من قِبل بائعيها الذين يحددون السعر والشروط والتوفر. تحقق منها بنفسك قبل الشراء."],["المسؤولية","في الحدود التي يسمح بها القانون المعمول به، لا نتحمل مسؤولية محتوى الأطراف الثالثة أو منتجاتها أو خدماتها. لا شيء هنا يقيّد المسؤولية التي لا يجوز تقييدها قانونًا، بما في ذلك الحقوق الإلزامية للمستهلكين."],["التوفر الإقليمي","تختلف قواعد المكملات من بلد لآخر؛ وقد لا تُسمح بعض المنتجات أو الادعاءات في كل مكان."],["الحداثة والتغييرات","قد تتقادم المعلومات أو تتغير دون إشعار."],["البيانات والشروط","يُوصَف تعاملنا مع البيانات في <a href=\"#privacy\">سياسة الخصوصية</a>، وقواعد استخدام الموقع في <a href=\"#terms\">شروط الاستخدام</a>."]],
in:"تصف هذه الصفحة النشاط الفعلي للموقع. وهي ليست وسيلة لتجنب المسؤولية أو قواعد الإعلان.",
fd:"مراجعات وأدلة عن المكملات الغذائية بلغة بسيطة.",fh1:"التنقل",fh2:"معلومات قانونية",fh3:"التواصل",fp:"سياسة الخصوصية",ft:"شروط الاستخدام",fr:"جميع الحقوق محفوظة.",back:"→ العودة إلى الرئيسية",upd:"نسخة 30 أكتوبر 2026",lnote:"الوثائق القانونية متاحة حاليًا باللغة الأوكرانية فقط."};
T.ur={title:"Useful Habit — غذائی سپلیمنٹس اور کمپلیکس: جائزے، اجزاء اور خصوصیات",desc:"غذائی سپلیمنٹس اور کمپلیکس کے جائزے: اجزاء، ہر جز کا مقصد، خصوصیات، احتیاطیں اور مختلف مینوفیکچررز کی مصنوعات کا موازنہ۔",
nav:["ہوم","ہمارے بارے میں","جائزے اور مضامین","مشورے","یہ کیسے کام کرتا ہے","اہم معلومات"],
hk:"معلومات • جائزے • مصنوعات",h1:"غذائی سپلیمنٹس اور کمپلیکس: <em>جائزے، اجزاء اور خصوصیات</em>",hp:"غذائی سپلیمنٹس اور مخصوص مصنوعات کی دنیا دریافت کریں۔ ہم اجزاء کا تجزیہ کرتے ہیں، ہر جز کا مقصد سمجھاتے ہیں، خصوصیات اور احتیاطوں پر بات کرتے ہیں، اور مختلف مینوفیکچررز کے کمپلیکس اور مصنوعات کا موازنہ کرتے ہیں۔<br><br>واضح معلومات، عملی جائزے اور موازنے جو آپ کو دستیاب مصنوعات سے بہتر واقفیت اور باخبر انتخاب میں مدد دیتے ہیں۔",c1:"ہمارے بارے میں",c2:"یہ کیسے کام کرتا ہے",ch:["سپلیمنٹس دوا نہیں ہیں","تجارتی تعلقات ظاہر کیے گئے ہیں","نتائج کی کوئی ضمانت نہیں"],
ak:"ہمارے بارے میں",at:"ہم کون ہیں اور کیا کرتے ہیں",al:"Useful Habit ایک ویب سائٹ ہے جو غذائی سپلیمنٹس کے بارے میں اپنے جائزے اور گائیڈز شائع کرتی ہے۔ ہم صرف وہی بتاتے ہیں جو سچ ہو، اور ایسی اہلیت یا حیثیت کا دعویٰ نہیں کرتے جسے ہم ثابت نہ کر سکیں۔",
about:[["مشن","سپلیمنٹس کو واضح اور دیانت داری سے سمجھانا تاکہ آپ اختیارات کا موازنہ کر کے خود فیصلہ کر سکیں۔"],["آپ کو کیا ملتا ہے","آسان زبان میں جائزے جن میں اجزاء، مقصد، احتیاطیں اور ذرائع شامل ہوں، اور ہر تجارتی مواد پر واضح نشان۔"],["اصول","بلند بانگ دعووں کے بجائے وضاحت۔ علاج یا یقینی نتائج کے کوئی دعوے نہیں۔ ہر تجارتی تعلق ظاہر کیا جاتا ہے۔"],["درستگی","ہم درست اور تازہ معلومات کی کوشش کرتے ہیں، سرکاری اور بنیادی ذرائع پر انحصار کرتے ہیں، مواد پر تاریخ لکھتے ہیں اور پرانے مواد کو اپ ڈیٹ یا ہٹا دیتے ہیں۔"],["تجارتی ماڈل","سائٹ تیسرے فریقوں کی مصنوعات کی تشہیر کر سکتی ہے اور ہمیں اس کا معاوضہ مل سکتا ہے۔ ہم اسے ہمیشہ مواد میں بتاتے ہیں، اور معاوضہ ہمارے پیش کردہ حقائق کو نہیں بدلتا۔"],["ہم کیا نہیں ہیں","ہم فارمیسی، کلینک یا طبی ادارہ نہیں ہیں اور طبی مشورہ نہیں دیتے۔ مصنوعات ان کے فروخت کنندگان فراہم کرتے ہیں جو قیمت، شرائط اور دستیابی طے کرتے ہیں۔"]],
rk:"جائزے اور مضامین",rt:"ہم سپلیمنٹس کو ایسے سمجھاتے ہیں جیسے کسی دوست کو بتا رہے ہوں",rl:"لیبل پر کیا لکھا ہے، ذرائع کیا کہتے ہیں اور کس چیز پر توجہ دینی چاہیے — ہر جائزہ یہ سب بتاتا ہے۔ تمام مواد کی ساخت یکساں ہے، اس لیے موازنہ آسان ہے۔",
inc:[["اجزاء میں کیا ہے","ڈبے میں بالکل کیا ہے اور کتنی مقدار میں — جیسا مینوفیکچرر نے بتایا، بغیر خوشنما الفاظ کے۔"],["کس مقصد کے لیے","مینوفیکچرر اسے کس مقصد کے لیے پیش کرتا ہے۔ کسی چیز کے علاج کا وعدہ نہیں۔"],["ذرائع کیا کہتے ہیں","ہم تحقیق اور سرکاری اعداد و شمار دیکھتے ہیں اور روابط دیتے ہیں تاکہ آپ خود تصدیق کر سکیں۔"],["کس کو احتیاط کرنی چاہیے","حاملہ خواتین، دوا لینے والے یا دائمی بیماری والے — پہلے ڈاکٹر سے۔ ہم یہ صاف کہتے ہیں۔"],["قیمت اور شرائط","اس کی قیمت کیا ہے اور فروخت کنندہ کن شرائط پر پیش کرتا ہے، تصدیق کی تاریخ کے ساتھ۔"],["آمدنی کے بارے میں دیانت داری","اگر ہم کسی مصنوعہ سے کما سکتے ہیں تو آپ جائزے کے آغاز میں اسے پڑھیں گے۔"]],
tk:"مشورے",tt:"سپلیمنٹس سمجھداری سے کیسے چنیں",tl:"سادہ عادتیں جو بلند بانگ الفاظ میں آنے سے بچاتی ہیں۔ یہ عمومی تعلیمی مشورے ہیں، ذاتی طبی سفارشات نہیں۔",
tips:[["لیبل پڑھیں","صرف سامنے کے بڑے نعرے پر نہ جائیں، اجزاء اور ہر خوراک کی مقدار دیکھیں۔"],["یہ دوا نہیں","سپلیمنٹس بیماریوں کی تشخیص، علاج یا روک تھام کے لیے نہیں ہیں۔"],["ماہر سے پوچھیں","اگر آپ حاملہ ہیں، دوا لیتے ہیں یا کوئی بیماری ہے تو پہلے ڈاکٹر یا فارماسسٹ سے بات کریں۔"],["معجزوں سے ہوشیار رہیں","“ضمانت”، “فوری”، “ہر چیز کا علاج” خطرے کی علامات ہیں۔ ایسے ہی وہ تبصرے جن کی تصدیق نہ ہو سکے۔"],["فروخت کنندہ کی جانچ کریں","ادائیگی سے پہلے کیا واضح رابطہ، واپسی کی شرائط اور مکمل قیمت موجود ہے؟"],["تاریخ دیکھیں","سفارشات بدلتی رہتی ہیں۔ تاریخ اور مذکور ذرائع والے مواد پر اعتماد کریں۔"]],
tn:"یہاں کی معلومات کسی مستند طبی ماہر سے مشورے کا متبادل نہیں ہیں۔",
wk:"یہ کیسے کام کرتا ہے",wt:"چار مراحل، کچھ بھی پوشیدہ نہیں",steps:[["آئیں اور پڑھیں","کوئی جائزہ یا گائیڈ کھولیں اور فوراً دیکھیں کہ یہ کون سی مصنوعہ ہے اور لیبل پر کیا لکھا ہے۔"],["موازنہ کریں","چیک لسٹ استعمال کریں: اجزاء، احتیاطیں، ذرائع، فروخت کنندہ کی شرائط۔"],["خود تصدیق کریں","ذرائع اور فروخت کنندہ کی ویب سائٹ دیکھیں۔ ہم روابط دیتے ہیں، فیصلہ آپ کا ہے۔"],["نشانات دیکھیں","اگر مواد میں پارٹنر لنک ہو یا ہمیں معاوضہ مل سکتا ہو تو کلک سے پہلے واضح طور پر لکھا جاتا ہے۔"]],
wn:"دستیابی، قیمت اور شرائط فروخت کنندگان طے کرتے ہیں۔ Useful Habit تیسرے فریقوں کی مصنوعات یا خدمات نہ بیچتی ہے، نہ پہنچاتی ہے اور نہ ان پر کنٹرول رکھتی ہے۔",
ik:"اہم معلومات",it:"اس سائٹ کے بارے میں سادہ حقائق",il:"یہ سائٹ کیا ہے، یہ کیسے کما سکتی ہے اور ہماری ذمہ داری کہاں ختم ہوتی ہے۔",
imp:[["معلوماتی نوعیت","جائزے اور گائیڈز عمومی اور تعلیمی ہیں اور کسی خاص فرد کے لیے مخصوص نہیں۔"],["دوا نہیں اور طبی مشورہ نہیں","سپلیمنٹس دوا نہیں ہیں اور کسی بیماری کی تشخیص، علاج یا روک تھام کے لیے نہیں ہیں۔ Useful Habit طبی ادارہ نہیں ہے اور سائٹ کا مواد طبی مشورہ نہیں۔"],["نتائج کی ضمانت نہیں","جسم کا ردعمل ہر فرد میں مختلف ہوتا ہے۔ ہم کسی نتیجے کی ضمانت نہیں دیتے۔"],["تجارتی تعلقات","زیر بحث مصنوعات کے سلسلے میں ہمیں تیسرے فریقوں سے معاوضہ مل سکتا ہے۔ یہ مواد میں ہی ظاہر کیا جاتا ہے۔"],["فروخت کنندگان اور شرائط","مصنوعات ان کے فروخت کنندگان فراہم کرتے ہیں جو قیمت، شرائط اور دستیابی طے کرتے ہیں۔ خریداری سے پہلے خود جانچ لیں۔"],["ذمہ داری","قابل اطلاق قانون کی اجازت کی حد تک ہم تیسرے فریقوں کے مواد، مصنوعات یا خدمات کے ذمہ دار نہیں۔ یہاں کوئی بات اس ذمہ داری کو محدود نہیں کرتی جو قانوناً محدود نہیں کی جا سکتی، بشمول صارفین کے لازمی حقوق۔"],["علاقائی دستیابی","سپلیمنٹس کے قواعد ملک ملک مختلف ہیں؛ کچھ مصنوعات یا دعوے ہر جگہ جائز نہیں ہو سکتے۔"],["تازگی اور تبدیلیاں","معلومات پرانی ہو سکتی ہیں یا بغیر اطلاع بدل سکتی ہیں۔"],["ڈیٹا اور شرائط","ہم ڈیٹا کے ساتھ کیسے پیش آتے ہیں اس کی وضاحت <a href=\"#privacy\">پرائیویسی پالیسی</a> میں ہے، اور سائٹ کے استعمال کے قواعد <a href=\"#terms\">استعمال کی شرائط</a> میں۔"]],

hk:"ინფორმაცია • მიმოხილვები • პროდუქტები",h1:"კვების დანამატები და კომპლექსები: <em>მიმოხილვები, შემადგენლობა და თავისებურებები</em>",hp:"აღმოაჩინეთ კვების დანამატებისა და სპეციალიზებული პროდუქტების სამყარო. ჩვენ ვაანალიზებთ შემადგენლობას, ვხსნით თითოეული კომპონენტის დანიშნულებას, ვუყურებთ მახასიათებლებსა და გაფრთხილებებს და ვადარებთ სხვადასხვა მწარმოებლის კომპლექსებსა და პროდუქტებს.<br><br>გასაგები ინფორმაცია, პრაქტიკული მიმოხილვები და შედარებები, რომლებიც გეხმარებათ უკეთ გაეცნოთ ასორტიმენტს და გააკეთოთ გააზრებული არჩევანი.",c1:"ჩვენ შესახებ",c2:"როგორ მუშაობს",ch:["დანამატები არ არის წამალი","კომერციული კავშირები გაცხადებულია","შედეგის გარანტია არ არსებობს"],
ak:"ჩვენ შესახებ",at:"ვინ ვართ და რას ვაკეთებთ",al:"Useful Habit არის ვებსაიტი, რომელიც აქვეყნებს საკუთარ მიმოხილვებსა და გზამკვლევებს კვების დანამატების შესახებ. ვამბობთ მხოლოდ იმას, რაც სიმართლეს შეესაბამება, და არ ვიმატებთ კვალიფიკაციას ან სტატუსს, რომლის დადასტურებაც არ შეგვიძლია.",
about:[["მისია","დანამატების ნათლად და გულწრფელად ახსნა, რათა შეძლოთ ვარიანტების შედარება და თავად გადაწყვეტა."],["რას იღებთ","მიმოხილვები მარტივი ენით — შემადგენლობით, დანიშნულებით, გაფრთხილებებითა და წყაროებით, ასევე მკაფიო აღნიშვნები ნებისმიერ კომერციულ შინაარსზე."],["პრინციპები","სიცხადე ხმამაღალი სიტყვების ნაცვლად. არანაირი განცხადება განკურნებისა თუ გარანტირებული შედეგის შესახებ. ყოველი კომერციული ურთიერთობა ცხადდება."],["სიზუსტე","ვცდილობთ, მივაწოდოთ ზუსტი და აქტუალური ინფორმაცია, ვეყრდნობით ოფიციალურ და პირველად წყაროებს, მასალებს ვათარიღებთ და მოძველებულს ვაახლებთ ან ვაუქმებთ."],["კომერციული მოდელი","საიტმა შეიძლება მესამე მხარის პროდუქტები გააცნოს და ამისთვის ანაზღაურება მივიღოთ. ამას ყოველთვის მასალაში მივუთითებთ, ხოლო ანაზღაურება არ ცვლის ჩვენ მიერ მოყვანილ ფაქტებს."],["რა არ ვართ","არ ვართ აფთიაქი, კლინიკა ან სამედიცინო დაწესებულება და არ ვაძლევთ სამედიცინო რჩევებს. პროდუქტებს აწვდიან გამყიდველები, რომლებიც ადგენენ ფასს, პირობებსა და ხელმისაწვდომობას."]],
rk:"მიმოხილვები და სტატიები",rt:"დანამატებს ისე ვშლით, როგორც მეგობარს ავუხსნიდით",rl:"რა წერია ეტიკეტზე, რას ამბობენ წყაროები და რაზე ღირს ყურადღების მიქცევა — ყველა მიმოხილვა ამას მოიცავს. ყველა მასალას ერთნაირი სტრუქტურა აქვს, ამიტომ შედარება ადვილია.",
inc:[["რა არის შემადგენლობაში","რა არის ზუსტად ქილაში და რა რაოდენობით — როგორც მწარმოებელმა მიუთითა, ლამაზი სიტყვების გარეშე."],["რისთვისაა განკუთვნილი","რისთვის წარადგენს მწარმოებელი დანამატს. არანაირი დაპირება რამის განკურნებაზე."],["რას ამბობენ წყაროები","ვუყურებთ კვლევებსა და ოფიციალურ მონაცემებს და ვაძლევთ ბმულებს, რათა თავად შეამოწმოთ."],["ვინ უნდა იყოს ფრთხილად","ორსულები, წამლის მიმღებნი ან ქრონიკული მდგომარეობის მქონენი — ჯერ ექიმთან. ამას პირდაპირ ვამბობთ."],["ფასი და პირობები","რა ღირს და რა პირობებით სთავაზობს გამყიდველი, შემოწმების თარიღით."],["გულწრფელად შემოსავალზე","თუ პროდუქტზე შეგვიძლია შემოსავლის მიღება, ამის შესახებ მიმოხილვის დასაწყისში წაიკითხავთ."]],
tk:"რჩევები",tt:"როგორ ავირჩიოთ დანამატები გონივრულად",tl:"მარტივი ჩვევები, რომლებიც ხმამაღალ სიტყვებზე წასვლისგან გიცავთ. ეს ზოგადი საგანმანათლებლო რჩევებია და არა პირადი სამედიცინო რეკომენდაციები.",
tips:[["წაიკითხეთ ეტიკეტი","ნუ შემოიფარგლებით წინა მხარეს არსებული ხმამაღალი ლოზუნგით — შეხედეთ შემადგენლობასა და რაოდენობას ულუფაზე."],["ეს არ არის წამალი","დანამატები არ არის განკუთვნილი დაავადებების დიაგნოსტიკისთვის, სამკურნალოდ ან პროფილაქტიკისთვის."],["ჰკითხეთ სპეციალისტს","თუ ორსულად ხართ, წამალს იღებთ ან დაავადება გაქვთ, ჯერ ექიმს ან ფარმაცევტს მიმართეთ."],["გაუფრთხილდით სასწაულებს","„გარანტირებულია“, „მყისიერად“, „ყველაფერს კურნავს“ საგანგაშო ნიშნებია. ასევე — შეუმოწმებელი მიმოხილვები."],["შეამოწმეთ გამყიდველი","არის თუ არა მკაფიო კონტაქტი, დაბრუნების პირობები და სრული ფასი გადახდამდე?"],["შეხედეთ თარიღს","რეკომენდაციები იცვლება. ენდეთ თარიღიან და წყაროებდასახელებულ მასალებს."]],
tn:"აქ მოცემული ინფორმაცია არ ცვლის კვალიფიციურ სამედიცინო სპეციალისტთან კონსულტაციას.",
wk:"როგორ მუშაობს",wt:"ოთხი ნაბიჯი, არაფერი დაფარული",steps:[["შედიხართ და კითხულობთ","ხსნით მიმოხილვას ან გზამკვლევს და მაშინვე ხედავთ, რა პროდუქტია და რა წერია ეტიკეტზე."],["ადარებთ","იყენებთ შემოწმების სიას: შემადგენლობა, გაფრთხილებები, წყაროები, გამყიდველის პირობები."],["თავად ამოწმებთ","უყურებთ წყაროებს და გამყიდველის საიტს. ჩვენ ბმულებს ვაძლევთ, გადაწყვეტილება თქვენია."],["ამჩნევთ აღნიშვნებს","თუ მასალაში არის პარტნიორის ბმული ან ანაზღაურების მიღება შეგვიძლია, ეს მკაფიოდ წერია დაწკაპუნებამდე."]],
wn:"ხელმისაწვდომობას, ფასსა და პირობებს გამყიდველები განსაზღვრავენ. Useful Habit არ ყიდის, არ აწვდის და არ აკონტროლებს მესამე მხარის პროდუქტებსა თუ მომსახურებას.",
ik:"მნიშვნელოვანი ინფორმაცია",it:"მარტივი ფაქტები ამ საიტის შესახებ",il:"რა არის ეს საიტი, როგორ შეიძლება გამოიმუშაოს და სად მთავრდება ჩვენი პასუხისმგებლობა.",
imp:[["საინფორმაციო ხასიათი","მიმოხილვები და გზამკვლევები ზოგადი და საგანმანათლებლოა და არ არის მორგებული კონკრეტულ ადამიანზე."],["არ არის წამალი და არ არის სამედიცინო რჩევა","დანამატები არ არის წამალი და არ არის განკუთვნილი რაიმე დაავადების დიაგნოსტიკის, მკურნალობის, განკურნების ან პროფილაქტიკისთვის. Useful Habit არ არის სამედიცინო დაწესებულება და საიტის მასალები არ წარმოადგენს სამედიცინო რჩევას."],["შედეგის გარანტია არ არსებობს","ორგანიზმის რეაქცია ინდივიდუალურია. ჩვენ არანაირ შედეგს არ გარანტირებთ."],["კომერციული ურთიერთობები","განხილულ პროდუქტებთან დაკავშირებით შეიძლება მესამე მხარეებისგან ანაზღაურება მივიღოთ. ეს მასალაშივე ცხადდება."],["გამყიდველები და პირობები","პროდუქტებს აწვდიან გამყიდველები, რომლებიც ადგენენ ფასს, პირობებსა და ხელმისაწვდომობას. შეამოწმეთ თავად შეძენამდე."],["პასუხისმგებლობა","მოქმედი კანონმდებლობით დაშვებულ ფარგლებში არ ვაგებთ პასუხს მესამე მხარეთა შინაარსზე, პროდუქტებზე ან მომსახურებაზე. აქ არაფერი ზღუდავს პასუხისმგებლობას, რომლის შეზღუდვაც კანონით დაუშვებელია, მათ შორის მომხმარებელთა სავალდებულო უფლებებს."],["რეგიონული ხელმისაწვდომობა","დანამატებთან დაკავშირებული წესები ქვეყნების მიხედვით განსხვავდება; ზოგი პროდუქტი ან განცხადება შეიძლება ყველგან დაშვებული არ იყოს."],["აქტუალობა და ცვლილებები","ინფორმაცია შეიძლება მოძველდეს ან გაფრთხილების გარეშე შეიცვალოს."],["მონაცემები და პირობები","როგორ ვმუშაობთ მონაცემებთან, აღწერილია <a href=\"#privacy\">კონფიდენციალურობის პოლიტიკაში</a>, ხოლო საიტის გამოყენების წესები — <a href=\"#terms\">გამოყენების პირობებში</a>."]],

fd:"მიმოხილვები და გზამკვლევები კვების დანამატების შესახებ მარტივი ენით.",fh1:"ნავიგაცია",fh2:"სამართლებრივი ინფორმაცია",fh3:"კონტაქტი",fp:"კონფიდენციალურობის პოლიტიკა",ft:"გამოყენების პირობები",fr:"ყველა უფლება დაცულია.",back:"← მთავარზე დაბრუნება",upd:"რედაქცია 2026 წლის 30 ოქტომბრიდან",lnote:"სამართლებრივი დოკუმენტები ამჟამად ხელმისაწვდომია მხოლოდ უკრაინულად."};
T.hy={title:"Useful Habit — Սննդային հավելումներ և համալիրներ. ակնարկներ, բաղադրություն և առանձնահատկություններ",desc:"Սննդային հավելումների և համալիրների ակնարկներ՝ բաղադրություն, բաղադրիչների նշանակությունը, բնութագրեր, զգուշացումներ և տարբեր արտադրողների արտադրանքի համեմատություն։",
nav:["Գլխավոր","Մեր մասին","Ակնարկներ և հոդվածներ","Խորհուրդներ","Ինչպես է աշխատում","Կարևոր տեղեկություն"],
hk:"Տեղեկատվություն • Ակնարկներ • Արտադրանք",h1:"Սննդային հավելումներ և համալիրներ. <em>ակնարկներ, բաղադրություն և առանձնահատկություններ</em>",hp:"Բացահայտեք սննդային հավելումների և մասնագիտացված արտադրանքի աշխարհը։ Մենք վերլուծում ենք բաղադրությունը, բացատրում յուրաքանչյուր բաղադրիչի նշանակությունը, քննարկում բնութագրերն ու զգուշացումները և համեմատում տարբեր արտադրողների համալիրներն ու արտադրանքը։<br><br>Հասկանալի տեղեկատվություն, գործնական ակնարկներ և համեմատություններ, որոնք օգնում են ավելի լավ ծանոթանալ տեսականուն և կատարել գիտակից ընտրություն։",c1:"Մեր մասին",c2:"Ինչպես է աշխատում",ch:["Հավելումները դեղ չեն","Առևտրային կապերը բացահայտված են","Արդյունքի երաշխիք չկա"],
ak:"Մեր մասին",at:"Ովքեր ենք մենք և ինչ ենք անում",al:"Useful Habit-ը կայք է, որը հրապարակում է սեփական ակնարկներն ու ուղեցույցները սննդային հավելումների մասին։ Մենք ասում ենք միայն այն, ինչ համապատասխանում է իրականությանը, և չենք վերագրում մեզ որակավորում կամ կարգավիճակ, որը չենք կարող հաստատել։",
about:[["Առաքելություն","Հավելումները բացատրել պարզ և ազնիվ, որպեսզի կարողանաք համեմատել տարբերակները և ինքներդ որոշել։"],["Ինչ եք ստանում","Պարզ լեզվով ակնարկներ՝ բաղադրությամբ, նշանակությամբ, զգուշացումներով և աղբյուրներով, ինչպես նաև հստակ նշումներ ցանկացած առևտրային բովանդակության վրա։"],["Սկզբունքներ","Պարզություն՝ բարձրագոչ խոսքերի փոխարեն։ Բուժման կամ երաշխավորված արդյունքի մասին պնդումներ չկան։ Յուրաքանչյուր առևտրային կապ բացահայտվում է։"],["Արժանահավատություն","Ձգտում ենք ճշգրիտ և արդի տեղեկատվության, հիմնվում ենք պաշտոնական և առաջնային աղբյուրների վրա, նյութերը ամսաթվով ենք նշում և հնացածները թարմացնում կամ հեռացնում ենք։"],["Առևտրային մոդել","Կայքը կարող է առաջ մղել երրորդ կողմերի արտադրանք, և դրա համար մենք կարող ենք վարձատրություն ստանալ։ Մենք դա միշտ նշում ենք նյութում, իսկ վարձատրությունը չի փոխում մեր ներկայացրած փաստերը։"],["Ինչ չենք մենք","Մենք դեղատուն, կլինիկա կամ բժշկական հաստատություն չենք և բժշկական խորհուրդներ չենք տալիս։ Արտադրանքը մատակարարում են վաճառողները, որոնք սահմանում են գինը, պայմաններն ու հասանելիությունը։"]],
rk:"Ակնարկներ և հոդվածներ",rt:"Հավելումները վերլուծում ենք այնպես, ինչպես կբացատրեինք ընկերոջը",rl:"Ինչ է գրված պիտակի վրա, ինչ են ասում աղբյուրները և ինչին արժե ուշադրություն դարձնել՝ յուրաքանչյուր ակնարկ դա ընդգրկում է։ Բոլոր նյութերն ունեն նույն կառուցվածքը, ուստի համեմատելը հեշտ է։",
inc:[["Ինչ կա բաղադրության մեջ","Տարայի մեջ կոնկրետ ինչ կա և ինչ քանակով՝ ինչպես նշել է արտադրողը, գեղեցիկ բառերից զուրկ։"],["Ինչի համար է նախատեսված","Ինչի համար է արտադրողը ներկայացնում հավելումը։ Առանց որևէ բան բուժելու խոստման։"],["Ինչ են ասում աղբյուրները","Դիտարկում ենք հետազոտություններն ու պաշտոնական տվյալները և տալիս հղումներ, որպեսզի կարողանաք ինքներդ ստուգել։"],["Ում պետք է զգույշ լինել","Հղիներին, դեղ ընդունողներին կամ քրոնիկ վիճակ ունեցողներին՝ նախ բժշկի մոտ։ Դա ասում ենք ուղիղ։"],["Գին և պայմաններ","Որքան է արժե և ինչ պայմաններով է առաջարկում վաճառողը՝ ստուգման ամսաթվով։"],["Ազնվորեն եկամտի մասին","Եթե արտադրանքից կարող ենք եկամուտ ստանալ, այդ մասին կկարդաք ակնարկի սկզբում։"]],
tk:"Խորհուրդներ",tt:"Ինչպես խելամիտ ընտրել հավելումներ",tl:"Պարզ սովորություններ, որոնք օգնում են չհավատալ բարձրագոչ խոսքերին։ Դրանք ընդհանուր կրթական խորհուրդներ են, ոչ թե անձնական բժշկական առաջարկություններ։",
tips:[["Կարդացեք պիտակը","Մի սահմանափակվեք առջևի բարձրագոչ կարգախոսով՝ նայեք բաղադրությանն ու քանակին մեկ չափաբաժնում։"],["Սա դեղ չէ","Հավելումները նախատեսված չեն հիվանդությունների ախտորոշման, բուժման կամ կանխարգելման համար։"],["Հարցրեք մասնագետին","Եթե հղի եք, դեղ եք ընդունում կամ հիվանդություն ունեք, նախ խորհրդակցեք բժշկի կամ դեղագործի հետ։"],["Զգուշացեք հրաշքներից","«Երաշխավորված է», «անմիջապես», «բուժում է ամեն ինչ»՝ դրանք զգուշացնող նշաններ են։ Ինչպես նաև չստուգվող կարծիքները։"],["Ստուգեք վաճառողին","Վճարումից առաջ կա՞ն հստակ կոնտակտներ, վերադարձի պայմաններ և ամբողջ գինը։"],["Նայեք ամսաթվին","Առաջարկությունները փոխվում են։ Վստահեք ամսաթվով և նշված աղբյուրներով նյութերին։"]],
tn:"Այստեղ տեղեկատվությունը չի փոխարինում որակավորված առողջապահության մասնագետի խորհրդատվությանը։",
wk:"Ինչպես է աշխատում",wt:"Չորս քայլ, ոչինչ թաքնված չէ",steps:[["Մտնում և կարդում եք","Բացում եք ակնարկ կամ ուղեցույց և անմիջապես տեսնում՝ ինչ արտադրանք է և ինչ է գրված պիտակի վրա։"],["Համեմատում եք","Օգտագործում եք ստուգաթերթը՝ բաղադրություն, զգուշացումներ, աղբյուրներ, վաճառողի պայմաններ։"],["Ինքներդ ստուգում եք","Դիտում եք աղբյուրներն ու վաճառողի կայքը։ Մենք հղումներ ենք տալիս, որոշումը ձերն է։"],["Նկատում եք նշումները","Եթե նյութում կա գործընկերոջ հղում կամ կարող ենք վարձատրություն ստանալ, դա հստակ գրված է սեղմելուց առաջ։"]],
wn:"Հասանելիությունը, գինը և պայմանները սահմանում են վաճառողները։ Useful Habit-ը չի վաճառում, չի առաքում և չի վերահսկում երրորդ կողմերի արտադրանքը կամ ծառայությունները։",
ik:"Կարևոր տեղեկություն",it:"Պարզ փաստեր այս կայքի մասին",il:"Ինչ է այս կայքը, ինչպես կարող է եկամուտ ստանալ և որտեղ է ավարտվում մեր պատասխանատվությունը։",
imp:[["Տեղեկատվական բնույթ","Ակնարկներն ու ուղեցույցները ընդհանուր և կրթական են և չեն հարմարեցված կոնկրետ անձի համար։"],["Դեղ չեն և բժշկական խորհուրդ չեն","Հավելումները դեղ չեն և նախատեսված չեն որևէ հիվանդության ախտորոշման, բուժման կամ կանխարգելման համար։ Useful Habit-ը բժշկական հաստատություն չէ, իսկ կայքի նյութերը բժշկական խորհուրդ չեն։"],["Արդյունքի երաշխիք չկա","Օրգանիզմի արձագանքը անհատական է։ Մենք որևէ արդյունք չենք երաշխավորում։"],["Առևտրային կապեր","Քննարկվող արտադրանքի հետ կապված երրորդ կողմերից կարող ենք վարձատրություն ստանալ։ Դա բացահայտվում է հենց նյութում։"],["Վաճառողներ և պայմաններ","Արտադրանքը մատակարարում են վաճառողները, որոնք սահմանում են գինը, պայմաններն ու հասանելիությունը։ Գնումից առաջ ինքներդ ստուգեք դրանք։"],["Պատասխանատվություն","Կիրառելի օրենսդրությամբ թույլատրված չափով մենք պատասխանատու չենք երրորդ կողմերի բովանդակության, արտադրանքի կամ ծառայությունների համար։ Այստեղ ոչինչ չի սահմանափակում պատասխանատվությունը, որը օրենքով հնարավոր չէ սահմանափակել, այդ թվում սպառողների պարտադիր իրավունքները։"],["Տարածաշրջանային հասանելիություն","Հավելումների վերաբերյալ կանոնները երկրից երկիր տարբերվում են. որոշ արտադրանք կամ պնդումներ կարող են ամենուր թույլատրված չլինել։"],["Արդիականություն և փոփոխություններ","Տեղեկատվությունը կարող է հնանալ կամ փոխվել առանց նախազգուշացման։"],["Տվյալներ և պայմաններ","Ինչպես ենք վարվում տվյալների հետ՝ նկարագրված է <a href=\"#privacy\">Գաղտնիության քաղաքականությունում</a>, իսկ կայքի օգտագործման կանոնները՝ <a href=\"#terms\">Օգտագործման պայմաններում</a>։"]],
in:"Այս էջը նկարագրում է կայքի իրական գործունեությունը։ Այն պատասխանատվությունից կամ գովազդային կանոններից խուսափելու միջոց չէ։",
fd:"Սննդային հավելումների ակնարկներ և ուղեցույցներ պարզ լեզվով։",fh1:"Նավիգացիա",fh2:"Իրավական տեղեկություն",fh3:"Կոնտակտներ",fp:"Գաղտնիության քաղաքականություն",ft:"Օգտագործման պայմաններ",fr:"Բոլոր իրավունքները պաշտպանված են։",back:"← Վերադառնալ գլխավոր էջ",upd:"Խմբագրություն՝ 2026 թ. հոկտեմբերի 30",lnote:"Իրավական փաստաթղթերն առայժմ հասանելի են միայն ուկրաիներեն։"};

T.en.legal={privacy:{t:"Privacy Policy",s:[
["Who we are","This Policy explains how Useful Habit (the “Site”, “we”) processes personal data of its visitors. Controller: Useful Habit, contact: useful.habit@outlook.com. The Site is operated from Ukraine. Where the GDPR applies to you, we process your data in line with Regulation (EU) 2016/679 (GDPR) and applicable national law."],
["Data we process","Data you provide:|name, phone number, email address and message, if you write to us or send a request form on the Site.|Data collected automatically:|IP address, device and browser type, language, pages viewed, time of visit, referrer, UTM tags and advertising click identifiers (for example gclid, fbclid);|cookies and similar technologies (section 6).|We do not ask for special categories of data, such as health data. Please do not enter such data in forms or messages."],
["Purposes and legal bases","We process data to:|answer your message or request (Art. 6(1)(b) GDPR, steps taken at your request, or your consent under Art. 6(1)(a));|pass your request to a partner or seller of a product when you send a form containing that notice (consent, Art. 6(1)(a));|keep the Site secure and prevent fraud and automated abuse (legitimate interests, Art. 6(1)(f), balanced against your rights);|measure traffic and improve the Site, and measure advertising (consent, Art. 6(1)(a), through the cookie banner);|comply with legal obligations (Art. 6(1)(c))."],
["Recipients","We do not sell your data. It may be shared with:|partners and sellers of products, only if you yourself sent them a request through a form; they act as independent controllers under their own policies;|service providers (hosting, email, spam protection, analytics and advertising services including Google and Meta), who process data on our behalf or under their own terms, within the scope of their services;|public authorities, when the law requires it."],
["International transfers","The Site is operated from Ukraine, outside the EU/EEA, and some providers are located outside the EEA (for example in the USA). Where required, transfers rely on safeguards under Chapter V GDPR, such as the European Commission’s standard contractual clauses, and we process data only to the extent needed for the purposes above."],
["Cookies","Necessary cookies make the Site work (for example, storing your language) and need no consent. Analytics and advertising cookies are set only after you give consent, which you can change or withdraw at any time as easily as you gave it, and in your browser settings. This follows the ePrivacy Directive 2002/58/EC as implemented in national law. Google and Meta process cookie data under their own policies."],
["Retention","We keep data no longer than necessary:|correspondence: up to 3 years;|request-form data: up to 12 months after the last contact, unless the law or a legal claim requires longer;|technical logs: up to 12 months;|cookies: for the periods stated in the consent settings.|After that, data is deleted or anonymised."],
["Your rights","Under GDPR you have the right to:|access your data (Art. 15) and receive a copy;|rectification (Art. 16);|erasure (Art. 17);|restriction of processing (Art. 18);|data portability (Art. 20);|object to processing based on legitimate interests (Art. 21);|withdraw consent at any time, without affecting earlier processing (Art. 7(3));|lodge a complaint with the supervisory authority in your country of residence, place of work or place of the alleged infringement (Art. 77).|To exercise your rights, write to useful.habit@outlook.com. We do not make decisions based solely on automated processing that produce legal effects for you."],
["Security","We use reasonable organisational and technical measures, including HTTPS and restricted access. No transmission over the internet is completely secure."],
["Minors","The Site is not intended for persons under 18 and we knowingly collect no data from them. If you believe a child has sent us data, write to us and we will delete it."],
["Changes","The current version is always published on this page with its date. If a change affects processing that requires consent, we will apply it only after obtaining new consent."],
["Contact","For data protection questions, write to useful.habit@outlook.com."]]},
terms:{t:"Terms of Use",s:[
["General","These Terms govern your use of the Useful Habit website (the “Site”). By using the Site you accept them; if you do not, please do not use it. The Site is intended for persons aged 18 or over."],
["What the Site is","The Site publishes reviews, articles and tips about dietary supplements for information purposes. Useful Habit is not a manufacturer, seller or supplier of supplements, not a pharmacy and not a medical institution, and does not sell, deliver or take payment for such products."],
["Not medical advice","Food supplements are foods, not medicines. Our materials are general and educational and are not medical, pharmaceutical, dietary or other professional advice. We do not present any food supplement as able to prevent, treat or cure a disease. Where we mention a health-related statement, it is either an authorised health claim within the meaning of Regulation (EC) No 1924/2006 or a statement of the manufacturer, which we identify as such. Before using supplements, especially during pregnancy or breastfeeding, if you take medication, have a chronic condition or an allergy, consult a doctor. Do not delay seeing a doctor or stop treatment because of anything on the Site."],
["No guarantees","Individual responses vary. We do not guarantee any result from the products discussed, or that the materials are complete, error-free or up to date, although we aim for that."],
["Commercial relationships","The Site may contain links to third-party resources and commercial relationships with them. If we may receive compensation (for example a commission or payment for a referred request or purchase), we state this in the material before you follow the link. Compensation does not change the facts we present, but you should bear in mind that we may have a financial interest."],
["Third-party sellers and products","Price, terms, availability, composition, labelling, delivery, returns and quality of products are determined and provided by their sellers and manufacturers. Any purchase contract is concluded directly with them, and their terms and privacy policies apply, including any statutory consumer rights such as a right of withdrawal. Check them before buying. We do not control third-party resources and are not responsible for their content or actions."],
["Rules of use","You agree not to:|use the Site unlawfully or in breach of third-party rights;|interfere with the Site, bypass its protection or scrape it with automated tools without permission;|send false data or data of other persons without their consent;|distribute malicious software."],
["Intellectual property","Texts, design, the Useful Habit logo and other materials are protected by copyright. Copying, distribution and adaptation without written permission are prohibited, except quotation to the extent permitted by law with a reference to the Site. Product names and trademarks belong to their owners and are used only for identification."],
["Liability","To the extent permitted by applicable law, we are not liable for losses resulting from use of the information on the Site, its unavailability or the acts of third parties. Nothing in these Terms excludes or limits liability that cannot be excluded or limited by law, including liability for intent or gross negligence, for death or personal injury, or your mandatory consumer rights."],
["Changes","We may change the Site and these Terms. The new version applies from its publication on this page with the date shown; continued use means acceptance."],
["Governing law and disputes","These Terms are governed by the law of Ukraine, without depriving you of the mandatory consumer protection provisions of the country where you habitually reside. If you are a consumer in the EU, you may bring proceedings in the courts of your country of residence. We will first try to resolve any complaint by agreement."],
["Contact","Write to us with any question or complaint at useful.habit@outlook.com."]]}};
T.pl.legal={privacy:{t:"Polityka prywatności",s:[
["Kim jesteśmy","Niniejsza Polityka wyjaśnia, w jaki sposób Useful Habit (dalej „Serwis”, „my”) przetwarza dane osobowe odwiedzających. Administrator: Useful Habit, kontakt: useful.habit@outlook.com. Serwis jest prowadzony z Ukrainy. Jeżeli dotyczy Cię RODO, przetwarzamy dane zgodnie z rozporządzeniem (UE) 2016/679 (RODO) oraz przepisami krajowymi."],
["Jakie dane przetwarzamy","Dane, które podajesz:|imię, numer telefonu, adres e-mail i treść wiadomości, jeśli piszesz do nas lub wysyłasz formularz zapytania;|Dane zbierane automatycznie:|adres IP, rodzaj urządzenia i przeglądarki, język, odwiedzane strony, czas wizyty, źródło wejścia, znaczniki UTM i identyfikatory kliknięć reklamowych (np. gclid, fbclid);|pliki cookie i podobne technologie (pkt 6).|Nie prosimy o dane szczególnych kategorii, w tym dane o zdrowiu. Prosimy nie podawać ich w formularzach ani wiadomościach."],
["Cele i podstawy prawne","Przetwarzamy dane, aby:|odpowiedzieć na Twoją wiadomość lub zapytanie (art. 6 ust. 1 lit. b RODO — działania na Twoje żądanie, albo Twoja zgoda, art. 6 ust. 1 lit. a);|przekazać Twoje zapytanie partnerowi lub sprzedawcy produktu, gdy wyślesz formularz z takim komunikatem (zgoda, art. 6 ust. 1 lit. a);|zapewnić bezpieczeństwo Serwisu oraz zapobiegać nadużyciom i automatycznym atakom (prawnie uzasadniony interes, art. 6 ust. 1 lit. f, po wyważeniu z Twoimi prawami);|mierzyć ruch, ulepszać Serwis i mierzyć skuteczność reklam (zgoda, art. 6 ust. 1 lit. a, udzielana przez baner cookie);|wypełniać obowiązki prawne (art. 6 ust. 1 lit. c)."],
["Odbiorcy danych","Nie sprzedajemy Twoich danych. Mogą one być przekazane:|partnerom i sprzedawcom produktów — wyłącznie jeśli sam wyślesz im zapytanie przez formularz; działają oni jako odrębni administratorzy według własnych polityk;|dostawcom usług (hosting, poczta e-mail, ochrona przed spamem, usługi analityczne i reklamowe, w tym Google i Meta), którzy przetwarzają dane w naszym imieniu lub na własnych warunkach, w zakresie niezbędnym do świadczenia usług;|organom publicznym, gdy wymaga tego prawo."],
["Przekazywanie danych poza EOG","Serwis jest prowadzony z Ukrainy, czyli spoza UE/EOG, a część dostawców ma siedzibę poza EOG (np. w USA). Gdy jest to wymagane, przekazanie opiera się na zabezpieczeniach z rozdziału V RODO, takich jak standardowe klauzule umowne Komisji Europejskiej, a dane przetwarzamy wyłącznie w zakresie potrzebnym do wskazanych celów."],
["Pliki cookie","Niezbędne pliki cookie umożliwiają działanie Serwisu (np. zapamiętanie języka) i nie wymagają zgody. Analityczne i reklamowe pliki cookie ustawiamy dopiero po uzyskaniu Twojej zgody, którą możesz zmienić lub wycofać w dowolnym momencie równie łatwo, jak ją wyrażono, a także w ustawieniach przeglądarki. Odpowiada to dyrektywie 2002/58/WE, wdrożonej do prawa krajowego (w Polsce — Prawo telekomunikacyjne). Google i Meta przetwarzają dane z plików cookie według własnych polityk."],
["Okres przechowywania","Przechowujemy dane nie dłużej, niż to konieczne:|korespondencja — do 3 lat;|dane z formularzy zapytań — do 12 miesięcy od ostatniego kontaktu, chyba że przepisy lub dochodzenie roszczeń wymagają dłużej;|logi techniczne — do 12 miesięcy;|pliki cookie — przez okresy wskazane w ustawieniach zgody.|Następnie dane usuwamy lub anonimizujemy."],
["Twoje prawa","Na podstawie RODO masz prawo do:|dostępu do danych (art. 15) i otrzymania ich kopii;|sprostowania (art. 16);|usunięcia (art. 17);|ograniczenia przetwarzania (art. 18);|przenoszenia danych (art. 20);|sprzeciwu wobec przetwarzania opartego na prawnie uzasadnionym interesie (art. 21);|wycofania zgody w dowolnym momencie, bez wpływu na zgodność z prawem wcześniejszego przetwarzania (art. 7 ust. 3);|wniesienia skargi do organu nadzorczego — w Polsce do Prezesa Urzędu Ochrony Danych Osobowych (UODO) — lub do organu w państwie Twojego zamieszkania, pracy albo miejsca domniemanego naruszenia (art. 77).|Aby skorzystać z praw, napisz na useful.habit@outlook.com. Nie podejmujemy decyzji opartych wyłącznie na zautomatyzowanym przetwarzaniu, które wywoływałyby wobec Ciebie skutki prawne."],
["Bezpieczeństwo","Stosujemy rozsądne środki organizacyjne i techniczne, w tym HTTPS i ograniczenie dostępu. Żadna transmisja przez internet nie jest całkowicie bezpieczna."],
["Osoby niepełnoletnie","Serwis nie jest przeznaczony dla osób poniżej 18 lat i świadomie nie zbieramy ich danych. Jeśli uważasz, że dziecko przesłało nam dane, napisz do nas — usuniemy je."],
["Zmiany","Aktualna wersja jest zawsze publikowana na tej stronie z datą. Jeśli zmiana dotyczy przetwarzania wymagającego zgody, zastosujemy ją dopiero po uzyskaniu nowej zgody."],
["Kontakt","W sprawach ochrony danych pisz na useful.habit@outlook.com."]]},
terms:{t:"Warunki korzystania",s:[
["Postanowienia ogólne","Niniejsze Warunki regulują korzystanie z serwisu Useful Habit (dalej „Serwis”). Korzystając z Serwisu, akceptujesz je; jeśli się nie zgadzasz, nie korzystaj z niego. Serwis jest przeznaczony dla osób pełnoletnich."],
["Czym jest Serwis","Serwis publikuje w celach informacyjnych recenzje, artykuły i porady o suplementach diety. Useful Habit nie jest producentem, sprzedawcą ani dostawcą suplementów, apteką ani placówką medyczną i nie sprzedaje, nie dostarcza ani nie przyjmuje płatności za takie produkty."],
["To nie porada medyczna","Suplementy diety są żywnością, a nie lekami. Nasze materiały mają charakter ogólny i edukacyjny i nie są poradą medyczną, farmaceutyczną, dietetyczną ani inną poradą zawodową. Nie przedstawiamy żadnego suplementu diety jako środka zapobiegającego chorobom, leczącego je lub uzdrawiającego. Jeśli wspominamy oświadczenie zdrowotne, jest to albo dozwolone oświadczenie zdrowotne w rozumieniu rozporządzenia (WE) nr 1924/2006, albo oświadczenie producenta, które jako takie oznaczamy. Przed zastosowaniem suplementów, zwłaszcza w ciąży, w okresie karmienia piersią, przy przyjmowaniu leków, chorobach przewlekłych lub alergii, skonsultuj się z lekarzem. Nie zwlekaj z wizytą u lekarza ani nie przerywaj leczenia z powodu informacji z Serwisu."],
["Brak gwarancji","Reakcja organizmu jest indywidualna. Nie gwarantujemy żadnego rezultatu stosowania omawianych produktów ani kompletności, bezbłędności i aktualności materiałów, choć do tego dążymy."],
["Powiązania komercyjne","Serwis może zawierać linki do zasobów podmiotów trzecich i powiązania komercyjne z nimi. Jeśli możemy otrzymać wynagrodzenie (np. prowizję lub płatność za przekazane zapytanie bądź zakup), informujemy o tym w materiale przed przejściem pod link. Wynagrodzenie nie zmienia przedstawianych faktów, jednak miej na uwadze, że możemy mieć interes finansowy."],
["Sprzedawcy i produkty podmiotów trzecich","Cenę, warunki, dostępność, skład, oznakowanie, dostawę, zwroty i jakość produktów określają i zapewniają ich sprzedawcy i producenci. Umowę sprzedaży zawierasz bezpośrednio z nimi i obowiązują Cię ich warunki i polityki prywatności, w tym ustawowe prawa konsumenta, takie jak prawo odstąpienia od umowy. Sprawdź je przed zakupem. Nie kontrolujemy zasobów podmiotów trzecich i nie odpowiadamy za ich treść ani działania."],
["Zasady korzystania","Zobowiązujesz się nie:|korzystać z Serwisu niezgodnie z prawem lub z naruszeniem praw osób trzecich;|ingerować w działanie Serwisu, obchodzić zabezpieczeń ani pobierać danych automatycznie bez zgody;|przesyłać fałszywych danych ani danych innych osób bez ich zgody;|rozpowszechniać złośliwego oprogramowania."],
["Własność intelektualna","Teksty, projekt, logo Useful Habit i inne materiały podlegają ochronie prawa autorskiego. Kopiowanie, rozpowszechnianie i przerabianie bez pisemnej zgody są zabronione, z wyjątkiem cytowania w granicach dozwolonych prawem z odesłaniem do Serwisu. Nazwy i znaki towarowe produktów należą do ich właścicieli i są używane wyłącznie w celu identyfikacji."],
["Odpowiedzialność","W zakresie dozwolonym przez prawo nie odpowiadamy za szkody wynikłe z korzystania z informacji z Serwisu, jego niedostępności lub działań osób trzecich. Żadne postanowienie Warunków nie wyłącza ani nie ogranicza odpowiedzialności, której nie można wyłączyć ani ograniczyć z mocy prawa, w tym odpowiedzialności za winę umyślną lub rażące niedbalstwo, za śmierć lub uszczerbek na zdrowiu oraz Twoich bezwzględnie obowiązujących praw konsumenta."],
["Zmiany","Możemy zmieniać Serwis i niniejsze Warunki. Nowa wersja obowiązuje od publikacji na tej stronie z podaną datą; dalsze korzystanie oznacza jej akceptację."],
["Prawo właściwe i spory","Warunki podlegają prawu Ukrainy, bez pozbawiania Cię bezwzględnie obowiązujących przepisów o ochronie konsumentów kraju Twojego zwykłego pobytu. Jeśli jesteś konsumentem w UE, możesz dochodzić roszczeń przed sądami państwa swojego zamieszkania. Skargi staramy się najpierw rozwiązać polubownie."],
["Kontakt","W razie pytań lub skarg pisz na useful.habit@outlook.com."]]}};
T.ro.legal={privacy:{t:"Politica de confidențialitate",s:[
["Cine suntem","Această Politică explică modul în care Useful Habit („Site-ul”, „noi”) prelucrează datele cu caracter personal ale vizitatorilor. Operator: Useful Habit, contact: useful.habit@outlook.com. Site-ul este administrat din Ucraina. Dacă RGPD se aplică în cazul dumneavoastră, prelucrăm datele în conformitate cu Regulamentul (UE) 2016/679 (RGPD) și cu legislația națională."],
["Ce date prelucrăm","Date pe care ni le furnizați:|nume, număr de telefon, adresă de e-mail și mesaj, dacă ne scrieți sau trimiteți un formular de solicitare;|Date colectate automat:|adresa IP, tipul dispozitivului și al browserului, limba, paginile vizualizate, ora vizitei, sursa accesării, etichete UTM și identificatori ai clicurilor publicitare (de exemplu gclid, fbclid);|cookie-uri și tehnologii similare (secțiunea 6).|Nu solicităm categorii speciale de date, inclusiv date privind sănătatea. Vă rugăm să nu le introduceți în formulare sau mesaje."],
["Scopuri și temeiuri juridice","Prelucrăm date pentru a:|răspunde mesajului sau solicitării dumneavoastră (art. 6 alin. (1) lit. b RGPD — demersuri la cererea dumneavoastră — sau consimțământul, art. 6 alin. (1) lit. a);|transmite solicitarea dumneavoastră unui partener sau vânzător al unui produs, atunci când trimiteți un formular care conține această informare (consimțământ, art. 6 alin. (1) lit. a);|menține securitatea Site-ului și preveni fraudele și abuzurile automate (interes legitim, art. 6 alin. (1) lit. f, echilibrat cu drepturile dumneavoastră);|măsura traficul, îmbunătăți Site-ul și măsura publicitatea (consimțământ, art. 6 alin. (1) lit. a, prin bannerul de cookie-uri);|respecta obligațiile legale (art. 6 alin. (1) lit. c)."],
["Destinatari","Nu vindem datele dumneavoastră. Acestea pot fi comunicate:|partenerilor și vânzătorilor de produse, doar dacă le-ați trimis dumneavoastră o solicitare prin formular; aceștia acționează ca operatori independenți, conform propriilor politici;|furnizorilor de servicii (găzduire, e-mail, protecție anti-spam, servicii de analiză și publicitate, inclusiv Google și Meta), care prelucrează datele în numele nostru sau conform propriilor condiții, în limita serviciilor lor;|autorităților publice, când legea o cere."],
["Transferuri internaționale","Site-ul este administrat din Ucraina, în afara UE/SEE, iar unii furnizori se află în afara SEE (de exemplu în SUA). Când este necesar, transferurile se bazează pe garanții prevăzute de capitolul V din RGPD, precum clauzele contractuale standard ale Comisiei Europene, iar datele sunt prelucrate doar în măsura necesară scopurilor de mai sus."],
["Cookie-uri","Cookie-urile necesare fac Site-ul să funcționeze (de exemplu, memorarea limbii) și nu necesită consimțământ. Cookie-urile analitice și publicitare se setează doar după consimțământul dumneavoastră, pe care îl puteți modifica sau retrage oricând, la fel de ușor ca dobândirea lui, precum și din setările browserului. Aceasta respectă Directiva 2002/58/CE, transpusă în legislația națională. Google și Meta prelucrează datele din cookie-uri conform propriilor politici."],
["Durata stocării","Păstrăm datele cel mult cât este necesar:|corespondența — până la 3 ani;|datele din formularele de solicitare — până la 12 luni de la ultimul contact, cu excepția cazului în care legea sau o acțiune în justiție impune mai mult;|jurnalele tehnice — până la 12 luni;|cookie-urile — pe perioadele indicate în setările de consimțământ.|Apoi datele sunt șterse sau anonimizate."],
["Drepturile dumneavoastră","Conform RGPD aveți dreptul:|de acces la date (art. 15) și de a primi o copie;|la rectificare (art. 16);|la ștergere (art. 17);|la restricționarea prelucrării (art. 18);|la portabilitatea datelor (art. 20);|de opoziție față de prelucrarea bazată pe interes legitim (art. 21);|de a vă retrage consimțământul oricând, fără a afecta legalitatea prelucrării anterioare (art. 7 alin. (3));|de a depune o plângere la autoritatea de supraveghere — în România, Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal (ANSPDCP) — sau la autoritatea din țara dumneavoastră de reședință, de muncă sau a locului presupusei încălcări (art. 77).|Pentru a vă exercita drepturile, scrieți la useful.habit@outlook.com. Nu luăm decizii bazate exclusiv pe prelucrare automată care produc efecte juridice asupra dumneavoastră."],
["Securitate","Aplicăm măsuri organizatorice și tehnice rezonabile, inclusiv HTTPS și acces restricționat. Nicio transmitere prin internet nu este complet sigură."],
["Minori","Site-ul nu se adresează persoanelor sub 18 ani și nu colectăm cu bună știință datele acestora. Dacă credeți că un copil ne-a trimis date, scrieți-ne și le vom șterge."],
["Modificări","Versiunea curentă este mereu publicată pe această pagină, cu data. Dacă o modificare privește o prelucrare ce necesită consimțământ, o vom aplica doar după obținerea unui nou consimțământ."],
["Contact","Pentru întrebări privind protecția datelor scrieți la useful.habit@outlook.com."]]},
terms:{t:"Termeni de utilizare",s:[
["Dispoziții generale","Acești Termeni reglementează utilizarea site-ului Useful Habit („Site-ul”). Prin utilizarea Site-ului îi acceptați; dacă nu sunteți de acord, nu utilizați Site-ul. Site-ul se adresează persoanelor cu vârsta de cel puțin 18 ani."],
["Ce este Site-ul","Site-ul publică, în scop informativ, recenzii, articole și sfaturi despre suplimente alimentare. Useful Habit nu este producător, vânzător sau furnizor de suplimente, nici farmacie sau instituție medicală și nu vinde, nu livrează și nu încasează plăți pentru astfel de produse."],
["Nu este sfat medical","Suplimentele alimentare sunt alimente, nu medicamente. Materialele noastre sunt generale și educative și nu constituie sfat medical, farmaceutic, dietetic sau profesional de alt tip. Nu prezentăm niciun supliment alimentar ca fiind capabil să prevină, să trateze sau să vindece o boală. Când menționăm o declarație de sănătate, aceasta este fie o declarație autorizată în sensul Regulamentului (CE) nr. 1924/2006, fie o declarație a producătorului, indicată ca atare. Înainte de a folosi suplimente, mai ales în sarcină sau alăptare, dacă luați medicamente, aveți o boală cronică sau o alergie, consultați un medic. Nu amânați consultul medical și nu întrerupeți tratamentul din cauza informațiilor de pe Site."],
["Fără garanții","Răspunsul organismului este individual. Nu garantăm niciun rezultat al folosirii produselor discutate și nici că materialele sunt complete, fără erori sau actuale, deși urmărim acest lucru."],
["Relații comerciale","Site-ul poate conține linkuri către resurse ale unor terți și relații comerciale cu aceștia. Dacă putem primi o remunerație (de exemplu un comision sau o plată pentru o solicitare sau o achiziție transmisă), o indicăm în material înainte de accesarea linkului. Remunerația nu schimbă faptele prezentate, dar rețineți că putem avea un interes financiar."],
["Vânzători și produse ale terților","Prețul, condițiile, disponibilitatea, compoziția, etichetarea, livrarea, returnarea și calitatea produselor sunt stabilite și asigurate de vânzătorii și producătorii acestora. Contractul de vânzare îl încheiați direct cu ei, iar condițiile și politicile lor de confidențialitate se aplică, inclusiv drepturile legale ale consumatorului, precum dreptul de retragere. Verificați-le înainte de cumpărare. Nu controlăm resursele terților și nu răspundem pentru conținutul sau acțiunile lor."],
["Reguli de utilizare","Vă obligați să nu:|folosiți Site-ul în mod ilegal sau cu încălcarea drepturilor terților;|interveniți asupra funcționării Site-ului, ocoliți protecția sau colectați date prin mijloace automate fără permisiune;|trimiteți date false sau ale altor persoane fără consimțământul lor;|răspândiți software malițios."],
["Proprietate intelectuală","Textele, designul, logo-ul Useful Habit și alte materiale sunt protejate de dreptul de autor. Copierea, distribuirea și adaptarea fără permisiune scrisă sunt interzise, cu excepția citării în limitele permise de lege, cu trimitere la Site. Denumirile și mărcile produselor aparțin proprietarilor lor și sunt folosite doar pentru identificare."],
["Răspundere","În măsura permisă de legea aplicabilă, nu răspundem pentru pierderi rezultate din folosirea informațiilor de pe Site, din indisponibilitatea lui sau din faptele terților. Nimic din acești Termeni nu exclude sau limitează răspunderea care nu poate fi exclusă sau limitată prin lege, inclusiv răspunderea pentru intenție sau culpă gravă, pentru deces sau vătămare corporală, ori drepturile dumneavoastră imperative de consumator."],
["Modificări","Putem modifica Site-ul și acești Termeni. Noua versiune se aplică de la publicarea pe această pagină cu data indicată; continuarea utilizării înseamnă acceptare."],
["Legea aplicabilă și litigii","Acești Termeni sunt guvernați de legea Ucrainei, fără a vă priva de dispozițiile imperative de protecție a consumatorilor din țara în care aveți reședința obișnuită. Dacă sunteți consumator în UE, puteți introduce acțiuni la instanțele din țara dumneavoastră de reședință. Încercăm mai întâi să soluționăm amiabil orice reclamație."],
["Contact","Pentru orice întrebare sau reclamație scrieți la useful.habit@outlook.com."]]}};
