T.ar.legal={privacy:{t:"سياسة الخصوصية",s:[
["من نحن","توضح هذه السياسة كيف يعالج موقع Useful Habit (ويُشار إليه بـ«الموقع» و«نحن») البيانات الشخصية لزواره. المتحكم في البيانات: Useful Habit، للتواصل: useful.habit@outlook.com. يُدار الموقع من أوكرانيا. بالنسبة للمستخدمين في الجزائر والمغرب وتونس، نعالج البيانات وفقًا لقانون حماية البيانات الشخصية المعمول به في بلدك (الجزائر: القانون رقم 18-07 لسنة 2018؛ المغرب: القانون رقم 09-08؛ تونس: القانون الأساسي رقم 63 لسنة 2004)."],
["البيانات التي نعالجها","بيانات تقدّمها أنت:|الاسم ورقم الهاتف والبريد الإلكتروني ونص الرسالة، إذا راسلتنا أو أرسلت نموذج طلب عبر الموقع؛|بيانات تُجمع تلقائيًا:|عنوان IP ونوع الجهاز والمتصفح واللغة والصفحات التي تمت زيارتها ووقت الزيارة ومصدرها ووسوم UTM ومعرّفات النقر الإعلانية (مثل gclid وfbclid)؛|ملفات تعريف الارتباط والتقنيات المماثلة (البند 6).|لا نطلب فئات بيانات حساسة، ومنها البيانات الصحية. يُرجى عدم إدخالها في النماذج أو الرسائل."],
["الأغراض والأسس","نعالج البيانات من أجل:|الرد على رسالتك أو طلبك (بناءً على موافقتك أو لتنفيذ طلبك)؛|إحالة طلبك إلى شريك أو بائع المنتج عندما ترسل نموذجًا يتضمن هذا الإشعار (بناءً على موافقتك)؛|الحفاظ على أمن الموقع ومنع الاحتيال وإساءة الاستخدام الآلي (مصلحة مشروعة مع مراعاة حقوقك)؛|قياس حركة الزيارات وتحسين الموقع وقياس الإعلانات (بناءً على موافقتك عبر شريط ملفات تعريف الارتباط)؛|الامتثال للالتزامات القانونية."],
["المستلمون","لا نبيع بياناتك. قد تُشارك مع:|شركاء المنتجات وبائعيها، فقط إذا أرسلت إليهم طلبًا بنفسك عبر نموذج؛ وهم يعملون وفق سياساتهم الخاصة؛|مزودي الخدمات (الاستضافة والبريد وحماية البريد المزعج وخدمات التحليل والإعلان ومنها Google وMeta) الذين يعالجون البيانات نيابةً عنا أو وفق شروطهم، ضمن نطاق خدماتهم؛|الجهات العامة عندما يقتضي القانون ذلك."],
["النقل عبر الحدود","يُدار الموقع من أوكرانيا، ويقع بعض المزودين خارج بلدك (مثل الولايات المتحدة). عند نقل البيانات خارج الدولة نتخذ الضمانات التي يشترطها القانون ونعالج البيانات بالقدر اللازم للأغراض المذكورة فقط."],
["ملفات تعريف الارتباط","تتيح ملفات تعريف الارتباط الضرورية عمل الموقع (مثل حفظ اللغة) ولا تتطلب موافقة. أما ملفات التحليل والإعلان فلا تُفعَّل إلا بعد موافقتك، ويمكنك تغييرها أو سحبها في أي وقت بالسهولة نفسها التي منحتها بها، وكذلك من إعدادات المتصفح. تعالج Google وMeta بيانات هذه الملفات وفق سياساتهما."],
["مدة الاحتفاظ","نحتفظ بالبيانات لمدة لا تتجاوز المطلوب:|المراسلات: حتى 3 سنوات؛|بيانات نماذج الطلب: حتى 12 شهرًا بعد آخر تواصل، ما لم يتطلب القانون أو نزاع ما مدة أطول؛|السجلات التقنية: حتى 12 شهرًا؛|ملفات تعريف الارتباط: وفق المدد المبيّنة في إعدادات الموافقة.|بعد ذلك تُحذف البيانات أو تُجهَّل هويتها."],
["حقوقك","وفق القانون يحق لك:|الحصول على معلومات حول معالجة بياناتك والوصول إليها؛|طلب تصحيح بياناتك أو استكمالها؛|طلب حذف بياناتك؛|طلب تقييد المعالجة؛|نقل بياناتك؛|الاعتراض على المعالجة، بما فيها المعالجة لأغراض التسويق المباشر؛|سحب موافقتك في أي وقت دون التأثير على مشروعية المعالجة السابقة؛|تقديم شكوى إلى الجهة المختصة بحماية البيانات في بلدك (الجزائر: السلطة الوطنية لحماية المعطيات ذات الطابع الشخصي؛ المغرب: اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي CNDP؛ تونس: الهيئة الوطنية لحماية المعطيات الشخصية) أو إلى القضاء.|لممارسة حقوقك، راسلنا على useful.habit@outlook.com."],
["الأمان","نطبق تدابير تنظيمية وتقنية معقولة، منها HTTPS وتقييد الوصول. لا يوجد نقل عبر الإنترنت آمن بالكامل."],
["القاصرون","الموقع غير موجَّه لمن هم دون 18 عامًا ولا نجمع بياناتهم عن علم. إذا كنت تعتقد أن طفلًا أرسل إلينا بيانات، فراسلنا وسنحذفها."],
["التغييرات","تُنشر النسخة الحالية دائمًا في هذه الصفحة مع تاريخها. وإذا تعلق التغيير بمعالجة تتطلب موافقة فلن نطبقه إلا بعد الحصول على موافقة جديدة."],
["التواصل","للاستفسارات حول حماية البيانات راسلنا على useful.habit@outlook.com."]]},
terms:{t:"شروط الاستخدام",s:[
["أحكام عامة","تنظم هذه الشروط استخدام موقع Useful Habit («الموقع»). باستخدامك الموقع فإنك توافق عليها؛ وإن لم توافق فلا تستخدمه. الموقع موجَّه لمن بلغ 18 عامًا فأكثر."],
["ما هو الموقع","ينشر الموقع لأغراض معلوماتية مراجعات ومقالات ونصائح عن المكملات الغذائية. Useful Habit ليس جهة مصنِّعة ولا بائعة ولا موردة للمكملات، وليس صيدلية ولا منشأة صحية، ولا يبيع هذه المنتجات ولا يوصلها ولا يتلقى مدفوعات عنها."],
["ليس نصيحة طبية","المكملات الغذائية ليست أدوية. موادنا عامة وتثقيفية وليست نصيحة طبية أو صيدلانية أو غذائية أو مهنية أخرى. لا نعرض أي مكمل على أنه يمنع المرض أو يعالجه أو يشفي منه، ولا نستخدم ادعاءات مبالغًا فيها مثل «مضمون». وأي معلومة عن الفوائد تستند إلى ما هو مسموح به أو إلى بيان الجهة المصنِّعة، ونوضح ذلك صراحة. قبل استخدام المكملات، خصوصًا أثناء الحمل أو الرضاعة أو عند تناول أدوية أو وجود مرض مزمن أو حساسية، استشر الطبيب. لا تؤجّل زيارة الطبيب ولا توقف علاجك بسبب معلومات الموقع."],
["لا ضمانات","تختلف استجابة الجسم من شخص لآخر. لا نضمن أي نتيجة من المنتجات المذكورة، ولا اكتمال المواد أو خلوها من الأخطاء أو حداثتها، وإن كنا نسعى إلى ذلك."],
["العلاقات التجارية","قد يتضمن الموقع روابط إلى موارد أطراف ثالثة وعلاقات تجارية معها. إذا كان بإمكاننا تلقي مقابل (كعمولة أو أجر عن طلب أو عملية شراء محالة)، فنذكر ذلك في المادة قبل أن تتبع الرابط. المقابل لا يغيّر الحقائق التي نعرضها، لكن ضع في اعتبارك أن لنا مصلحة مالية محتملة."],
["البائعون ومنتجات الأطراف الثالثة","يحدد البائعون والمصنّعون سعر المنتجات وشروطها وتوفرها وتركيبتها وملصقاتها وتوصيلها وإرجاعها وجودتها ويضمنونها. وتبرم عقد الشراء معهم مباشرة وتسري عليك شروطهم وسياسات الخصوصية لديهم، بما فيها حقوق المستهلك القانونية. تحقق منها قبل الشراء. يجب أن تكون المكملات المباعة في الجزائر والمغرب وتونس مسجّلة ومعتمدة، وأن تكون إعلاناتها الصحية معتمدة من الجهة المختصة. لا نتحكم في موارد الأطراف الثالثة ولا نتحمل مسؤولية محتواها أو أفعالها."],
["قواعد الاستخدام","توافق على ألا:|تستخدم الموقع بصورة غير قانونية أو بما ينتهك حقوق الغير؛|تتدخل في عمل الموقع أو تتجاوز حمايته أو تجمع البيانات بأدوات آلية دون إذن؛|ترسل بيانات كاذبة أو بيانات أشخاص آخرين دون موافقتهم؛|تنشر برمجيات خبيثة."],
["الملكية الفكرية","النصوص والتصميم وشعار Useful Habit وسائر المواد محمية بحقوق المؤلف. يُحظر النسخ والتوزيع والتعديل دون إذن كتابي، باستثناء الاقتباس في الحدود التي يسمح بها القانون مع الإشارة إلى الموقع. أسماء المنتجات وعلاماتها التجارية ملك لأصحابها وتُستخدم للتعريف فقط."],
["المسؤولية","في الحدود التي يسمح بها القانون المعمول به، لا نتحمل المسؤولية عن الأضرار الناشئة عن استخدام معلومات الموقع أو عدم توفره أو تصرفات الأطراف الثالثة. لا شيء في هذه الشروط يستبعد أو يقيّد مسؤولية لا يجوز استبعادها أو تقييدها قانونًا، بما في ذلك الحقوق الإلزامية للمستهلكين."],
["التغييرات","يجوز لنا تعديل الموقع وهذه الشروط. تسري النسخة الجديدة من تاريخ نشرها في هذه الصفحة؛ واستمرارك في الاستخدام يعني قبولك."],
["القانون الواجب التطبيق والنزاعات","تخضع هذه الشروط لقانون أوكرانيا، دون الإخلال بأحكام حماية المستهلك الإلزامية في الدولة التي تقيم فيها. وسنحاول أولًا حل أي شكوى بالتراضي."],
["التواصل","لأي سؤال أو شكوى راسلنا على useful.habit@outlook.com."]]}};
T.ur.legal={privacy:{t:"پرائیویسی پالیسی",s:[
["ہم کون ہیں","یہ پالیسی وضاحت کرتی ہے کہ Useful Habit (آگے “سائٹ”، “ہم”) زائرین کا ذاتی ڈیٹا کیسے پراسیس کرتی ہے۔ ڈیٹا کنٹرولر: Useful Habit، رابطہ: useful.habit@outlook.com۔ سائٹ یوکرین سے چلائی جاتی ہے۔ پاکستان میں مقیم صارفین کے لیے ہم ڈیٹا کو پاکستان کے قابل اطلاق قوانین کے مطابق پراسیس کرتے ہیں۔"],
["ہم کون سا ڈیٹا پراسیس کرتے ہیں","جو ڈیٹا آپ خود فراہم کرتے ہیں:|نام، فون نمبر، ای میل اور پیغام کا متن، اگر آپ ہمیں لکھیں یا سائٹ پر درخواست کا فارم بھیجیں؛|جو ڈیٹا خودکار طور پر جمع ہوتا ہے:|IP ایڈریس، ڈیوائس اور براؤزر کی قسم، زبان، دیکھے گئے صفحات، وزٹ کا وقت، ذریعہ، UTM ٹیگز اور اشتہاری کلک شناخت کنندہ (جیسے gclid، fbclid)؛|کوکیز اور اس جیسی ٹیکنالوجیز (نکتہ 6)۔|ہم حساس اقسام کا ڈیٹا، بشمول صحت کا ڈیٹا، نہیں مانگتے۔ براہِ کرم اسے فارم یا پیغام میں درج نہ کریں۔"],
["مقاصد اور بنیادیں","ہم ڈیٹا اس لیے پراسیس کرتے ہیں کہ:|آپ کے پیغام یا درخواست کا جواب دیں (آپ کی رضامندی سے یا آپ کی درخواست پر کارروائی کے لیے)؛|جب آپ اس نوٹس والا فارم بھیجیں تو آپ کی درخواست پروڈکٹ کے پارٹنر یا فروخت کنندہ کو بھیجیں (رضامندی سے)؛|سائٹ کی سیکیورٹی برقرار رکھیں اور فراڈ اور خودکار غلط استعمال روکیں (جائز مفاد، آپ کے حقوق کو مدنظر رکھتے ہوئے)؛|ٹریفک ناپیں، سائٹ بہتر بنائیں اور اشتہارات کی پیمائش کریں (کوکی بینر کے ذریعے رضامندی سے)؛|قانونی ذمہ داریاں پوری کریں۔"],
["وصول کنندگان","ہم آپ کا ڈیٹا فروخت نہیں کرتے۔ یہ ان کے ساتھ شیئر ہو سکتا ہے:|پروڈکٹ پارٹنرز اور فروخت کنندگان — صرف اگر آپ نے خود فارم کے ذریعے انہیں درخواست بھیجی ہو؛ وہ اپنی پالیسیوں کے مطابق کام کرتے ہیں؛|سروس فراہم کنندگان (ہوسٹنگ، ای میل، اسپام سے تحفظ، تجزیاتی اور اشتہاری خدمات بشمول Google اور Meta) جو ہماری طرف سے یا اپنی شرائط پر اپنی خدمات کے دائرے میں ڈیٹا پراسیس کرتے ہیں؛|سرکاری اداروں کے ساتھ، جب قانون تقاضا کرے۔"],
["سرحد پار منتقلی","سائٹ یوکرین سے چلائی جاتی ہے اور کچھ فراہم کنندگان پاکستان سے باہر ہیں (مثلاً امریکہ میں)۔ جب ڈیٹا بیرونِ ملک منتقل ہو تو ہم قابل اطلاق قانون کی شرائط پوری کرتے ہیں اور ڈیٹا صرف مذکورہ مقاصد کے لیے ضروری حد تک پراسیس کرتے ہیں۔"],
["کوکیز","ضروری کوکیز سائٹ کو چلانے کے لیے ہیں (مثلاً زبان یاد رکھنا) اور رضامندی کی محتاج نہیں۔ تجزیاتی اور اشتہاری کوکیز صرف آپ کی رضامندی کے بعد لگتی ہیں، جسے آپ کسی بھی وقت اتنی ہی آسانی سے بدل یا واپس لے سکتے ہیں جتنی آسانی سے دی تھی، نیز براؤزر کی سیٹنگز میں بھی۔ Google اور Meta کوکی ڈیٹا کو اپنی پالیسیوں کے مطابق پراسیس کرتے ہیں۔"],
["ذخیرہ کرنے کی مدت","ہم ڈیٹا ضرورت سے زیادہ دیر نہیں رکھتے:|مراسلت: زیادہ سے زیادہ 3 سال؛|درخواست کے فارم کا ڈیٹا: آخری رابطے کے بعد 12 ماہ تک، جب تک قانون یا تنازع طویل مدت کا تقاضا نہ کرے؛|تکنیکی لاگز: 12 ماہ تک؛|کوکیز: رضامندی کی سیٹنگز میں بتائی گئی مدت کے مطابق۔|اس کے بعد ڈیٹا حذف یا گمنام کر دیا جاتا ہے۔"],
["آپ کے حقوق","آپ کو حق ہے کہ:|اپنے ڈیٹا کی پراسیسنگ کے بارے میں جانیں اور اس تک رسائی حاصل کریں؛|ڈیٹا کی درستی یا تکمیل کا مطالبہ کریں؛|ڈیٹا حذف کرنے کا مطالبہ کریں؛|پراسیسنگ محدود کرنے کا مطالبہ کریں؛|پراسیسنگ پر اعتراض کریں، بشمول براہِ راست مارکیٹنگ؛|کسی بھی وقت رضامندی واپس لیں، پچھلی پراسیسنگ کی قانونی حیثیت پر اثر ڈالے بغیر؛|متعلقہ اتھارٹی یا عدالت میں شکایت درج کریں۔|اپنے حقوق استعمال کرنے کے لیے useful.habit@outlook.com پر لکھیں۔"],
["سیکیورٹی","ہم معقول تنظیمی اور تکنیکی اقدامات اپناتے ہیں، بشمول HTTPS اور محدود رسائی۔ انٹرنیٹ پر کوئی منتقلی مکمل طور پر محفوظ نہیں ہوتی۔"],
["بچے","سائٹ 18 سال سے کم عمر افراد کے لیے نہیں ہے اور ہم جان بوجھ کر ان کا ڈیٹا جمع نہیں کرتے۔ اگر آپ کو لگے کہ کسی بچے نے ہمیں ڈیٹا بھیجا ہے تو ہمیں لکھیں، ہم اسے حذف کر دیں گے۔"],
["تبدیلیاں","موجودہ ورژن ہمیشہ اسی صفحے پر تاریخ کے ساتھ شائع ہوتا ہے۔ اگر تبدیلی ایسی پراسیسنگ سے متعلق ہو جس کے لیے رضامندی درکار ہو تو ہم اسے نئی رضامندی ملنے کے بعد ہی نافذ کریں گے۔"],
["رابطہ","ڈیٹا کے تحفظ سے متعلق سوالات کے لیے useful.habit@outlook.com پر لکھیں۔"]]},
terms:{t:"استعمال کی شرائط",s:[
["عمومی احکام","یہ شرائط Useful Habit ویب سائٹ (“سائٹ”) کے استعمال کو منظم کرتی ہیں۔ سائٹ استعمال کر کے آپ ان سے اتفاق کرتے ہیں؛ اگر متفق نہیں تو سائٹ استعمال نہ کریں۔ سائٹ 18 سال یا اس سے زائد عمر کے افراد کے لیے ہے۔"],
["سائٹ کیا ہے","سائٹ معلوماتی مقصد کے لیے غذائی سپلیمنٹس کے بارے میں جائزے، مضامین اور مشورے شائع کرتی ہے۔ Useful Habit سپلیمنٹس کی مینوفیکچرر، فروخت کنندہ یا سپلائر نہیں، فارمیسی یا طبی ادارہ نہیں، اور ایسی مصنوعات نہ بیچتی ہے، نہ پہنچاتی ہے اور نہ ان کی ادائیگی وصول کرتی ہے۔"],
["طبی مشورہ نہیں","غذائی سپلیمنٹس دوا نہیں ہیں۔ ہمارا مواد عمومی اور تعلیمی ہے اور طبی، دواسازی، غذائی یا کسی اور پیشہ ورانہ مشورے کا درجہ نہیں رکھتا۔ ہم کسی سپلیمنٹ کو بیماری سے بچانے، اس کے علاج یا شفا دینے والا ظاہر نہیں کرتے اور “ضمانت شدہ” جیسے مبالغہ آمیز دعوے استعمال نہیں کرتے۔ مصنوعات کے فوائد سے متعلق معلومات صرف منظور شدہ معلومات یا مینوفیکچرر کے بیان پر مبنی ہوتی ہیں، جنہیں ہم واضح طور پر نشان زد کرتے ہیں۔ سپلیمنٹس استعمال کرنے سے پہلے، خاص طور پر حمل یا دودھ پلانے کے دوران، دوا لیتے وقت، دائمی بیماری یا الرجی کی صورت میں، ڈاکٹر سے مشورہ کریں۔ سائٹ کی معلومات کی بنا پر ڈاکٹر کے پاس جانے میں تاخیر نہ کریں اور علاج بند نہ کریں۔"],
["ضمانت نہیں","جسم کا ردعمل ہر فرد میں مختلف ہوتا ہے۔ ہم زیر بحث مصنوعات کے کسی نتیجے کی، یا مواد کے مکمل، غلطی سے پاک یا تازہ ہونے کی ضمانت نہیں دیتے، اگرچہ ہم اس کی کوشش کرتے ہیں۔"],
["تجارتی تعلقات","سائٹ میں تیسرے فریقوں کے وسائل کے روابط اور ان کے ساتھ تجارتی تعلقات ہو سکتے ہیں۔ اگر ہمیں معاوضہ مل سکتا ہو (مثلاً بھیجی گئی درخواست یا خریداری پر کمیشن) تو ہم اسے لنک پر جانے سے پہلے مواد میں بتاتے ہیں۔ معاوضہ ہمارے پیش کردہ حقائق کو نہیں بدلتا، لیکن یاد رکھیں کہ ہمارا مالی مفاد ہو سکتا ہے۔"],
["فروخت کنندگان اور تیسرے فریق کی مصنوعات","مصنوعات کی قیمت، شرائط، دستیابی، اجزاء، لیبلنگ، ترسیل، واپسی اور معیار کا تعین اور ضمانت ان کے فروخت کنندگان اور مینوفیکچررز دیتے ہیں۔ آپ خرید و فروخت کا معاہدہ براہِ راست ان کے ساتھ کرتے ہیں اور ان کی شرائط اور پرائیویسی پالیسیاں آپ پر لاگو ہوتی ہیں، بشمول صارف کے قانونی حقوق۔ خریدنے سے پہلے ان کی جانچ کر لیں۔ پاکستان میں فروخت ہونے والی مصنوعات کو متعلقہ ریگولیٹری ادارے کی رجسٹریشن اور اشتہاری قواعد پر پورا اترنا ہوتا ہے۔ ہم تیسرے فریقوں کے وسائل پر کنٹرول نہیں رکھتے اور ان کے مواد یا اعمال کے ذمہ دار نہیں۔"],
["استعمال کے قواعد","آپ اتفاق کرتے ہیں کہ:|سائٹ کو غیر قانونی طور پر یا تیسرے فریقوں کے حقوق کی خلاف ورزی میں استعمال نہیں کریں گے؛|سائٹ کے کام میں مداخلت، اس کے تحفظ سے بچاؤ یا اجازت کے بغیر خودکار ذرائع سے ڈیٹا جمع نہیں کریں گے؛|جھوٹا ڈیٹا یا دوسروں کا ڈیٹا ان کی رضامندی کے بغیر نہیں بھیجیں گے؛|نقصان دہ سافٹ ویئر نہیں پھیلائیں گے۔"],
["دانشورانہ املاک","متن، ڈیزائن، Useful Habit کا لوگو اور دیگر مواد کاپی رائٹ سے محفوظ ہیں۔ تحریری اجازت کے بغیر نقل، تقسیم اور ترمیم ممنوع ہے، سوائے قانون کی اجازت کی حد تک حوالے کے، سائٹ کے ذکر کے ساتھ۔ مصنوعات کے نام اور ٹریڈ مارک ان کے مالکان کی ملکیت ہیں اور صرف شناخت کے لیے استعمال ہوتے ہیں۔"],
["ذمہ داری","قابل اطلاق قانون کی اجازت کی حد تک ہم سائٹ کی معلومات کے استعمال، اس کی عدم دستیابی یا تیسرے فریقوں کے اعمال سے ہونے والے نقصانات کے ذمہ دار نہیں۔ ان شرائط میں کوئی بات اس ذمہ داری کو خارج یا محدود نہیں کرتی جسے قانوناً خارج یا محدود نہیں کیا جا سکتا، بشمول صارفین کے لازمی حقوق۔"],
["تبدیلیاں","ہم سائٹ اور ان شرائط میں تبدیلی کر سکتے ہیں۔ نیا ورژن اس صفحے پر درج تاریخ کے ساتھ شائع ہونے سے نافذ ہوتا ہے؛ استعمال جاری رکھنا قبولیت ہے۔"],
["قابل اطلاق قانون اور تنازعات","یہ شرائط یوکرین کے قانون کے تحت ہیں، آپ کی رہائش کے ملک میں صارفین کے تحفظ کے لازمی احکام کو متاثر کیے بغیر۔ ہم کسی بھی شکایت کو پہلے باہمی گفتگو سے حل کرنے کی کوشش کریں گے۔"],
["رابطہ","کسی بھی سوال یا شکایت کے لیے useful.habit@outlook.com پر لکھیں۔"]]}};
T.sw.legal={privacy:{t:"Sera ya Faragha",s:[
["Sisi ni nani","Sera hii inaeleza jinsi Useful Habit (hapa “Tovuti”, “sisi”) inavyochakata data binafsi za wageni. Mdhibiti wa data: Useful Habit, mawasiliano: useful.habit@outlook.com. Tovuti inaendeshwa kutoka Ukraine. Kwa watumiaji walio Kenya, tunachakata data kwa kuzingatia Sheria ya Ulinzi wa Data ya Kenya, 2019."],
["Data tunazochakata","Data unazotoa mwenyewe:|jina, nambari ya simu, barua pepe na ujumbe, ukituandikia au ukituma fomu ya ombi kwenye Tovuti;|Data zinazokusanywa kiotomatiki:|anwani ya IP, aina ya kifaa na kivinjari, lugha, kurasa ulizotazama, muda wa ziara, chanzo cha ziara, lebo za UTM na vitambulisho vya mibofyo ya matangazo (mfano gclid, fbclid);|vidakuzi na teknolojia zinazofanana (kipengele 6).|Hatuombi data nyeti, ikiwemo data za afya. Tafadhali usiziweke kwenye fomu au ujumbe."],
["Madhumuni na misingi","Tunachakata data ili:|kujibu ujumbe au ombi lako (kwa ridhaa yako au kutekeleza ombi lako);|kupeleka ombi lako kwa mshirika au muuzaji wa bidhaa unapotuma fomu yenye taarifa hiyo (kwa ridhaa);|kulinda usalama wa Tovuti na kuzuia ulaghai na matumizi mabaya ya kiotomatiki (maslahi halali, huku tukizingatia haki zako);|kupima trafiki, kuboresha Tovuti na kupima matangazo (kwa ridhaa kupitia bango la vidakuzi);|kutimiza wajibu wa kisheria."],
["Wapokeaji","Hatuuzi data zako. Zinaweza kushirikiwa na:|washirika na wauzaji wa bidhaa, ikiwa wewe mwenyewe uliwatumia ombi kupitia fomu; wanafanya kazi kwa sera zao wenyewe;|watoa huduma (mwenyeji wa tovuti, barua pepe, kinga ya barua taka, huduma za uchanganuzi na matangazo zikiwemo Google na Meta) wanaochakata data kwa niaba yetu au kwa masharti yao, ndani ya wigo wa huduma zao;|mamlaka za umma, inapohitajika kisheria."],
["Uhamishaji nje ya nchi","Tovuti inaendeshwa kutoka Ukraine na baadhi ya watoa huduma wako nje ya Kenya (mfano Marekani). Data zinapohamishwa nje ya nchi, tunazingatia masharti ya sheria husika na kuchakata data kwa kiasi kinachohitajika kwa madhumuni yaliyotajwa pekee."],
["Vidakuzi","Vidakuzi vya lazima huwezesha Tovuti kufanya kazi (mfano kuhifadhi lugha) na havihitaji ridhaa. Vidakuzi vya uchanganuzi na matangazo huwekwa baada ya ridhaa yako pekee, na unaweza kuibadilisha au kuiondoa wakati wowote kwa urahisi kama ulivyoitoa, pia kupitia mipangilio ya kivinjari. Google na Meta huchakata data za vidakuzi kwa sera zao."],
["Muda wa kuhifadhi","Tunahifadhi data kwa muda usiozidi unaohitajika:|mawasiliano: hadi miaka 3;|data za fomu za ombi: hadi miezi 12 tangu mawasiliano ya mwisho, isipokuwa sheria au mgogoro unahitaji muda mrefu zaidi;|kumbukumbu za kiufundi: hadi miezi 12;|vidakuzi: kulingana na muda ulioonyeshwa kwenye mipangilio ya ridhaa.|Baada ya hapo data hufutwa au kufanywa zisitambulike."],
["Haki zako","Una haki ya:|kujulishwa kuhusu uchakataji wa data zako na kuzifikia;|kuomba data zako zisahihishwe;|kuomba data zako zifutwe;|kuomba uchakataji uzuiwe au upunguzwe;|kupinga uchakataji, ikiwemo kwa madhumuni ya masoko ya moja kwa moja;|kuhamisha data zako;|kuondoa ridhaa yako wakati wowote bila kuathiri uhalali wa uchakataji uliotangulia;|kuwasilisha malalamiko kwa mamlaka husika — nchini Kenya, Ofisi ya Kamishna wa Ulinzi wa Data (ODPC) — au mahakamani.|Ili kutumia haki zako, andika kwa useful.habit@outlook.com."],
["Usalama","Tunatumia hatua za kiutawala na kiufundi zinazofaa, zikiwemo HTTPS na ufikiaji uliodhibitiwa. Hakuna usafirishaji kupitia mtandao ulio salama kabisa."],
["Watoto","Tovuti haikusudiwi kwa watu walio chini ya miaka 18 na hatukusanyi data zao kwa makusudi. Ukiamini mtoto ametutumia data, tuandikie nasi tutazifuta."],
["Mabadiliko","Toleo la sasa huchapishwa kila mara kwenye ukurasa huu likiwa na tarehe. Ikiwa mabadiliko yanahusu uchakataji unaohitaji ridhaa, tutayatumia baada ya kupata ridhaa mpya pekee."],
["Mawasiliano","Kwa maswali kuhusu ulinzi wa data, andika kwa useful.habit@outlook.com."]]},
terms:{t:"Masharti ya Matumizi",s:[
["Masharti ya jumla","Masharti haya yanasimamia matumizi ya tovuti ya Useful Habit (“Tovuti”). Kwa kutumia Tovuti unakubali masharti haya; usipokubali, usiitumie. Tovuti inakusudiwa watu wenye umri wa miaka 18 na zaidi."],
["Tovuti ni nini","Tovuti huchapisha tathmini, makala na vidokezo kuhusu virutubisho vya lishe kwa madhumuni ya taarifa. Useful Habit si mtengenezaji, muuzaji wala msambazaji wa virutubisho, si duka la dawa wala taasisi ya matibabu, na haiuzi, haisafirishi wala kupokea malipo ya bidhaa hizo."],
["Si ushauri wa kitabibu","Virutubisho vya lishe si dawa. Maudhui yetu ni ya jumla na ya kielimu na si ushauri wa kitabibu, wa kifamasia, wa lishe au wa kitaalamu mwingine. Hatuwasilishi kirutubisho chochote kama kinachozuia, kutibu au kuponya ugonjwa, wala hatutumii madai ya kupita kiasi kama “imehakikishwa”. Taarifa kuhusu faida za bidhaa hurejelea yaliyoruhusiwa au kauli ya mtengenezaji, ambayo tunaiweka alama wazi. Kabla ya kutumia virutubisho, hasa ukiwa mjamzito, unanyonyesha, unatumia dawa, una ugonjwa sugu au mzio, shauriana na daktari. Usichelewe kumuona daktari wala kuacha matibabu kwa sababu ya taarifa za Tovuti."],
["Hakuna dhamana","Mwitikio wa mwili hutofautiana. Hatuhakikishi matokeo yoyote ya bidhaa zinazojadiliwa, wala kwamba maudhui ni kamili, hayana makosa au ni ya kisasa, ingawa tunajitahidi."],
["Uhusiano wa kibiashara","Tovuti inaweza kuwa na viungo vya rasilimali za watu wengine na uhusiano wa kibiashara nao. Tukiweza kupokea fidia (mfano kamisheni au malipo ya ombi au ununuzi uliopelekwa), tunaeleza hilo kwenye maudhui kabla hujafuata kiungo. Fidia haibadilishi ukweli tunaoutoa, lakini kumbuka kwamba tunaweza kuwa na maslahi ya kifedha."],
["Wauzaji na bidhaa za watu wengine","Bei, masharti, upatikanaji, viambato, lebo, usafirishaji, urejeshaji na ubora wa bidhaa huamuliwa na kuhakikishwa na wauzaji na watengenezaji wake. Unaingia mkataba wa ununuzi moja kwa moja nao na masharti yao na sera zao za faragha zinakuhusu, pamoja na haki za mlaji za kisheria. Zihakiki kabla ya kununua. Virutubisho vinavyouzwa Kenya lazima vikidhi masharti ya usajili na utangazaji ya mamlaka husika. Hatudhibiti rasilimali za watu wengine na hatuwajibiki kwa maudhui au vitendo vyao."],
["Kanuni za matumizi","Unakubali kutofanya yafuatayo:|kutumia Tovuti kinyume cha sheria au kukiuka haki za watu wengine;|kuingilia utendaji wa Tovuti, kukwepa ulinzi wake au kukusanya data kwa zana za kiotomatiki bila ruhusa;|kutuma data za uongo au za watu wengine bila ridhaa yao;|kusambaza programu hasidi."],
["Haki miliki","Maandishi, muundo, nembo ya Useful Habit na maudhui mengine yamelindwa na hakimiliki. Kunakili, kusambaza na kubadilisha bila idhini ya maandishi ni marufuku, isipokuwa kunukuu kadiri sheria inavyoruhusu kwa kutaja Tovuti. Majina na alama za biashara za bidhaa ni mali ya wamiliki wake na hutumiwa kwa utambuzi pekee."],
["Uwajibikaji","Kwa kiwango kinachoruhusiwa na sheria husika, hatuwajibiki kwa hasara inayotokana na matumizi ya taarifa za Tovuti, kutopatikana kwake au vitendo vya watu wengine. Hakuna kilichomo kwenye masharti haya kinachoondoa au kupunguza uwajibikaji usioweza kuondolewa au kupunguzwa kisheria, ikiwemo haki za lazima za walaji."],
["Mabadiliko","Tunaweza kubadilisha Tovuti na masharti haya. Toleo jipya hutumika tangu kuchapishwa kwenye ukurasa huu likiwa na tarehe; kuendelea kutumia kunamaanisha kukubali."],
["Sheria inayotumika na migogoro","Masharti haya yanatawaliwa na sheria za Ukraine, bila kukunyima masharti ya lazima ya ulinzi wa walaji ya nchi unayoishi. Tutajaribu kwanza kutatua malalamiko yoyote kwa mazungumzo."],
["Mawasiliano","Kwa swali au malalamiko yoyote, andika kwa useful.habit@outlook.com."]]}};
