T.lt.legal={privacy:{t:"Privatumo politika",s:[
["Kas mes esame","Ši Politika paaiškina, kaip Useful Habit (toliau – „Svetainė“, „mes“) tvarko lankytojų asmens duomenis. Duomenų valdytojas: Useful Habit, kontaktas: useful.habit@outlook.com. Svetainė valdoma iš Ukrainos. Jei jums taikomas BDAR, duomenis tvarkome pagal Reglamentą (ES) 2016/679 (BDAR) ir nacionalinę teisę."],
["Kokius duomenis tvarkome","Jūsų pateikiami duomenys:|vardas, telefono numeris, el. pašto adresas ir pranešimo tekstas, jei rašote mums ar siunčiate užklausos formą;|Automatiškai renkami duomenys:|IP adresas, įrenginio ir naršyklės tipas, kalba, peržiūrėti puslapiai, apsilankymo laikas, nukreipimo šaltinis, UTM žymos ir reklamos paspaudimų identifikatoriai (pvz., gclid, fbclid);|slapukai ir panašios technologijos (6 punktas).|Neprašome ypatingų kategorijų duomenų, įskaitant sveikatos duomenis. Prašome jų nerašyti formose ir pranešimuose."],
["Tikslai ir teisiniai pagrindai","Duomenis tvarkome, kad:|atsakytume į jūsų pranešimą ar užklausą (BDAR 6 str. 1 d. b punktas – veiksmai jūsų prašymu, arba jūsų sutikimas, a punktas);|perduotume jūsų užklausą produkto partneriui ar pardavėjui, kai siunčiate formą su tokiu pranešimu (sutikimas, a punktas);|užtikrintume Svetainės saugumą ir užkirstume kelią sukčiavimui bei automatizuotam piktnaudžiavimui (teisėtas interesas, f punktas, subalansuotas su jūsų teisėmis);|matuotume lankomumą, tobulintume Svetainę ir matuotume reklamą (sutikimas, a punktas, per slapukų juostą);|vykdytume teisinius įsipareigojimus (c punktas)."],
["Gavėjai","Jūsų duomenų neparduodame. Jie gali būti perduoti:|produktų partneriams ir pardavėjams – tik jei patys jiems išsiuntėte užklausą per formą; jie veikia kaip savarankiški valdytojai pagal savo politikas;|paslaugų teikėjams (prieglobos, el. pašto, apsaugos nuo šlamšto, analitikos ir reklamos paslaugos, įskaitant „Google“ ir „Meta“), kurie duomenis tvarko mūsų vardu ar pagal savo sąlygas savo paslaugų apimtimi;|valdžios institucijoms, kai to reikalauja įstatymai."],
["Tarptautiniai perdavimai","Svetainė valdoma iš Ukrainos, ne ES/EEE, o kai kurie teikėjai yra ne EEE (pvz., JAV). Prireikus perdavimas grindžiamas BDAR V skyriaus apsaugos priemonėmis, pavyzdžiui, Europos Komisijos standartinėmis sutarčių sąlygomis, o duomenys tvarkomi tik tiek, kiek reikia pirmiau nurodytiems tikslams."],
["Slapukai","Būtini slapukai užtikrina Svetainės veikimą (pvz., kalbos įsiminimą) ir sutikimo nereikalauja. Analitikos ir reklamos slapukai nustatomi tik gavus jūsų sutikimą, kurį galite bet kada pakeisti ar atšaukti taip pat lengvai, kaip jį davėte, taip pat naršyklės nustatymuose. Tai atitinka į nacionalinę teisę perkeltą Direktyvą 2002/58/EB. „Google“ ir „Meta“ slapukų duomenis tvarko pagal savo politikas."],
["Saugojimo trukmė","Duomenis saugome ne ilgiau, nei būtina:|korespondenciją – iki 3 metų;|užklausų formų duomenis – iki 12 mėnesių po paskutinio kontakto, nebent įstatymai ar teisinis reikalavimas reikalauja ilgiau;|techninius žurnalus – iki 12 mėnesių;|slapukus – sutikimo nustatymuose nurodytą laiką.|Vėliau duomenys ištrinami arba anonimizuojami."],
["Jūsų teisės","Pagal BDAR turite teisę:|susipažinti su duomenimis (15 str.) ir gauti jų kopiją;|reikalauti ištaisyti (16 str.);|reikalauti ištrinti (17 str.);|apriboti tvarkymą (18 str.);|duomenų perkeliamumą (20 str.);|nesutikti su tvarkymu, grindžiamu teisėtu interesu (21 str.);|bet kada atšaukti sutikimą, nepažeidžiant ankstesnio tvarkymo teisėtumo (7 str. 3 d.);|pateikti skundą priežiūros institucijai – Lietuvoje Valstybinei duomenų apsaugos inspekcijai (VDAI) – arba institucijai šalyje, kurioje gyvenate, dirbate ar įvyko tariamas pažeidimas (77 str.).|Savo teisėms įgyvendinti rašykite adresu useful.habit@outlook.com. Nepriimame sprendimų, grindžiamų vien automatizuotu tvarkymu, kurie jums sukeltų teisinių padarinių."],
["Sauga","Taikome pagrįstas organizacines ir technines priemones, įskaitant HTTPS ir ribotą prieigą. Joks perdavimas internetu nėra visiškai saugus."],
["Nepilnamečiai","Svetainė neskirta jaunesniems nei 18 metų asmenims ir sąmoningai jų duomenų nerenkame. Jei manote, kad vaikas atsiuntė mums duomenų, parašykite – juos ištrinsime."],
["Pakeitimai","Aktuali versija visada skelbiama šiame puslapyje su data. Jei pakeitimas susijęs su tvarkymu, kuriam reikia sutikimo, jį taikysime tik gavę naują sutikimą."],
["Kontaktai","Duomenų apsaugos klausimais rašykite useful.habit@outlook.com."]]},
terms:{t:"Naudojimo sąlygos",s:[
["Bendrosios nuostatos","Šios Sąlygos reglamentuoja svetainės Useful Habit (toliau – „Svetainė“) naudojimą. Naudodamiesi Svetaine jas priimate; jei nesutinkate, jos nenaudokite. Svetainė skirta 18 metų ir vyresniems asmenims."],
["Kas yra Svetainė","Svetainė informaciniais tikslais skelbia apžvalgas, straipsnius ir patarimus apie maisto papildus. Useful Habit nėra papildų gamintojas, pardavėjas ar tiekėjas, vaistinė ar gydymo įstaiga ir tokių produktų neparduoda, netiekia ir nepriima mokėjimų už juos."],
["Tai nėra medicininis patarimas","Maisto papildai yra maisto produktai, o ne vaistai. Mūsų medžiaga yra bendro pobūdžio, šviečiamoji ir nėra medicininis, farmacinis, dietologinis ar kitoks profesinis patarimas. Jokio maisto papildo nepateikiame kaip galinčio užkirsti kelią ligai, ją gydyti ar išgydyti. Kai paminime sveikatos teiginį, tai arba leistinas sveikatos teiginys Reglamento (EB) Nr. 1924/2006 prasme, arba gamintojo teiginys, kurį kaip tokį ir pažymime. Prieš vartodami papildus, ypač nėštumo ar žindymo metu, vartodami vaistus, sergant lėtine liga ar esant alergijai, pasitarkite su gydytoju. Neatidėliokite apsilankymo pas gydytoją ir nenutraukite gydymo dėl Svetainės informacijos."],
["Jokių garantijų","Organizmo reakcija individuali. Negarantuojame jokio aptariamų produktų rezultato, taip pat medžiagos išsamumo, be klaidų ar aktualumo, nors to siekiame."],
["Komerciniai ryšiai","Svetainėje gali būti nuorodų į trečiųjų šalių išteklius ir komercinių ryšių su jais. Jei galime gauti atlygį (pvz., komisinį ar mokėjimą už perduotą užklausą ar pirkinį), tai nurodome medžiagoje prieš sekant nuorodą. Atlygis nekeičia pateikiamų faktų, tačiau turėkite omenyje, kad galime turėti finansinį interesą."],
["Trečiųjų šalių pardavėjai ir produktai","Produktų kainą, sąlygas, prieinamumą, sudėtį, ženklinimą, pristatymą, grąžinimą ir kokybę nustato ir užtikrina jų pardavėjai bei gamintojai. Pirkimo–pardavimo sutartį sudarote tiesiogiai su jais, jums taikomos jų sąlygos ir privatumo politikos, įskaitant įstatymais nustatytas vartotojo teises, pavyzdžiui, atsisakymo teisę. Patikrinkite jas prieš pirkdami. Trečiųjų šalių išteklių nekontroliuojame ir neatsakome už jų turinį ar veiksmus."],
["Naudojimo taisyklės","Įsipareigojate:|nenaudoti Svetainės neteisėtai ar pažeidžiant trečiųjų asmenų teises;|netrukdyti Svetainės veiklai, neapeiti jos apsaugos ir nerinkti duomenų automatizuotomis priemonėmis be leidimo;|nesiųsti klaidingų duomenų ar kitų asmenų duomenų be jų sutikimo;|neplatinti kenkėjiškos programinės įrangos."],
["Intelektinė nuosavybė","Tekstai, dizainas, Useful Habit logotipas ir kita medžiaga saugomi autorių teisių. Kopijuoti, platinti ir perdirbti be raštiško leidimo draudžiama, išskyrus citavimą įstatymų leidžiamais ribose su nuoroda į Svetainę. Produktų pavadinimai ir prekių ženklai priklauso jų savininkams ir naudojami tik identifikavimui."],
["Atsakomybė","Taikytinos teisės leidžiamu mastu neatsakome už nuostolius dėl Svetainės informacijos naudojimo, jos nepasiekiamumo ar trečiųjų asmenų veiksmų. Niekas šiose Sąlygose neatmeta ir neriboja atsakomybės, kurios pagal įstatymą atmesti ar apriboti negalima, įskaitant atsakomybę už tyčią ar didelį neatsargumą, mirtį ar kūno sužalojimą, ir jūsų imperatyvias vartotojų teises."],
["Pakeitimai","Galime keisti Svetainę ir šias Sąlygas. Nauja versija taikoma nuo paskelbimo šiame puslapyje nurodytą dieną; toliau naudodamiesi sutinkate."],
["Taikytina teisė ir ginčai","Šioms Sąlygoms taikoma Ukrainos teisė, nepaneigiant imperatyvių vartotojų apsaugos nuostatų šalies, kurioje įprastai gyvenate. Jei esate vartotojas ES, galite kreiptis į savo gyvenamosios šalies teismus. Bet kokį skundą pirmiausia bandome išspręsti susitarimu."],
["Kontaktai","Su klausimais ir skundais rašykite useful.habit@outlook.com."]]}};
T.lv.legal={privacy:{t:"Privātuma politika",s:[
["Kas mēs esam","Šī Politika skaidro, kā Useful Habit (turpmāk – „Vietne”, „mēs”) apstrādā apmeklētāju personas datus. Pārzinis: Useful Habit, kontakts: useful.habit@outlook.com. Vietne tiek pārvaldīta no Ukrainas. Ja uz jums attiecas VDAR, datus apstrādājam saskaņā ar Regulu (ES) 2016/679 (VDAR) un valsts tiesību aktiem."],
["Kādus datus apstrādājam","Dati, ko sniedzat paši:|vārds, tālruņa numurs, e-pasta adrese un ziņojuma teksts, ja rakstāt mums vai nosūtāt pieprasījuma veidlapu;|Automātiski vāktie dati:|IP adrese, ierīces un pārlūka veids, valoda, skatītās lapas, apmeklējuma laiks, pārsūtīšanas avots, UTM atzīmes un reklāmas klikšķu identifikatori (piem., gclid, fbclid);|sīkdatnes un līdzīgas tehnoloģijas (6. punkts).|Mēs neprasām īpašu kategoriju datus, tostarp veselības datus. Lūdzu, neievadiet tos veidlapās un ziņojumos."],
["Nolūki un tiesiskie pamati","Datus apstrādājam, lai:|atbildētu uz jūsu ziņojumu vai pieprasījumu (VDAR 6. panta 1. punkta b) apakšpunkts — darbības pēc jūsu pieprasījuma — vai jūsu piekrišana, a) apakšpunkts);|nodotu jūsu pieprasījumu produkta partnerim vai pārdevējam, kad nosūtāt veidlapu ar šādu paziņojumu (piekrišana, a) apakšpunkts);|nodrošinātu Vietnes drošību un novērstu krāpšanu un automatizētu ļaunprātīgu izmantošanu (leģitīmās intereses, f) apakšpunkts, izsvērtas pret jūsu tiesībām);|mērītu apmeklējumu, uzlabotu Vietni un mērītu reklāmu (piekrišana, a) apakšpunkts, izmantojot sīkdatņu joslu);|izpildītu juridiskus pienākumus (c) apakšpunkts)."],
["Saņēmēji","Mēs nepārdodam jūsu datus. Tos var nodot:|produktu partneriem un pārdevējiem — tikai tad, ja paši esat viņiem nosūtījuši pieprasījumu, izmantojot veidlapu; viņi darbojas kā patstāvīgi pārziņi saskaņā ar savām politikām;|pakalpojumu sniedzējiem (mitināšana, e-pasts, aizsardzība pret surogātpastu, analītikas un reklāmas pakalpojumi, tostarp Google un Meta), kas datus apstrādā mūsu vārdā vai saskaņā ar saviem noteikumiem, savu pakalpojumu ietvaros;|valsts iestādēm, ja to prasa likums."],
["Starptautiska datu nodošana","Vietne tiek pārvaldīta no Ukrainas, ārpus ES/EEZ, un daži pakalpojumu sniedzēji atrodas ārpus EEZ (piem., ASV). Ja nepieciešams, nodošana balstās uz VDAR V nodaļas garantijām, piemēram, Eiropas Komisijas standarta līguma klauzulām, un datus apstrādājam tikai tiktāl, cik nepieciešams iepriekš minētajiem nolūkiem."],
["Sīkdatnes","Nepieciešamās sīkdatnes nodrošina Vietnes darbību (piem., valodas saglabāšanu) un piekrišanu neprasa. Analītikas un reklāmas sīkdatnes tiek iestatītas tikai pēc jūsu piekrišanas, ko varat jebkurā brīdī mainīt vai atsaukt tikpat viegli, kā tā dota, kā arī pārlūka iestatījumos. Tas atbilst valsts tiesību aktos transponētajai Direktīvai 2002/58/EK. Google un Meta sīkdatņu datus apstrādā saskaņā ar savām politikām."],
["Glabāšanas termiņi","Datus glabājam ne ilgāk, kā nepieciešams:|sarakste — līdz 3 gadiem;|pieprasījuma veidlapu dati — līdz 12 mēnešiem pēc pēdējā kontakta, ja likums vai tiesisks prasījums neprasa ilgāk;|tehniskie žurnāli — līdz 12 mēnešiem;|sīkdatnes — piekrišanas iestatījumos norādītajos termiņos.|Pēc tam dati tiek dzēsti vai anonimizēti."],
["Jūsu tiesības","Saskaņā ar VDAR jums ir tiesības:|piekļūt datiem (15. pants) un saņemt kopiju;|labot (16. pants);|dzēst (17. pants);|ierobežot apstrādi (18. pants);|uz datu pārnesamību (20. pants);|iebilst pret apstrādi, kas balstīta uz leģitīmajām interesēm (21. pants);|jebkurā laikā atsaukt piekrišanu, neietekmējot iepriekšējās apstrādes likumību (7. panta 3. punkts);|iesniegt sūdzību uzraudzības iestādei — Latvijā Datu valsts inspekcijai — vai iestādei valstī, kurā dzīvojat, strādājat vai notikusi iespējamā pārkāpuma vieta (77. pants).|Lai īstenotu tiesības, rakstiet uz useful.habit@outlook.com. Mēs nepieņemam lēmumus, kas balstīti tikai uz automatizētu apstrādi un rada jums tiesiskas sekas."],
["Drošība","Piemērojam saprātīgus organizatoriskus un tehniskus pasākumus, tostarp HTTPS un ierobežotu piekļuvi. Neviena pārsūtīšana internetā nav pilnīgi droša."],
["Nepilngadīgie","Vietne nav paredzēta personām līdz 18 gadu vecumam, un mēs apzināti nevācam viņu datus. Ja uzskatāt, ka bērns mums ir nosūtījis datus, rakstiet — mēs tos dzēsīsim."],
["Izmaiņas","Aktuālā versija vienmēr ir publicēta šajā lapā ar datumu. Ja izmaiņas attiecas uz apstrādi, kam nepieciešama piekrišana, mēs tās piemērosim tikai pēc jaunas piekrišanas saņemšanas."],
["Kontakti","Datu aizsardzības jautājumos rakstiet uz useful.habit@outlook.com."]]},
terms:{t:"Lietošanas noteikumi",s:[
["Vispārīgie noteikumi","Šie Noteikumi regulē vietnes Useful Habit (turpmāk – „Vietne”) lietošanu. Lietojot Vietni, jūs tos pieņemat; ja nepiekrītat, Vietni nelietojiet. Vietne paredzēta personām no 18 gadu vecuma."],
["Kas ir Vietne","Vietne informatīviem nolūkiem publicē apskatus, rakstus un padomus par uztura bagātinātājiem. Useful Habit nav bagātinātāju ražotājs, pārdevējs vai piegādātājs, nav aptieka vai ārstniecības iestāde, un tā nepārdod, nepiegādā un nepieņem maksājumus par šādiem produktiem."],
["Nav medicīnisks padoms","Uztura bagātinātāji ir pārtikas produkti, nevis zāles. Mūsu materiāli ir vispārīgi un izglītojoši, un tie nav medicīnisks, farmaceitisks, uztura vai cits profesionāls padoms. Nevienu uztura bagātinātāju neizvirzām kā līdzekli, kas novērš, ārstē vai izārstē slimību. Ja minam veselīguma norādi, tā ir vai nu atļauta veselīguma norāde Regulas (EK) Nr. 1924/2006 izpratnē, vai ražotāja apgalvojums, ko attiecīgi norādām. Pirms bagātinātāju lietošanas, īpaši grūtniecības vai zīdīšanas laikā, lietojot zāles, hroniskas slimības vai alerģijas gadījumā, konsultējieties ar ārstu. Neatliciet vizīti pie ārsta un nepārtrauciet ārstēšanu Vietnes informācijas dēļ."],
["Nav garantiju","Organisma reakcija ir individuāla. Mēs negarantējam nekādu apskatīto produktu rezultātu, kā arī materiālu pilnīgumu, bezkļūdību vai aktualitāti, lai gan tiecamies uz to."],
["Komerciālās saites","Vietne var saturēt saites uz trešo pušu resursiem un komerciālas attiecības ar tiem. Ja varam saņemt atlīdzību (piem., komisiju vai maksājumu par nodotu pieprasījumu vai pirkumu), to norādām materiālā pirms saites atvēršanas. Atlīdzība nemaina mūsu minētos faktus, taču ņemiet vērā, ka mums var būt finansiāla interese."],
["Trešo pušu pārdevēji un produkti","Produktu cenu, nosacījumus, pieejamību, sastāvu, marķējumu, piegādi, atgriešanu un kvalitāti nosaka un nodrošina to pārdevēji un ražotāji. Pirkuma līgumu slēdzat tieši ar viņiem, un uz jums attiecas viņu noteikumi un privātuma politikas, tostarp likumā noteiktās patērētāja tiesības, piemēram, atteikuma tiesības. Pārbaudiet tos pirms pirkuma. Mēs nekontrolējam trešo pušu resursus un neatbildam par to saturu vai rīcību."],
["Lietošanas noteikumi","Jūs apņematies:|nelietot Vietni nelikumīgi vai pārkāpjot trešo personu tiesības;|netraucēt Vietnes darbību, neapiet tās aizsardzību un nevākt datus ar automatizētiem līdzekļiem bez atļaujas;|nesūtīt nepatiesus datus vai citu personu datus bez viņu piekrišanas;|neplatīt ļaunprātīgu programmatūru."],
["Intelektuālais īpašums","Teksti, dizains, Useful Habit logotips un citi materiāli ir aizsargāti ar autortiesībām. Kopēšana, izplatīšana un pārstrādāšana bez rakstiskas atļaujas ir aizliegta, izņemot citēšanu likuma atļautajās robežās ar norādi uz Vietni. Produktu nosaukumi un preču zīmes pieder to īpašniekiem un tiek izmantoti tikai identifikācijai."],
["Atbildība","Piemērojamo tiesību aktu pieļautajā apjomā mēs neatbildam par zaudējumiem, kas rodas no Vietnes informācijas izmantošanas, tās nepieejamības vai trešo personu rīcības. Nekas šajos Noteikumos neizslēdz un neierobežo atbildību, ko ar likumu nevar izslēgt vai ierobežot, tostarp atbildību par tīšu nodarījumu vai rupju neuzmanību, nāvi vai miesas bojājumiem, kā arī jūsu obligātās patērētāju tiesības."],
["Izmaiņas","Mēs varam mainīt Vietni un šos Noteikumus. Jaunā versija stājas spēkā no publicēšanas šajā lapā ar norādīto datumu; turpmāka lietošana nozīmē piekrišanu."],
["Piemērojamās tiesības un strīdi","Šiem Noteikumiem piemēro Ukrainas tiesības, neatņemot jums tās valsts obligātos patērētāju aizsardzības noteikumus, kurā parasti dzīvojat. Ja esat patērētājs ES, varat vērsties savas dzīvesvietas valsts tiesās. Jebkuru sūdzību vispirms cenšamies atrisināt vienošanās ceļā."],
["Kontakti","Ar jautājumiem un sūdzībām rakstiet uz useful.habit@outlook.com."]]}};
T.it.legal={privacy:{t:"Informativa sulla privacy",s:[
["Chi siamo","La presente Informativa spiega come Useful Habit (di seguito il «Sito», «noi») tratta i dati personali dei visitatori. Titolare del trattamento: Useful Habit, contatto: useful.habit@outlook.com. Il Sito è gestito dall’Ucraina. Se ti si applica il GDPR, trattiamo i dati in conformità al Regolamento (UE) 2016/679 (GDPR) e alla normativa nazionale."],
["Quali dati trattiamo","Dati che fornisci tu:|nome, numero di telefono, indirizzo e-mail e testo del messaggio, se ci scrivi o invii un modulo di richiesta;|Dati raccolti automaticamente:|indirizzo IP, tipo di dispositivo e browser, lingua, pagine visualizzate, orario della visita, fonte di provenienza, tag UTM e identificativi dei clic pubblicitari (ad es. gclid, fbclid);|cookie e tecnologie simili (punto 6).|Non richiediamo categorie particolari di dati, inclusi i dati sulla salute. Ti preghiamo di non inserirli nei moduli o nei messaggi."],
["Finalità e basi giuridiche","Trattiamo i dati per:|rispondere al tuo messaggio o alla tua richiesta (art. 6, par. 1, lett. b) GDPR — misure su tua richiesta — oppure il tuo consenso, lett. a);|inoltrare la tua richiesta a un partner o venditore di un prodotto quando invii un modulo con tale avviso (consenso, lett. a);|garantire la sicurezza del Sito e prevenire frodi e abusi automatizzati (legittimo interesse, lett. f), bilanciato con i tuoi diritti);|misurare il traffico, migliorare il Sito e misurare la pubblicità (consenso, lett. a), tramite il banner dei cookie);|adempiere obblighi di legge (lett. c))."],
["Destinatari","Non vendiamo i tuoi dati. Possono essere comunicati a:|partner e venditori di prodotti — solo se sei stato tu a inviare loro una richiesta tramite modulo; agiscono come titolari autonomi secondo le proprie informative;|fornitori di servizi (hosting, e-mail, protezione antispam, servizi di analisi e pubblicità, inclusi Google e Meta), che trattano i dati per nostro conto o secondo i propri termini, nell’ambito dei loro servizi;|autorità pubbliche, quando la legge lo richiede."],
["Trasferimenti internazionali","Il Sito è gestito dall’Ucraina, al di fuori dell’UE/SEE, e alcuni fornitori si trovano fuori dal SEE (ad es. negli USA). Ove necessario, il trasferimento si basa sulle garanzie del capo V del GDPR, come le clausole contrattuali tipo della Commissione europea, e trattiamo i dati solo nella misura necessaria alle finalità indicate."],
["Cookie","I cookie necessari consentono il funzionamento del Sito (ad es. memorizzare la lingua) e non richiedono consenso. I cookie analitici e pubblicitari sono impostati solo dopo il tuo consenso, che puoi modificare o revocare in qualsiasi momento con la stessa facilità con cui è stato dato, anche nelle impostazioni del browser. Ciò è conforme alla direttiva 2002/58/CE recepita nel diritto nazionale. Google e Meta trattano i dati dei cookie secondo le proprie informative."],
["Conservazione","Conserviamo i dati non oltre il necessario:|corrispondenza — fino a 3 anni;|dati dei moduli di richiesta — fino a 12 mesi dall’ultimo contatto, salvo che la legge o un’azione legale richieda di più;|log tecnici — fino a 12 mesi;|cookie — per i periodi indicati nelle impostazioni del consenso.|Poi i dati sono cancellati o resi anonimi."],
["I tuoi diritti","Ai sensi del GDPR hai il diritto di:|accedere ai dati (art. 15) e ottenerne copia;|rettifica (art. 16);|cancellazione (art. 17);|limitazione del trattamento (art. 18);|portabilità dei dati (art. 20);|opporti al trattamento fondato sul legittimo interesse (art. 21);|revocare il consenso in qualsiasi momento, senza pregiudicare la liceità del trattamento precedente (art. 7, par. 3);|proporre reclamo all’autorità di controllo — in Italia il Garante per la protezione dei dati personali — o all’autorità dello Stato in cui risiedi, lavori o in cui si è verificata la presunta violazione (art. 77).|Per esercitare i diritti scrivi a useful.habit@outlook.com. Non adottiamo decisioni basate unicamente su trattamenti automatizzati che producano effetti giuridici nei tuoi confronti."],
["Sicurezza","Adottiamo misure organizzative e tecniche ragionevoli, tra cui HTTPS e accesso limitato. Nessuna trasmissione via internet è completamente sicura."],
["Minori","Il Sito non è destinato a persone di età inferiore a 18 anni e non raccogliamo consapevolmente i loro dati. Se ritieni che un minore ci abbia inviato dati, scrivici e li cancelleremo."],
["Modifiche","La versione aggiornata è sempre pubblicata su questa pagina con la data. Se la modifica riguarda un trattamento che richiede consenso, la applicheremo solo dopo aver ottenuto un nuovo consenso."],
["Contatti","Per domande sulla protezione dei dati scrivi a useful.habit@outlook.com."]]},
terms:{t:"Termini di utilizzo",s:[
["Disposizioni generali","I presenti Termini disciplinano l’uso del sito Useful Habit (di seguito il «Sito»). Usando il Sito li accetti; se non sei d’accordo, non usarlo. Il Sito è destinato a persone di almeno 18 anni."],
["Cos’è il Sito","Il Sito pubblica a scopo informativo recensioni, articoli e consigli sugli integratori alimentari. Useful Habit non è produttore, venditore o fornitore di integratori, né farmacia o struttura sanitaria, e non vende, non consegna e non riceve pagamenti per tali prodotti."],
["Non è consulenza medica","Gli integratori alimentari sono alimenti, non medicinali. I nostri contenuti sono generali ed educativi e non costituiscono consulenza medica, farmaceutica, dietetica o professionale di altro tipo. Non presentiamo alcun integratore come in grado di prevenire, trattare o curare una malattia. Quando citiamo un’indicazione sulla salute, essa è un’indicazione sulla salute autorizzata ai sensi del Regolamento (CE) n. 1924/2006 oppure un’affermazione del produttore, che indichiamo come tale. Prima di usare integratori, in particolare in gravidanza o allattamento, se assumi farmaci, hai una patologia cronica o un’allergia, consulta un medico. Non rimandare la visita medica né interrompere una terapia a causa delle informazioni del Sito."],
["Nessuna garanzia","La risposta dell’organismo è individuale. Non garantiamo alcun risultato dei prodotti trattati né la completezza, l’assenza di errori o l’attualità dei contenuti, pur puntando a questo."],
["Rapporti commerciali","Il Sito può contenere link a risorse di terzi e rapporti commerciali con essi. Se possiamo ricevere un compenso (ad es. una commissione o un pagamento per una richiesta o un acquisto inoltrato), lo indichiamo nel contenuto prima che tu segua il link. Il compenso non modifica i fatti che presentiamo, ma tieni presente che possiamo avere un interesse economico."],
["Venditori e prodotti di terzi","Prezzo, condizioni, disponibilità, composizione, etichettatura, consegna, resi e qualità dei prodotti sono stabiliti e garantiti dai rispettivi venditori e produttori. Il contratto di acquisto lo concludi direttamente con loro e valgono le loro condizioni e informative sulla privacy, inclusi i diritti legali del consumatore, come il diritto di recesso. Verificali prima di acquistare. Non controlliamo le risorse di terzi e non rispondiamo del loro contenuto o delle loro azioni."],
["Regole d’uso","Ti impegni a non:|usare il Sito in modo illecito o in violazione di diritti di terzi;|interferire con il funzionamento del Sito, aggirarne le protezioni o raccogliere dati con strumenti automatizzati senza permesso;|inviare dati falsi o di altre persone senza il loro consenso;|diffondere software dannoso."],
["Proprietà intellettuale","Testi, grafica, il logo Useful Habit e gli altri contenuti sono protetti dal diritto d’autore. Copia, distribuzione e rielaborazione senza autorizzazione scritta sono vietate, salvo citazione nei limiti consentiti dalla legge con rinvio al Sito. Nomi e marchi dei prodotti appartengono ai rispettivi titolari e sono usati solo per identificazione."],
["Responsabilità","Nei limiti consentiti dalla legge applicabile, non rispondiamo dei danni derivanti dall’uso delle informazioni del Sito, dalla sua indisponibilità o da azioni di terzi. Nulla nei presenti Termini esclude o limita la responsabilità che non può essere esclusa o limitata per legge, inclusa quella per dolo o colpa grave, per morte o lesioni personali, né i tuoi diritti inderogabili di consumatore."],
["Modifiche","Possiamo modificare il Sito e i presenti Termini. La nuova versione si applica dalla pubblicazione su questa pagina con la data indicata; l’uso continuato ne comporta l’accettazione."],
["Legge applicabile e controversie","I presenti Termini sono disciplinati dalla legge ucraina, senza privarti delle disposizioni inderogabili di tutela del consumatore dello Stato in cui risiedi abitualmente. Se sei un consumatore nell’UE, puoi agire davanti ai giudici del tuo Stato di residenza. Cerchiamo prima di risolvere ogni reclamo in via bonaria."],
["Contatti","Per domande o reclami scrivi a useful.habit@outlook.com."]]}};

T.es.legal={privacy:{t:"Política de privacidad",s:[
["Quiénes somos","Esta Política explica cómo Useful Habit (en adelante, el «Sitio», «nosotros») trata los datos personales de sus visitantes. Responsable del tratamiento: Useful Habit, contacto: useful.habit@outlook.com. El Sitio se gestiona desde Ucrania. Si el RGPD se aplica a usted, tratamos sus datos conforme al Reglamento (UE) 2016/679 (RGPD) y a la normativa nacional, incluida la Ley Orgánica 3/2018 (LOPDGDD)."],
["Qué datos tratamos","Datos que usted facilita:|nombre, número de teléfono, correo electrónico y texto del mensaje, si nos escribe o envía un formulario de solicitud;|Datos recogidos automáticamente:|dirección IP, tipo de dispositivo y navegador, idioma, páginas visitadas, hora de la visita, origen de la visita, etiquetas UTM e identificadores de clic publicitario (por ejemplo, gclid, fbclid);|cookies y tecnologías similares (apartado 6).|No solicitamos categorías especiales de datos, como datos de salud. Le rogamos que no los introduzca en formularios ni mensajes."],
["Finalidades y bases jurídicas","Tratamos los datos para:|responder a su mensaje o solicitud (art. 6.1.b RGPD, medidas a petición suya, o su consentimiento, art. 6.1.a);|trasladar su solicitud a un socio o vendedor de un producto cuando envía un formulario con ese aviso (consentimiento, art. 6.1.a);|mantener la seguridad del Sitio y prevenir fraudes y abusos automatizados (interés legítimo, art. 6.1.f, ponderado frente a sus derechos);|medir el tráfico, mejorar el Sitio y medir la publicidad (consentimiento, art. 6.1.a, mediante el banner de cookies);|cumplir obligaciones legales (art. 6.1.c)."],
["Destinatarios","No vendemos sus datos. Pueden comunicarse a:|socios y vendedores de productos, solo si usted mismo les ha enviado una solicitud mediante un formulario; actúan como responsables independientes según sus propias políticas;|proveedores de servicios (alojamiento, correo, protección antispam, servicios de analítica y publicidad, incluidos Google y Meta), que tratan datos por cuenta nuestra o con sus propias condiciones, dentro de sus servicios;|autoridades públicas, cuando la ley lo exija."],
["Transferencias internacionales","El Sitio se gestiona desde Ucrania, fuera de la UE/EEE, y algunos proveedores están fuera del EEE (por ejemplo, en EE. UU.). Cuando es necesario, las transferencias se basan en las garantías del capítulo V del RGPD, como las cláusulas contractuales tipo de la Comisión Europea, y tratamos los datos solo en la medida necesaria para las finalidades indicadas."],
["Cookies","Las cookies necesarias permiten el funcionamiento del Sitio (por ejemplo, recordar el idioma) y no requieren consentimiento. Las cookies analíticas y publicitarias solo se instalan tras su consentimiento, que puede modificar o retirar en cualquier momento con la misma facilidad con que lo otorgó, así como en la configuración de su navegador. Esto se ajusta a la Directiva 2002/58/CE, incorporada en España por la Ley 34/2002 (LSSI-CE). Google y Meta tratan los datos de cookies conforme a sus propias políticas."],
["Plazos de conservación","Conservamos los datos solo el tiempo necesario:|correspondencia: hasta 3 años;|datos de formularios de solicitud: hasta 12 meses desde el último contacto, salvo que la ley o una reclamación exija más;|registros técnicos: hasta 12 meses;|cookies: durante los plazos indicados en la configuración del consentimiento.|Después, los datos se suprimen o se anonimizan."],
["Sus derechos","Conforme al RGPD, usted tiene derecho a:|acceder a sus datos (art. 15) y recibir una copia;|rectificación (art. 16);|supresión (art. 17);|limitación del tratamiento (art. 18);|portabilidad (art. 20);|oponerse al tratamiento basado en interés legítimo (art. 21);|retirar su consentimiento en cualquier momento, sin afectar a la licitud del tratamiento previo (art. 7.3);|presentar una reclamación ante la autoridad de control — en España, la Agencia Española de Protección de Datos (AEPD) — o ante la del Estado en que resida, trabaje o se haya producido la presunta infracción (art. 77).|Para ejercer sus derechos escriba a useful.habit@outlook.com. No adoptamos decisiones basadas únicamente en tratamientos automatizados que produzcan efectos jurídicos sobre usted."],
["Seguridad","Aplicamos medidas organizativas y técnicas razonables, incluidos HTTPS y acceso restringido. Ninguna transmisión por internet es completamente segura."],
["Menores","El Sitio no está dirigido a menores de 18 años y no recogemos conscientemente sus datos. Si cree que un menor nos ha enviado datos, escríbanos y los suprimiremos."],
["Cambios","La versión vigente se publica siempre en esta página con su fecha. Si un cambio afecta a un tratamiento que requiere consentimiento, solo lo aplicaremos tras obtener un nuevo consentimiento."],
["Contacto","Para cuestiones de protección de datos escriba a useful.habit@outlook.com."]]},
terms:{t:"Términos de uso",s:[
["Disposiciones generales","Estos Términos regulan el uso del sitio web Useful Habit (el «Sitio»). Al usar el Sitio los acepta; si no está de acuerdo, no lo use. El Sitio está dirigido a mayores de 18 años."],
["Qué es el Sitio","El Sitio publica, con fines informativos, reseñas, artículos y consejos sobre complementos alimenticios. Useful Habit no es fabricante, vendedor ni proveedor de complementos, ni farmacia ni centro sanitario, y no vende, entrega ni cobra por dichos productos."],
["No es consejo médico","Los complementos alimenticios son alimentos, no medicamentos. Nuestros contenidos son generales y educativos y no constituyen consejo médico, farmacéutico, dietético ni de otro tipo profesional. No presentamos ningún complemento como capaz de prevenir, tratar o curar una enfermedad. Cuando mencionamos una declaración de propiedades saludables, es una declaración autorizada en el sentido del Reglamento (CE) n.º 1924/2006 o una afirmación del fabricante, que identificamos como tal. Antes de usar complementos, en especial durante el embarazo o la lactancia, si toma medicamentos, tiene una enfermedad crónica o alergia, consulte a un médico. No retrase la visita al médico ni interrumpa un tratamiento por lo que lea en el Sitio."],
["Sin garantías","La respuesta del organismo es individual. No garantizamos ningún resultado de los productos tratados ni que los contenidos sean completos, estén libres de errores o actualizados, aunque aspiramos a ello."],
["Relaciones comerciales","El Sitio puede contener enlaces a recursos de terceros y relaciones comerciales con ellos. Si podemos recibir una compensación (por ejemplo, una comisión o un pago por una solicitud o compra derivada), lo indicamos en el contenido antes de que siga el enlace. La compensación no altera los hechos que exponemos, pero tenga presente que podemos tener un interés económico."],
["Vendedores y productos de terceros","El precio, las condiciones, la disponibilidad, la composición, el etiquetado, la entrega, las devoluciones y la calidad de los productos los determinan y garantizan sus vendedores y fabricantes. El contrato de compra lo celebra directamente con ellos y se aplican sus condiciones y políticas de privacidad, incluidos los derechos legales del consumidor, como el derecho de desistimiento. Compruébelos antes de comprar. No controlamos los recursos de terceros ni respondemos de su contenido o actuaciones."],
["Normas de uso","Se compromete a no:|usar el Sitio de forma ilícita o vulnerando derechos de terceros;|interferir en el funcionamiento del Sitio, eludir su protección ni extraer datos con medios automatizados sin permiso;|enviar datos falsos o de otras personas sin su consentimiento;|difundir software malicioso."],
["Propiedad intelectual","Los textos, el diseño, el logotipo de Useful Habit y demás contenidos están protegidos por derechos de autor. Se prohíbe su copia, distribución y transformación sin permiso escrito, salvo la cita dentro de los límites legales con referencia al Sitio. Los nombres y marcas de los productos pertenecen a sus titulares y se usan solo para identificarlos."],
["Responsabilidad","En la medida permitida por la ley aplicable, no respondemos de los daños derivados del uso de la información del Sitio, de su falta de disponibilidad o de actos de terceros. Nada en estos Términos excluye ni limita la responsabilidad que no pueda excluirse o limitarse por ley, incluida la derivada de dolo o negligencia grave, la muerte o las lesiones personales, ni sus derechos imperativos como consumidor."],
["Cambios","Podemos modificar el Sitio y estos Términos. La nueva versión se aplica desde su publicación en esta página con la fecha indicada; seguir usando el Sitio implica su aceptación."],
["Ley aplicable y controversias","Estos Términos se rigen por la ley de Ucrania, sin privarle de las disposiciones imperativas de protección del consumidor del Estado en que reside habitualmente. Si es consumidor en la UE, puede ejercer acciones ante los tribunales de su país de residencia. Intentaremos resolver cualquier reclamación de forma amistosa."],
["Contacto","Para cualquier consulta o reclamación escriba a useful.habit@outlook.com."]]}};
T.pt.legal={privacy:{t:"Política de privacidade",s:[
["Quem somos","Esta Política explica como a Useful Habit (doravante o «Site», «nós») trata os dados pessoais dos visitantes. Responsável pelo tratamento: Useful Habit, contacto: useful.habit@outlook.com. O Site é gerido a partir da Ucrânia. Se o RGPD se aplica a si, tratamos os dados em conformidade com o Regulamento (UE) 2016/679 (RGPD) e a legislação nacional, incluindo a Lei n.º 58/2019."],
["Que dados tratamos","Dados que nos fornece:|nome, número de telefone, endereço de e-mail e texto da mensagem, se nos escrever ou enviar um formulário de pedido;|Dados recolhidos automaticamente:|endereço IP, tipo de dispositivo e navegador, idioma, páginas visualizadas, hora da visita, origem do acesso, etiquetas UTM e identificadores de cliques publicitários (por exemplo, gclid, fbclid);|cookies e tecnologias semelhantes (ponto 6).|Não solicitamos categorias especiais de dados, como dados de saúde. Pedimos que não os introduza em formulários ou mensagens."],
["Finalidades e fundamentos jurídicos","Tratamos os dados para:|responder à sua mensagem ou pedido (art. 6.º, n.º 1, al. b) do RGPD, diligências a seu pedido, ou o seu consentimento, al. a));|encaminhar o seu pedido a um parceiro ou vendedor de um produto quando envia um formulário com esse aviso (consentimento, al. a));|manter a segurança do Site e prevenir fraudes e abusos automatizados (interesse legítimo, al. f), ponderado face aos seus direitos);|medir o tráfego, melhorar o Site e medir a publicidade (consentimento, al. a), através do banner de cookies);|cumprir obrigações legais (al. c))."],
["Destinatários","Não vendemos os seus dados. Podem ser comunicados a:|parceiros e vendedores de produtos, apenas se tiver sido você a enviar-lhes um pedido através de um formulário; atuam como responsáveis independentes segundo as suas próprias políticas;|prestadores de serviços (alojamento, e-mail, proteção antispam, serviços de análise e publicidade, incluindo Google e Meta), que tratam dados por nossa conta ou segundo os seus próprios termos, no âmbito dos seus serviços;|autoridades públicas, quando a lei o exigir."],
["Transferências internacionais","O Site é gerido a partir da Ucrânia, fora da UE/EEE, e alguns prestadores situam-se fora do EEE (por exemplo, nos EUA). Quando necessário, as transferências baseiam-se nas garantias do capítulo V do RGPD, como as cláusulas contratuais-tipo da Comissão Europeia, e tratamos os dados apenas na medida necessária para as finalidades indicadas."],
["Cookies","Os cookies necessários permitem o funcionamento do Site (por exemplo, memorizar o idioma) e não exigem consentimento. Os cookies analíticos e publicitários só são definidos após o seu consentimento, que pode alterar ou retirar a qualquer momento tão facilmente quanto o deu, bem como nas definições do navegador. Isto cumpre a Diretiva 2002/58/CE, transposta em Portugal pela Lei n.º 41/2004. A Google e a Meta tratam os dados dos cookies segundo as suas próprias políticas."],
["Prazos de conservação","Conservamos os dados apenas pelo tempo necessário:|correspondência: até 3 anos;|dados de formulários de pedido: até 12 meses após o último contacto, salvo se a lei ou uma reclamação exigir mais;|registos técnicos: até 12 meses;|cookies: pelos prazos indicados nas definições de consentimento.|Depois, os dados são apagados ou anonimizados."],
["Os seus direitos","Nos termos do RGPD, tem direito a:|aceder aos seus dados (art. 15.º) e obter cópia;|retificação (art. 16.º);|apagamento (art. 17.º);|limitação do tratamento (art. 18.º);|portabilidade (art. 20.º);|opor-se ao tratamento baseado em interesse legítimo (art. 21.º);|retirar o consentimento a qualquer momento, sem afetar a licitude do tratamento anterior (art. 7.º, n.º 3);|apresentar reclamação à autoridade de controlo — em Portugal, a Comissão Nacional de Proteção de Dados (CNPD) — ou à do Estado onde reside, trabalha ou ocorreu a alegada infração (art. 77.º).|Para exercer os seus direitos escreva para useful.habit@outlook.com. Não tomamos decisões baseadas exclusivamente em tratamento automatizado que produzam efeitos jurídicos na sua esfera."],
["Segurança","Aplicamos medidas organizativas e técnicas razoáveis, incluindo HTTPS e acesso restrito. Nenhuma transmissão pela internet é totalmente segura."],
["Menores","O Site não se destina a menores de 18 anos e não recolhemos conscientemente os seus dados. Se considera que uma criança nos enviou dados, escreva-nos e apagá-los-emos."],
["Alterações","A versão em vigor é sempre publicada nesta página com a data. Se uma alteração afetar um tratamento que exija consentimento, só a aplicaremos após obter novo consentimento."],
["Contacto","Para questões de proteção de dados escreva para useful.habit@outlook.com."]]},
terms:{t:"Termos de utilização",s:[
["Disposições gerais","Estes Termos regulam a utilização do site Useful Habit (o «Site»). Ao utilizar o Site, aceita-os; se não concordar, não o utilize. O Site destina-se a maiores de 18 anos."],
["O que é o Site","O Site publica, para fins informativos, análises, artigos e dicas sobre suplementos alimentares. A Useful Habit não é fabricante, vendedora nem fornecedora de suplementos, nem farmácia ou estabelecimento de saúde, e não vende, entrega nem recebe pagamentos por esses produtos."],
["Não é aconselhamento médico","Os suplementos alimentares são géneros alimentícios, não medicamentos. Os nossos conteúdos são gerais e educativos e não constituem aconselhamento médico, farmacêutico, dietético ou profissional de outro tipo. Não apresentamos nenhum suplemento como capaz de prevenir, tratar ou curar uma doença. Quando mencionamos uma alegação de saúde, trata-se de uma alegação autorizada na aceção do Regulamento (CE) n.º 1924/2006 ou de uma afirmação do fabricante, que identificamos como tal. Antes de utilizar suplementos, em especial na gravidez ou amamentação, se toma medicamentos, tem uma doença crónica ou alergia, consulte um médico. Não adie a ida ao médico nem interrompa um tratamento por causa do que lê no Site."],
["Sem garantias","A resposta do organismo é individual. Não garantimos qualquer resultado dos produtos abordados nem que os conteúdos sejam completos, isentos de erros ou atuais, embora o procuremos."],
["Relações comerciais","O Site pode conter ligações para recursos de terceiros e relações comerciais com eles. Se pudermos receber uma compensação (por exemplo, uma comissão ou pagamento por um pedido ou compra encaminhada), indicamo-lo no conteúdo antes de seguir a ligação. A compensação não altera os factos que apresentamos, mas tenha presente que podemos ter um interesse financeiro."],
["Vendedores e produtos de terceiros","O preço, as condições, a disponibilidade, a composição, a rotulagem, a entrega, as devoluções e a qualidade dos produtos são definidos e assegurados pelos seus vendedores e fabricantes. O contrato de compra é celebrado diretamente com eles e aplicam-se as suas condições e políticas de privacidade, incluindo os direitos legais do consumidor, como o direito de livre resolução. Verifique-as antes de comprar. Não controlamos recursos de terceiros nem respondemos pelo seu conteúdo ou ações."],
["Regras de utilização","Compromete-se a não:|utilizar o Site de forma ilícita ou violando direitos de terceiros;|interferir no funcionamento do Site, contornar a sua proteção ou recolher dados por meios automatizados sem autorização;|enviar dados falsos ou de outras pessoas sem o seu consentimento;|difundir software malicioso."],
["Propriedade intelectual","Os textos, o design, o logótipo da Useful Habit e demais conteúdos estão protegidos por direitos de autor. É proibida a cópia, distribuição e adaptação sem autorização escrita, exceto a citação dentro dos limites legais com referência ao Site. Os nomes e marcas dos produtos pertencem aos seus titulares e são usados apenas para identificação."],
["Responsabilidade","Na medida permitida pela lei aplicável, não respondemos por danos resultantes da utilização da informação do Site, da sua indisponibilidade ou de atos de terceiros. Nada nestes Termos exclui ou limita a responsabilidade que não possa ser excluída ou limitada por lei, incluindo a decorrente de dolo ou negligência grosseira, de morte ou ofensa à integridade física, nem os seus direitos imperativos de consumidor."],
["Alterações","Podemos alterar o Site e estes Termos. A nova versão aplica-se desde a publicação nesta página com a data indicada; a utilização continuada implica aceitação."],
["Lei aplicável e litígios","Estes Termos regem-se pela lei da Ucrânia, sem o privar das disposições imperativas de proteção do consumidor do Estado da sua residência habitual. Se for consumidor na UE, pode intentar ações nos tribunais do seu país de residência. Tentaremos primeiro resolver qualquer reclamação por acordo."],
["Contacto","Para qualquer questão ou reclamação escreva para useful.habit@outlook.com."]]}};
T.fr.legal={privacy:{t:"Politique de confidentialité",s:[
["Qui sommes-nous","Cette Politique explique comment Useful Habit (ci-après le « Site », « nous ») traite les données personnelles des visiteurs. Responsable de traitement : Useful Habit, contact : useful.habit@outlook.com. Le Site est exploité depuis l’Ukraine. Si le RGPD s’applique à vous, nous traitons vos données conformément au règlement (UE) 2016/679 (RGPD) et à la loi Informatique et Libertés."],
["Quelles données nous traitons","Données que vous fournissez :|nom, numéro de téléphone, adresse e-mail et texte du message, si vous nous écrivez ou envoyez un formulaire de demande ;|Données collectées automatiquement :|adresse IP, type d’appareil et de navigateur, langue, pages consultées, heure de la visite, source de provenance, balises UTM et identifiants de clics publicitaires (par exemple gclid, fbclid) ;|cookies et technologies similaires (point 6).|Nous ne demandons pas de catégories particulières de données, notamment des données de santé. Merci de ne pas en saisir dans les formulaires ou messages."],
["Finalités et bases juridiques","Nous traitons les données pour :|répondre à votre message ou demande (art. 6, § 1, b) RGPD — mesures prises à votre demande — ou votre consentement, a)) ;|transmettre votre demande à un partenaire ou vendeur d’un produit lorsque vous envoyez un formulaire comportant cet avertissement (consentement, a)) ;|assurer la sécurité du Site et prévenir la fraude et les abus automatisés (intérêt légitime, f), mis en balance avec vos droits) ;|mesurer l’audience, améliorer le Site et mesurer la publicité (consentement, a), via le bandeau cookies) ;|respecter des obligations légales (c))."],
["Destinataires","Nous ne vendons pas vos données. Elles peuvent être communiquées :|aux partenaires et vendeurs de produits, uniquement si vous leur avez vous-même adressé une demande via un formulaire ; ils agissent en tant que responsables de traitement distincts selon leurs propres politiques ;|aux prestataires de services (hébergement, messagerie, protection anti-spam, services d’analyse et de publicité, dont Google et Meta), qui traitent les données pour notre compte ou selon leurs propres conditions, dans le cadre de leurs services ;|aux autorités publiques, lorsque la loi l’exige."],
["Transferts internationaux","Le Site est exploité depuis l’Ukraine, hors UE/EEE, et certains prestataires sont situés hors de l’EEE (par exemple aux États-Unis). Lorsque cela est nécessaire, les transferts reposent sur les garanties du chapitre V du RGPD, telles que les clauses contractuelles types de la Commission européenne, et nous ne traitons les données que dans la mesure nécessaire aux finalités indiquées."],
["Cookies","Les cookies nécessaires assurent le fonctionnement du Site (par exemple mémoriser la langue) et ne requièrent pas de consentement. Les cookies d’analyse et de publicité ne sont déposés qu’après votre consentement, que vous pouvez modifier ou retirer à tout moment aussi simplement que vous l’avez donné, ainsi que dans les paramètres de votre navigateur. Cela est conforme à la directive 2002/58/CE transposée en droit national et aux recommandations de la CNIL. Google et Meta traitent les données des cookies selon leurs propres politiques."],
["Durées de conservation","Nous conservons les données pas plus longtemps que nécessaire :|correspondance : jusqu’à 3 ans ;|données des formulaires de demande : jusqu’à 12 mois après le dernier contact, sauf si la loi ou une action en justice exige davantage ;|journaux techniques : jusqu’à 12 mois ;|cookies : pour les durées indiquées dans les paramètres de consentement.|Ensuite, les données sont supprimées ou anonymisées."],
["Vos droits","En vertu du RGPD, vous avez le droit :|d’accéder à vos données (art. 15) et d’en obtenir une copie ;|à la rectification (art. 16) ;|à l’effacement (art. 17) ;|à la limitation du traitement (art. 18) ;|à la portabilité (art. 20) ;|de vous opposer au traitement fondé sur l’intérêt légitime (art. 21) ;|de retirer votre consentement à tout moment, sans affecter la licéité du traitement antérieur (art. 7, § 3) ;|d’introduire une réclamation auprès de l’autorité de contrôle — en France, la Commission nationale de l’informatique et des libertés (CNIL) — ou de celle de l’État où vous résidez, travaillez ou où la violation aurait eu lieu (art. 77).|Pour exercer vos droits, écrivez à useful.habit@outlook.com. Nous ne prenons aucune décision fondée exclusivement sur un traitement automatisé produisant des effets juridiques à votre égard."],
["Sécurité","Nous appliquons des mesures organisationnelles et techniques raisonnables, dont HTTPS et un accès restreint. Aucune transmission par internet n’est totalement sûre."],
["Mineurs","Le Site n’est pas destiné aux personnes de moins de 18 ans et nous ne collectons pas sciemment leurs données. Si vous pensez qu’un enfant nous a transmis des données, écrivez-nous et nous les supprimerons."],
["Modifications","La version en vigueur est toujours publiée sur cette page avec sa date. Si une modification concerne un traitement nécessitant le consentement, nous ne l’appliquerons qu’après avoir obtenu un nouveau consentement."],
["Contact","Pour toute question relative à la protection des données, écrivez à useful.habit@outlook.com."]]},
terms:{t:"Conditions d’utilisation",s:[
["Dispositions générales","Les présentes Conditions régissent l’utilisation du site Useful Habit (le « Site »). En utilisant le Site, vous les acceptez ; si vous n’êtes pas d’accord, ne l’utilisez pas. Le Site s’adresse aux personnes âgées d’au moins 18 ans."],
["Ce qu’est le Site","Le Site publie, à titre informatif, des avis, articles et conseils sur les compléments alimentaires. Useful Habit n’est ni fabricant, ni vendeur, ni fournisseur de compléments, ni pharmacie, ni établissement de santé, et ne vend, ne livre ni n’encaisse de paiements pour ces produits."],
["Pas un avis médical","Les compléments alimentaires sont des denrées alimentaires, non des médicaments. Nos contenus sont généraux et éducatifs et ne constituent pas un avis médical, pharmaceutique, diététique ou professionnel d’un autre ordre. Nous ne présentons aucun complément comme pouvant prévenir, traiter ou guérir une maladie. Lorsque nous mentionnons une allégation de santé, il s’agit soit d’une allégation autorisée au sens du règlement (CE) n° 1924/2006, soit d’une affirmation du fabricant, que nous signalons comme telle. Avant d’utiliser des compléments, notamment pendant la grossesse ou l’allaitement, si vous prenez des médicaments, avez une maladie chronique ou une allergie, consultez un médecin. Ne retardez pas une consultation et n’interrompez pas un traitement à cause d’informations du Site."],
["Aucune garantie","La réponse de l’organisme est individuelle. Nous ne garantissons aucun résultat des produits traités, ni que les contenus soient complets, sans erreur ou à jour, bien que nous y aspirions."],
["Relations commerciales","Le Site peut contenir des liens vers des ressources de tiers et des relations commerciales avec eux. Si nous pouvons percevoir une rémunération (par exemple une commission ou un paiement pour une demande ou un achat transmis), nous l’indiquons dans le contenu avant que vous ne suiviez le lien. La rémunération ne modifie pas les faits présentés, mais gardez à l’esprit que nous pouvons avoir un intérêt financier."],
["Vendeurs et produits de tiers","Le prix, les conditions, la disponibilité, la composition, l’étiquetage, la livraison, les retours et la qualité des produits sont déterminés et assurés par leurs vendeurs et fabricants. Le contrat de vente est conclu directement avec eux et leurs conditions et politiques de confidentialité s’appliquent, y compris les droits légaux du consommateur, tels que le droit de rétractation. Vérifiez-les avant d’acheter. Nous ne contrôlons pas les ressources de tiers et ne répondons pas de leur contenu ni de leurs actes."],
["Règles d’utilisation","Vous vous engagez à ne pas :|utiliser le Site de manière illicite ou en violation des droits de tiers ;|entraver le fonctionnement du Site, contourner sa protection ou extraire des données par des moyens automatisés sans autorisation ;|envoyer de fausses données ou des données d’autrui sans son consentement ;|diffuser des logiciels malveillants."],
["Propriété intellectuelle","Les textes, le design, le logo Useful Habit et les autres contenus sont protégés par le droit d’auteur. Toute copie, diffusion ou adaptation sans autorisation écrite est interdite, sauf citation dans les limites légales avec renvoi au Site. Les noms et marques des produits appartiennent à leurs titulaires et ne sont utilisés qu’à des fins d’identification."],
["Responsabilité","Dans la mesure permise par la loi applicable, nous ne sommes pas responsables des préjudices résultant de l’utilisation des informations du Site, de son indisponibilité ou d’actes de tiers. Rien dans les présentes Conditions n’exclut ni ne limite la responsabilité qui ne peut l’être légalement, y compris en cas de dol ou de faute lourde, de décès ou de dommage corporel, ni vos droits impératifs de consommateur."],
["Modifications","Nous pouvons modifier le Site et les présentes Conditions. La nouvelle version s’applique dès sa publication sur cette page avec la date indiquée ; la poursuite de l’utilisation vaut acceptation."],
["Droit applicable et litiges","Les présentes Conditions sont régies par le droit ukrainien, sans vous priver des dispositions impératives de protection des consommateurs de l’État de votre résidence habituelle. Si vous êtes consommateur dans l’UE, vous pouvez agir devant les tribunaux de votre pays de résidence. Nous tentons d’abord de résoudre toute réclamation à l’amiable."],
["Contact","Pour toute question ou réclamation, écrivez à useful.habit@outlook.com."]]}};
