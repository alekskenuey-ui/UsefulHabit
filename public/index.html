T.ru.legal={privacy:{t:"Политика конфиденциальности",s:[
["Общие положения","Настоящая Политика объясняет, какие персональные данные обрабатывает веб-сайт Useful Habit (далее — «Сайт»), зачем, на каком основании, кому их могут передавать и какие права у вас есть. Владелец Сайта — Useful Habit (далее — «мы»). Контакт: useful.habit@outlook.com. Политика составлена в соответствии с Законом Украины «О защите персональных данных». Пользуясь Сайтом, вы подтверждаете, что ознакомились с ней. Если вы не согласны — прекратите пользование Сайтом."],
["Данные, которые вы предоставляете сами","Мы получаем только то, что вы решили отправить:|имя, номер телефона, электронную почту и текст сообщения — если вы пишете нам письмо или заполняете форму на Сайте;|любую другую информацию, которую вы добавили к обращению."],
["Данные, собираемые автоматически","Во время визита могут обрабатываться:|IP-адрес, тип устройства, браузер, язык, просмотренные страницы, время и длительность визита;|источник перехода, в том числе UTM-метки и рекламные идентификаторы клика (например, gclid, fbclid);|файлы cookie и аналогичные технологии (раздел 7)."],
["Чего мы не собираем","Мы не просим и не собираем данные о состоянии здоровья, диагнозах, убеждениях и других особых категориях данных. Пожалуйста, не указывайте их в формах и сообщениях."],
["Цели и основания обработки","Мы обрабатываем данные, чтобы:|ответить на ваше письмо или запрос (основание — ваше согласие или действия по вашей просьбе);|передать ваш запрос партнёру или продавцу продукта, если вы отправили форму с соответствующим сообщением (основание — ваше согласие);|обеспечивать работу и безопасность Сайта, предотвращать мошенничество и автоматические обращения (необходимость защиты законных интересов, если они не нарушают ваших прав);|анализировать посещаемость и совершенствовать Сайт (только с вашего согласия);|измерять эффективность рекламы (только с вашего согласия);|выполнять требования законодательства."],
["Кому мы можем передавать данные","Мы не продаём ваши данные. Они могут передаваться:|партнёрам и продавцам продуктов — только если вы сами отправили им запрос через форму; об этом сказано рядом с формой, а дальше эти лица самостоятельно отвечают за обработку по своим политикам;|поставщикам услуг (хостинг, почта, защита от спама, аналитические и рекламные системы, в том числе Google и Meta) — только в объёме, необходимом для их услуг;|органам власти — когда этого требует закон.|Часть поставщиков может находиться за пределами Украины. В таком случае передача осуществляется с соблюдением законодательства о защите персональных данных."],
["Файлы cookie","Cookie — небольшие файлы в вашем браузере. Мы различаем:|необходимые — для работы Сайта (например, сохранение выбора языка), согласия не требуют;|аналитические — показывают, как используют Сайт (например, Google Analytics 4);|рекламные — измеряют рекламу и показывают релевантные объявления (например, Meta Pixel, Google Ads).|Аналитические и рекламные cookie включаются только после вашего согласия, которое можно изменить или отозвать в любой момент, а также в настройках браузера. Google и Meta обрабатывают данные по собственным политикам, и мы не контролируем этого."],
["Сроки хранения","Мы храним данные не дольше, чем нужно для целей обработки:|переписка — до 3 лет;|данные запросов из форм — до 12 месяцев после последнего взаимодействия, если закон или рассмотрение спора не требуют дольше;|технические журналы — до 12 месяцев;|cookie — по срокам в настройках согласия.|После этого данные удаляются или обезличиваются."],
["Ваши права","В соответствии со статьёй 8 Закона Украины «О защите персональных данных» вы имеете право:|знать об источниках сбора, местонахождении и цели обработки своих данных;|получать информацию об условиях доступа к данным, в том числе о третьих лицах, которым их передают;|на доступ к своим данным;|требовать изменения или уничтожения данных, если они недостоверны или обрабатываются незаконно;|отозвать согласие в любое время;|вносить оговорку об ограничении обработки при предоставлении согласия;|обратиться с жалобой к Уполномоченному Верховной Рады Украины по правам человека или в суд.|Чтобы воспользоваться правами, напишите на useful.habit@outlook.com. Мы ответим в сроки, установленные законом."],
["Безопасность","Мы применяем разумные организационные и технические меры: защищённое соединение HTTPS и ограничение доступа к данным. Однако ни одна передача через интернет не является абсолютно безопасной."],
["Дети","Сайт не предназначен для лиц младше 18 лет, и мы сознательно не собираем их данные. Если вам известно, что ребёнок отправил нам данные, напишите — мы их удалим."],
["Изменения Политики","Актуальная редакция всегда опубликована на этой странице с датой. Если изменения касаются обработки, требующей согласия, мы применим их только после получения нового согласия."],
["Контакты","По вопросам обработки данных пишите на useful.habit@outlook.com."]]},
terms:{t:"Условия использования",s:[
["Общие положения","Эти Условия регулируют пользование сайтом Useful Habit (далее — «Сайт»). Пользуясь Сайтом, вы соглашаетесь с Условиями; если не согласны — не пользуйтесь Сайтом. Сайт предназначен для лиц от 18 лет."],
["Что такое Сайт","Сайт публикует обзоры, статьи и советы о пищевых добавках в информационных целях. Useful Habit не является производителем, продавцом или поставщиком добавок, аптекой или медицинским учреждением и не осуществляет продажи, доставки или приёма платежей за такие продукты."],
["Не медицинский совет","Материалы носят общий образовательный характер и не являются медицинским, фармацевтическим, диетологическим или иным профессиональным советом. Они не предназначены для диагностики, лечения или профилактики заболеваний. Пищевые добавки не являются лекарственными средствами. Перед применением добавок, особенно при беременности, кормлении грудью, приёме лекарств, хронических состояниях или аллергии, посоветуйтесь с врачом. Не откладывайте обращение к врачу и не прекращайте лечение из-за информации с Сайта."],
["Отсутствие гарантий","Реакция организма индивидуальна. Мы не гарантируем никакого результата от продуктов, о которых идёт речь на Сайте, а также полноты, безошибочности или актуальности материалов, хотя и стремимся к этому."],
["Коммерческие связи","Сайт может содержать ссылки на ресурсы третьих сторон и коммерческие отношения с ними. Если мы можем получить вознаграждение (например, комиссию или оплату за переданный запрос или покупку), мы указываем это в материале до перехода по ссылке. Вознаграждение не меняет фактов, которые мы приводим, но учитывайте, что у нас может быть финансовая заинтересованность."],
["Сторонние ресурсы и продукты","Цены, условия, наличие, состав, маркировку, доставку, возвраты и качество товаров определяют и обеспечивают их продавцы и производители. Договор купли-продажи вы заключаете непосредственно с ними, и для вас действуют их условия и политики конфиденциальности. Проверяйте их перед покупкой. Мы не контролируем сторонние ресурсы и не отвечаем за их содержание и действия."],
["Правила пользования","Вы соглашаетесь не:|использовать Сайт в незаконных целях или с нарушением прав третьих лиц;|вмешиваться в работу Сайта, обходить защиту или собирать данные автоматизированными средствами без разрешения;|отправлять заведомо недостоверные данные или данные других лиц без их согласия;|распространять вредоносное программное обеспечение."],
["Интеллектуальная собственность","Тексты, дизайн, логотип Useful Habit и другие материалы Сайта охраняются законодательством об авторском праве. Копирование, распространение и переработка без письменного разрешения запрещены, кроме цитирования в пределах, разрешённых законом, со ссылкой на Сайт. Названия и товарные знаки продуктов принадлежат их владельцам и упоминаются только для идентификации."],
["Ответственность","В пределах, разрешённых действующим законодательством, мы не отвечаем за убытки, возникшие из-за использования информации с Сайта, его недоступности или действий третьих лиц. Эти Условия не ограничивают ответственность, которую нельзя ограничить законом, и не лишают вас обязательных прав потребителя."],
["Изменения","Мы можем изменять Сайт и эти Условия. Новая редакция действует с момента публикации на этой странице с указанной датой; продолжение пользования означает согласие."],
["Право и споры","Эти Условия регулируются законодательством Украины. Споры решаются путём переговоров, а при невозможности — в суде в соответствии с законодательством Украины."],
["Контакты","По любым вопросам и жалобам пишите на useful.habit@outlook.com."]]}};
T.th.legal={privacy:{t:"นโยบายความเป็นส่วนตัว",s:[
["เราคือใคร","นโยบายนี้อธิบายวิธีที่ Useful Habit (ต่อไปนี้เรียกว่า “เว็บไซต์” หรือ “เรา”) ประมวลผลข้อมูลส่วนบุคคลของผู้เข้าชม ผู้ควบคุมข้อมูล: Useful Habit ติดต่อ: useful.habit@outlook.com เว็บไซต์ดำเนินการจากประเทศยูเครน เราประมวลผลข้อมูลโดยคำนึงถึงพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) ของประเทศไทยเมื่อมีผลบังคับใช้กับคุณ"],
["ข้อมูลที่เราประมวลผล","ข้อมูลที่คุณให้เอง:|ชื่อ หมายเลขโทรศัพท์ อีเมล และข้อความ หากคุณเขียนถึงเราหรือส่งแบบฟอร์มคำขอบนเว็บไซต์;|ข้อมูลที่เก็บโดยอัตโนมัติ:|ที่อยู่ IP ประเภทอุปกรณ์และเบราว์เซอร์ ภาษา หน้าที่เข้าชม เวลาเข้าชม แหล่งที่มา แท็ก UTM และตัวระบุการคลิกโฆษณา (เช่น gclid, fbclid);|คุกกี้และเทคโนโลยีที่คล้ายกัน (ข้อ 6)|เราไม่ขอข้อมูลที่อ่อนไหว เช่น ข้อมูลสุขภาพ โปรดอย่ากรอกข้อมูลดังกล่าวลงในแบบฟอร์มหรือข้อความ"],
["วัตถุประสงค์และฐานทางกฎหมาย","เราประมวลผลข้อมูลเพื่อ:|ตอบข้อความหรือคำขอของคุณ (โดยอาศัยความยินยอมของคุณ หรือเพื่อดำเนินการตามคำขอของคุณ);|ส่งต่อคำขอของคุณไปยังพันธมิตรหรือผู้ขายผลิตภัณฑ์เมื่อคุณส่งแบบฟอร์มที่มีข้อความแจ้งดังกล่าว (โดยอาศัยความยินยอม);|รักษาความปลอดภัยของเว็บไซต์ ป้องกันการฉ้อโกงและการใช้งานโดยอัตโนมัติที่ไม่เหมาะสม (ประโยชน์โดยชอบด้วยกฎหมาย เมื่อไม่กระทบสิทธิของคุณเกินสมควร);|วัดปริมาณการเข้าชมและปรับปรุงเว็บไซต์ รวมถึงวัดผลโฆษณา (โดยอาศัยความยินยอมผ่านแบนเนอร์คุกกี้);|ปฏิบัติตามกฎหมาย"],
["ผู้รับข้อมูล","เราไม่ขายข้อมูลของคุณ ข้อมูลอาจถูกเปิดเผยแก่:|พันธมิตรและผู้ขายผลิตภัณฑ์ เฉพาะเมื่อคุณส่งคำขอถึงพวกเขาเองผ่านแบบฟอร์ม โดยพวกเขาดำเนินการตามนโยบายของตนเอง;|ผู้ให้บริการ (โฮสติ้ง อีเมล ป้องกันสแปม บริการวิเคราะห์และโฆษณา รวมถึง Google และ Meta) ที่ประมวลผลในนามของเราหรือตามเงื่อนไขของตน ภายในขอบเขตบริการ;|หน่วยงานของรัฐ เมื่อกฎหมายกำหนด"],
["การส่งข้อมูลไปต่างประเทศ","เว็บไซต์ดำเนินการจากประเทศยูเครน และผู้ให้บริการบางรายอยู่นอกประเทศไทย (เช่น สหรัฐอเมริกา) เมื่อมีการส่งหรือโอนข้อมูลไปต่างประเทศ เราจะดำเนินการโดยมีมาตรการคุ้มครองที่เหมาะสมตามที่ PDPA กำหนด และประมวลผลเท่าที่จำเป็นต่อวัตถุประสงค์ข้างต้น"],
["คุกกี้","คุกกี้ที่จำเป็นช่วยให้เว็บไซต์ทำงานได้ (เช่น จดจำภาษา) และไม่ต้องขอความยินยอม คุกกี้เพื่อการวิเคราะห์และโฆษณาจะถูกตั้งค่าหลังจากคุณให้ความยินยอมเท่านั้น และคุณเปลี่ยนหรือถอนความยินยอมได้ทุกเมื่ออย่างง่ายดายเท่ากับตอนให้ รวมถึงในการตั้งค่าเบราว์เซอร์ Google และ Meta ประมวลผลข้อมูลคุกกี้ตามนโยบายของตน"],
["ระยะเวลาเก็บรักษา","เราเก็บข้อมูลไม่นานเกินความจำเป็น:|การติดต่อสื่อสาร: ไม่เกิน 3 ปี;|ข้อมูลจากแบบฟอร์มคำขอ: ไม่เกิน 12 เดือนนับจากการติดต่อครั้งล่าสุด เว้นแต่กฎหมายหรือการดำเนินคดีกำหนดให้นานกว่านั้น;|บันทึกทางเทคนิค: ไม่เกิน 12 เดือน;|คุกกี้: ตามระยะเวลาที่ระบุในการตั้งค่าความยินยอม|จากนั้นข้อมูลจะถูกลบหรือทำให้ไม่สามารถระบุตัวตนได้"],
["สิทธิของคุณ","ตาม PDPA คุณมีสิทธิ:|เข้าถึงและขอรับสำเนาข้อมูลของคุณ;|ขอแก้ไขข้อมูลให้ถูกต้อง;|ขอให้ลบหรือทำลายข้อมูล;|ขอให้ระงับการใช้ข้อมูล;|ขอรับหรือโอนย้ายข้อมูล;|คัดค้านการประมวลผลที่อาศัยประโยชน์โดยชอบด้วยกฎหมาย;|ถอนความยินยอมเมื่อใดก็ได้ โดยไม่กระทบการประมวลผลก่อนหน้า;|ร้องเรียนต่อคณะกรรมการผู้เชี่ยวชาญตาม PDPA หรือหน่วยงานที่มีอำนาจของประเทศไทย|หากต้องการใช้สิทธิ โปรดเขียนมาที่ useful.habit@outlook.com"],
["ความปลอดภัย","เราใช้มาตรการเชิงองค์กรและเทคนิคที่เหมาะสม รวมถึง HTTPS และการจำกัดการเข้าถึง การส่งข้อมูลผ่านอินเทอร์เน็ตไม่มีทางปลอดภัยสมบูรณ์"],
["ผู้เยาว์","เว็บไซต์ไม่ได้มีไว้สำหรับผู้ที่อายุต่ำกว่า 18 ปี และเราไม่เก็บข้อมูลของพวกเขาโดยเจตนา หากคุณเชื่อว่าเด็กส่งข้อมูลมาให้เรา โปรดแจ้ง เราจะลบข้อมูลนั้น"],
["การเปลี่ยนแปลง","ฉบับปัจจุบันเผยแพร่ในหน้านี้พร้อมวันที่เสมอ หากการเปลี่ยนแปลงเกี่ยวกับการประมวลผลที่ต้องได้รับความยินยอม เราจะใช้หลังได้รับความยินยอมใหม่เท่านั้น"],
["ติดต่อ","สำหรับคำถามเกี่ยวกับการคุ้มครองข้อมูล เขียนมาที่ useful.habit@outlook.com"]]},
terms:{t:"ข้อกำหนดการใช้งาน",s:[
["ข้อกำหนดทั่วไป","ข้อกำหนดนี้ใช้กับการใช้เว็บไซต์ Useful Habit (“เว็บไซต์”) เมื่อใช้เว็บไซต์ถือว่าคุณยอมรับข้อกำหนดนี้ หากไม่เห็นด้วย โปรดอย่าใช้ เว็บไซต์มีไว้สำหรับผู้ที่มีอายุ 18 ปีขึ้นไป"],
["เว็บไซต์คืออะไร","เว็บไซต์เผยแพร่รีวิว บทความ และเคล็ดลับเกี่ยวกับอาหารเสริมเพื่อให้ข้อมูล Useful Habit ไม่ใช่ผู้ผลิต ผู้ขาย หรือผู้จัดหาอาหารเสริม ไม่ใช่ร้านขายยาหรือสถานพยาบาล และไม่ขาย ไม่จัดส่ง หรือรับชำระเงินสำหรับผลิตภัณฑ์เหล่านั้น"],
["ไม่ใช่คำแนะนำทางการแพทย์","อาหารเสริมจัดเป็นอาหาร ไม่ใช่ยา เนื้อหาของเราเป็นข้อมูลทั่วไปเพื่อการศึกษา ไม่ใช่คำแนะนำทางการแพทย์ เภสัชกรรม โภชนาการ หรือวิชาชีพอื่น เราไม่นำเสนออาหารเสริมใดว่ารักษา บำบัด หรือป้องกันโรคได้ และไม่ใช้ถ้อยคำโอ้อวดเกินจริง เช่น “รับประกันผล” ข้อมูลเกี่ยวกับคุณสมบัติหรือประโยชน์ของผลิตภัณฑ์จะอ้างอิงตามที่ได้รับอนุญาตหรือตามข้อมูลที่ผู้ผลิตระบุ ซึ่งเราจะแจ้งไว้ชัดเจน ก่อนใช้อาหารเสริม โดยเฉพาะหากตั้งครรภ์ ให้นมบุตร ใช้ยา มีโรคเรื้อรังหรือภูมิแพ้ ควรปรึกษาแพทย์ อย่าเลื่อนการไปพบแพทย์หรือหยุดการรักษาเพราะข้อมูลบนเว็บไซต์"],
["ไม่มีการรับประกัน","การตอบสนองของร่างกายแตกต่างกัน เราไม่รับประกันผลลัพธ์ใด ๆ จากผลิตภัณฑ์ที่กล่าวถึง หรือว่าเนื้อหาครบถ้วน ปราศจากข้อผิดพลาด หรือเป็นปัจจุบัน แม้เราพยายามเช่นนั้น"],
["ความสัมพันธ์เชิงพาณิชย์","เว็บไซต์อาจมีลิงก์ไปยังแหล่งข้อมูลของบุคคลที่สามและความสัมพันธ์เชิงพาณิชย์กับพวกเขา หากเราอาจได้รับค่าตอบแทน (เช่น ค่าคอมมิชชันหรือค่าตอบแทนสำหรับคำขอหรือการซื้อที่ส่งต่อ) เราจะระบุไว้ในเนื้อหาก่อนที่คุณจะคลิกลิงก์ ค่าตอบแทนไม่เปลี่ยนข้อเท็จจริงที่เรานำเสนอ แต่โปรดตระหนักว่าเราอาจมีผลประโยชน์ทางการเงิน"],
["ผู้ขายและผลิตภัณฑ์ของบุคคลที่สาม","ราคา เงื่อนไข ความพร้อมจำหน่าย ส่วนประกอบ ฉลาก การจัดส่ง การคืนสินค้า และคุณภาพ กำหนดและรับผิดชอบโดยผู้ขายและผู้ผลิต คุณทำสัญญาซื้อขายกับพวกเขาโดยตรง และเงื่อนไขกับนโยบายความเป็นส่วนตัวของพวกเขามีผลกับคุณ รวมถึงสิทธิของผู้บริโภคตามกฎหมาย โปรดตรวจสอบก่อนซื้อ เราไม่ควบคุมแหล่งข้อมูลของบุคคลที่สามและไม่รับผิดชอบต่อเนื้อหาหรือการกระทำของพวกเขา ผลิตภัณฑ์ที่จำหน่ายในประเทศไทยต้องเป็นไปตามกฎหมายของไทย รวมถึงการขึ้นทะเบียนและการอนุญาตโฆษณาจากหน่วยงานที่เกี่ยวข้อง"],
["กฎการใช้งาน","คุณตกลงว่าจะไม่:|ใช้เว็บไซต์โดยผิดกฎหมายหรือละเมิดสิทธิของบุคคลที่สาม;|แทรกแซงการทำงานของเว็บไซต์ หลีกเลี่ยงระบบป้องกัน หรือเก็บข้อมูลด้วยเครื่องมืออัตโนมัติโดยไม่ได้รับอนุญาต;|ส่งข้อมูลเท็จหรือข้อมูลของผู้อื่นโดยไม่ได้รับความยินยอม;|เผยแพร่ซอฟต์แวร์ที่เป็นอันตราย"],
["ทรัพย์สินทางปัญญา","ข้อความ การออกแบบ โลโก้ Useful Habit และเนื้อหาอื่น ๆ ได้รับความคุ้มครองตามกฎหมายลิขสิทธิ์ ห้ามคัดลอก เผยแพร่ หรือดัดแปลงโดยไม่ได้รับอนุญาตเป็นลายลักษณ์อักษร ยกเว้นการอ้างอิงในขอบเขตที่กฎหมายอนุญาตพร้อมระบุเว็บไซต์ ชื่อและเครื่องหมายการค้าของผลิตภัณฑ์เป็นของเจ้าของและใช้เพื่อระบุตัวตนเท่านั้น"],
["ความรับผิด","ภายในขอบเขตที่กฎหมายที่ใช้บังคับอนุญาต เราไม่รับผิดต่อความเสียหายจากการใช้ข้อมูลบนเว็บไซต์ การที่เว็บไซต์ไม่พร้อมใช้งาน หรือการกระทำของบุคคลที่สาม ไม่มีสิ่งใดในข้อกำหนดนี้ที่ยกเว้นหรือจำกัดความรับผิดที่กฎหมายไม่อนุญาตให้ยกเว้นหรือจำกัด รวมถึงสิทธิของผู้บริโภคตามกฎหมาย"],
["การเปลี่ยนแปลง","เราอาจเปลี่ยนแปลงเว็บไซต์และข้อกำหนดนี้ ฉบับใหม่มีผลตั้งแต่เผยแพร่ในหน้านี้พร้อมวันที่ การใช้งานต่อถือว่ายอมรับ"],
["กฎหมายที่ใช้บังคับและข้อพิพาท","ข้อกำหนดนี้อยู่ภายใต้กฎหมายของประเทศยูเครน โดยไม่ตัดสิทธิคุ้มครองผู้บริโภคตามกฎหมายบังคับของประเทศที่คุณพำนักอยู่ เราจะพยายามแก้ไขข้อร้องเรียนโดยการเจรจาก่อน"],
["ติดต่อ","สำหรับคำถามหรือข้อร้องเรียน เขียนมาที่ useful.habit@outlook.com"]]}};
T.id.legal={privacy:{t:"Kebijakan Privasi",s:[
["Siapa kami","Kebijakan ini menjelaskan bagaimana Useful Habit (selanjutnya “Situs”, “kami”) memproses data pribadi pengunjung. Pengendali Data Pribadi: Useful Habit, kontak: useful.habit@outlook.com. Situs dikelola dari Ukraina. Jika berlaku bagi Anda, kami memproses data sesuai dengan Undang-Undang No. 27 Tahun 2022 tentang Pelindungan Data Pribadi (UU PDP)."],
["Data yang kami proses","Data yang Anda berikan:|nama, nomor telepon, alamat e-mail, dan isi pesan, jika Anda menulis kepada kami atau mengirim formulir permintaan di Situs;|Data yang dikumpulkan otomatis:|alamat IP, jenis perangkat dan peramban, bahasa, halaman yang dilihat, waktu kunjungan, sumber kunjungan, tag UTM, dan pengenal klik iklan (misalnya gclid, fbclid);|cookie dan teknologi serupa (butir 6).|Kami tidak meminta data pribadi yang bersifat spesifik, seperti data dan informasi kesehatan. Mohon jangan memasukkannya ke dalam formulir atau pesan."],
["Tujuan dan dasar pemrosesan","Kami memproses data untuk:|menjawab pesan atau permintaan Anda (berdasarkan persetujuan yang sah dari Anda atau untuk memenuhi permintaan Anda);|meneruskan permintaan Anda kepada mitra atau penjual produk ketika Anda mengirim formulir yang memuat pemberitahuan tersebut (berdasarkan persetujuan);|menjaga keamanan Situs serta mencegah penipuan dan penyalahgunaan otomatis (kepentingan yang sah dengan menyeimbangkan hak Anda);|mengukur lalu lintas, meningkatkan Situs, dan mengukur iklan (berdasarkan persetujuan melalui spanduk cookie);|memenuhi kewajiban hukum."],
["Penerima data","Kami tidak menjual data Anda. Data dapat dibagikan kepada:|mitra dan penjual produk, hanya jika Anda sendiri mengirim permintaan kepada mereka melalui formulir; mereka bertindak berdasarkan kebijakan mereka sendiri;|penyedia layanan (hosting, e-mail, perlindungan spam, layanan analitik dan periklanan termasuk Google dan Meta) yang memproses data atas nama kami atau berdasarkan ketentuan mereka sendiri, sebatas layanannya;|otoritas publik, bila diwajibkan oleh hukum."],
["Transfer lintas negara","Situs dikelola dari Ukraina dan sebagian penyedia berada di luar Indonesia (misalnya di Amerika Serikat). Bila data ditransfer ke luar wilayah Indonesia, kami memastikan adanya perlindungan yang memadai sebagaimana disyaratkan UU PDP dan memproses data hanya sebatas yang diperlukan untuk tujuan di atas."],
["Cookie","Cookie yang diperlukan membuat Situs berfungsi (misalnya menyimpan bahasa) dan tidak memerlukan persetujuan. Cookie analitik dan iklan hanya dipasang setelah Anda memberi persetujuan, yang dapat Anda ubah atau tarik kembali kapan saja semudah saat memberikannya, juga melalui pengaturan peramban. Google dan Meta memproses data cookie berdasarkan kebijakan mereka sendiri."],
["Jangka waktu penyimpanan","Kami menyimpan data tidak lebih lama dari yang diperlukan:|korespondensi: hingga 3 tahun;|data formulir permintaan: hingga 12 bulan sejak kontak terakhir, kecuali hukum atau sengketa mewajibkan lebih lama;|catatan teknis: hingga 12 bulan;|cookie: sesuai jangka waktu yang tercantum pada pengaturan persetujuan.|Setelah itu data dihapus atau dianonimkan."],
["Hak Anda","Berdasarkan UU PDP, Anda berhak:|memperoleh informasi tentang kejelasan identitas, dasar hukum, tujuan, dan akuntabilitas pemrosesan;|melengkapi, memperbarui, dan/atau memperbaiki data;|mengakses dan memperoleh salinan data;|mengakhiri pemrosesan, menghapus, dan/atau memusnahkan data;|menarik kembali persetujuan pemrosesan;|mengajukan keberatan atas keputusan yang semata-mata berdasarkan pemrosesan otomatis;|menunda atau membatasi pemrosesan secara proporsional;|menggugat dan menerima ganti rugi atas pelanggaran sesuai ketentuan peraturan perundang-undangan;|mengajukan pengaduan kepada lembaga yang berwenang di bidang pelindungan data pribadi.|Untuk menggunakan hak Anda, tulis ke useful.habit@outlook.com."],
["Keamanan","Kami menerapkan langkah organisasi dan teknis yang wajar, termasuk HTTPS dan pembatasan akses. Tidak ada transmisi melalui internet yang sepenuhnya aman."],
["Anak","Situs tidak ditujukan bagi orang di bawah 18 tahun dan kami tidak dengan sengaja mengumpulkan data mereka. Jika Anda yakin seorang anak mengirim data kepada kami, hubungi kami dan data akan kami hapus."],
["Perubahan","Versi terbaru selalu diterbitkan di halaman ini beserta tanggalnya. Jika perubahan menyangkut pemrosesan yang memerlukan persetujuan, kami hanya akan menerapkannya setelah memperoleh persetujuan baru."],
["Kontak","Untuk pertanyaan tentang pelindungan data, tulis ke useful.habit@outlook.com."]]},
terms:{t:"Ketentuan Penggunaan",s:[
["Ketentuan umum","Ketentuan ini mengatur penggunaan situs Useful Habit (“Situs”). Dengan menggunakan Situs, Anda menyetujuinya; jika tidak setuju, jangan gunakan Situs. Situs ditujukan bagi orang berusia 18 tahun ke atas."],
["Apa itu Situs","Situs memublikasikan ulasan, artikel, dan tips tentang suplemen kesehatan untuk tujuan informasi. Useful Habit bukan produsen, penjual, atau pemasok suplemen, bukan apotek atau fasilitas kesehatan, dan tidak menjual, mengirim, atau menerima pembayaran untuk produk tersebut."],
["Bukan saran medis","Suplemen kesehatan bukan obat. Materi kami bersifat umum dan edukatif, bukan saran medis, farmasi, gizi, atau profesional lainnya. Kami tidak menyajikan suplemen apa pun sebagai penyembuh atau pencegah penyakit dan tidak menggunakan klaim berlebihan seperti “dijamin”. Informasi tentang khasiat atau manfaat produk hanya merujuk pada informasi yang disetujui atau pernyataan produsen, yang kami tandai jelas. Sebelum menggunakan suplemen, terutama saat hamil, menyusui, mengonsumsi obat, memiliki penyakit kronis atau alergi, konsultasikan dengan dokter. Jangan menunda ke dokter atau menghentikan pengobatan karena informasi di Situs."],
["Tanpa jaminan","Respons tubuh bersifat individual. Kami tidak menjamin hasil apa pun dari produk yang dibahas, maupun bahwa materi lengkap, bebas kesalahan, atau terkini, meskipun kami berupaya demikian."],
["Hubungan komersial","Situs dapat memuat tautan ke sumber pihak ketiga dan hubungan komersial dengan mereka. Jika kami dapat menerima kompensasi (misalnya komisi atau pembayaran untuk permintaan atau pembelian yang diteruskan), kami menyatakannya dalam materi sebelum Anda mengikuti tautan. Kompensasi tidak mengubah fakta yang kami sajikan, tetapi harap diingat bahwa kami dapat memiliki kepentingan finansial."],
["Penjual dan produk pihak ketiga","Harga, ketentuan, ketersediaan, komposisi, label, pengiriman, pengembalian, dan kualitas produk ditentukan dan dijamin oleh penjual serta produsennya. Anda membuat perjanjian jual beli langsung dengan mereka dan berlaku ketentuan serta kebijakan privasi mereka, termasuk hak konsumen menurut hukum. Periksa sebelum membeli. Produk yang dijual di Indonesia wajib memiliki izin edar BPOM dan iklannya wajib sesuai ketentuan BPOM. Kami tidak mengendalikan sumber pihak ketiga dan tidak bertanggung jawab atas isi atau tindakan mereka."],
["Aturan penggunaan","Anda setuju untuk tidak:|menggunakan Situs secara melawan hukum atau melanggar hak pihak ketiga;|mengganggu kinerja Situs, menghindari perlindungannya, atau mengambil data dengan alat otomatis tanpa izin;|mengirim data palsu atau data orang lain tanpa persetujuan mereka;|menyebarkan perangkat lunak berbahaya."],
["Kekayaan intelektual","Teks, desain, logo Useful Habit, dan materi lain dilindungi hak cipta. Menyalin, menyebarkan, dan mengadaptasi tanpa izin tertulis dilarang, kecuali pengutipan sebatas yang diizinkan hukum dengan mencantumkan Situs. Nama dan merek produk milik pemiliknya dan digunakan hanya untuk identifikasi."],
["Tanggung jawab","Sejauh diizinkan hukum yang berlaku, kami tidak bertanggung jawab atas kerugian akibat penggunaan informasi di Situs, ketidaktersediaannya, atau tindakan pihak ketiga. Tidak ada ketentuan di sini yang mengecualikan atau membatasi tanggung jawab yang tidak dapat dikecualikan atau dibatasi menurut hukum, termasuk hak wajib konsumen."],
["Perubahan","Kami dapat mengubah Situs dan Ketentuan ini. Versi baru berlaku sejak diterbitkan di halaman ini dengan tanggal yang tertera; penggunaan lanjutan berarti persetujuan."],
["Hukum yang berlaku dan sengketa","Ketentuan ini diatur oleh hukum Ukraina, tanpa mengurangi ketentuan wajib perlindungan konsumen di negara tempat tinggal Anda. Kami akan terlebih dahulu berupaya menyelesaikan setiap keluhan secara musyawarah."],
["Kontak","Untuk pertanyaan atau keluhan, tulis ke useful.habit@outlook.com."]]}};
T.ms.legal={privacy:{t:"Dasar Privasi",s:[
["Siapa kami","Dasar ini menerangkan bagaimana Useful Habit (seterusnya “Laman”, “kami”) memproses data peribadi pelawat. Pengguna data: Useful Habit, hubungan: useful.habit@outlook.com. Laman ini diurus dari Ukraine. Jika Akta Perlindungan Data Peribadi 2010 (PDPA) Malaysia terpakai kepada anda, kami memproses data selaras dengannya."],
["Data yang kami proses","Data yang anda berikan:|nama, nombor telefon, alamat e-mel dan teks mesej, jika anda menulis kepada kami atau menghantar borang permintaan di Laman;|Data yang dikumpul secara automatik:|alamat IP, jenis peranti dan pelayar, bahasa, halaman yang dilihat, masa lawatan, sumber rujukan, tag UTM dan pengecam klik iklan (contohnya gclid, fbclid);|kuki dan teknologi serupa (perkara 6).|Kami tidak meminta data peribadi yang sensitif seperti maklumat kesihatan. Sila jangan masukkannya dalam borang atau mesej."],
["Tujuan dan asas pemprosesan","Kami memproses data untuk:|menjawab mesej atau permintaan anda (dengan persetujuan anda atau bagi melaksanakan permintaan anda);|menyampaikan permintaan anda kepada rakan kongsi atau penjual produk apabila anda menghantar borang yang mengandungi notis tersebut (dengan persetujuan);|memastikan keselamatan Laman serta mencegah penipuan dan penyalahgunaan automatik;|mengukur trafik, menambah baik Laman dan mengukur pengiklanan (dengan persetujuan melalui sepanduk kuki);|mematuhi kewajipan undang-undang.|Kami memaklumkan anda mengenai tujuan, sumber dan pihak yang menerima data, selaras dengan prinsip notis dan pilihan PDPA."],
["Penerima","Kami tidak menjual data anda. Data boleh didedahkan kepada:|rakan kongsi dan penjual produk, hanya jika anda sendiri menghantar permintaan kepada mereka melalui borang; mereka bertindak mengikut dasar mereka sendiri;|penyedia perkhidmatan (pengehosan, e-mel, perlindungan spam, perkhidmatan analitik dan pengiklanan termasuk Google dan Meta) yang memproses data bagi pihak kami atau mengikut terma mereka sendiri, dalam lingkungan perkhidmatan mereka;|pihak berkuasa awam, apabila dikehendaki oleh undang-undang."],
["Pemindahan merentas sempadan","Laman diurus dari Ukraine dan sesetengah penyedia terletak di luar Malaysia (contohnya di Amerika Syarikat). Apabila data dipindahkan ke luar Malaysia, kami melakukannya selaras dengan keperluan PDPA dan memproses data hanya setakat yang perlu untuk tujuan di atas."],
["Kuki","Kuki yang perlu membolehkan Laman berfungsi (contohnya menyimpan bahasa) dan tidak memerlukan persetujuan. Kuki analitik dan pengiklanan hanya ditetapkan selepas anda memberi persetujuan, yang boleh anda ubah atau tarik balik pada bila-bila masa semudah ketika memberikannya, juga dalam tetapan pelayar. Google dan Meta memproses data kuki mengikut dasar mereka sendiri."],
["Tempoh penyimpanan","Kami menyimpan data tidak lebih lama daripada yang perlu:|surat-menyurat: sehingga 3 tahun;|data borang permintaan: sehingga 12 bulan selepas hubungan terakhir, kecuali undang-undang atau pertikaian memerlukan lebih lama;|log teknikal: sehingga 12 bulan;|kuki: mengikut tempoh dalam tetapan persetujuan.|Selepas itu data dipadam atau dianonimkan."],
["Hak anda","Di bawah PDPA anda berhak:|mengakses data peribadi anda dan mendapatkan salinan;|meminta pembetulan data yang tidak tepat;|menarik balik persetujuan pada bila-bila masa, tanpa menjejaskan pemprosesan terdahulu;|menghalang pemprosesan yang menyebabkan atau mungkin menyebabkan kerosakan atau kesusahan;|menghalang pemprosesan untuk tujuan pemasaran langsung;|mengemukakan aduan kepada Pesuruhjaya Perlindungan Data Peribadi Malaysia.|Untuk menggunakan hak anda, tulis kepada useful.habit@outlook.com."],
["Keselamatan","Kami menggunakan langkah organisasi dan teknikal yang munasabah, termasuk HTTPS dan akses terhad. Tiada penghantaran melalui internet yang selamat sepenuhnya."],
["Kanak-kanak","Laman tidak ditujukan kepada mereka yang berumur di bawah 18 tahun dan kami tidak sengaja mengumpul data mereka. Jika anda percaya seorang kanak-kanak menghantar data kepada kami, tulis kepada kami dan kami akan memadamnya."],
["Perubahan","Versi terkini sentiasa diterbitkan di halaman ini bersama tarikh. Jika perubahan melibatkan pemprosesan yang memerlukan persetujuan, kami hanya akan menerapkannya selepas mendapat persetujuan baharu."],
["Hubungan","Untuk soalan tentang perlindungan data, tulis kepada useful.habit@outlook.com."]]},
terms:{t:"Terma Penggunaan",s:[
["Peruntukan am","Terma ini mengawal penggunaan laman web Useful Habit (“Laman”). Dengan menggunakan Laman, anda bersetuju dengannya; jika tidak bersetuju, jangan gunakan Laman. Laman ditujukan kepada mereka yang berumur 18 tahun ke atas."],
["Apakah Laman ini","Laman menerbitkan ulasan, artikel dan petua tentang suplemen makanan untuk tujuan maklumat. Useful Habit bukan pengeluar, penjual atau pembekal suplemen, bukan farmasi atau kemudahan kesihatan, dan tidak menjual, menghantar atau menerima bayaran bagi produk tersebut."],
["Bukan nasihat perubatan","Suplemen makanan bukan ubat. Bahan kami bersifat am dan pendidikan serta bukan nasihat perubatan, farmaseutikal, pemakanan atau profesional lain. Kami tidak mempersembahkan sebarang suplemen sebagai mampu mencegah, merawat atau menyembuhkan penyakit dan tidak menggunakan dakwaan keterlaluan seperti “dijamin”. Maklumat tentang khasiat atau faedah produk hanya merujuk kepada maklumat yang diluluskan atau kenyataan pengeluar, yang kami tandakan dengan jelas. Sebelum menggunakan suplemen, terutamanya semasa mengandung, menyusu, mengambil ubat, mempunyai penyakit kronik atau alahan, rujuk doktor. Jangan menangguhkan berjumpa doktor atau menghentikan rawatan kerana maklumat di Laman."],
["Tiada jaminan","Tindak balas badan adalah individu. Kami tidak menjamin sebarang hasil daripada produk yang dibincangkan, mahupun bahawa bahan lengkap, bebas ralat atau terkini, walaupun kami berusaha ke arah itu."],
["Hubungan komersial","Laman mungkin mengandungi pautan ke sumber pihak ketiga dan hubungan komersial dengan mereka. Jika kami boleh menerima ganjaran (contohnya komisen atau bayaran bagi permintaan atau pembelian yang dirujuk), kami menyatakannya dalam bahan sebelum anda mengikuti pautan. Ganjaran tidak mengubah fakta yang kami sampaikan, tetapi sila ingat bahawa kami mungkin mempunyai kepentingan kewangan."],
["Penjual dan produk pihak ketiga","Harga, syarat, ketersediaan, komposisi, pelabelan, penghantaran, pemulangan dan kualiti produk ditentukan dan dijamin oleh penjual serta pengeluarnya. Anda memuktamadkan kontrak jual beli terus dengan mereka dan terma serta dasar privasi mereka terpakai, termasuk hak pengguna di sisi undang-undang. Semak sebelum membeli. Produk yang dijual di Malaysia mesti mematuhi keperluan pendaftaran dan pengiklanan pihak berkuasa kesihatan yang berkaitan. Kami tidak mengawal sumber pihak ketiga dan tidak bertanggungjawab atas kandungan atau tindakan mereka."],
["Peraturan penggunaan","Anda bersetuju untuk tidak:|menggunakan Laman secara menyalahi undang-undang atau melanggar hak pihak ketiga;|mengganggu operasi Laman, memintas perlindungannya atau mengumpul data dengan alat automatik tanpa kebenaran;|menghantar data palsu atau data orang lain tanpa persetujuan mereka;|menyebarkan perisian berbahaya."],
["Harta intelek","Teks, reka bentuk, logo Useful Habit dan bahan lain dilindungi hak cipta. Menyalin, mengedar dan mengadaptasi tanpa kebenaran bertulis adalah dilarang, kecuali petikan dalam had yang dibenarkan undang-undang dengan rujukan kepada Laman. Nama dan tanda dagangan produk milik pemiliknya dan digunakan hanya untuk pengenalan."],
["Tanggungjawab","Setakat yang dibenarkan oleh undang-undang terpakai, kami tidak bertanggungjawab atas kerugian akibat penggunaan maklumat di Laman, ketidaktersediaannya atau tindakan pihak ketiga. Tiada apa dalam Terma ini yang mengecualikan atau menghadkan tanggungjawab yang tidak boleh dikecualikan atau dihadkan oleh undang-undang, termasuk hak wajib pengguna."],
["Perubahan","Kami boleh mengubah Laman dan Terma ini. Versi baharu terpakai sejak diterbitkan di halaman ini dengan tarikh yang dinyatakan; penggunaan berterusan bermakna persetujuan."],
["Undang-undang terpakai dan pertikaian","Terma ini ditadbir oleh undang-undang Ukraine, tanpa menjejaskan peruntukan wajib perlindungan pengguna di negara tempat tinggal anda. Kami akan cuba menyelesaikan sebarang aduan melalui perundingan terlebih dahulu."],
["Hubungan","Untuk soalan atau aduan, tulis kepada useful.habit@outlook.com."]]}};

T.kk.legal={privacy:{t:"Құпиялылық саясаты",s:[
["Жалпы ережелер","Осы Саясат Useful Habit сайты (бұдан әрі — «Сайт», «біз») қандай дербес деректерді, не үшін, қандай негізде өңдейтінін, оларды кімге беруі мүмкін екенін және сізде қандай құқықтар бар екенін түсіндіреді. Сайт иесі — Useful Habit. Байланыс: useful.habit@outlook.com. Сайт Украинадан басқарылады. Қазақстан Республикасының аумағындағы пайдаланушылар үшін деректер «Дербес деректер және оларды қорғау туралы» ҚР Заңына (2013 жылғы 21 мамырдағы № 94-V) сәйкес өңделеді. Сайтты пайдалана отырып, сіз Саясатпен танысқаныңызды растайсыз."],
["Сіз өзіңіз беретін деректер","Біз тек сіз жіберуді шешкен деректерді аламыз:|аты-жөні, телефон нөмірі, электрондық пошта және хабарлама мәтіні — егер сіз бізге жазсаңыз немесе Сайттағы нысанды толтырсаңыз;|өтінішіңізге қоса берген кез келген басқа ақпарат."],
["Автоматты түрде жиналатын деректер","Сайтқа кірген кезде мыналар өңделуі мүмкін:|IP-мекенжай, құрылғы түрі, браузер, тіл, қаралған беттер, кіру уақыты мен ұзақтығы;|өту көзі, соның ішінде UTM-белгілер және жарнамалық клик идентификаторлары (мысалы, gclid, fbclid);|cookie файлдары және ұқсас технологиялар (7-бөлім)."],
["Біз нені жинамаймыз","Біз денсаулық жағдайы, диагноздар, наным-сенімдер және өзге де ерекше санаттағы деректерді сұрамаймыз және жинамаймыз. Оларды нысандар мен хабарламаларда көрсетпеуіңізді сұраймыз."],
["Өңдеу мақсаттары мен негіздері","Біз деректерді мыналар үшін өңдейміз:|хатыңызға немесе сұрауыңызға жауап беру (негіз — сіздің келісіміңіз немесе сіздің өтінішіңіз бойынша іс-қимыл);|нысанды тиісті хабарламамен жіберсеңіз, сұрауыңызды өнім серіктесіне немесе сатушысына беру (негіз — сіздің келісіміңіз);|Сайттың жұмысы мен қауіпсіздігін қамтамасыз ету, алаяқтық пен автоматты өтініштердің алдын алу;|келу санын талдау және Сайтты жетілдіру (тек сіздің келісіміңізбен);|жарнама тиімділігін өлшеу (тек сіздің келісіміңізбен);|заңнама талаптарын орындау."],
["Деректерді кімге беруіміз мүмкін","Біз деректеріңізді сатпаймыз. Олар мыналарға берілуі мүмкін:|өнім серіктестері мен сатушыларына — егер сіз оларға нысан арқылы сұрау жіберсеңіз ғана; бұл нысанның жанында көрсетіледі, одан әрі олар өз саясаттарына сай жауап береді;|қызмет жеткізушілерге (хостинг, пошта, спамнан қорғау, талдау және жарнама жүйелері, соның ішінде Google мен Meta) — қызметтері үшін қажетті көлемде ғана;|мемлекеттік органдарға — заң талап еткенде.|Деректер Қазақстаннан тыс жерге берілуі мүмкін. Мұндай беру дербес деректерді қорғау туралы заңнама талаптарын сақтай отырып жүзеге асырылады."],
["Cookie файлдары","Cookie — браузеріңіздегі шағын файлдар. Біз мыналарды ажыратамыз:|қажетті — Сайттың жұмысы үшін (мысалы, тілді сақтау), келісімді қажет етпейді;|аналитикалық — Сайттың қалай пайдаланылатынын көрсетеді;|жарнамалық — жарнаманы өлшейді және өзекті хабарландыруларды көрсетеді.|Аналитикалық және жарнамалық cookie тек сіздің келісіміңізден кейін қосылады, оны кез келген уақытта өзгертуге немесе қайтарып алуға болады, сондай-ақ браузер параметрлерінде. Google мен Meta деректерді өз саясаттарына сай өңдейді."],
["Сақтау мерзімдері","Деректерді өңдеу мақсаттарына қажеттіден ұзақ сақтамаймыз:|хат алмасу — 3 жылға дейін;|нысандардағы сұрау деректері — соңғы байланыстан кейін 12 айға дейін, егер заң немесе дау қарауы ұзағырақ талап етпесе;|техникалық журналдар — 12 айға дейін;|cookie — келісім параметрлеріндегі мерзімдерге сай.|Содан кейін деректер жойылады немесе иесіздендіріледі."],
["Сіздің құқықтарыңыз","Қазақстан Республикасының заңнамасына сәйкес сіз:|өз деректеріңіздің өңделуі туралы білуге және оларға қол жеткізуге;|деректерді түзетуді, бұғаттауды немесе жоюды талап етуге, егер олар дұрыс емес немесе заңсыз өңделсе;|келісімді кез келген уақытта қайтарып алуға;|өз құқықтарыңыз бұзылса, уәкілетті органға (дербес деректерді қорғау саласындағы мемлекеттік орган) немесе сотқа шағымдануға құқылысыз.|Құқықтарды іске асыру үшін useful.habit@outlook.com мекенжайына жазыңыз. Біз заңда белгіленген мерзімде жауап береміз."],
["Қауіпсіздік","Біз ақылға қонымды ұйымдастырушылық және техникалық шараларды қолданамыз: HTTPS қорғалған қосылымы және деректерге қолжетімділікті шектеу. Алайда интернет арқылы ешбір беру толық қауіпсіз емес."],
["Балалар","Сайт 18 жасқа толмаған адамдарға арналмаған және біз олардың деректерін саналы түрде жинамаймыз. Егер бала бізге деректер жібергенін білсеңіз, жазыңыз — біз оларды жоямыз."],
["Саясаттағы өзгерістер","Өзекті редакция әрдайым осы бетте күнімен жарияланады. Егер өзгерістер келісімді қажет ететін өңдеуге қатысты болса, оларды жаңа келісім алғаннан кейін ғана қолданамыз."],
["Байланыс","Деректерді өңдеу мәселелері бойынша useful.habit@outlook.com мекенжайына жазыңыз."]]},
terms:{t:"Пайдалану шарттары",s:[
["Жалпы ережелер","Осы Шарттар Useful Habit сайтын (бұдан әрі — «Сайт») пайдалануды реттейді. Сайтты пайдалана отырып, сіз Шарттармен келісесіз; келіспесеңіз, Сайтты пайдаланбаңыз. Сайт 18 жастан асқан адамдарға арналған."],
["Сайт дегеніміз не","Сайт ақпараттық мақсатта тағамдық қоспалар туралы шолулар, мақалалар мен кеңестер жариялайды. Useful Habit қоспалардың өндірушісі, сатушысы немесе жеткізушісі емес, дәріхана немесе медициналық мекеме емес және мұндай өнімдерді сатпайды, жеткізбейді және олар үшін төлем қабылдамайды."],
["Медициналық кеңес емес","Материалдар жалпы білім беру сипатында және медициналық, фармацевтикалық, диетологиялық не өзге кәсіби кеңес болып табылмайды. Олар аурулардың диагностикасына, емдеуге немесе алдын алуға арналмаған. Тағамдық қоспалар дәрілік зат емес және біз ешқандай қоспаны емдік қасиеті бар деп көрсетпейміз. Қоспаларды қолданар алдында, әсіресе жүктілік немесе емшек емізу кезінде, дәрі қабылдағанда, созылмалы ауруда немесе аллергияда дәрігермен кеңесіңіз. Сайттағы ақпаратқа байланысты дәрігерге баруды кейінге қалдырмаңыз және емдеуді тоқтатпаңыз."],
["Кепілдіктердің болмауы","Организмнің реакциясы жеке. Біз Сайтта талқыланатын өнімдерден ешқандай нәтижеге, сондай-ақ материалдардың толықтығына, қатесіздігіне немесе өзектілігіне кепілдік бермейміз, дегенмен бұған ұмтыламыз."],
["Коммерциялық байланыстар","Сайт үшінші тараптардың ресурстарына сілтемелерді және олармен коммерциялық қатынастарды қамтуы мүмкін. Егер біз сыйақы ала алсақ (мысалы, берілген сұрау немесе сатып алу үшін комиссия), мұны материалда сілтемеге өтпес бұрын көрсетеміз. Сыйақы біз келтіретін фактілерді өзгертпейді, бірақ бізде қаржылық мүдде болуы мүмкін екенін ескеріңіз."],
["Сыртқы ресурстар мен өнімдер","Тауарлардың бағасын, шарттарын, қолжетімділігін, құрамын, таңбалануын, жеткізуін, қайтаруын және сапасын олардың сатушылары мен өндірушілері анықтайды және қамтамасыз етеді. Сатып алу-сату шартын сіз олармен тікелей жасайсыз, сізге олардың шарттары мен құпиялылық саясаттары қолданылады. Қазақстанда сатылатын БАД мемлекеттік тіркеуден өтуі тиіс, ал оның жарнамасы тіркеу деректеріне сәйкес болуы керек. Сатып алар алдында тексеріңіз. Біз сыртқы ресурстарды бақыламаймыз және олардың мазмұны мен әрекеттері үшін жауап бермейміз."],
["Пайдалану ережелері","Сіз мыналарға келісесіз:|Сайтты заңсыз мақсатта немесе үшінші тұлғалардың құқықтарын бұза отырып пайдаланбау;|Сайттың жұмысына кедергі жасамау, қорғанысты айналып өтпеу немесе рұқсатсыз автоматты құралдармен деректерді жинамау;|жалған деректерді немесе басқа адамдардың деректерін олардың келісімінсіз жібермеу;|зиянды бағдарламалық жасақтаманы таратпау."],
["Зияткерлік меншік","Мәтіндер, дизайн, Useful Habit логотипі және Сайттың басқа материалдары авторлық құқық туралы заңнамамен қорғалады. Жазбаша рұқсатсыз көшіруге, таратуға және өңдеуге тыйым салынады, заңда рұқсат етілген шектегі дәйексөзден басқа, Сайтқа сілтеме жасай отырып. Өнім атаулары мен тауар белгілері олардың иелеріне тиесілі және тек сәйкестендіру үшін аталады."],
["Жауапкершілік","Қолданыстағы заңнама рұқсат ететін шекте біз Сайттағы ақпаратты пайдаланудан, оның қолжетімсіздігінен немесе үшінші тараптардың әрекеттерінен туындаған залал үшін жауап бермейміз. Осы Шарттар заңмен шектеуге болмайтын жауапкершілікті және тұтынушылардың міндетті құқықтарын шектемейді."],
["Өзгерістер","Біз Сайтты және осы Шарттарды өзгерте аламыз. Жаңа редакция осы бетте көрсетілген күнімен жарияланған сәттен бастап күшіне енеді; пайдалануды жалғастыру келісімді білдіреді."],
["Қолданылатын құқық және даулар","Осы Шарттар Украина заңнамасымен реттеледі, бұл Қазақстан Республикасының тұтынушылардың құқықтарын қорғау туралы міндетті ережелерін жоймайды. Даулар алдымен келіссөздер арқылы шешіледі."],
["Байланыс","Кез келген сұрақ пен шағым бойынша useful.habit@outlook.com мекенжайына жазыңыз."]]}};
T.uz.legal={privacy:{t:"Maxfiylik siyosati",s:[
["Umumiy qoidalar","Ushbu Siyosat Useful Habit sayti (keyingi o‘rinlarda — «Sayt», «biz») qanday shaxsga doir ma’lumotlarni, nima uchun, qanday asosda qayta ishlashini, ularni kimga berishi mumkinligini va sizda qanday huquqlar borligini tushuntiradi. Sayt egasi — Useful Habit. Aloqa: useful.habit@outlook.com. Sayt Ukrainadan boshqariladi. O‘zbekiston Respublikasi hududidagi foydalanuvchilar uchun ma’lumotlar «Shaxsga doir ma’lumotlar to‘g‘risida»gi O‘zbekiston Respublikasi Qonuniga (2019-yil 2-iyul, O‘RQ-547) muvofiq qayta ishlanadi. Saytdan foydalanib, siz Siyosat bilan tanishganingizni tasdiqlaysiz."],
["O‘zingiz taqdim etadigan ma’lumotlar","Biz faqat siz yuborishga qaror qilgan ma’lumotlarni olamiz:|ism, telefon raqami, elektron pochta va xabar matni — agar bizga yozsangiz yoki saytdagi shaklni to‘ldirsangiz;|murojaatingizga qo‘shgan boshqa har qanday ma’lumot."],
["Avtomatik yig‘iladigan ma’lumotlar","Tashrif vaqtida quyidagilar qayta ishlanishi mumkin:|IP-manzil, qurilma turi, brauzer, til, ko‘rilgan sahifalar, tashrif vaqti va davomiyligi;|o‘tish manbasi, jumladan UTM-belgilar va reklama kliki identifikatorlari (masalan, gclid, fbclid);|cookie fayllari va shunga o‘xshash texnologiyalar (7-bo‘lim)."],
["Nimani yig‘masligimiz","Biz sog‘liq holati, tashxislar, e’tiqodlar va boshqa maxsus toifadagi ma’lumotlarni so‘ramaymiz va yig‘maymiz. Iltimos, ularni shakl va xabarlarda ko‘rsatmang."],
["Maqsadlar va asoslar","Biz ma’lumotlarni quyidagilar uchun qayta ishlaymiz:|xatingiz yoki so‘rovingizga javob berish (asos — sizning roziligingiz yoki so‘rovingiz bo‘yicha harakatlar);|shaklni tegishli xabar bilan yuborsangiz, so‘rovingizni mahsulot hamkori yoki sotuvchisiga uzatish (asos — sizning roziligingiz);|Sayt ishi va xavfsizligini ta’minlash, firibgarlik va avtomatik murojaatlarning oldini olish;|tashriflarni tahlil qilish va Saytni takomillashtirish (faqat sizning roziligingiz bilan);|reklama samaradorligini o‘lchash (faqat sizning roziligingiz bilan);|qonunchilik talablarini bajarish."],
["Ma’lumotlarni kimga berishimiz mumkin","Biz ma’lumotlaringizni sotmaymiz. Ular quyidagilarga berilishi mumkin:|mahsulot hamkorlari va sotuvchilariga — faqat siz ularga shakl orqali so‘rov yuborgan bo‘lsangiz; bu shakl yonida ko‘rsatiladi, keyin ular o‘z siyosatlariga muvofiq javob beradi;|xizmat ko‘rsatuvchilarga (xosting, pochta, spamdan himoya, tahlil va reklama tizimlari, jumladan Google va Meta) — xizmatlari uchun zarur hajmda;|davlat organlariga — qonun talab qilganda.|Ma’lumotlar O‘zbekistondan tashqariga uzatilishi mumkin. Bunday uzatish shaxsga doir ma’lumotlarni himoya qilish to‘g‘risidagi qonunchilik talablariga rioya qilgan holda amalga oshiriladi."],
["Cookie fayllari","Cookie — brauzeringizdagi kichik fayllar. Biz quyidagilarni farqlaymiz:|zarur — Sayt ishi uchun (masalan, tilni saqlash), rozilik talab qilmaydi;|analitik — Saytdan qanday foydalanilishini ko‘rsatadi;|reklama — reklamani o‘lchaydi va dolzarb e’lonlarni ko‘rsatadi.|Analitik va reklama cookie faqat sizning roziligingizdan keyin yoqiladi, uni istalgan vaqtda o‘zgartirish yoki qaytarib olish mumkin, shuningdek brauzer sozlamalarida. Google va Meta ma’lumotlarni o‘z siyosatlariga muvofiq qayta ishlaydi."],
["Saqlash muddatlari","Ma’lumotlarni qayta ishlash maqsadlari uchun zarurdan uzoq saqlamaymiz:|yozishmalar — 3 yilgacha;|shakllardagi so‘rov ma’lumotlari — oxirgi aloqadan keyin 12 oygacha, agar qonun yoki nizo ko‘rib chiqilishi uzoqroq talab qilmasa;|texnik jurnallar — 12 oygacha;|cookie — rozilik sozlamalaridagi muddatlarga muvofiq.|Shundan so‘ng ma’lumotlar o‘chiriladi yoki shaxssizlantiriladi."],
["Sizning huquqlaringiz","O‘zbekiston Respublikasi qonunchiligiga muvofiq siz:|o‘z ma’lumotlaringiz qayta ishlanishi haqida bilish va ularga kirish huquqiga;|ma’lumotlarni tuzatish, bloklash yoki o‘chirishni talab qilish huquqiga, agar ular noto‘g‘ri yoki noqonuniy qayta ishlansa;|rozilikni istalgan vaqtda qaytarib olish huquqiga;|huquqlaringiz buzilsa, vakolatli davlat organiga yoki sudga shikoyat qilish huquqiga egasiz.|Huquqlarni amalga oshirish uchun useful.habit@outlook.com manziliga yozing. Biz qonunda belgilangan muddatda javob beramiz."],
["Xavfsizlik","Biz oqilona tashkiliy va texnik choralarni qo‘llaymiz: HTTPS himoyalangan ulanishi va ma’lumotlarga kirishni cheklash. Biroq internet orqali hech bir uzatish mutlaqo xavfsiz emas."],
["Bolalar","Sayt 18 yoshga to‘lmagan shaxslar uchun mo‘ljallanmagan va biz ularning ma’lumotlarini ongli ravishda yig‘maymiz. Agar bola bizga ma’lumot yuborganini bilsangiz, yozing — biz ularni o‘chiramiz."],
["Siyosatdagi o‘zgarishlar","Dolzarb tahrir doim shu sahifada sana bilan e’lon qilinadi. Agar o‘zgarishlar rozilik talab qiladigan qayta ishlashga taalluqli bo‘lsa, ularni yangi rozilik olingandan keyingina qo‘llaymiz."],
["Aloqa","Ma’lumotlarni qayta ishlash masalalari bo‘yicha useful.habit@outlook.com manziliga yozing."]]},
terms:{t:"Foydalanish shartlari",s:[
["Umumiy qoidalar","Ushbu Shartlar Useful Habit saytidan (keyingi o‘rinlarda — «Sayt») foydalanishni tartibga soladi. Saytdan foydalanib, siz Shartlarga rozilik bildirasiz; rozi bo‘lmasangiz, Saytdan foydalanmang. Sayt 18 yoshdan oshgan shaxslar uchun mo‘ljallangan."],
["Sayt nima","Sayt axborot maqsadida oziq-ovqat qo‘shimchalari haqida sharhlar, maqolalar va maslahatlar e’lon qiladi. Useful Habit qo‘shimchalar ishlab chiqaruvchisi, sotuvchisi yoki yetkazib beruvchisi emas, dorixona yoki tibbiyot muassasasi emas va bunday mahsulotlarni sotmaydi, yetkazib bermaydi hamda ular uchun to‘lov qabul qilmaydi."],
["Tibbiy maslahat emas","Materiallar umumiy ta’limiy xususiyatga ega va tibbiy, farmatsevtik, dietologik yoki boshqa kasbiy maslahat hisoblanmaydi. Ular kasalliklarni aniqlash, davolash yoki oldini olish uchun mo‘ljallanmagan. Oziq-ovqat qo‘shimchalari dori vositasi emas va biz hech qanday qo‘shimchani davolovchi xususiyatga ega deb ko‘rsatmaymiz. Qo‘shimchalarni qo‘llashdan oldin, ayniqsa homiladorlik yoki emizish davrida, dori qabul qilganda, surunkali kasallik yoki allergiyada shifokor bilan maslahatlashing. Saytdagi ma’lumot tufayli shifokorga borishni kechiktirmang va davolanishni to‘xtatmang."],
["Kafolatlar yo‘qligi","Organizm reaksiyasi individual. Biz Saytda muhokama qilinadigan mahsulotlardan hech qanday natijani, shuningdek materiallarning to‘liqligi, xatosizligi yoki dolzarbligini kafolatlamaymiz, garchi bunga intilsak ham."],
["Tijoriy aloqalar","Sayt uchinchi tomon resurslariga havolalarni va ular bilan tijoriy munosabatlarni o‘z ichiga olishi mumkin. Agar biz haq olishimiz mumkin bo‘lsa (masalan, uzatilgan so‘rov yoki xarid uchun komissiya), buni materialda havolaga o‘tishdan oldin ko‘rsatamiz. Haq biz keltirgan faktlarni o‘zgartirmaydi, biroq bizda moliyaviy manfaat bo‘lishi mumkinligini hisobga oling."],
["Tashqi resurslar va mahsulotlar","Tovarlarning narxi, shartlari, mavjudligi, tarkibi, markirovkasi, yetkazib berilishi, qaytarilishi va sifatini ularning sotuvchilari va ishlab chiqaruvchilari belgilaydi va ta’minlaydi. Oldi-sotdi shartnomasini siz ular bilan bevosita tuzasiz, sizga ularning shartlari va maxfiylik siyosatlari qo‘llanadi. O‘zbekistonda sotiladigan qo‘shimchalar belgilangan ro‘yxatdan o‘tish va reklama talablariga mos bo‘lishi kerak. Xariddan oldin tekshiring. Biz tashqi resurslarni nazorat qilmaymiz va ularning mazmuni hamda harakatlari uchun javob bermaymiz."],
["Foydalanish qoidalari","Siz quyidagilarga rozilik bildirasiz:|Saytdan noqonuniy maqsadda yoki uchinchi shaxslar huquqlarini buzgan holda foydalanmaslik;|Sayt ishiga xalaqit bermaslik, himoyani chetlab o‘tmaslik yoki ruxsatsiz avtomatik vositalar bilan ma’lumot yig‘maslik;|yolg‘on ma’lumotlarni yoki boshqa shaxslarning ma’lumotlarini ularning roziligisiz yubormaslik;|zararli dasturiy ta’minotni tarqatmaslik."],
["Intellektual mulk","Matnlar, dizayn, Useful Habit logotipi va Saytning boshqa materiallari mualliflik huquqi qonunchiligi bilan himoyalangan. Yozma ruxsatsiz nusxalash, tarqatish va qayta ishlashga yo‘l qo‘yilmaydi, qonunda ruxsat etilgan doiradagi iqtibosdan tashqari, Saytga havola bilan. Mahsulot nomlari va tovar belgilari ularning egalariga tegishli va faqat identifikatsiya uchun tilga olinadi."],
["Javobgarlik","Amaldagi qonunchilik ruxsat bergan doirada biz Saytdagi ma’lumotdan foydalanish, uning mavjud emasligi yoki uchinchi tomonlarning harakatlari oqibatida yuzaga kelgan zararlar uchun javob bermaymiz. Ushbu Shartlar qonun bilan cheklab bo‘lmaydigan javobgarlikni va iste’molchilarning majburiy huquqlarini cheklamaydi."],
["O‘zgarishlar","Biz Saytni va ushbu Shartlarni o‘zgartirishimiz mumkin. Yangi tahrir shu sahifada ko‘rsatilgan sana bilan e’lon qilingan paytdan kuchga kiradi; foydalanishni davom ettirish rozilikni bildiradi."],
["Qo‘llaniladigan huquq va nizolar","Ushbu Shartlar Ukraina qonunchiligi bilan tartibga solinadi, bu O‘zbekiston Respublikasining iste’molchilar huquqlarini himoya qilish to‘g‘risidagi majburiy qoidalarini bekor qilmaydi. Nizolar avval muzokaralar yo‘li bilan hal etiladi."],
["Aloqa","Har qanday savol va shikoyat bo‘yicha useful.habit@outlook.com manziliga yozing."]]}};
T.ka.legal={privacy:{t:"კონფიდენციალურობის პოლიტიკა",s:[
["ვინ ვართ","ეს პოლიტიკა განმარტავს, როგორ ამუშავებს Useful Habit (შემდგომში „საიტი“, „ჩვენ“) ვიზიტორთა პერსონალურ მონაცემებს. დამმუშავებელი: Useful Habit, საკონტაქტო: useful.habit@outlook.com. საიტს მართავენ უკრაინიდან. საქართველოში მყოფი პირებისთვის მონაცემებს ვამუშავებთ „პერსონალურ მონაცემთა დაცვის შესახებ“ საქართველოს კანონის შესაბამისად."],
["რა მონაცემებს ვამუშავებთ","თქვენ მიერ მოწოდებული მონაცემები:|სახელი, ტელეფონის ნომერი, ელფოსტა და შეტყობინების ტექსტი, თუ გვწერთ ან საიტზე შეკითხვის ფორმას გვიგზავნით;|ავტომატურად შეგროვებული მონაცემები:|IP მისამართი, მოწყობილობისა და ბრაუზერის ტიპი, ენა, დათვალიერებული გვერდები, ვიზიტის დრო, წყარო, UTM ტეგები და სარეკლამო კლიკის იდენტიფიკატორები (მაგ., gclid, fbclid);|ქუქი-ფაილები და მსგავსი ტექნოლოგიები (პუნქტი 6).|ჩვენ არ ვითხოვთ განსაკუთრებული კატეგორიის მონაცემებს, მათ შორის ჯანმრთელობის შესახებ. გთხოვთ, არ მიუთითოთ ისინი ფორმებსა და შეტყობინებებში."],
["მიზნები და სამართლებრივი საფუძვლები","მონაცემებს ვამუშავებთ იმისთვის, რომ:|ვუპასუხოთ თქვენს შეტყობინებას ან შეკითხვას (თქვენი თანხმობით ან თქვენი მოთხოვნით ზომების მისაღებად);|გადავცეთ თქვენი შეკითხვა პროდუქტის პარტნიორს ან გამყიდველს, როცა ამ შეტყობინების მქონე ფორმას აგზავნით (თანხმობა);|უზრუნველვყოთ საიტის უსაფრთხოება და თავიდან ავიცილოთ თაღლითობა და ავტომატური ბოროტად გამოყენება (კანონიერი ინტერესი, თქვენი უფლებების გათვალისწინებით);|გავზომოთ ტრაფიკი, გავაუმჯობესოთ საიტი და გავზომოთ რეკლამა (თანხმობა ქუქი-ბანერის მეშვეობით);|შევასრულოთ სამართლებრივი ვალდებულებები."],
["მიმღებები","თქვენს მონაცემებს არ ვყიდით. ისინი შეიძლება გადაეცეს:|პროდუქტის პარტნიორებსა და გამყიდველებს — მხოლოდ თუ თავად გაუგზავნეთ მათ შეკითხვა ფორმით; ისინი მოქმედებენ საკუთარი პოლიტიკის მიხედვით;|მომსახურების მიმწოდებლებს (ჰოსტინგი, ელფოსტა, სპამისგან დაცვა, ანალიტიკისა და რეკლამის სერვისები, მათ შორის Google და Meta), რომლებიც მონაცემებს ამუშავებენ ჩვენი სახელით ან საკუთარი პირობებით, თავიანთი სერვისების ფარგლებში;|საჯარო ორგანოებს, როცა ამას კანონი მოითხოვს."],
["საერთაშორისო გადაცემა","საიტს მართავენ უკრაინიდან, ხოლო ზოგი მიმწოდებელი საქართველოს გარეთ მდებარეობს (მაგ., აშშ-ში). მონაცემთა საზღვარგარეთ გადაცემისას ვიცავთ კანონით დადგენილ გარანტიებს და მონაცემებს ვამუშავებთ მხოლოდ ზემოაღნიშნული მიზნებისთვის საჭირო მოცულობით."],
["ქუქი-ფაილები","აუცილებელი ქუქი-ფაილები უზრუნველყოფს საიტის მუშაობას (მაგ., ენის დამახსოვრებას) და თანხმობას არ საჭიროებს. ანალიტიკური და სარეკლამო ქუქი-ფაილები ინსტალირდება მხოლოდ თქვენი თანხმობის შემდეგ, რომლის შეცვლა ან გაუქმება ნებისმიერ დროს შეგიძლიათ ისეთივე მარტივად, როგორც მისი მიცემა, ასევე ბრაუზერის პარამეტრებში. Google და Meta ქუქი-მონაცემებს საკუთარი პოლიტიკის მიხედვით ამუშავებენ."],
["შენახვის ვადები","მონაცემებს ვინახავთ საჭიროზე მეტ ხანს არა:|მიმოწერა — 3 წლამდე;|შეკითხვის ფორმის მონაცემები — ბოლო კონტაქტიდან 12 თვემდე, თუ კანონი ან სამართლებრივი მოთხოვნა უფრო დიდ ვადას არ მოითხოვს;|ტექნიკური ჟურნალები — 12 თვემდე;|ქუქი-ფაილები — თანხმობის პარამეტრებში მითითებული ვადებით.|ამის შემდეგ მონაცემები იშლება ან ანონიმურდება."],
["თქვენი უფლებები","კანონის შესაბამისად თქვენ გაქვთ უფლება:|მიიღოთ ინფორმაცია თქვენი მონაცემების დამუშავების შესახებ და გაეცნოთ მათ;|მოითხოვოთ მონაცემების შესწორება, განახლება ან შევსება;|მოითხოვოთ დამუშავების შეწყვეტა, წაშლა ან განადგურება;|მოითხოვოთ დამუშავების დაბლოკვა;|მოითხოვოთ მონაცემთა გადატანა;|გააუქმოთ თანხმობა ნებისმიერ დროს, უკვე განხორციელებული დამუშავების კანონიერების შეუხებლად;|საჩივრით მიმართოთ პერსონალურ მონაცემთა დაცვის სამსახურს ან სასამართლოს.|უფლებების გამოსაყენებლად მოგვწერეთ: useful.habit@outlook.com. ჩვენ არ ვიღებთ გადაწყვეტილებებს, რომლებიც მხოლოდ ავტომატიზებულ დამუშავებას ეფუძნება და თქვენთვის სამართლებრივ შედეგებს წარმოშობს."],
["უსაფრთხოება","ვიყენებთ გონივრულ ორგანიზაციულ და ტექნიკურ ზომებს, მათ შორის HTTPS-სა და წვდომის შეზღუდვას. ინტერნეტით არცერთი გადაცემა არ არის სრულიად უსაფრთხო."],
["არასრულწლოვნები","საიტი არ არის განკუთვნილი 18 წლამდე პირებისთვის და მათ მონაცემებს შეგნებულად არ ვაგროვებთ. თუ ფიქრობთ, რომ ბავშვმა მონაცემები გამოგვიგზავნა, მოგვწერეთ და წავშლით."],
["ცვლილებები","მოქმედი ვერსია ყოველთვის გამოქვეყნებულია ამ გვერდზე თარიღით. თუ ცვლილება თანხმობის მოთხოვნის დამუშავებას ეხება, მას გამოვიყენებთ მხოლოდ ახალი თანხმობის მიღების შემდეგ."],
["კონტაქტი","მონაცემთა დაცვის საკითხებზე მოგვწერეთ: useful.habit@outlook.com."]]},
terms:{t:"გამოყენების პირობები",s:[
["ზოგადი დებულებები","ეს პირობები არეგულირებს საიტის Useful Habit (შემდგომში „საიტი“) გამოყენებას. საიტის გამოყენებით თქვენ ეთანხმებით მათ; თუ არ ეთანხმებით, ნუ გამოიყენებთ. საიტი განკუთვნილია 18 წლის და უფროსი პირებისთვის."],
["რა არის საიტი","საიტი საინფორმაციო მიზნით აქვეყნებს მიმოხილვებს, სტატიებსა და რჩევებს კვების დანამატების შესახებ. Useful Habit არ არის დანამატების მწარმოებელი, გამყიდველი ან მიმწოდებელი, არც აფთიაქია და არც სამედიცინო დაწესებულება და ასეთ პროდუქტებს არ ყიდის, არ აწვდის და მათ საფასურს არ იღებს."],
["არ არის სამედიცინო რჩევა","კვების დანამატები არ არის წამალი. ჩვენი მასალები ზოგადი და საგანმანათლებლოა და არ წარმოადგენს სამედიცინო, ფარმაცევტულ, დიეტოლოგიურ ან სხვა პროფესიულ რჩევას. ჩვენ არცერთ დანამატს არ წარმოვადგენთ დაავადების პრევენციის, მკურნალობის ან განკურნების საშუალებად. როცა ჯანმრთელობასთან დაკავშირებულ განცხადებას ვახსენებთ, ის ან დაშვებული განცხადებაა, ან მწარმოებლის განცხადება, რასაც ცალსახად ვუთითებთ. დანამატების გამოყენებამდე, განსაკუთრებით ორსულობისას, ძუძუთი კვებისას, წამლის მიღებისას, ქრონიკული დაავადების ან ალერგიის დროს, გაიარეთ კონსულტაცია ექიმთან. ნუ გადადებთ ექიმთან მისვლას და ნუ შეწყვეტთ მკურნალობას საიტზე არსებული ინფორმაციის გამო."],
["გარანტიების არარსებობა","ორგანიზმის რეაქცია ინდივიდუალურია. ჩვენ არ გარანტირებთ განხილული პროდუქტების არანაირ შედეგს, ასევე მასალების სისრულეს, უშეცდომობას ან აქტუალობას, თუმცა ამისკენ ვისწრაფვით."],
["კომერციული ურთიერთობები","საიტი შეიძლება შეიცავდეს ბმულებს მესამე მხარის რესურსებზე და მათთან კომერციულ ურთიერთობებს. თუ შეგვიძლია ანაზღაურების მიღება (მაგ., საკომისიო გადაცემული შეკითხვის ან შეძენისთვის), ამას მასალაში მივუთითებთ ბმულზე გადასვლამდე. ანაზღაურება არ ცვლის ჩვენ მიერ წარმოდგენილ ფაქტებს, თუმცა გაითვალისწინეთ, რომ შესაძლოა გვქონდეს ფინანსური ინტერესი."],
["მესამე მხარის გამყიდველები და პროდუქტები","პროდუქტების ფასს, პირობებს, ხელმისაწვდომობას, შემადგენლობას, მარკირებას, მიწოდებას, დაბრუნებას და ხარისხს განსაზღვრავენ და უზრუნველყოფენ მათი გამყიდველები და მწარმოებლები. ყიდვა-გაყიდვის ხელშეკრულებას უშუალოდ მათთან დებთ და თქვენზე ვრცელდება მათი პირობები და კონფიდენციალურობის პოლიტიკა, მათ შორის მომხმარებლის კანონისმიერი უფლებები. შეამოწმეთ ისინი შეძენამდე. მესამე მხარის რესურსებს არ ვაკონტროლებთ და მათ შინაარსზე ან მოქმედებაზე პასუხს არ ვაგებთ."],
["გამოყენების წესები","თქვენ თანხმდებით, რომ არ:|გამოიყენებთ საიტს უკანონოდ ან მესამე პირთა უფლებების დარღვევით;|ჩაერევით საიტის მუშაობაში, არ გვერდს აუვლით მის დაცვას და ნებართვის გარეშე ავტომატური საშუალებებით არ შეაგროვებთ მონაცემებს;|გამოგზავნით ყალბ მონაცემებს ან სხვათა მონაცემებს მათი თანხმობის გარეშე;|გაავრცელებთ მავნე პროგრამულ უზრუნველყოფას."],
["ინტელექტუალური საკუთრება","ტექსტები, დიზაინი, Useful Habit-ის ლოგო და სხვა მასალები დაცულია საავტორო უფლებით. წერილობითი ნებართვის გარეშე კოპირება, გავრცელება და გადამუშავება აკრძალულია, გარდა კანონით დაშვებული ციტირებისა საიტზე მითითებით. პროდუქტების სახელები და სავაჭრო ნიშნები ეკუთვნის მათ მფლობელებს და გამოიყენება მხოლოდ იდენტიფიკაციისთვის."],
["პასუხისმგებლობა","მოქმედი კანონმდებლობით დაშვებულ ფარგლებში ჩვენ არ ვაგებთ პასუხს საიტზე არსებული ინფორმაციის გამოყენებით, მისი მიუწვდომლობით ან მესამე პირთა ქმედებით გამოწვეულ ზიანზე. ეს პირობები არ გამორიცხავს და არ ზღუდავს პასუხისმგებლობას, რომლის გამორიცხვა ან შეზღუდვა კანონით დაუშვებელია, მათ შორის მომხმარებელთა იმპერატიულ უფლებებს."],
["ცვლილებები","შეგვიძლია შევცვალოთ საიტი და ეს პირობები. ახალი ვერსია მოქმედებს ამ გვერდზე მითითებული თარიღით გამოქვეყნების მომენტიდან; გამოყენების გაგრძელება ნიშნავს თანხმობას."],
["მოქმედი სამართალი და დავები","ეს პირობები რეგულირდება უკრაინის კანონმდებლობით, თქვენი მუდმივი ბინადრობის ქვეყნის მომხმარებელთა დაცვის იმპერატიული ნორმების შეუფასებლად. ნებისმიერ საჩივარს ჯერ მოლაპარაკებით ვცდილობთ გადავწყვიტოთ."],
["კონტაქტი","ნებისმიერი კითხვისა და საჩივრის შემთხვევაში მოგვწერეთ: useful.habit@outlook.com."]]}};
T.hy.legal={privacy:{t:"Գաղտնիության քաղաքականություն",s:[
["Ովքեր ենք մենք","Այս Քաղաքականությունը բացատրում է, թե ինչպես է Useful Habit-ը (այսուհետ՝ «Կայք», «մենք») մշակում այցելուների անձնական տվյալները։ Մշակող՝ Useful Habit, կոնտակտ՝ useful.habit@outlook.com։ Կայքը կառավարվում է Ուկրաինայից։ Հայաստանի Հանրապետությունում գտնվող անձանց համար տվյալները մշակում ենք «Անձնական տվյալների պաշտպանության մասին» ՀՀ օրենքին համապատասխան։"],
["Ինչ տվյալներ ենք մշակում","Ձեր տրամադրած տվյալներ՝|անուն, հեռախոսահամար, էլ. փոստ և հաղորդագրության տեքստ, եթե գրում եք մեզ կամ ուղարկում եք հարցման ձև Կայքում,|Ավտոմատ հավաքվող տվյալներ՝|IP հասցե, սարքի և դիտարկչի տեսակ, լեզու, դիտված էջեր, այցի ժամանակ, անցման աղբյուր, UTM նշիչներ և գովազդային սեղմումների նույնացուցիչներ (օրինակ՝ gclid, fbclid),|քուքիներ և նման տեխնոլոգիաներ (կետ 6)։|Մենք չենք խնդրում հատուկ կատեգորիաների տվյալներ, այդ թվում՝ առողջության վերաբերյալ։ Խնդրում ենք դրանք չնշել ձևերում և հաղորդագրություններում։"],
["Նպատակներ և իրավական հիմքեր","Տվյալները մշակում ենք՝|պատասխանելու համար Ձեր հաղորդագրությանը կամ հարցմանը (Ձեր համաձայնությամբ կամ Ձեր խնդրանքով գործողություններ կատարելու համար),|Ձեր հարցումն արտադրանքի գործընկերոջը կամ վաճառողին փոխանցելու համար, երբ ուղարկում եք այդ ծանուցմամբ ձևը (համաձայնություն),|Կայքի անվտանգությունն ապահովելու և խարդախությունն ու ավտոմատ չարաշահումները կանխելու համար (իրավաչափ շահ՝ Ձեր իրավունքները հաշվի առնելով),|տրաֆիկը չափելու, Կայքը բարելավելու և գովազդը չափելու համար (համաձայնություն՝ քուքիների նշանակի միջոցով),|իրավական պարտականություններն իրականացնելու համար։"],
["Ստացողներ","Մենք չենք վաճառում Ձեր տվյալները։ Դրանք կարող են փոխանցվել՝|արտադրանքի գործընկերներին և վաճառողներին՝ միայն եթե Դուք ինքներդ եք նրանց հարցում ուղարկել ձևի միջոցով, նրանք գործում են իրենց քաղաքականության համաձայն,|ծառայություններ մատուցողներին (հոսթինգ, էլ. փոստ, սպամից պաշտպանություն, վերլուծության և գովազդի ծառայություններ, այդ թվում՝ Google և Meta), որոնք տվյալները մշակում են մեր անունից կամ իրենց պայմաններով՝ իրենց ծառայությունների շրջանակում,|պետական մարմիններին, երբ դա պահանջում է օրենքը։"],
["Միջազգային փոխանցում","Կայքը կառավարվում է Ուկրաինայից, իսկ որոշ մատակարարներ գտնվում են Հայաստանից դուրս (օրինակ՝ ԱՄՆ-ում)։ Տվյալների արտերկիր փոխանցման դեպքում պահպանում ենք օրենքով նախատեսված երաշխիքները և տվյալները մշակում ենք միայն վերոնշյալ նպատակների համար անհրաժեշտ չափով։"],
["Քուքիներ","Անհրաժեշտ քուքիները ապահովում են Կայքի աշխատանքը (օրինակ՝ լեզվի հիշումը) և համաձայնություն չեն պահանջում։ Վերլուծական և գովազդային քուքիները տեղադրվում են միայն Ձեր համաձայնությունից հետո, որը կարող եք ցանկացած պահի փոխել կամ հետ կանչել նույնքան հեշտությամբ, որքան տվել եք, ինչպես նաև դիտարկչի կարգավորումներում։ Google-ը և Meta-ն քուքիների տվյալները մշակում են իրենց քաղաքականության համաձայն։"],
["Պահպանման ժամկետներ","Տվյալները պահում ենք ոչ ավելի, քան անհրաժեշտ է՝|նամակագրություն՝ մինչև 3 տարի,|հարցման ձևերի տվյալներ՝ վերջին կապից հետո մինչև 12 ամիս, եթե օրենքը կամ իրավական պահանջը ավելի երկար չի պահանջում,|տեխնիկական մատյաններ՝ մինչև 12 ամիս,|քուքիներ՝ համաձայնության կարգավորումներում նշված ժամկետներով։|Դրանից հետո տվյալները ջնջվում կամ ապանձնավորվում են։"],
["Ձեր իրավունքները","Օրենքի համաձայն Դուք իրավունք ունեք՝|տեղեկանալու Ձեր տվյալների մշակման մասին և ծանոթանալու դրանց,|պահանջելու տվյալների ուղղում, թարմացում կամ լրացում,|պահանջելու մշակման դադարեցում, ջնջում կամ ոչնչացում,|պահանջելու մշակման արգելափակում,|ցանկացած պահի հետ կանչելու համաձայնությունը՝ առանց նախկին մշակման իրավաչափության վրա ազդելու,|բողոք ներկայացնելու անձնական տվյալների պաշտպանության լիազոր մարմնին կամ դատարան։|Իրավունքներն իրացնելու համար գրեք useful.habit@outlook.com հասցեով։ Մենք չենք կայացնում որոշումներ, որոնք հիմնված են բացառապես ավտոմատ մշակման վրա և առաջացնում են իրավական հետևանքներ Ձեզ համար։"],
["Անվտանգություն","Կիրառում ենք ողջամիտ կազմակերպչական և տեխնիկական միջոցներ՝ ներառյալ HTTPS-ը և հասանելիության սահմանափակումը։ Ինտերնետով ոչ մի փոխանցում լիովին անվտանգ չէ։"],
["Անչափահասներ","Կայքը նախատեսված չէ 18 տարեկանից ցածր անձանց համար, և մենք գիտակցաբար չենք հավաքում նրանց տվյալները։ Եթե կարծում եք, որ երեխան մեզ տվյալներ է ուղարկել, գրեք մեզ, և մենք դրանք կջնջենք։"],
["Փոփոխություններ","Գործող տարբերակը միշտ հրապարակվում է այս էջում ամսաթվով։ Եթե փոփոխությունը վերաբերում է համաձայնություն պահանջող մշակմանը, այն կկիրառենք միայն նոր համաձայնություն ստանալուց հետո։"],
["Կոնտակտ","Տվյալների պաշտպանության հարցերով գրեք useful.habit@outlook.com հասցեով։"]]},
terms:{t:"Օգտագործման պայմաններ",s:[
["Ընդհանուր դրույթներ","Այս Պայմանները կարգավորում են Useful Habit կայքի (այսուհետ՝ «Կայք») օգտագործումը։ Կայքն օգտագործելով՝ Դուք համաձայնում եք դրանց, եթե համաձայն չեք՝ մի օգտագործեք։ Կայքը նախատեսված է 18 տարեկան և ավելի բարձր անձանց համար։"],
["Ինչ է Կայքը","Կայքը տեղեկատվական նպատակով հրապարակում է ակնարկներ, հոդվածներ և խորհուրդներ սննդային հավելումների մասին։ Useful Habit-ը հավելումների արտադրող, վաճառող կամ մատակարար չէ, դեղատուն կամ բժշկական հաստատություն չէ և նման արտադրանք չի վաճառում, չի առաքում և դրանց համար վճարում չի ընդունում։"],
["Բժշկական խորհուրդ չէ","Սննդային հավելումները դեղ չեն։ Մեր նյութերը ընդհանուր և կրթական բնույթի են և բժշկական, դեղագործական, սննդաբանական կամ այլ մասնագիտական խորհուրդ չեն։ Մենք ոչ մի հավելում չենք ներկայացնում որպես հիվանդություն կանխարգելող, բուժող կամ բժշկող միջոց։ Երբ նշում ենք առողջությանը վերաբերող պնդում, այն կա՛մ թույլատրված պնդում է, կա՛մ արտադրողի պնդում, ինչը հստակ նշում ենք։ Հավելումներ օգտագործելուց առաջ, հատկապես հղիության կամ կրծքով կերակրման ժամանակ, դեղ ընդունելիս, քրոնիկ հիվանդության կամ ալերգիայի դեպքում, խորհրդակցեք բժշկի հետ։ Մի հետաձգեք բժշկի այցը և մի դադարեցրեք բուժումը Կայքի տեղեկատվության պատճառով։"],
["Երաշխիքների բացակայություն","Օրգանիզմի արձագանքը անհատական է։ Մենք չենք երաշխավորում քննարկվող արտադրանքի որևէ արդյունք, ինչպես նաև նյութերի ամբողջականությունը, անսխալությունը կամ արդիականությունը, թեև դրան ձգտում ենք։"],
["Առևտրային կապեր","Կայքը կարող է պարունակել հղումներ երրորդ կողմերի ռեսուրսներին և նրանց հետ առևտրային հարաբերություններ։ Եթե կարող ենք վարձատրություն ստանալ (օրինակ՝ միջնորդավճար փոխանցված հարցման կամ գնման համար), դա նշում ենք նյութում՝ հղումով անցնելուց առաջ։ Վարձատրությունը չի փոխում մեր ներկայացրած փաստերը, սակայն հաշվի առեք, որ մենք կարող ենք ֆինանսական շահ ունենալ։"],
["Երրորդ կողմերի վաճառողներ և արտադրանք","Արտադրանքի գինը, պայմանները, հասանելիությունը, բաղադրությունը, պիտակավորումը, առաքումը, վերադարձը և որակը սահմանում և ապահովում են դրանց վաճառողներն ու արտադրողները։ Առք ու վաճառքի պայմանագիրը կնքում եք անմիջապես նրանց հետ, և Ձեզ վրա տարածվում են նրանց պայմաններն ու գաղտնիության քաղաքականությունները, ներառյալ սպառողի օրենքով սահմանված իրավունքները։ Ստուգեք դրանք գնելուց առաջ։ Մենք չենք վերահսկում երրորդ կողմերի ռեսուրսները և պատասխանատու չենք դրանց բովանդակության կամ գործողությունների համար։"],
["Օգտագործման կանոններ","Դուք համաձայնում եք՝|չօգտագործել Կայքն անօրինական նպատակով կամ երրորդ անձանց իրավունքները խախտելով,|չխոչընդոտել Կայքի աշխատանքը, չշրջանցել դրա պաշտպանությունը և առանց թույլտվության ավտոմատ միջոցներով տվյալներ չհավաքել,|չուղարկել կեղծ տվյալներ կամ այլ անձանց տվյալներ առանց նրանց համաձայնության,|չտարածել վնասակար ծրագրեր։"],
["Մտավոր սեփականություն","Տեքստերը, դիզայնը, Useful Habit-ի լոգոն և այլ նյութերը պաշտպանված են հեղինակային իրավունքով։ Առանց գրավոր թույլտվության պատճենելը, տարածելը և վերամշակելը արգելվում է, բացառությամբ օրենքով թույլատրված չափով մեջբերումների՝ Կայքին հղումով։ Արտադրանքի անվանումներն ու ապրանքանշանները պատկանում են իրենց սեփականատերերին և օգտագործվում են միայն նույնականացման համար։"],
["Պատասխանատվություն","Կիրառելի օրենսդրությամբ թույլատրված չափով մենք պատասխանատու չենք Կայքի տեղեկատվության օգտագործումից, դրա անհասանելիությունից կամ երրորդ կողմերի գործողություններից առաջացած վնասի համար։ Այս Պայմանները չեն բացառում կամ սահմանափակում պատասխանատվությունը, որը օրենքով հնարավոր չէ բացառել կամ սահմանափակել, ներառյալ սպառողների պարտադիր իրավունքները։"],
["Փոփոխություններ","Մենք կարող ենք փոփոխել Կայքը և այս Պայմանները։ Նոր տարբերակը գործում է այս էջում նշված ամսաթվով հրապարակման պահից. շարունակական օգտագործումը նշանակում է համաձայնություն։"],
["Կիրառելի իրավունք և վեճեր","Այս Պայմանները կարգավորվում են Ուկրաինայի օրենսդրությամբ՝ առանց չեղարկելու Ձեր մշտական բնակության երկրի սպառողների պաշտպանության պարտադիր նորմերը։ Ցանկացած բողոք նախ փորձում ենք լուծել բանակցությունների միջոցով։"],
["Կոնտակտ","Ցանկացած հարցով և բողոքով գրեք useful.habit@outlook.com հասցեով։"]]}};
