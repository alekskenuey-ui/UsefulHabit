T.cs={title:"Useful Habit — Doplňky stravy a komplexy: recenze, složení a vlastnosti",desc:"Recenze doplňků stravy a komplexů: složení, účel složek, vlastnosti, upozornění a srovnání produktů různých výrobců.",
nav:["Domů","O nás","Recenze a články","Rady","Jak to funguje","Důležité informace"],
hk:"Informace • Recenze • Produkty",h1:"Doplňky stravy a komplexy: <em>recenze, složení a vlastnosti</em>",hp:"Objevte svět doplňků stravy a specializovaných produktů. Rozebíráme složení, vysvětlujeme účel jednotlivých složek, probíráme vlastnosti a upozornění a porovnáváme komplexy a produkty různých výrobců.<br><br>Srozumitelné informace, praktické recenze a srovnání, které pomáhají lépe se seznámit s nabídkou a vybrat si uvážlivě.",c1:"O nás",c2:"Jak to funguje",ch:["Doplňky nejsou léky","Obchodní vazby zveřejněny","Žádné záruky výsledku"],
ak:"O nás",at:"Kdo jsme a čím se zabýváme",al:"Useful Habit je web, který publikuje vlastní recenze a průvodce doplňky stravy. Říkáme jen to, co odpovídá pravdě, a nepřisuzujeme si kvalifikace ani postavení, které nemůžeme doložit.",
about:[["Poslání","Vysvětlovat doplňky srozumitelně a poctivě, abyste mohli porovnat možnosti a rozhodnout se sami."],["Co získáte","Recenze jednoduchým jazykem se složením, účelem, upozorněními a zdroji a jasné označení veškerého komerčního obsahu."],["Zásady","Jasnost místo hlasitých slov. Žádná tvrzení o léčbě ani zaručeném výsledku. Každý obchodní vztah je zveřejněn."],["Spolehlivost","Usilujeme o přesné a aktuální informace, opíráme se o oficiální a primární zdroje, materiály datujeme a zastaralé aktualizujeme nebo odstraňujeme."],["Obchodní model","Web může propagovat produkty třetích stran a my za to můžeme dostat odměnu. Vždy to uvádíme v materiálu a odměna nemění fakta, která předkládáme."],["Čím nejsme","Nejsme lékárna, klinika ani zdravotnické zařízení a neposkytujeme lékařské rady. Produkty dodávají jejich prodejci, kteří určují cenu, podmínky a dostupnost."]],
rk:"Recenze a články",rt:"Rozebíráme doplňky tak, jak bychom je vysvětlili kamarádovi",rl:"Co stojí na etiketě, co říkají zdroje a na co si dát pozor — to vše najdete v každé recenzi. Všechny materiály mají stejnou strukturu, takže se snadno porovnávají.",
inc:[["Co je ve složení","Co přesně je v dózičce a v jakém množství — tak, jak uvedl výrobce, bez ozdobných slov."],["K čemu slouží","K čemu doplněk výrobce určuje. Bez slibů, že něco vyléčí."],["Co říkají zdroje","Podíváme se na studie a oficiální data a dáme odkazy, abyste si to mohli ověřit sami."],["Kdo by měl být opatrný","Těhotné, lidé užívající léky nebo s chronickým onemocněním — nejdřív k lékaři. Říkáme to přímo."],["Cena a podmínky","Kolik to stojí a za jakých podmínek to prodejce nabízí, s datem ověření."],["Upřímně o výdělku","Pokud můžeme na produktu vydělat, přečtete si to na začátku recenze."]],
tk:"Rady",tt:"Jak rozumně vybírat doplňky",tl:"Jednoduché návyky, které pomáhají neulítnout na hlasitá slova. Jde o obecné vzdělávací rady, ne o osobní lékařská doporučení.",
tips:[["Čtěte etiketu","Nekoukejte jen na hlasitý slogan vpředu, ale na složení a množství v porci."],["Není to lék","Doplňky stravy neslouží k diagnostice, léčbě ani prevenci nemocí."],["Zeptejte se odborníka","Jste-li těhotná, užíváte léky nebo máte onemocnění, nejdřív se poraďte s lékařem nebo lékárníkem."],["Pozor na zázraky","„Zaručeně“, „okamžitě“, „vyléčí vše“ jsou varovné signály. Stejně jako recenze, které nelze ověřit."],["Ověřte prodejce","Jsou tam jasné kontakty, podmínky vrácení a celková cena před platbou?"],["Podívejte se na datum","Doporučení se mění. Důvěřujte materiálům s datem a uvedenými zdroji."]],
tn:"Zdejší informace nenahrazují konzultaci s kvalifikovaným zdravotnickým pracovníkem.",
wk:"Jak to funguje",wt:"Čtyři kroky, nic skrytého",steps:[["Přijdete a čtete","Otevřete recenzi nebo průvodce a hned vidíte, o jaký produkt jde a co je na etiketě."],["Porovnáte","Použijete kontrolní seznam: složení, upozornění, zdroje, podmínky prodejce."],["Ověříte sami","Podíváte se do zdrojů a na web prodejce. My dáváme odkazy, rozhodnutí je na vás."],["Všimnete si označení","Pokud materiál obsahuje partnerský odkaz nebo můžeme dostat odměnu, je to jasně uvedeno před kliknutím."]],
wn:"Dostupnost, cenu a podmínky určují prodejci. Useful Habit neprodává, nedodává ani nekontroluje produkty či služby třetích stran.",
ik:"Důležité informace",it:"Jasná fakta o tomto webu",il:"Čím tento web je, jak může vydělávat a kde končí naše odpovědnost.",
imp:[["Informační charakter","Recenze a průvodci mají obecný vzdělávací charakter a nejsou přizpůsobeny konkrétnímu člověku."],["Nejsou to léky ani lékařská rada","Doplňky stravy nejsou léky a nejsou určeny k diagnostice, léčbě ani prevenci jakýchkoli nemocí. Useful Habit není zdravotnické zařízení a materiály webu nejsou lékařskou radou."],["Bez záruky výsledku","Reakce organismu je individuální. Žádný výsledek nezaručujeme."],["Obchodní vztahy","Od třetích stran můžeme dostávat odměnu v souvislosti s probíranými produkty. Je to uvedeno přímo v materiálu."],["Prodejci a podmínky","Produkty dodávají jejich prodejci, kteří určují cenu, podmínky a dostupnost. Před nákupem je ověřte sami."],["Odpovědnost","V rozsahu povoleném platnými právními předpisy neodpovídáme za obsah, produkty či služby třetích stran. Nic zde neomezuje odpovědnost, kterou nelze zákonem omezit, včetně povinných práv spotřebitelů."],["Regionální dostupnost","Pravidla pro doplňky se v jednotlivých zemích liší; některé produkty či tvrzení nemusí být povoleny všude."],["Aktuálnost a změny","Informace mohou zastarat nebo se změnit bez upozornění."],["Údaje a podmínky","Jak nakládáme s údaji, popisují <a href=\"#privacy\">Zásady ochrany osobních údajů</a>, pravidla používání webu <a href=\"#terms\">Podmínky použití</a>."]],
in:"Tato stránka popisuje skutečnou činnost webu. Neslouží k vyhýbání se odpovědnosti ani reklamním pravidlům.",
fd:"Recenze a průvodci doplňky stravy jednoduchým jazykem.",fh1:"Navigace",fh2:"Právní informace",fh3:"Kontakt",fp:"Zásady ochrany osobních údajů",ft:"Podmínky použití",fr:"Všechna práva vyhrazena.",back:"← Zpět na úvod",upd:"Verze z 30. října 2026",lnote:"Právní dokumenty jsou zatím dostupné pouze v ukrajinštině."};
T.sk={title:"Useful Habit — Výživové doplnky a komplexy: recenzie, zloženie a vlastnosti",desc:"Recenzie výživových doplnkov a komplexov: zloženie, účel zložiek, vlastnosti, upozornenia a porovnanie produktov rôznych výrobcov.",
nav:["Domov","O nás","Recenzie a články","Rady","Ako to funguje","Dôležité informácie"],
hk:"Informácie • Recenzie • Produkty",h1:"Výživové doplnky a komplexy: <em>recenzie, zloženie a vlastnosti</em>",hp:"Objavte svet výživových doplnkov a špecializovaných produktov. Rozoberáme zloženie, vysvetľujeme účel jednotlivých zložiek, približujeme vlastnosti a upozornenia a porovnávame komplexy a produkty rôznych výrobcov.<br><br>Zrozumiteľné informácie, praktické recenzie a porovnania, ktoré pomáhajú lepšie spoznať ponuku a vybrať si uvážlivo.",c1:"O nás",c2:"Ako to funguje",ch:["Doplnky nie sú lieky","Obchodné väzby zverejnené","Žiadne záruky výsledku"],
ak:"O nás",at:"Kto sme a čím sa zaoberáme",al:"Useful Habit je web, ktorý uverejňuje vlastné recenzie a sprievodcov výživovými doplnkami. Hovoríme len to, čo zodpovedá pravde, a nepripisujeme si kvalifikácie ani postavenie, ktoré nevieme doložiť.",
about:[["Poslanie","Vysvetľovať doplnky zrozumiteľne a úprimne, aby ste mohli porovnať možnosti a rozhodnúť sa sami."],["Čo získate","Recenzie jednoduchým jazykom so zložením, účelom, upozorneniami a zdrojmi a jasné označenie akéhokoľvek komerčného obsahu."],["Zásady","Jasnosť namiesto hlasných slov. Žiadne tvrdenia o liečbe ani zaručenom výsledku. Každý obchodný vzťah je zverejnený."],["Spoľahlivosť","Usilujeme o presné a aktuálne informácie, opierame sa o oficiálne a primárne zdroje, materiály datujeme a zastarané aktualizujeme alebo odstraňujeme."],["Obchodný model","Web môže propagovať produkty tretích strán a my za to môžeme dostať odmenu. Vždy to uvádzame v materiáli a odmena nemení fakty, ktoré predkladáme."],["Čím nie sme","Nie sme lekáreň, klinika ani zdravotnícke zariadenie a neposkytujeme lekárske rady. Produkty dodávajú ich predajcovia, ktorí určujú cenu, podmienky a dostupnosť."]],
rk:"Recenzie a články",rt:"Rozoberáme doplnky tak, ako by sme ich vysvetlili kamarátovi",rl:"Čo je na etikete, čo hovoria zdroje a na čo si dať pozor — to všetko nájdete v každej recenzii. Všetky materiály majú rovnakú štruktúru, takže sa dajú ľahko porovnávať.",
inc:[["Čo je v zložení","Čo presne je v dózičke a v akom množstve — tak, ako uviedol výrobca, bez ozdobných slov."],["Na čo slúži","Na čo doplnok výrobca určuje. Bez sľubov, že niečo vylieči."],["Čo hovoria zdroje","Pozrieme sa na štúdie a oficiálne údaje a dáme odkazy, aby ste si to mohli overiť sami."],["Kto by mal byť opatrný","Tehotné, ľudia užívajúci lieky alebo s chronickým ochorením — najprv k lekárovi. Hovoríme to priamo."],["Cena a podmienky","Koľko to stojí a za akých podmienok to predajca ponúka, s dátumom overenia."],["Úprimne o zárobku","Ak môžeme na produkte zarobiť, prečítate si to na začiatku recenzie."]],
tk:"Rady",tt:"Ako rozumne vyberať doplnky",tl:"Jednoduché návyky, ktoré pomáhajú nenaletieť na hlasné slová. Ide o všeobecné vzdelávacie rady, nie o osobné lekárske odporúčania.",
tips:[["Čítajte etiketu","Nepozerajte len na hlasný slogan vpredu, ale na zloženie a množstvo v porcii."],["Nie je to liek","Doplnky nie sú určené na diagnostiku, liečbu ani prevenciu chorôb."],["Opýtajte sa odborníka","Ak ste tehotná, užívate lieky alebo máte ochorenie, najprv sa poraďte s lekárom alebo lekárnikom."],["Pozor na zázraky","„Zaručene“, „okamžite“, „vylieči všetko“ sú varovné signály. Rovnako ako recenzie, ktoré nemožno overiť."],["Overte predajcu","Sú tam jasné kontakty, podmienky vrátenia a celková cena pred platbou?"],["Pozrite sa na dátum","Odporúčania sa menia. Dôverujte materiálom s dátumom a uvedenými zdrojmi."]],
tn:"Tunajšie informácie nenahrádzajú konzultáciu s kvalifikovaným zdravotníckym pracovníkom.",
wk:"Ako to funguje",wt:"Štyri kroky, nič skryté",steps:[["Prídete a čítate","Otvoríte recenziu alebo sprievodcu a hneď vidíte, o aký produkt ide a čo je na etikete."],["Porovnáte","Použijete kontrolný zoznam: zloženie, upozornenia, zdroje, podmienky predajcu."],["Overíte sami","Pozriete sa do zdrojov a na web predajcu. My dávame odkazy, rozhodnutie je na vás."],["Všimnete si označenia","Ak materiál obsahuje partnerský odkaz alebo môžeme dostať odmenu, je to jasne uvedené pred kliknutím."]],
wn:"Dostupnosť, cenu a podmienky určujú predajcovia. Useful Habit nepredáva, nedodáva ani nekontroluje produkty či služby tretích strán.",
ik:"Dôležité informácie",it:"Jasné fakty o tomto webe",il:"Čím tento web je, ako môže zarábať a kde končí naša zodpovednosť.",
imp:[["Informačný charakter","Recenzie a sprievodcovia majú všeobecný vzdelávací charakter a nie sú prispôsobené konkrétnemu človeku."],["Nie sú to lieky ani lekárska rada","Doplnky nie sú lieky a nie sú určené na diagnostiku, liečbu ani prevenciu akýchkoľvek chorôb. Useful Habit nie je zdravotnícke zariadenie a materiály webu nie sú lekárskou radou."],["Bez záruky výsledku","Reakcia organizmu je individuálna. Žiadny výsledok nezaručujeme."],["Obchodné vzťahy","Od tretích strán môžeme dostávať odmenu v súvislosti s posudzovanými produktmi. Je to uvedené priamo v materiáli."],["Predajcovia a podmienky","Produkty dodávajú ich predajcovia, ktorí určujú cenu, podmienky a dostupnosť. Pred nákupom ich overte sami."],["Zodpovednosť","V rozsahu povolenom platnými právnymi predpismi nezodpovedáme za obsah, produkty ani služby tretích strán. Nič tu neobmedzuje zodpovednosť, ktorú zákon obmedziť nedovoľuje, vrátane povinných práv spotrebiteľov."],["Regionálna dostupnosť","Pravidlá pre doplnky sa v jednotlivých krajinách líšia; niektoré produkty či tvrdenia nemusia byť povolené všade."],["Aktuálnosť a zmeny","Informácie môžu zastarať alebo sa zmeniť bez upozornenia."],["Údaje a podmienky","Ako nakladáme s údajmi, opisujú <a href=\"#privacy\">Zásady ochrany osobných údajov</a>, pravidlá používania webu <a href=\"#terms\">Podmienky používania</a>."]],
in:"Táto stránka popisuje skutočnú činnosť webu. Neslúži na vyhnutie sa zodpovednosti ani reklamným pravidlám.",
fd:"Recenzie a sprievodcovia výživovými doplnkami jednoduchým jazykom.",fh1:"Navigácia",fh2:"Právne informácie",fh3:"Kontakt",fp:"Zásady ochrany osobných údajov",ft:"Podmienky používania",fr:"Všetky práva vyhradené.",back:"← Späť na úvod",upd:"Verzia z 30. októbra 2026",lnote:"Právne dokumenty sú zatiaľ dostupné iba v ukrajinčine."};
T.hu={title:"Useful Habit — Étrend-kiegészítők és komplexek: értékelések, összetétel és jellemzők",desc:"Étrend-kiegészítők és komplexek értékelései: összetétel, az összetevők szerepe, jellemzők, figyelmeztetések és különböző gyártók termékeinek összehasonlítása.",
nav:["Kezdőlap","Rólunk","Értékelések és cikkek","Tippek","Hogyan működik","Fontos információk"],
hk:"Információ • Értékelések • Termékek",h1:"Étrend-kiegészítők és komplexek: <em>értékelések, összetétel és jellemzők</em>",hp:"Fedezd fel az étrend-kiegészítők és a speciális termékek világát. Elemezzük az összetételt, elmagyarázzuk az egyes összetevők szerepét, bemutatjuk a jellemzőket és a figyelmeztetéseket, és összehasonlítjuk a különböző gyártók komplexeit és termékeit.<br><br>Érthető információk, gyakorlati értékelések és összehasonlítások, amelyek segítenek megismerni a kínálatot és megalapozott döntést hozni.",c1:"Rólunk",c2:"Hogyan működik",ch:["A kiegészítők nem gyógyszerek","Kereskedelmi kapcsolatok feltüntetve","Nincs eredménygarancia"],
ak:"Rólunk",at:"Kik vagyunk és mivel foglalkozunk",al:"A Useful Habit egy weboldal, amely saját értékeléseket és útmutatókat közöl az étrend-kiegészítőkről. Csak azt mondjuk el, ami megfelel a valóságnak, és nem tulajdonítunk magunknak olyan képesítést vagy státuszt, amelyet nem tudunk igazolni.",
about:[["Küldetés","Világosan és őszintén elmagyarázni a kiegészítőket, hogy összehasonlíthasd a lehetőségeket és magad dönthess."],["Mit kapsz","Közérthető értékeléseket összetétellel, rendeltetéssel, figyelmeztetésekkel és forrásokkal, valamint egyértelmű jelölést minden kereskedelmi tartalomnál."],["Alapelvek","Világosság a hangzatos szavak helyett. Semmilyen gyógyító vagy garantált eredményre vonatkozó állítás. Minden kereskedelmi kapcsolatot feltüntetünk."],["Megbízhatóság","Pontos és aktuális információra törekszünk, hivatalos és elsődleges forrásokra támaszkodunk, az anyagokat dátumozzuk, az elavultakat frissítjük vagy töröljük."],["Üzleti modell","Az oldal harmadik felek termékeit is népszerűsítheti, és ezért jutalékot kaphatunk. Ezt mindig jelezzük az anyagban, a jutalék pedig nem változtatja meg az általunk közölt tényeket."],["Mi nem vagyunk","Nem vagyunk gyógyszertár, klinika vagy egészségügyi intézmény, és nem adunk orvosi tanácsot. A termékeket az eladóik szállítják, ők határozzák meg az árat, a feltételeket és az elérhetőséget."]],
rk:"Értékelések és cikkek",rt:"Úgy elemezzük a kiegészítőket, ahogy egy barátnak magyaráznánk",rl:"Mi áll a címkén, mit mondanak a források és mire érdemes figyelni — minden értékelés ezt tartalmazza. Az anyagok azonos felépítésűek, így könnyű összehasonlítani őket.",
inc:[["Mi van benne","Pontosan mi van a dobozban és mekkora mennyiségben — úgy, ahogy a gyártó megadta, cifra szavak nélkül."],["Mire szolgál","Mire szánja a gyártó a kiegészítőt. Gyógyítási ígéretek nélkül."],["Mit mondanak a források","Kutatásokat és hivatalos adatokat nézünk, és hivatkozásokat adunk, hogy magad is ellenőrizhesd."],["Kinek kell óvatosnak lennie","Várandósoknak, gyógyszert szedőknek vagy krónikus betegségben élőknek először orvoshoz kell fordulniuk. Ezt nyíltan megírjuk."],["Ár és feltételek","Mennyibe kerül és milyen feltételekkel kínálja az eladó, az ellenőrzés dátumával."],["Őszintén a bevételről","Ha egy termék után bevételünk származhat, ezt az értékelés elején olvashatod."]],
tk:"Tippek",tt:"Hogyan válassz észszerűen kiegészítőt",tl:"Egyszerű szokások, amelyek segítenek nem bedőlni a hangzatos szavaknak. Általános oktatási tippek, nem személyes orvosi ajánlások.",
tips:[["Olvasd el a címkét","Ne csak az elöl lévő harsány szlogent nézd, hanem az összetételt és az adagonkénti mennyiséget."],["Nem gyógyszer","A kiegészítők nem betegségek diagnosztizálására, kezelésére vagy megelőzésére valók."],["Kérdezz szakembert","Ha várandós vagy, gyógyszert szedsz vagy betegséged van, előbb orvossal vagy gyógyszerésszel beszélj."],["Óvakodj a csodáktól","A „garantált”, „azonnali”, „mindent gyógyít” figyelmeztető jelek. Ahogy az ellenőrizhetetlen vélemények is."],["Ellenőrizd az eladót","Vannak-e világos elérhetőségek, visszaküldési feltételek és teljes ár a fizetés előtt?"],["Nézd a dátumot","Az ajánlások változnak. Bízz a dátummal és megnevezett forrásokkal ellátott anyagokban."]],
tn:"Az itteni információk nem helyettesítik a képzett egészségügyi szakemberrel való konzultációt.",
wk:"Hogyan működik",wt:"Négy lépés, semmi rejtett",steps:[["Belépsz és olvasol","Megnyitsz egy értékelést vagy útmutatót, és azonnal látod, milyen termékről van szó és mi áll a címkén."],["Összehasonlítasz","Az ellenőrzőlistát használod: összetétel, figyelmeztetések, források, az eladó feltételei."],["Magad ellenőrzöd","Megnézed a forrásokat és az eladó weboldalát. Mi hivatkozásokat adunk, a döntés a tiéd."],["Észreveszed a jelöléseket","Ha egy anyag partnerhivatkozást tartalmaz, vagy jutalékot kaphatunk, ezt a kattintás előtt egyértelműen jelezzük."]],
wn:"Az elérhetőséget, az árat és a feltételeket az eladók határozzák meg. A Useful Habit nem árul, nem szállít és nem ellenőriz harmadik felek termékeit vagy szolgáltatásait.",
ik:"Fontos információk",it:"Egyszerű tények erről az oldalról",il:"Mi ez az oldal, hogyan szerezhet bevételt, és hol ér véget a felelősségünk.",
imp:[["Tájékoztató jelleg","Az értékelések és útmutatók általános, oktatási jellegűek, és nem egy adott személyre szabottak."],["Nem gyógyszerek és nem orvosi tanács","A kiegészítők nem gyógyszerek, és nem szolgálnak betegségek diagnosztizálására, kezelésére, gyógyítására vagy megelőzésére. A Useful Habit nem egészségügyi intézmény, anyagai nem minősülnek orvosi tanácsnak."],["Nincs eredménygarancia","A szervezet reakciója egyéni. Semmilyen eredményt nem garantálunk."],["Kereskedelmi kapcsolatok","A tárgyalt termékekkel kapcsolatban harmadik felektől jutalékot kaphatunk. Ezt maga az anyag tünteti fel."],["Eladók és feltételek","A termékeket az eladók szállítják, ők határozzák meg az árat, a feltételeket és az elérhetőséget. Vásárlás előtt ellenőrizd őket magad."],["Felelősség","A vonatkozó jogszabályok által megengedett mértékben nem felelünk harmadik felek tartalmáért, termékeiért vagy szolgáltatásaiért. Semmi sem korlátozza azt a felelősséget, amelyet jogszabály nem enged korlátozni, ideértve a fogyasztók kötelező jogait."],["Regionális elérhetőség","A kiegészítőkre vonatkozó szabályok országonként eltérnek; egyes termékek vagy állítások nem engedélyezettek mindenhol."],["Aktualitás és változások","Az információk elavulhatnak vagy előzetes értesítés nélkül változhatnak."],["Adatok és feltételek","Az adatkezelést az <a href=\"#privacy\">Adatvédelmi irányelvek</a>, az oldal használatának szabályait a <a href=\"#terms\">Felhasználási feltételek</a> ismertetik."]],
in:"Ez az oldal az oldal tényleges tevékenységét írja le. Nem szolgál a felelősség vagy a hirdetési szabályok kijátszására.",
fd:"Étrend-kiegészítőkről szóló értékelések és útmutatók közérthetően.",fh1:"Navigáció",fh2:"Jogi információk",fh3:"Kapcsolat",fp:"Adatvédelmi irányelvek",ft:"Felhasználási feltételek",fr:"Minden jog fenntartva.",back:"← Vissza a kezdőlapra",upd:"2026. október 30-i verzió",lnote:"A jogi dokumentumok jelenleg csak ukrán nyelven érhetők el."};
T.hr={title:"Useful Habit — Dodaci prehrani i kompleksi: recenzije, sastav i značajke",desc:"Recenzije dodataka prehrani i kompleksa: sastav, svrha sastojaka, značajke, upozorenja i usporedba proizvoda različitih proizvođača.",
nav:["Početna","O nama","Recenzije i članci","Savjeti","Kako to funkcionira","Važne informacije"],
hk:"Informacije • Recenzije • Proizvodi",h1:"Dodaci prehrani i kompleksi: <em>recenzije, sastav i značajke</em>",hp:"Istražite svijet dodataka prehrani i specijaliziranih proizvoda. Razlažemo sastav, objašnjavamo svrhu pojedinih sastojaka, osvrćemo se na značajke i upozorenja te uspoređujemo komplekse i proizvode različitih proizvođača.<br><br>Razumljive informacije, praktične recenzije i usporedbe koje pomažu da bolje upoznate ponudu i odaberete promišljeno.",c1:"O nama",c2:"Kako to funkcionira",ch:["Dodaci nisu lijekovi","Komercijalne veze objavljene","Nema jamstva rezultata"],
ak:"O nama",at:"Tko smo i čime se bavimo",al:"Useful Habit je web-stranica koja objavljuje vlastite recenzije i vodiče o dodacima prehrani. Govorimo samo ono što odgovara istini i ne pripisujemo si kvalifikacije ni status koje ne možemo potvrditi.",
about:[["Misija","Objasniti dodatke jasno i iskreno kako biste mogli usporediti mogućnosti i sami odlučiti."],["Što dobivate","Recenzije jednostavnim jezikom sa sastavom, svrhom, upozorenjima i izvorima te jasne oznake na svakom komercijalnom sadržaju."],["Načela","Jasnoća umjesto glasnih riječi. Nikakve tvrdnje o liječenju ni zajamčenom rezultatu. Svaki komercijalni odnos je objavljen."],["Točnost","Težimo točnim i aktualnim informacijama, oslanjamo se na službene i primarne izvore, datiramo materijale te ažuriramo ili uklanjamo zastarjele."],["Poslovni model","Stranica može promovirati proizvode trećih strana, a mi za to možemo primiti naknadu. To uvijek navodimo u materijalu, a naknada ne mijenja činjenice koje iznosimo."],["Što nismo","Nismo ljekarna, klinika ni zdravstvena ustanova i ne dajemo medicinske savjete. Proizvode isporučuju njihovi prodavatelji, koji određuju cijenu, uvjete i dostupnost."]],
rk:"Recenzije i članci",rt:"Razlažemo dodatke onako kako bismo ih objasnili prijatelju",rl:"Što piše na etiketi, što kažu izvori i na što vrijedi obratiti pozornost — sve je to u svakoj recenziji. Svi materijali imaju istu strukturu pa ih je lako usporediti.",
inc:[["Što je u sastavu","Što točno ima u posudici i u kojoj količini — kako je naveo proizvođač, bez lijepih riječi."],["Čemu služi","Za što proizvođač predstavlja dodatak. Bez obećanja da će nešto izliječiti."],["Što kažu izvori","Pogledamo studije i službene podatke i dajemo poveznice da možete provjeriti sami."],["Tko treba biti oprezan","Trudnice, osobe koje uzimaju lijekove ili imaju kronične bolesti — prvo liječniku. To kažemo izravno."],["Cijena i uvjeti","Koliko košta i pod kojim uvjetima ga nudi prodavatelj, s datumom provjere."],["Iskreno o zaradi","Ako možemo zaraditi na proizvodu, pročitat ćete to na početku recenzije."]],
tk:"Savjeti",tt:"Kako razumno birati dodatke",tl:"Jednostavne navike koje pomažu da ne nasjednete na glasne riječi. Riječ je o općim edukativnim savjetima, a ne osobnim medicinskim preporukama.",
tips:[["Čitajte etiketu","Ne gledajte samo glasan slogan na prednjoj strani, nego sastav i količinu po obroku."],["Nije lijek","Dodaci nisu namijenjeni dijagnosticiranju, liječenju ni sprječavanju bolesti."],["Pitajte stručnjaka","Ako ste trudni, uzimate lijekove ili imate bolest, prvo se posavjetujte s liječnikom ili ljekarnikom."],["Čuvajte se čuda","„Zajamčeno“, „odmah“, „liječi sve“ su znakovi upozorenja. Kao i recenzije koje se ne mogu provjeriti."],["Provjerite prodavatelja","Ima li jasnih kontakata, uvjeta povrata i ukupne cijene prije plaćanja?"],["Pogledajte datum","Preporuke se mijenjaju. Vjerujte materijalima s datumom i navedenim izvorima."]],
tn:"Informacije ovdje ne zamjenjuju savjetovanje s kvalificiranim zdravstvenim stručnjakom.",
wk:"Kako to funkcionira",wt:"Četiri koraka, ništa skriveno",steps:[["Dođete i čitate","Otvorite recenziju ili vodič i odmah vidite o kojem je proizvodu riječ i što piše na etiketi."],["Usporedite","Koristite kontrolni popis: sastav, upozorenja, izvori, uvjeti prodavatelja."],["Provjerite sami","Pogledate izvore i web-stranicu prodavatelja. Mi dajemo poveznice, odluka je vaša."],["Primijetite oznake","Ako materijal sadrži partnersku poveznicu ili možemo primiti naknadu, to je jasno navedeno prije klika."]],
wn:"Dostupnost, cijenu i uvjete određuju prodavatelji. Useful Habit ne prodaje, ne isporučuje niti kontrolira proizvode ili usluge trećih strana.",
ik:"Važne informacije",it:"Jednostavne činjenice o ovoj stranici",il:"Što je ova stranica, kako može zarađivati i gdje završava naša odgovornost.",
imp:[["Informativni karakter","Recenzije i vodiči imaju opći edukativni karakter i nisu prilagođeni pojedincu."],["Nisu lijekovi ni medicinski savjet","Dodaci nisu lijekovi i nisu namijenjeni dijagnosticiranju, liječenju ni sprječavanju bilo koje bolesti. Useful Habit nije zdravstvena ustanova, a materijali stranice nisu medicinski savjet."],["Nema jamstva rezultata","Reakcija organizma je individualna. Ne jamčimo nikakav rezultat."],["Komercijalni odnosi","Od trećih strana možemo primati naknadu u vezi s proizvodima koje obrađujemo. To je navedeno u samom materijalu."],["Prodavatelji i uvjeti","Proizvode isporučuju njihovi prodavatelji, koji određuju cijenu, uvjete i dostupnost. Provjerite ih sami prije kupnje."],["Odgovornost","U mjeri dopuštenoj mjerodavnim pravom ne odgovaramo za sadržaj, proizvode ni usluge trećih strana. Ništa ovdje ne ograničava odgovornost koja se zakonom ne može ograničiti, uključujući obvezna prava potrošača."],["Regionalna dostupnost","Pravila o dodacima razlikuju se među zemljama; neki proizvodi ili tvrdnje možda nisu dopušteni svugdje."],["Aktualnost i izmjene","Informacije mogu zastarjeti ili se promijeniti bez najave."],["Podaci i uvjeti","Kako postupamo s podacima opisano je u <a href=\"#privacy\">Politici privatnosti</a>, a pravila korištenja stranice u <a href=\"#terms\">Uvjetima korištenja</a>."]],
in:"Ova stranica opisuje stvarnu djelatnost stranice. Ne služi za izbjegavanje odgovornosti ni pravila oglašavanja.",
fd:"Recenzije i vodiči o dodacima prehrani jednostavnim jezikom.",fh1:"Navigacija",fh2:"Pravne informacije",fh3:"Kontakt",fp:"Politika privatnosti",ft:"Uvjeti korištenja",fr:"Sva prava pridržana.",back:"← Natrag na početnu",upd:"Verzija od 30. listopada 2026.",lnote:"Pravni dokumenti za sada su dostupni samo na ukrajinskom jeziku."};
T.sl={title:"Useful Habit — Prehranska dopolnila in kompleksi: ocene, sestava in lastnosti",desc:"Ocene prehranskih dopolnil in kompleksov: sestava, namen sestavin, lastnosti, opozorila in primerjava izdelkov različnih proizvajalcev.",
nav:["Domov","O nas","Ocene in članki","Nasveti","Kako deluje","Pomembne informacije"],
hk:"Informacije • Ocene • Izdelki",h1:"Prehranska dopolnila in kompleksi: <em>ocene, sestava in lastnosti</em>",hp:"Odkrijte svet prehranskih dopolnil in specializiranih izdelkov. Razčlenjujemo sestavo, pojasnjujemo namen posameznih sestavin, pregledamo lastnosti in opozorila ter primerjamo komplekse in izdelke različnih proizvajalcev.<br><br>Razumljive informacije, praktične ocene in primerjave, ki pomagajo bolje spoznati ponudbo in se premišljeno odločiti.",c1:"O nas",c2:"Kako deluje",ch:["Dopolnila niso zdravila","Komercialne povezave razkrite","Brez zagotovila rezultatov"],
ak:"O nas",at:"Kdo smo in s čim se ukvarjamo",al:"Useful Habit je spletno mesto, ki objavlja lastne ocene in vodnike o prehranskih dopolnilih. Povemo le tisto, kar je res, in si ne pripisujemo kvalifikacij ali statusa, ki jih ne moremo dokazati.",
about:[["Poslanstvo","Dopolnila razložiti jasno in iskreno, da lahko primerjate možnosti in se odločite sami."],["Kaj dobite","Ocene v preprostem jeziku s sestavo, namenom, opozorili in viri ter jasne oznake pri vsaki komercialni vsebini."],["Načela","Jasnost namesto glasnih besed. Nobenih trditev o zdravljenju ali zagotovljenem rezultatu. Vsako komercialno razmerje je razkrito."],["Zanesljivost","Prizadevamo si za točne in aktualne informacije, opiramo se na uradne in primarne vire, gradiva datiramo ter zastarela posodobimo ali odstranimo."],["Poslovni model","Spletno mesto lahko promovira izdelke tretjih oseb, mi pa lahko za to prejmemo nadomestilo. To vedno navedemo v gradivu, nadomestilo pa ne spremeni dejstev, ki jih predstavljamo."],["Kaj nismo","Nismo lekarna, klinika ali zdravstvena ustanova in ne dajemo zdravniških nasvetov. Izdelke dobavljajo njihovi prodajalci, ki določajo ceno, pogoje in razpoložljivost."]],
rk:"Ocene in članki",rt:"Dopolnila razčlenimo tako, kot bi jih razložili prijatelju",rl:"Kaj piše na etiketi, kaj pravijo viri in na kaj velja biti pozoren — vse to je v vsaki oceni. Vsa gradiva imajo enako zgradbo, zato jih je lahko primerjati.",
inc:[["Kaj je v sestavi","Kaj točno je v lončku in v kakšni količini — kot je navedel proizvajalec, brez lepih besed."],["Čemu je namenjeno","Za kaj proizvajalec dopolnilo predstavlja. Brez obljub, da bo kaj ozdravilo."],["Kaj pravijo viri","Pogledamo raziskave in uradne podatke ter dodamo povezave, da lahko preverite sami."],["Kdo naj bo previden","Nosečnice, osebe, ki jemljejo zdravila ali imajo kronične bolezni — najprej k zdravniku. To povemo naravnost."],["Cena in pogoji","Koliko stane in pod kakšnimi pogoji ga ponuja prodajalec, z datumom preverjanja."],["Pošteno o zaslužku","Če lahko pri izdelku kaj zaslužimo, boste to prebrali na začetku ocene."]],
tk:"Nasveti",tt:"Kako pametno izbirati dopolnila",tl:"Preproste navade, ki pomagajo, da ne nasedete glasnim besedam. Gre za splošne izobraževalne nasvete, ne za osebna zdravstvena priporočila.",
tips:[["Preberite etiketo","Ne glejte le glasnega slogana spredaj, temveč sestavo in količino na obrok."],["To ni zdravilo","Dopolnila niso namenjena diagnosticiranju, zdravljenju ali preprečevanju bolezni."],["Vprašajte strokovnjaka","Če ste noseči, jemljete zdravila ali imate bolezen, se najprej posvetujte z zdravnikom ali farmacevtom."],["Pazite se čudežev","»Zagotovljeno«, »takoj«, »zdravi vse« so opozorilni znaki. Tako kot ocene, ki jih ni mogoče preveriti."],["Preverite prodajalca","So na voljo jasni kontakti, pogoji vračila in skupna cena pred plačilom?"],["Poglejte datum","Priporočila se spreminjajo. Zaupajte gradivom z datumom in navedenimi viri."]],
tn:"Tukajšnje informacije ne nadomeščajo posveta z usposobljenim zdravstvenim delavcem.",
wk:"Kako deluje",wt:"Štirje koraki, nič skritega",steps:[["Pridete in berete","Odprete oceno ali vodnik in takoj vidite, za kakšen izdelek gre in kaj piše na etiketi."],["Primerjate","Uporabite kontrolni seznam: sestava, opozorila, viri, pogoji prodajalca."],["Preverite sami","Pogledate vire in spletno mesto prodajalca. Mi dajemo povezave, odločitev je vaša."],["Opazite oznake","Če gradivo vsebuje partnersko povezavo ali lahko prejmemo nadomestilo, je to jasno navedeno pred klikom."]],
wn:"Razpoložljivost, ceno in pogoje določajo prodajalci. Useful Habit ne prodaja, ne dostavlja in ne nadzira izdelkov ali storitev tretjih oseb.",
ik:"Pomembne informacije",it:"Preprosta dejstva o tem spletnem mestu",il:"Kaj je to spletno mesto, kako lahko zasluži in kje se konča naša odgovornost.",
imp:[["Informativni značaj","Ocene in vodniki so splošni in izobraževalni ter niso prilagojeni posamezniku."],["Niso zdravila in niso zdravniški nasvet","Dopolnila niso zdravila in niso namenjena diagnosticiranju, zdravljenju ali preprečevanju bolezni. Useful Habit ni zdravstvena ustanova, gradiva spletnega mesta pa niso zdravniški nasvet."],["Brez zagotovila rezultatov","Odziv telesa je individualen. Nobenega rezultata ne zagotavljamo."],["Komercialna razmerja","Od tretjih oseb lahko prejmemo nadomestilo v zvezi z obravnavanimi izdelki. To je razkrito v samem gradivu."],["Prodajalci in pogoji","Izdelke dobavljajo njihovi prodajalci, ki določajo ceno, pogoje in razpoložljivost. Pred nakupom jih preverite sami."],["Odgovornost","V obsegu, ki ga dovoljuje veljavna zakonodaja, ne odgovarjamo za vsebino, izdelke ali storitve tretjih oseb. Nič tukaj ne omejuje odgovornosti, ki je po zakonu ni mogoče omejiti, vključno z obveznimi pravicami potrošnikov."],["Regionalna razpoložljivost","Pravila za dopolnila se po državah razlikujejo; nekateri izdelki ali trditve morda niso povsod dovoljeni."],["Aktualnost in spremembe","Informacije lahko zastarajo ali se spremenijo brez obvestila."],["Podatki in pogoji","Kako ravnamo s podatki, opisuje <a href=\"#privacy\">Politika zasebnosti</a>, pravila uporabe spletnega mesta pa <a href=\"#terms\">Pogoji uporabe</a>."]],
in:"Ta stran opisuje dejansko dejavnost spletnega mesta. Ne služi izogibanju odgovornosti ali oglaševalskim pravilom.",
fd:"Ocene in vodniki o prehranskih dopolnilih v preprostem jeziku.",fh1:"Navigacija",fh2:"Pravne informacije",fh3:"Kontakt",fp:"Politika zasebnosti",ft:"Pogoji uporabe",fr:"Vse pravice pridržane.",back:"← Nazaj na začetek",upd:"Različica z dne 30. oktobra 2026",lnote:"Pravni dokumenti so zaenkrat na voljo samo v ukrajinščini."};

T.et={title:"Useful Habit — Toidulisandid ja kompleksid: ülevaated, koostis ja omadused",desc:"Toidulisandite ja komplekside ülevaated: koostis, koostisosade otstarve, omadused, hoiatused ja eri tootjate toodete võrdlus.",
nav:["Avaleht","Meist","Ülevaated ja artiklid","Nõuanded","Kuidas see toimib","Oluline teave"],
hk:"Teave • Ülevaated • Tooted",h1:"Toidulisandid ja kompleksid: <em>ülevaated, koostis ja omadused</em>",hp:"Avasta toidulisandite ja spetsiaalsete toodete maailm. Analüüsime koostist, selgitame iga koostisosa otstarvet, käsitleme omadusi ja hoiatusi ning võrdleme eri tootjate komplekse ja tooteid.<br><br>Arusaadav teave, praktilised ülevaated ja võrdlused, mis aitavad pakkumisega paremini tutvuda ja teha teadlik valik.",c1:"Meist",c2:"Kuidas see toimib",ch:["Lisandid ei ole ravimid","Ärisidemed on avalikustatud","Tulemust ei garanteerita"],
ak:"Meist",at:"Kes me oleme ja mida teeme",al:"Useful Habit on veebileht, mis avaldab oma ülevaateid ja juhendeid toidulisandite kohta. Räägime ainult seda, mis vastab tõele, ega omista endale kvalifikatsiooni ega staatust, mida me tõendada ei suuda.",
about:[["Missioon","Selgitada lisandeid selgelt ja ausalt, et saaksid variante võrrelda ja ise otsustada."],["Mida sa saad","Lihtsas keeles ülevaated koos koostise, otstarbe, hoiatuste ja allikatega ning selged märgised igal kommertssisul."],["Põhimõtted","Selgus valjude sõnade asemel. Mingeid väiteid ravi ega garanteeritud tulemuse kohta. Iga ärisuhe avalikustatakse."],["Usaldusväärsus","Püüame anda täpset ja ajakohast teavet, toetume ametlikele ja esmastele allikatele, dateerime materjalid ning uuendame või eemaldame aegunud."],["Ärimudel","Leht võib reklaamida kolmandate osapoolte tooteid ja me võime selle eest tasu saada. Märgime seda alati materjalis ning tasu ei muuda meie esitatud fakte."],["Mida me ei ole","Me ei ole apteek, kliinik ega meditsiiniasutus ega anna meditsiinilist nõu. Tooteid tarnivad nende müüjad, kes määravad hinna, tingimused ja kättesaadavuse."]],
rk:"Ülevaated ja artiklid",rt:"Analüüsime lisandeid nii, nagu selgitaksime neid sõbrale",rl:"Mis on etiketil, mida allikad ütlevad ja mis väärib tähelepanu — iga ülevaade katab selle. Kõik materjalid on sama ülesehitusega, nii et võrdlemine on lihtne.",
inc:[["Mis on koostises","Mis täpselt purgis on ja mis koguses — nii, nagu tootja on märkinud, ilusate sõnadeta."],["Milleks see mõeldud on","Milleks tootja lisandit positsioneerib. Ilma lubaduseta midagi ravida."],["Mida allikad ütlevad","Vaatame uuringuid ja ametlikke andmeid ning anname lingid, et saaksid ise kontrollida."],["Kes peaks olema ettevaatlik","Rasedad, ravimeid tarvitavad või krooniliste haigustega inimesed — kõigepealt arsti juurde. Ütleme seda otse."],["Hind ja tingimused","Kui palju see maksab ja millistel tingimustel müüja seda pakub, koos kontrollimise kuupäevaga."],["Ausalt teenistusest","Kui me võime tootelt teenida, loed sellest ülevaate alguses."]],
tk:"Nõuanded",tt:"Kuidas lisandeid mõistlikult valida",tl:"Lihtsad harjumused, mis aitavad mitte langeda valjude sõnade lõksu. Need on üldised harivad nõuanded, mitte isiklikud meditsiinilised soovitused.",
tips:[["Loe etiketti","Ära vaata ainult ees olevat valju loosungit, vaid koostist ja kogust portsjonis."],["See ei ole ravim","Lisandid ei ole mõeldud haiguste diagnoosimiseks, raviks ega ennetamiseks."],["Küsi spetsialistilt","Kui oled rase, tarvitad ravimeid või sul on haigus, räägi kõigepealt arsti või apteekriga."],["Ettevaatust imedega","„Garanteeritud“, „kohe“, „ravib kõike“ on hoiatusmärgid. Nagu ka kontrollimatud arvustused."],["Kontrolli müüjat","Kas on selged kontaktid, tagastustingimused ja kogu hind enne maksmist?"],["Vaata kuupäeva","Soovitused muutuvad. Usalda kuupäeva ja nimetatud allikatega materjale."]],
tn:"Siinne teave ei asenda konsultatsiooni kvalifitseeritud tervishoiutöötajaga.",
wk:"Kuidas see toimib",wt:"Neli sammu, mitte midagi peidus",steps:[["Tuled ja loed","Avad ülevaate või juhendi ning näed kohe, mis toode see on ja mis on etiketil."],["Võrdled","Kasutad kontrollnimekirja: koostis, hoiatused, allikad, müüja tingimused."],["Kontrollid ise","Vaatad allikaid ja müüja veebilehte. Meie anname lingid, otsus on sinu."],["Märkad märgiseid","Kui materjalis on partnerilink või võime tasu saada, on see enne klikkimist selgelt kirjas."]],
wn:"Kättesaadavuse, hinna ja tingimused määravad müüjad. Useful Habit ei müü, ei tarni ega kontrolli kolmandate osapoolte tooteid ega teenuseid.",
ik:"Oluline teave",it:"Lihtsad faktid selle lehe kohta",il:"Mis see leht on, kuidas ta võib teenida ja kus lõpeb meie vastutus.",
imp:[["Teavitav iseloom","Ülevaated ja juhendid on üldised ja harivad ega ole kohandatud konkreetsele inimesele."],["Mitte ravimid ega meditsiiniline nõu","Lisandid ei ole ravimid ega ole mõeldud mis tahes haiguse diagnoosimiseks, raviks ega ennetamiseks. Useful Habit ei ole meditsiiniasutus ja lehe materjalid ei ole meditsiiniline nõu."],["Tulemuse garantiid ei ole","Organismi reaktsioon on individuaalne. Me ei garanteeri ühtegi tulemust."],["Ärisuhted","Võime saada kolmandatelt osapoolelt tasu käsitletavate toodete seoses. See on avalikustatud materjalis endas."],["Müüjad ja tingimused","Tooteid tarnivad nende müüjad, kes määravad hinna, tingimused ja kättesaadavuse. Kontrolli neid ise enne ostu."],["Vastutus","Kohaldatava õigusega lubatud ulatuses me ei vastuta kolmandate osapoolte sisu, toodete ega teenuste eest. Miski siin ei piira vastutust, mida seadusega piirata ei saa, sealhulgas tarbija kohustuslikke õigusi."],["Piirkondlik kättesaadavus","Lisandite reeglid erinevad riigiti; mõni toode või väide ei pruugi kõikjal lubatud olla."],["Ajakohasus ja muudatused","Teave võib aeguda või muutuda etteteatamata."],["Andmed ja tingimused","Kuidas andmetega ümber käime, on kirjeldatud <a href=\"#privacy\">Privaatsuspoliitikas</a> ja lehe kasutamise reeglid <a href=\"#terms\">Kasutustingimustes</a>."]],
in:"See leht kirjeldab lehe tegelikku tegevust. See ei ole viis vastutusest ega reklaamireeglitest kõrvale hiilida.",
fd:"Toidulisandite ülevaated ja juhendid lihtsas keeles.",fh1:"Navigeerimine",fh2:"Õiguslik teave",fh3:"Kontakt",fp:"Privaatsuspoliitika",ft:"Kasutustingimused",fr:"Kõik õigused kaitstud.",back:"← Tagasi avalehele",upd:"Redaktsioon 30. oktoobrist 2026",lnote:"Õigusdokumendid on praegu saadaval ainult ukraina keeles."};
T.lt={title:"Useful Habit — Maisto papildai ir kompleksai: apžvalgos, sudėtis ir ypatybės",desc:"Maisto papildų ir kompleksų apžvalgos: sudėtis, sudedamųjų dalių paskirtis, savybės, įspėjimai ir skirtingų gamintojų produktų palyginimas.",
nav:["Pradžia","Apie mus","Apžvalgos ir straipsniai","Patarimai","Kaip tai veikia","Svarbi informacija"],
hk:"Informacija • Apžvalgos • Produktai",h1:"Maisto papildai ir kompleksai: <em>apžvalgos, sudėtis ir ypatybės</em>",hp:"Atraskite maisto papildų ir specializuotų produktų pasaulį. Analizuojame sudėtį, aiškiname kiekvienos sudedamosios dalies paskirtį, aptariame savybes bei įspėjimus ir lyginame skirtingų gamintojų kompleksus bei produktus.<br><br>Aiški informacija, praktiškos apžvalgos ir palyginimai padeda geriau susipažinti su pasiūla ir pasirinkti sąmoningai.",c1:"Apie mus",c2:"Kaip tai veikia",ch:["Papildai nėra vaistai","Komerciniai ryšiai atskleisti","Jokių rezultato garantijų"],
ak:"Apie mus",at:"Kas esame ir ką darome",al:"Useful Habit yra svetainė, kurioje skelbiamos mūsų pačių apžvalgos ir gidai apie maisto papildus. Pasakojame tik tai, kas atitinka tiesą, ir nepriskiriame sau kvalifikacijų ar statuso, kurių negalime patvirtinti.",
about:[["Misija","Paaiškinti papildus aiškiai ir sąžiningai, kad galėtumėte palyginti variantus ir apsispręsti patys."],["Ką gaunate","Apžvalgos paprasta kalba su sudėtimi, paskirtimi, įspėjimais ir šaltiniais bei aiškūs ženklinimai ant bet kokio komercinio turinio."],["Principai","Aiškumas vietoj garsių žodžių. Jokių teiginių apie gydymą ar garantuotą rezultatą. Kiekvienas komercinis ryšys atskleidžiamas."],["Patikimumas","Siekiame tikslios ir aktualios informacijos, remiamės oficialiais ir pirminiais šaltiniais, datuojame medžiagą ir atnaujiname ar pašaliname pasenusią."],["Verslo modelis","Svetainė gali reklamuoti trečiųjų šalių produktus, o mes už tai galime gauti atlygį. Apie tai visada nurodome medžiagoje, o atlygis nekeičia pateikiamų faktų."],["Kuo nesame","Nesame vaistinė, klinika ar medicinos įstaiga ir neteikiame medicininių patarimų. Produktus tiekia jų pardavėjai, kurie nustato kainą, sąlygas ir prieinamumą."]],
rk:"Apžvalgos ir straipsniai",rt:"Nagrinėjame papildus taip, kaip paaiškintume draugui",rl:"Kas parašyta etiketėje, ką sako šaltiniai ir į ką verta atkreipti dėmesį — visa tai yra kiekvienoje apžvalgoje. Visa medžiaga sudaryta vienodai, todėl ją lengva palyginti.",
inc:[["Kas sudėtyje","Kas tiksliai yra indelyje ir kokiu kiekiu — kaip nurodė gamintojas, be gražių žodžių."],["Kam skirtas","Kam gamintojas pozicionuoja papildą. Be pažadų ką nors išgydyti."],["Ką sako šaltiniai","Žiūrime tyrimus ir oficialius duomenis bei pateikiame nuorodas, kad galėtumėte patikrinti patys."],["Kam būti atsargiems","Nėščiosioms, vartojantiems vaistus ar sergantiems lėtinėmis ligomis — pirmiausia pas gydytoją. Sakome tai tiesiai."],["Kaina ir sąlygos","Kiek kainuoja ir kokiomis sąlygomis siūlo pardavėjas, su patikrinimo data."],["Sąžiningai apie uždarbį","Jei iš produkto galime uždirbti, apie tai perskaitysite apžvalgos pradžioje."]],
tk:"Patarimai",tt:"Kaip protingai rinktis papildus",tl:"Paprasti įpročiai, padedantys nepasiduoti garsiems žodžiams. Tai bendri šviečiamieji patarimai, o ne asmeninės medicininės rekomendacijos.",
tips:[["Skaitykite etiketę","Žiūrėkite ne tik į garsų šūkį priekyje, bet ir į sudėtį bei kiekį porcijoje."],["Tai ne vaistas","Papildai nėra skirti ligoms diagnozuoti, gydyti ar jų profilaktikai."],["Paklauskite specialisto","Jei esate nėščia, vartojate vaistus ar sergate, pirmiausia pasitarkite su gydytoju ar vaistininku."],["Saugokitės stebuklų","„Garantuota“, „iškart“, „gydo viską“ — įspėjamieji ženklai. Taip pat ir atsiliepimai, kurių neįmanoma patikrinti."],["Patikrinkite pardavėją","Ar yra aiškūs kontaktai, grąžinimo sąlygos ir visa kaina prieš mokant?"],["Pažiūrėkite į datą","Rekomendacijos keičiasi. Pasitikėkite medžiaga su data ir nurodytais šaltiniais."]],
tn:"Čia pateikta informacija nepakeičia kvalifikuoto sveikatos priežiūros specialisto konsultacijos.",
wk:"Kaip tai veikia",wt:"Keturi žingsniai, nieko slapto",steps:[["Ateinate ir skaitote","Atidarote apžvalgą ar gidą ir iškart matote, koks tai produktas ir kas parašyta etiketėje."],["Palyginate","Naudojatės kontroliniu sąrašu: sudėtis, įspėjimai, šaltiniai, pardavėjo sąlygos."],["Patikrinate patys","Pažiūrite šaltinius ir pardavėjo svetainę. Mes duodame nuorodas, sprendimas jūsų."],["Pastebite ženklinimus","Jei medžiagoje yra partnerio nuoroda arba galime gauti atlygį, tai aiškiai nurodoma prieš paspaudžiant."]],
wn:"Prieinamumą, kainą ir sąlygas nustato pardavėjai. Useful Habit neparduoda, nepristato ir nekontroliuoja trečiųjų šalių produktų ar paslaugų.",
ik:"Svarbi informacija",it:"Paprasti faktai apie šią svetainę",il:"Kas yra ši svetainė, kaip ji gali uždirbti ir kur baigiasi mūsų atsakomybė.",
imp:[["Informacinis pobūdis","Apžvalgos ir gidai yra bendro šviečiamojo pobūdžio ir nėra pritaikyti konkrečiam žmogui."],["Ne vaistai ir ne medicininis patarimas","Papildai nėra vaistai ir nėra skirti jokiai ligai diagnozuoti, gydyti ar jos profilaktikai. Useful Habit nėra medicinos įstaiga, o svetainės medžiaga nėra medicininis patarimas."],["Jokių rezultato garantijų","Organizmo reakcija individuali. Negarantuojame jokio rezultato."],["Komerciniai ryšiai","Galime gauti atlygį iš trečiųjų šalių dėl nagrinėjamų produktų. Tai atskleidžiama pačioje medžiagoje."],["Pardavėjai ir sąlygos","Produktus tiekia jų pardavėjai, kurie nustato kainą, sąlygas ir prieinamumą. Prieš pirkdami patikrinkite juos patys."],["Atsakomybė","Taikytinos teisės leidžiamu mastu neatsakome už trečiųjų šalių turinį, produktus ar paslaugas. Niekas čia neriboja atsakomybės, kurios įstatymu apriboti negalima, įskaitant privalomas vartotojų teises."],["Regioninis prieinamumas","Papildų taisyklės įvairiose šalyse skiriasi; kai kurie produktai ar teiginiai gali būti ne visur leidžiami."],["Aktualumas ir pakeitimai","Informacija gali pasenti ar pasikeisti be įspėjimo."],["Duomenys ir sąlygos","Kaip tvarkome duomenis, aprašyta <a href=\"#privacy\">Privatumo politikoje</a>, o svetainės naudojimo taisyklės — <a href=\"#terms\">Naudojimo sąlygose</a>."]],
in:"Šis puslapis aprašo tikrąją svetainės veiklą. Jis nėra būdas išvengti atsakomybės ar reklamos taisyklių.",
fd:"Maisto papildų apžvalgos ir gidai paprasta kalba.",fh1:"Navigacija",fh2:"Teisinė informacija",fh3:"Kontaktai",fp:"Privatumo politika",ft:"Naudojimo sąlygos",fr:"Visos teisės saugomos.",back:"← Į pradžią",upd:"2026 m. spalio 30 d. redakcija",lnote:"Teisiniai dokumentai kol kas pateikiami tik ukrainiečių kalba."};
T.lv={title:"Useful Habit — Uztura bagātinātāji un kompleksi: apskati, sastāvs un īpašības",desc:"Uztura bagātinātāju un kompleksu apskati: sastāvs, sastāvdaļu nozīme, īpašības, brīdinājumi un dažādu ražotāju produktu salīdzinājums.",
nav:["Sākums","Par mums","Apskati un raksti","Padomi","Kā tas darbojas","Svarīga informācija"],
hk:"Informācija • Apskati • Produkti",h1:"Uztura bagātinātāji un kompleksi: <em>apskati, sastāvs un īpašības</em>",hp:"Iepazīstiet uztura bagātinātāju un specializēto produktu pasauli. Mēs analizējam sastāvu, skaidrojam katras sastāvdaļas nozīmi, apskatām īpašības un brīdinājumus un salīdzinām dažādu ražotāju kompleksus un produktus.<br><br>Saprotama informācija, praktiski apskati un salīdzinājumi palīdz labāk iepazīt piedāvājumu un izdarīt apzinātu izvēli.",c1:"Par mums",c2:"Kā tas darbojas",ch:["Bagātinātāji nav zāles","Komerciālās saites atklātas","Nekādu rezultāta garantiju"],
ak:"Par mums",at:"Kas mēs esam un ar ko nodarbojamies",al:"Useful Habit ir vietne, kas publicē paša veidotus apskatus un ceļvežus par uztura bagātinātājiem. Mēs stāstām tikai to, kas atbilst patiesībai, un nepiedēvējam sev kvalifikāciju vai statusu, ko nevaram apstiprināt.",
about:[["Misija","Skaidrot bagātinātājus saprotami un godīgi, lai varētu salīdzināt variantus un izlemt pats."],["Ko jūs saņemat","Apskati vienkāršā valodā ar sastāvu, nozīmi, brīdinājumiem un avotiem, kā arī skaidras atzīmes uz jebkura komerciāla satura."],["Principi","Skaidrība skaļu vārdu vietā. Nekādu apgalvojumu par ārstēšanu vai garantētu rezultātu. Katras komerciālās attiecības tiek atklātas."],["Ticamība","Tiecamies pēc precīzas un aktuālas informācijas, balstāmies uz oficiāliem un primārajiem avotiem, datējam materiālus un atjaunojam vai noņemam novecojušos."],["Komercmodelis","Vietne var reklamēt trešo pušu produktus, un mēs par to varam saņemt atlīdzību. Mēs to vienmēr norādām materiālā, un atlīdzība nemaina mūsu sniegtos faktus."],["Kas mēs neesam","Mēs neesam aptieka, klīnika vai ārstniecības iestāde un nesniedzam medicīniskus padomus. Produktus piegādā to pārdevēji, kas nosaka cenu, nosacījumus un pieejamību."]],
rk:"Apskati un raksti",rt:"Analizējam bagātinātājus tā, kā paskaidrotu draugam",rl:"Kas rakstīts uz etiķetes, ko saka avoti un kam vērts pievērst uzmanību — katrs apskats to aptver. Visi materiāli veidoti vienādi, tāpēc tos viegli salīdzināt.",
inc:[["Kas ir sastāvā","Kas tieši ir burciņā un kādā daudzumā — kā norādījis ražotājs, bez skaistiem vārdiem."],["Kam tas paredzēts","Kam ražotājs bagātinātāju pozicionē. Bez solījumiem kaut ko izārstēt."],["Ko saka avoti","Skatāmies pētījumus un oficiālos datus un sniedzam saites, lai varat pārbaudīt paši."],["Kam jāuzmanās","Grūtniecēm, zāļu lietotājiem vai cilvēkiem ar hroniskām slimībām — vispirms pie ārsta. Sakām to tieši."],["Cena un nosacījumi","Cik tas maksā un kādos apstākļos to piedāvā pārdevējs, ar pārbaudes datumu."],["Godīgi par ieņēmumiem","Ja no produkta varam gūt ieņēmumus, jūs par to izlasīsiet apskata sākumā."]],
tk:"Padomi",tt:"Kā saprātīgi izvēlēties bagātinātājus",tl:"Vienkārši ieradumi, kas palīdz nenoticēt skaļiem vārdiem. Tie ir vispārēji izglītojoši padomi, nevis personiski medicīniski ieteikumi.",
tips:[["Lasiet etiķeti","Skatieties ne tikai uz skaļo saukli priekšpusē, bet arī uz sastāvu un daudzumu porcijā."],["Tās nav zāles","Bagātinātāji nav paredzēti slimību diagnosticēšanai, ārstēšanai vai profilaksei."],["Pajautājiet speciālistam","Ja esat grūtniece, lietojat zāles vai Jums ir slimība, vispirms konsultējieties ar ārstu vai farmaceitu."],["Sargieties no brīnumiem","„Garantēti“, „uzreiz“, „ārstē visu“ ir brīdinājuma signāli. Tāpat kā atsauksmes, ko nevar pārbaudīt."],["Pārbaudiet pārdevēju","Vai ir skaidri kontakti, atgriešanas nosacījumi un pilna cena pirms maksāšanas?"],["Skatieties datumu","Ieteikumi mainās. Uzticieties materiāliem ar datumu un norādītiem avotiem."]],
tn:"Šeit sniegtā informācija neaizstāj konsultāciju pie kvalificēta veselības aprūpes speciālista.",
wk:"Kā tas darbojas",wt:"Četri soļi, nekā slēpta",steps:[["Ienākat un lasāt","Atverat apskatu vai ceļvedi un uzreiz redzat, kas tas par produktu un kas rakstīts uz etiķetes."],["Salīdzināt","Izmantojat kontrolsarakstu: sastāvs, brīdinājumi, avoti, pārdevēja nosacījumi."],["Pārbaudat paši","Apskatāt avotus un pārdevēja vietni. Mēs sniedzam saites, lēmums ir jūsu."],["Pamanāt atzīmes","Ja materiālā ir partnera saite vai varam saņemt atlīdzību, tas skaidri norādīts pirms noklikšķināšanas."]],
wn:"Pieejamību, cenu un nosacījumus nosaka pārdevēji. Useful Habit nepārdod, nepiegādā un nekontrolē trešo pušu produktus vai pakalpojumus.",
ik:"Svarīga informācija",it:"Vienkārši fakti par šo vietni",il:"Kas ir šī vietne, kā tā var pelnīt un kur beidzas mūsu atbildība.",
imp:[["Informatīvs raksturs","Apskati un ceļveži ir vispārēji un izglītojoši, un nav pielāgoti konkrētam cilvēkam."],["Nav zāles un nav medicīnisks padoms","Bagātinātāji nav zāles un nav paredzēti nevienas slimības diagnosticēšanai, ārstēšanai vai profilaksei. Useful Habit nav ārstniecības iestāde, un vietnes materiāli nav medicīnisks padoms."],["Nekādu rezultāta garantiju","Organisma reakcija ir individuāla. Mēs negarantējam nekādu rezultātu."],["Komerciālās attiecības","Mēs varam saņemt atlīdzību no trešajām pusēm saistībā ar apskatītajiem produktiem. Tas tiek atklāts pašā materiālā."],["Pārdevēji un nosacījumi","Produktus piegādā to pārdevēji, kas nosaka cenu, nosacījumus un pieejamību. Pārbaudiet tos paši pirms pirkuma."],["Atbildība","Piemērojamo tiesību aktu pieļautajā apjomā mēs neatbildam par trešo pušu saturu, produktiem vai pakalpojumiem. Nekas šeit neierobežo atbildību, ko ar likumu nevar ierobežot, tostarp obligātās patērētāju tiesības."],["Reģionālā pieejamība","Noteikumi par bagātinātājiem dažādās valstīs atšķiras; daži produkti vai apgalvojumi var nebūt atļauti visur."],["Aktualitāte un izmaiņas","Informācija var novecot vai mainīties bez brīdinājuma."],["Dati un noteikumi","Kā rīkojamies ar datiem, aprakstīts <a href=\"#privacy\">Privātuma politikā</a>, bet vietnes lietošanas noteikumi — <a href=\"#terms\">Lietošanas noteikumos</a>."]],
in:"Šī lapa apraksta vietnes faktisko darbību. Tā nav veids, kā izvairīties no atbildības vai reklāmas noteikumiem.",
fd:"Uztura bagātinātāju apskati un ceļveži vienkāršā valodā.",fh1:"Navigācija",fh2:"Juridiskā informācija",fh3:"Kontakti",fp:"Privātuma politika",ft:"Lietošanas noteikumi",fr:"Visas tiesības aizsargātas.",back:"← Uz sākumu",upd:"2026. gada 30. oktobra redakcija",lnote:"Juridiskie dokumenti pašlaik pieejami tikai ukraiņu valodā."};
T.id={title:"Useful Habit — Suplemen makanan dan kompleks: ulasan, komposisi, dan fitur",desc:"Ulasan suplemen makanan dan kompleks: komposisi, fungsi bahan, karakteristik, peringatan, dan perbandingan produk dari berbagai produsen.",
nav:["Beranda","Tentang Kami","Ulasan & Artikel","Tips","Cara Kerja","Informasi Penting"],
hk:"Informasi • Ulasan • Produk",h1:"Suplemen makanan dan kompleks: <em>ulasan, komposisi, dan fitur</em>",hp:"Jelajahi dunia suplemen makanan dan produk khusus. Kami mengurai komposisi, menjelaskan fungsi setiap bahan, membahas karakteristik dan peringatan, serta membandingkan kompleks dan produk dari berbagai produsen.<br><br>Informasi yang jelas, ulasan praktis, dan perbandingan yang membantu Anda mengenal pilihan produk dan membuat keputusan yang tepat.",c1:"Tentang Kami",c2:"Cara Kerja",ch:["Suplemen bukan obat","Hubungan komersial diungkapkan","Tanpa jaminan hasil"],
ak:"Tentang Kami",at:"Siapa kami dan apa yang kami lakukan",al:"Useful Habit adalah situs yang memublikasikan ulasan dan panduan sendiri tentang suplemen makanan. Kami hanya menyampaikan apa yang benar dan tidak mengklaim kualifikasi atau status yang tidak dapat kami buktikan.",
about:[["Misi","Menjelaskan suplemen dengan jelas dan jujur agar Anda dapat membandingkan pilihan dan memutuskan sendiri."],["Yang Anda dapatkan","Ulasan dengan bahasa sederhana yang memuat komposisi, tujuan, peringatan, dan sumber, serta label jelas pada setiap konten komersial."],["Prinsip","Kejelasan, bukan sensasi. Tanpa klaim penyembuhan atau hasil yang dijamin. Setiap hubungan komersial diungkapkan."],["Akurasi","Kami berupaya menyajikan informasi yang akurat dan terkini, merujuk pada sumber resmi dan primer, mencantumkan tanggal materi, serta memperbarui atau menghapus yang sudah usang."],["Model bisnis","Situs ini dapat mempromosikan produk pihak ketiga dan kami dapat menerima kompensasi untuk itu. Kami selalu menyebutkannya dalam materi, dan kompensasi tidak mengubah fakta yang kami sajikan."],["Yang bukan kami","Kami bukan apotek, klinik, atau lembaga medis dan tidak memberikan saran medis. Produk disediakan oleh penjualnya, yang menetapkan harga, ketentuan, dan ketersediaan."]],
rk:"Ulasan & Artikel",rt:"Kami mengulas suplemen seperti menjelaskannya kepada seorang teman",rl:"Apa yang tertulis di label, apa kata sumber, dan hal apa yang patut diperhatikan — semuanya ada di setiap ulasan. Semua materi disusun dengan struktur yang sama, sehingga mudah dibandingkan.",
inc:[["Apa isinya","Apa persisnya yang ada di dalam wadah dan berapa jumlahnya — sesuai yang dinyatakan produsen, tanpa kata-kata indah."],["Untuk apa","Untuk apa produsen memposisikan suplemen ini. Tanpa janji menyembuhkan apa pun."],["Apa kata sumber","Kami melihat penelitian dan data resmi serta memberikan tautan agar Anda dapat memeriksa sendiri."],["Siapa yang perlu berhati-hati","Ibu hamil, orang yang minum obat atau punya kondisi kronis — ke dokter dulu. Kami menyatakannya secara langsung."],["Harga dan ketentuan","Berapa harganya dan dengan ketentuan apa penjual menawarkannya, lengkap dengan tanggal pengecekan."],["Jujur soal penghasilan","Jika kami dapat memperoleh penghasilan dari suatu produk, Anda akan membacanya di awal ulasan."]],
tk:"Tips",tt:"Cara memilih suplemen dengan bijak",tl:"Kebiasaan sederhana yang membantu Anda tidak terpancing kata-kata bombastis. Ini adalah tips edukatif umum, bukan rekomendasi medis pribadi.",
tips:[["Baca labelnya","Jangan hanya melihat slogan mencolok di depan, tetapi komposisi dan jumlah per sajian."],["Ini bukan obat","Suplemen tidak dimaksudkan untuk mendiagnosis, mengobati, atau mencegah penyakit."],["Tanyakan ahlinya","Jika Anda hamil, minum obat, atau memiliki penyakit, bicarakan dulu dengan dokter atau apoteker."],["Waspadai keajaiban","“Dijamin”, “instan”, “menyembuhkan semua” adalah tanda bahaya. Begitu juga ulasan yang tidak dapat diverifikasi."],["Periksa penjualnya","Apakah ada kontak yang jelas, ketentuan pengembalian, dan harga total sebelum membayar?"],["Lihat tanggalnya","Rekomendasi berubah. Percayai materi yang bertanggal dan mencantumkan sumber."]],
tn:"Informasi di sini tidak menggantikan konsultasi dengan tenaga kesehatan yang berkualifikasi.",
wk:"Cara Kerja",wt:"Empat langkah, tanpa yang disembunyikan",steps:[["Masuk dan baca","Buka ulasan atau panduan dan langsung lihat produk apa itu dan apa yang tertulis di label."],["Bandingkan","Gunakan daftar periksa: komposisi, peringatan, sumber, ketentuan penjual."],["Periksa sendiri","Lihat sumber dan situs penjual. Kami memberikan tautan, keputusan ada di tangan Anda."],["Perhatikan label","Jika materi memuat tautan mitra atau kami dapat menerima kompensasi, hal itu dinyatakan jelas sebelum Anda mengeklik."]],
wn:"Ketersediaan, harga, dan ketentuan ditetapkan oleh penjual. Useful Habit tidak menjual, mengirim, atau mengendalikan produk maupun layanan pihak ketiga.",
ik:"Informasi Penting",it:"Fakta sederhana tentang situs ini",il:"Apa situs ini, bagaimana situs ini dapat memperoleh penghasilan, dan di mana tanggung jawab kami berakhir.",
imp:[["Bersifat informatif","Ulasan dan panduan bersifat umum dan edukatif, serta tidak disesuaikan untuk individu tertentu."],["Bukan obat, bukan saran medis","Suplemen bukan obat dan tidak dimaksudkan untuk mendiagnosis, mengobati, menyembuhkan, atau mencegah penyakit apa pun. Useful Habit bukan lembaga medis dan materinya bukan saran medis."],["Tanpa jaminan hasil","Respons tubuh bersifat individual. Kami tidak menjamin hasil apa pun."],["Hubungan komersial","Kami dapat menerima kompensasi dari pihak ketiga terkait produk yang kami bahas. Hal ini diungkapkan dalam materi itu sendiri."],["Penjual dan ketentuan","Produk disediakan oleh penjualnya, yang menetapkan harga, ketentuan, dan ketersediaan. Periksa sendiri sebelum membeli."],["Tanggung jawab","Sejauh diizinkan oleh hukum yang berlaku, kami tidak bertanggung jawab atas konten, produk, atau layanan pihak ketiga. Tidak ada ketentuan di sini yang membatasi tanggung jawab yang tidak dapat dibatasi oleh hukum, termasuk hak wajib konsumen."],["Ketersediaan regional","Aturan tentang suplemen berbeda di tiap negara; sebagian produk atau klaim mungkin tidak diizinkan di semua tempat."],["Kebaruan dan perubahan","Informasi dapat menjadi usang atau berubah tanpa pemberitahuan."],["Data dan ketentuan","Cara kami menangani data dijelaskan dalam <a href=\"#privacy\">Kebijakan Privasi</a>, dan aturan penggunaan situs dalam <a href=\"#terms\">Ketentuan Penggunaan</a>."]],
in:"Halaman ini menjelaskan aktivitas sebenarnya dari situs. Halaman ini bukan cara untuk menghindari tanggung jawab atau aturan periklanan.",
fd:"Ulasan dan panduan suplemen makanan dengan bahasa sederhana.",fh1:"Navigasi",fh2:"Informasi hukum",fh3:"Kontak",fp:"Kebijakan Privasi",ft:"Ketentuan Penggunaan",fr:"Hak cipta dilindungi.",back:"← Kembali ke beranda",upd:"Versi 30 Oktober 2026",lnote:"Dokumen hukum saat ini hanya tersedia dalam bahasa Ukraina."};
T.ms={title:"Useful Habit — Suplemen makanan dan kompleks: ulasan, komposisi dan ciri",desc:"Ulasan suplemen makanan dan kompleks: komposisi, fungsi bahan, ciri, amaran dan perbandingan produk pelbagai pengeluar.",
nav:["Laman Utama","Tentang Kami","Ulasan & Artikel","Petua","Cara Ia Berfungsi","Maklumat Penting"],
hk:"Maklumat • Ulasan • Produk",h1:"Suplemen makanan dan kompleks: <em>ulasan, komposisi dan ciri</em>",hp:"Terokai dunia suplemen makanan dan produk khusus. Kami menghuraikan komposisi, menjelaskan fungsi setiap bahan, membincangkan ciri dan amaran, serta membandingkan kompleks dan produk daripada pelbagai pengeluar.<br><br>Maklumat yang jelas, ulasan praktikal dan perbandingan yang membantu anda mengenali pilihan produk dan membuat keputusan yang bijak.",c1:"Tentang Kami",c2:"Cara Ia Berfungsi",ch:["Suplemen bukan ubat","Hubungan komersial didedahkan","Tiada jaminan hasil"],
ak:"Tentang Kami",at:"Siapa kami dan apa yang kami lakukan",al:"Useful Habit ialah laman web yang menerbitkan ulasan dan panduan sendiri tentang suplemen makanan. Kami hanya menyampaikan perkara yang benar dan tidak mendakwa kelayakan atau status yang tidak dapat kami buktikan.",
about:[["Misi","Menerangkan suplemen dengan jelas dan jujur supaya anda boleh membandingkan pilihan dan membuat keputusan sendiri."],["Apa yang anda dapat","Ulasan dalam bahasa mudah dengan komposisi, tujuan, amaran dan sumber, serta label yang jelas pada sebarang kandungan komersial."],["Prinsip","Kejelasan berbanding sensasi. Tiada dakwaan penyembuhan atau hasil terjamin. Setiap hubungan komersial didedahkan."],["Ketepatan","Kami berusaha memberi maklumat yang tepat dan terkini, merujuk sumber rasmi dan primer, menandakan tarikh bahan serta mengemas kini atau membuang yang usang."],["Model perniagaan","Laman ini mungkin mempromosikan produk pihak ketiga dan kami mungkin menerima ganjaran. Kami sentiasa menyatakannya dalam bahan, dan ganjaran tidak mengubah fakta yang kami sampaikan."],["Apa yang kami bukan","Kami bukan farmasi, klinik atau institusi perubatan dan tidak memberi nasihat perubatan. Produk dibekalkan oleh penjualnya, yang menetapkan harga, syarat dan ketersediaan."]],
rk:"Ulasan & Artikel",rt:"Kami mengupas suplemen seperti kami menerangkannya kepada seorang kawan",rl:"Apa yang tertulis pada label, apa kata sumber dan apa yang patut diberi perhatian — semuanya ada dalam setiap ulasan. Semua bahan disusun dengan struktur yang sama, jadi mudah dibandingkan.",
inc:[["Apa kandungannya","Apa sebenarnya di dalam bekas dan berapa jumlahnya — seperti yang dinyatakan pengeluar, tanpa kata-kata indah."],["Untuk apa","Untuk apa pengeluar meletakkan suplemen ini. Tanpa janji menyembuhkan apa-apa."],["Apa kata sumber","Kami meneliti kajian dan data rasmi serta memberi pautan supaya anda boleh menyemak sendiri."],["Siapa perlu berhati-hati","Wanita hamil, mereka yang mengambil ubat atau mempunyai keadaan kronik — jumpa doktor dahulu. Kami menyatakannya secara terus."],["Harga dan syarat","Berapa harganya dan dengan syarat apa penjual menawarkannya, berserta tarikh semakan."],["Jujur tentang pendapatan","Jika kami boleh memperoleh pendapatan daripada sesuatu produk, anda akan membacanya di awal ulasan."]],
tk:"Petua",tt:"Cara memilih suplemen dengan bijak",tl:"Tabiat mudah yang membantu anda tidak terpengaruh kata-kata hebat. Ini petua pendidikan am, bukan cadangan perubatan peribadi.",
tips:[["Baca label","Jangan hanya lihat slogan lantang di hadapan, tetapi komposisi dan jumlah setiap hidangan."],["Ia bukan ubat","Suplemen tidak bertujuan mendiagnosis, merawat atau mencegah penyakit."],["Tanya pakar","Jika anda hamil, mengambil ubat atau mempunyai penyakit, berbincang dengan doktor atau ahli farmasi dahulu."],["Berhati-hati dengan keajaiban","“Dijamin”, “serta-merta”, “menyembuhkan semua” ialah tanda amaran. Begitu juga ulasan yang tidak dapat disahkan."],["Semak penjual","Adakah terdapat hubungan yang jelas, syarat pemulangan dan harga penuh sebelum membayar?"],["Lihat tarikh","Cadangan berubah. Percayai bahan yang bertarikh dan menyebut sumber."]],
tn:"Maklumat di sini tidak menggantikan konsultasi dengan profesional kesihatan yang layak.",
wk:"Cara Ia Berfungsi",wt:"Empat langkah, tiada yang tersembunyi",steps:[["Masuk dan baca","Buka ulasan atau panduan dan terus lihat produk apa itu dan apa yang tertulis pada label."],["Bandingkan","Gunakan senarai semak: komposisi, amaran, sumber, syarat penjual."],["Semak sendiri","Lihat sumber dan laman web penjual. Kami beri pautan, keputusan di tangan anda."],["Perhatikan label","Jika bahan mengandungi pautan rakan kongsi atau kami boleh menerima ganjaran, ia dinyatakan dengan jelas sebelum anda klik."]],
wn:"Ketersediaan, harga dan syarat ditetapkan oleh penjual. Useful Habit tidak menjual, menghantar atau mengawal produk atau perkhidmatan pihak ketiga.",
ik:"Maklumat Penting",it:"Fakta mudah tentang laman ini",il:"Apa laman ini, bagaimana ia boleh memperoleh pendapatan dan di mana tanggungjawab kami berakhir.",
imp:[["Sifat bermaklumat","Ulasan dan panduan bersifat am dan pendidikan serta tidak disesuaikan untuk individu tertentu."],["Bukan ubat, bukan nasihat perubatan","Suplemen bukan ubat dan tidak bertujuan mendiagnosis, merawat, menyembuhkan atau mencegah sebarang penyakit. Useful Habit bukan institusi perubatan dan bahannya bukan nasihat perubatan."],["Tiada jaminan hasil","Tindak balas badan adalah individu. Kami tidak menjamin sebarang hasil."],["Hubungan komersial","Kami mungkin menerima ganjaran daripada pihak ketiga berkaitan produk yang dibincangkan. Ini didedahkan dalam bahan itu sendiri."],["Penjual dan syarat","Produk dibekalkan oleh penjualnya, yang menetapkan harga, syarat dan ketersediaan. Semak sendiri sebelum membeli."],["Tanggungjawab","Setakat yang dibenarkan oleh undang-undang yang terpakai, kami tidak bertanggungjawab ke atas kandungan, produk atau perkhidmatan pihak ketiga. Tiada apa di sini mengehadkan tanggungjawab yang tidak boleh dihadkan oleh undang-undang, termasuk hak wajib pengguna."],["Ketersediaan serantau","Peraturan suplemen berbeza mengikut negara; sesetengah produk atau dakwaan mungkin tidak dibenarkan di semua tempat."],["Kemas kini dan perubahan","Maklumat mungkin menjadi lapuk atau berubah tanpa notis."],["Data dan terma","Cara kami mengendalikan data diterangkan dalam <a href=\"#privacy\">Dasar Privasi</a>, dan peraturan penggunaan laman dalam <a href=\"#terms\">Terma Penggunaan</a>."]],
in:"Halaman ini menerangkan aktiviti sebenar laman. Ia bukan cara untuk mengelak tanggungjawab atau peraturan pengiklanan.",
