T.bg.legal={privacy:{t:"Политика за поверителност",s:[
["Кои сме ние","Настоящата Политика обяснява как Useful Habit („Сайтът“, „ние“) обработва личните данни на посетителите. Администратор: Useful Habit, контакт: useful.habit@outlook.com. Сайтът се управлява от Украйна. Когато ОРЗД се прилага спрямо Вас, обработваме данните в съответствие с Регламент (ЕС) 2016/679 (ОРЗД) и националното законодателство."],
["Какви данни обработваме","Данни, които предоставяте Вие:|име, телефонен номер, имейл адрес и съобщение, ако ни пишете или изпращате формуляр за запитване;|Автоматично събирани данни:|IP адрес, тип устройство и браузър, език, разгледани страници, час на посещението, източник на прехода, UTM маркери и рекламни идентификатори на клик (напр. gclid, fbclid);|бисквитки и сходни технологии (раздел 6).|Не искаме специални категории данни, включително данни за здравето. Моля, не ги въвеждайте във формуляри и съобщения."],
["Цели и правни основания","Обработваме данни, за да:|отговорим на Вашето съобщение или запитване (чл. 6, пар. 1, б. „б“ ОРЗД — стъпки по Ваше искане, или Вашето съгласие по чл. 6, пар. 1, б. „а“);|предадем запитването Ви на партньор или продавач на продукт, когато изпратите формуляр с такова уведомление (съгласие, чл. 6, пар. 1, б. „а“);|поддържаме сигурността на Сайта и предотвратяваме измами и автоматизирани злоупотреби (законен интерес, чл. 6, пар. 1, б. „е“, преценен спрямо Вашите права);|измерваме трафика, подобряваме Сайта и измерваме рекламата (съгласие, чл. 6, пар. 1, б. „а“, чрез банера за бисквитки);|изпълняваме законови задължения (чл. 6, пар. 1, б. „в“)."],
["Получатели","Не продаваме Вашите данни. Те могат да бъдат предоставени на:|партньори и продавачи на продукти — само ако сами сте им изпратили запитване чрез формуляр; те действат като самостоятелни администратори по собствените си политики;|доставчици на услуги (хостинг, имейл, защита от спам, аналитични и рекламни услуги, включително Google и Meta), които обработват данни от наше име или при собствени условия, в рамките на услугите си;|публични органи, когато законът го изисква."],
["Международно предаване","Сайтът се управлява от Украйна, извън ЕС/ЕИП, а някои доставчици се намират извън ЕИП (напр. в САЩ). Когато е необходимо, предаването се основава на гаранции по глава V от ОРЗД, като стандартните договорни клаузи на Европейската комисия, а данните се обработват само доколкото е нужно за посочените цели."],
["Бисквитки","Необходимите бисквитки осигуряват работата на Сайта (напр. запазване на езика) и не изискват съгласие. Аналитичните и рекламните бисквитки се задават само след Вашето съгласие, което можете да промените или оттеглите по всяко време също толкова лесно, колкото е дадено, както и в настройките на браузъра. Това отговаря на Директива 2002/58/ЕО, транспонирана в националното право. Google и Meta обработват данните от бисквитките по собствените си политики."],
["Срокове на съхранение","Съхраняваме данните не по-дълго от необходимото:|кореспонденция — до 3 години;|данни от формуляри за запитване — до 12 месеца след последния контакт, освен ако закон или правен спор изисква по-дълго;|технически журнали — до 12 месеца;|бисквитки — за сроковете, посочени в настройките за съгласие.|След това данните се изтриват или анонимизират."],
["Вашите права","Съгласно ОРЗД имате право:|на достъп до данните (чл. 15) и на копие;|на коригиране (чл. 16);|на изтриване (чл. 17);|на ограничаване на обработването (чл. 18);|на преносимост на данните (чл. 20);|на възражение срещу обработване на основание законен интерес (чл. 21);|да оттеглите съгласието си по всяко време, без това да засяга законосъобразността на предходното обработване (чл. 7, пар. 3);|да подадете жалба до надзорния орган — в България Комисията за защита на личните данни (КЗЛД) — или до органа в държавата на Вашето обичайно местопребиваване, работа или предполагаемо нарушение (чл. 77).|За да упражните правата си, пишете на useful.habit@outlook.com. Не вземаме решения, основани единствено на автоматизирано обработване, които пораждат правни последици за Вас."],
["Сигурност","Прилагаме разумни организационни и технически мерки, включително HTTPS и ограничен достъп. Никое предаване през интернет не е напълно сигурно."],
["Непълнолетни","Сайтът не е предназначен за лица под 18 години и съзнателно не събираме техни данни. Ако смятате, че дете ни е изпратило данни, пишете ни и ще ги изтрием."],
["Промени","Актуалната версия винаги е публикувана на тази страница с дата. Ако промяната засяга обработване, изискващо съгласие, ще я приложим само след ново съгласие."],
["Контакти","По въпроси за защита на данните пишете на useful.habit@outlook.com."]]},
terms:{t:"Условия за ползване",s:[
["Общи положения","Тези Условия уреждат ползването на сайта Useful Habit („Сайтът“). Ползвайки Сайта, Вие ги приемате; ако не сте съгласни, не го ползвайте. Сайтът е предназначен за лица на 18 или повече години."],
["Какво представлява Сайтът","Сайтът публикува с информационна цел прегледи, статии и съвети за хранителни добавки. Useful Habit не е производител, продавач или доставчик на добавки, нито аптека или лечебно заведение и не продава, не доставя и не приема плащания за такива продукти."],
["Не е медицински съвет","Хранителните добавки са храни, а не лекарства. Материалите ни са общи и образователни и не са медицински, фармацевтичен, диетичен или друг професионален съвет. Не представяме никоя хранителна добавка като способна да предотврати, лекува или излекува заболяване. Когато посочваме твърдение за здравето, то е или разрешено здравно твърдение по смисъла на Регламент (ЕО) № 1924/2006, или твърдение на производителя, което обозначаваме като такова. Преди прием на добавки, особено по време на бременност или кърмене, при прием на лекарства, хронично заболяване или алергия, се консултирайте с лекар. Не отлагайте посещение при лекар и не прекратявайте лечение заради информация от Сайта."],
["Липса на гаранции","Реакцията на организма е индивидуална. Не гарантираме резултат от разглежданите продукти, нито че материалите са пълни, безгрешни или актуални, макар да се стремим към това."],
["Търговски връзки","Сайтът може да съдържа връзки към ресурси на трети страни и търговски отношения с тях. Ако можем да получим възнаграждение (напр. комисиона или плащане за предадено запитване или покупка), го посочваме в материала преди да последвате връзката. Възнаграждението не променя представените факти, но имайте предвид, че може да имаме финансов интерес."],
["Продавачи и продукти на трети страни","Цената, условията, наличността, съставът, етикетирането, доставката, връщането и качеството на продуктите се определят и осигуряват от техните продавачи и производители. Договор за продажба сключвате директно с тях и се прилагат техните условия и политики за поверителност, включително законовите права на потребителя, като правото на отказ. Проверете ги преди покупка. Не контролираме ресурсите на трети страни и не отговаряме за съдържанието или действията им."],
["Правила за ползване","Задължавате се да не:|ползвате Сайта незаконно или в нарушение на права на трети лица;|пречите на работата на Сайта, заобикаляте защитата или събирате данни с автоматизирани средства без разрешение;|изпращате неверни данни или данни на други лица без тяхно съгласие;|разпространявате зловреден софтуер."],
["Интелектуална собственост","Текстовете, дизайнът, логото на Useful Habit и други материали са защитени от авторското право. Копирането, разпространението и преработването без писмено разрешение са забранени, освен цитиране в рамките на допустимото по закон с позоваване на Сайта. Имената и търговските марки на продуктите принадлежат на техните собственици и се използват само за идентификация."],
["Отговорност","Доколкото е допустимо от приложимото право, не носим отговорност за вреди от ползването на информацията от Сайта, неговата недостъпност или действия на трети лица. Нищо в тези Условия не изключва и не ограничава отговорност, която не може да бъде изключена или ограничена по закон, включително за умисъл или груба небрежност, за смърт или телесна повреда, както и Вашите императивни потребителски права."],
["Промени","Можем да променяме Сайта и тези Условия. Новата версия се прилага от публикуването ѝ на тази страница с посочената дата; продължаването на ползването означава приемане."],
["Приложимо право и спорове","Тези Условия се уреждат от правото на Украйна, без да Ви лишават от императивните разпоредби за защита на потребителите на държавата на Вашето обичайно местопребиваване. Ако сте потребител в ЕС, можете да заведете дело пред съдилищата в държавата на Вашето пребиваване. Първо се опитваме да уредим всяка жалба по взаимно съгласие."],
["Контакти","При въпроси или жалби пишете на useful.habit@outlook.com."]]}};
T.cs.legal={privacy:{t:"Zásady ochrany osobních údajů",s:[
["Kdo jsme","Tyto Zásady vysvětlují, jak Useful Habit (dále „Web“, „my“) zpracovává osobní údaje návštěvníků. Správce: Useful Habit, kontakt: useful.habit@outlook.com. Web je provozován z Ukrajiny. Pokud se na Vás vztahuje GDPR, zpracováváme údaje v souladu s nařízením (EU) 2016/679 (GDPR) a vnitrostátními předpisy."],
["Jaké údaje zpracováváme","Údaje, které poskytnete Vy:|jméno, telefonní číslo, e-mail a text zprávy, pokud nám píšete nebo odešlete formulář s dotazem;|Údaje shromažďované automaticky:|IP adresa, typ zařízení a prohlížeče, jazyk, zobrazené stránky, čas návštěvy, zdroj přístupu, UTM značky a reklamní identifikátory kliknutí (např. gclid, fbclid);|soubory cookie a obdobné technologie (bod 6).|Nevyžadujeme zvláštní kategorie údajů, včetně údajů o zdraví. Nezadávejte je prosím do formulářů ani zpráv."],
["Účely a právní základy","Údaje zpracováváme, abychom:|odpověděli na Vaši zprávu či dotaz (čl. 6 odst. 1 písm. b) GDPR — kroky na Vaši žádost, nebo Váš souhlas dle čl. 6 odst. 1 písm. a);|předali Váš dotaz partnerovi či prodejci produktu, když odešlete formulář s takovým upozorněním (souhlas, čl. 6 odst. 1 písm. a);|zajistili bezpečnost Webu a předešli podvodům a automatizovanému zneužití (oprávněný zájem, čl. 6 odst. 1 písm. f), po zvážení proti Vašim právům);|měřili návštěvnost, zlepšovali Web a měřili reklamu (souhlas, čl. 6 odst. 1 písm. a), prostřednictvím cookie lišty);|plnili zákonné povinnosti (čl. 6 odst. 1 písm. c))."],
["Příjemci","Vaše údaje neprodáváme. Mohou být předány:|partnerům a prodejcům produktů — pouze pokud jste jim sami odeslali dotaz přes formulář; jednají jako samostatní správci podle vlastních zásad;|poskytovatelům služeb (hosting, e-mail, ochrana před spamem, analytické a reklamní služby včetně Google a Meta), kteří údaje zpracovávají naším jménem nebo za vlastních podmínek v rozsahu svých služeb;|orgánům veřejné moci, pokud to vyžaduje zákon."],
["Předávání do třetích zemí","Web je provozován z Ukrajiny, mimo EU/EHP, a někteří poskytovatelé sídlí mimo EHP (např. v USA). Je-li to nutné, předání se opírá o záruky podle kapitoly V GDPR, například standardní smluvní doložky Evropské komise, a údaje zpracováváme jen v rozsahu potřebném pro výše uvedené účely."],
["Soubory cookie","Nezbytné cookie zajišťují chod Webu (např. uložení jazyka) a souhlas nevyžadují. Analytické a reklamní cookie nastavujeme až po Vašem souhlasu, který můžete kdykoli změnit či odvolat stejně snadno, jako byl udělen, i v nastavení prohlížeče. Odpovídá to směrnici 2002/58/ES provedené ve vnitrostátním právu. Google a Meta zpracovávají údaje z cookie podle vlastních zásad."],
["Doba uložení","Údaje uchováváme nejdéle po dobu nezbytnou:|korespondence — až 3 roky;|údaje z formulářů s dotazem — až 12 měsíců od posledního kontaktu, pokud zákon nebo právní nárok nevyžaduje déle;|technické záznamy — až 12 měsíců;|cookie — po dobu uvedenou v nastavení souhlasu.|Poté jsou údaje vymazány nebo anonymizovány."],
["Vaše práva","Podle GDPR máte právo:|na přístup k údajům (čl. 15) a na jejich kopii;|na opravu (čl. 16);|na výmaz (čl. 17);|na omezení zpracování (čl. 18);|na přenositelnost údajů (čl. 20);|vznést námitku proti zpracování na základě oprávněného zájmu (čl. 21);|kdykoli odvolat souhlas, aniž by tím byla dotčena zákonnost dřívějšího zpracování (čl. 7 odst. 3);|podat stížnost u dozorového úřadu — v České republice u Úřadu pro ochranu osobních údajů (ÚOOÚ) — nebo u úřadu ve státě svého bydliště, zaměstnání či místa údajného porušení (čl. 77).|Při uplatnění práv pište na useful.habit@outlook.com. Nepřijímáme rozhodnutí založená výhradně na automatizovaném zpracování, která by měla na Vás právní účinky."],
["Zabezpečení","Používáme přiměřená organizační a technická opatření, včetně HTTPS a omezení přístupu. Žádný přenos internetem není zcela bezpečný."],
["Nezletilí","Web není určen osobám mladším 18 let a vědomě o nich neshromažďujeme údaje. Pokud se domníváte, že nám dítě poslalo údaje, napište nám a vymažeme je."],
["Změny","Aktuální verze je vždy zveřejněna na této stránce s datem. Týká-li se změna zpracování vyžadujícího souhlas, použijeme ji až po získání nového souhlasu."],
["Kontakt","K otázkám ochrany údajů pište na useful.habit@outlook.com."]]},
terms:{t:"Podmínky použití",s:[
["Obecná ustanovení","Tyto Podmínky upravují používání webu Useful Habit (dále „Web“). Používáním Webu je přijímáte; pokud nesouhlasíte, Web nepoužívejte. Web je určen osobám starším 18 let."],
["Čím Web je","Web publikuje pro informační účely recenze, články a rady o doplňcích stravy. Useful Habit není výrobcem, prodejcem ani dodavatelem doplňků, lékárnou ani zdravotnickým zařízením a takové produkty neprodává, nedodává ani za ně nepřijímá platby."],
["Není to lékařská rada","Doplňky stravy jsou potraviny, nikoli léky. Naše materiály jsou obecné a vzdělávací a nejsou lékařskou, farmaceutickou, dietologickou ani jinou odbornou radou. Žádný doplněk stravy neprezentujeme jako prostředek, který by předcházel nemocem, léčil je či vyléčil. Pokud uvádíme zdravotní tvrzení, jde buď o schválené zdravotní tvrzení ve smyslu nařízení (ES) č. 1924/2006, nebo o tvrzení výrobce, které jako takové označujeme. Před použitím doplňků, zejména v těhotenství či při kojení, při užívání léků, chronickém onemocnění nebo alergii, se poraďte s lékařem. Neodkládejte návštěvu lékaře ani nepřerušujte léčbu kvůli informacím z Webu."],
["Žádné záruky","Reakce organismu je individuální. Nezaručujeme žádný výsledek z probíraných produktů ani úplnost, bezchybnost či aktuálnost materiálů, i když o to usilujeme."],
["Obchodní vazby","Web může obsahovat odkazy na zdroje třetích stran a obchodní vazby s nimi. Pokud můžeme získat odměnu (např. provizi či platbu za předaný dotaz nebo nákup), uvádíme to v materiálu před přechodem na odkaz. Odměna nemění předkládaná fakta, mějte však na paměti, že můžeme mít finanční zájem."],
["Prodejci a produkty třetích stran","Cenu, podmínky, dostupnost, složení, označení, dodání, vrácení a kvalitu produktů určují a zajišťují jejich prodejci a výrobci. Kupní smlouvu uzavíráte přímo s nimi a platí pro Vás jejich podmínky a zásady ochrany osobních údajů, včetně zákonných práv spotřebitele, například práva odstoupit od smlouvy. Ověřte si je před nákupem. Zdroje třetích stran nekontrolujeme a neodpovídáme za jejich obsah ani jednání."],
["Pravidla používání","Zavazujete se, že nebudete:|používat Web v rozporu se zákonem nebo s porušením práv třetích osob;|zasahovat do provozu Webu, obcházet jeho ochranu ani automatizovaně sbírat data bez povolení;|zasílat nepravdivé údaje či údaje jiných osob bez jejich souhlasu;|šířit škodlivý software."],
["Duševní vlastnictví","Texty, design, logo Useful Habit a další materiály jsou chráněny autorským právem. Kopírování, šíření a úpravy bez písemného souhlasu jsou zakázány, s výjimkou citace v mezích zákona s odkazem na Web. Názvy a ochranné známky produktů patří jejich vlastníkům a jsou užívány jen k identifikaci."],
["Odpovědnost","V rozsahu povoleném právními předpisy neneseme odpovědnost za škody vzniklé použitím informací z Webu, jeho nedostupností nebo jednáním třetích osob. Nic v těchto Podmínkách nevylučuje ani neomezuje odpovědnost, kterou nelze zákonem vyloučit či omezit, včetně odpovědnosti za úmysl či hrubou nedbalost, za smrt či újmu na zdraví a Vašich kogentních spotřebitelských práv."],
["Změny","Web i tyto Podmínky můžeme měnit. Nová verze platí od zveřejnění na této stránce s uvedeným datem; další používání znamená souhlas."],
["Rozhodné právo a spory","Tyto Podmínky se řídí právem Ukrajiny, aniž by Vás zbavovaly kogentních ustanovení o ochraně spotřebitele státu Vašeho obvyklého bydliště. Jste-li spotřebitelem v EU, můžete se domáhat práv u soudů státu svého bydliště. Každou stížnost se nejprve snažíme vyřešit dohodou."],
["Kontakt","S dotazy či stížnostmi pište na useful.habit@outlook.com."]]}};
T.sk.legal={privacy:{t:"Zásady ochrany osobných údajov",s:[
["Kto sme","Tieto Zásady vysvetľujú, ako Useful Habit (ďalej „Web“, „my“) spracúva osobné údaje návštevníkov. Prevádzkovateľ: Useful Habit, kontakt: useful.habit@outlook.com. Web je prevádzkovaný z Ukrajiny. Ak sa na Vás vzťahuje GDPR, spracúvame údaje v súlade s nariadením (EÚ) 2016/679 (GDPR) a vnútroštátnymi predpismi."],
["Aké údaje spracúvame","Údaje, ktoré poskytnete Vy:|meno, telefónne číslo, e-mail a text správy, ak nám píšete alebo odošlete formulár s otázkou;|Údaje zhromažďované automaticky:|IP adresa, typ zariadenia a prehliadača, jazyk, zobrazené stránky, čas návštevy, zdroj prístupu, UTM značky a reklamné identifikátory kliknutí (napr. gclid, fbclid);|súbory cookie a podobné technológie (bod 6).|Nežiadame osobitné kategórie údajov vrátane údajov o zdraví. Nezadávajte ich, prosím, do formulárov ani správ."],
["Účely a právne základy","Údaje spracúvame, aby sme:|odpovedali na Vašu správu alebo otázku (čl. 6 ods. 1 písm. b) GDPR — kroky na Vašu žiadosť, alebo Váš súhlas podľa čl. 6 ods. 1 písm. a);|odovzdali Vašu otázku partnerovi alebo predajcovi produktu, keď odošlete formulár s takým upozornením (súhlas, čl. 6 ods. 1 písm. a);|zabezpečili bezpečnosť Webu a predchádzali podvodom a automatizovanému zneužitiu (oprávnený záujem, čl. 6 ods. 1 písm. f), po zvážení voči Vašim právam);|merali návštevnosť, zlepšovali Web a merali reklamu (súhlas, čl. 6 ods. 1 písm. a), prostredníctvom cookie lišty);|plnili zákonné povinnosti (čl. 6 ods. 1 písm. c))."],
["Príjemcovia","Vaše údaje nepredávame. Môžu byť poskytnuté:|partnerom a predajcom produktov — len ak ste im sami odoslali otázku cez formulár; konajú ako samostatní prevádzkovatelia podľa vlastných zásad;|poskytovateľom služieb (hosting, e-mail, ochrana pred spamom, analytické a reklamné služby vrátane Google a Meta), ktorí údaje spracúvajú v našom mene alebo za vlastných podmienok v rozsahu svojich služieb;|orgánom verejnej moci, ak to vyžaduje zákon."],
["Prenos do tretích krajín","Web je prevádzkovaný z Ukrajiny, mimo EÚ/EHP, a niektorí poskytovatelia sídlia mimo EHP (napr. v USA). Ak je to potrebné, prenos sa opiera o záruky podľa kapitoly V GDPR, napríklad štandardné zmluvné doložky Európskej komisie, a údaje spracúvame len v rozsahu potrebnom na uvedené účely."],
["Súbory cookie","Nevyhnutné cookie zabezpečujú fungovanie Webu (napr. uloženie jazyka) a súhlas nevyžadujú. Analytické a reklamné cookie nastavujeme až po Vašom súhlase, ktorý môžete kedykoľvek zmeniť alebo odvolať rovnako ľahko, ako bol udelený, aj v nastaveniach prehliadača. Zodpovedá to smernici 2002/58/ES prebratej do vnútroštátneho práva. Google a Meta spracúvajú údaje z cookie podľa vlastných zásad."],
["Doba uchovávania","Údaje uchovávame najviac po dobu nevyhnutnú:|korešpondencia — až 3 roky;|údaje z formulárov s otázkou — až 12 mesiacov od posledného kontaktu, ak zákon alebo právny nárok nevyžaduje dlhšie;|technické záznamy — až 12 mesiacov;|cookie — po dobu uvedenú v nastaveniach súhlasu.|Potom sa údaje vymažú alebo anonymizujú."],
["Vaše práva","Podľa GDPR máte právo:|na prístup k údajom (čl. 15) a na ich kópiu;|na opravu (čl. 16);|na vymazanie (čl. 17);|na obmedzenie spracúvania (čl. 18);|na prenosnosť údajov (čl. 20);|namietať proti spracúvaniu na základe oprávneného záujmu (čl. 21);|kedykoľvek odvolať súhlas bez vplyvu na zákonnosť predchádzajúceho spracúvania (čl. 7 ods. 3);|podať sťažnosť dozornému orgánu — na Slovensku Úradu na ochranu osobných údajov Slovenskej republiky — alebo orgánu v štáte Vášho bydliska, zamestnania či miesta údajného porušenia (čl. 77).|Pri uplatnení práv píšte na useful.habit@outlook.com. Neprijímame rozhodnutia založené výlučne na automatizovanom spracúvaní, ktoré by mali právne účinky voči Vám."],
["Zabezpečenie","Používame primerané organizačné a technické opatrenia vrátane HTTPS a obmedzenia prístupu. Žiaden prenos internetom nie je úplne bezpečný."],
["Maloletí","Web nie je určený osobám mladším ako 18 rokov a vedome o nich nezhromažďujeme údaje. Ak sa domnievate, že nám dieťa poslalo údaje, napíšte nám a vymažeme ich."],
["Zmeny","Aktuálna verzia je vždy zverejnená na tejto stránke s dátumom. Ak sa zmena týka spracúvania vyžadujúceho súhlas, použijeme ju až po získaní nového súhlasu."],
["Kontakt","K otázkam ochrany údajov píšte na useful.habit@outlook.com."]]},
terms:{t:"Podmienky používania",s:[
["Všeobecné ustanovenia","Tieto Podmienky upravujú používanie webu Useful Habit (ďalej „Web“). Používaním Webu ich prijímate; ak nesúhlasíte, Web nepoužívajte. Web je určený osobám starším ako 18 rokov."],
["Čím Web je","Web uverejňuje na informačné účely recenzie, články a rady o výživových doplnkoch. Useful Habit nie je výrobcom, predajcom ani dodávateľom doplnkov, lekárňou ani zdravotníckym zariadením a takéto produkty nepredáva, nedodáva ani za ne neprijíma platby."],
["Nie je to lekárska rada","Výživové doplnky sú potraviny, nie lieky. Naše materiály sú všeobecné a vzdelávacie a nie sú lekárskou, farmaceutickou, dietologickou ani inou odbornou radou. Žiadny výživový doplnok neprezentujeme ako prostriedok, ktorý by predchádzal chorobám, liečil ich alebo vyliečil. Ak uvádzame zdravotné tvrdenie, ide buď o schválené zdravotné tvrdenie v zmysle nariadenia (ES) č. 1924/2006, alebo o tvrdenie výrobcu, ktoré ako také označujeme. Pred použitím doplnkov, najmä v tehotenstve či pri dojčení, pri užívaní liekov, chronickom ochorení alebo alergii, sa poraďte s lekárom. Neodkladajte návštevu lekára ani neprerušujte liečbu kvôli informáciám z Webu."],
["Žiadne záruky","Reakcia organizmu je individuálna. Nezaručujeme žiadny výsledok z prerokúvaných produktov ani úplnosť, bezchybnosť či aktuálnosť materiálov, hoci sa o to usilujeme."],
["Obchodné väzby","Web môže obsahovať odkazy na zdroje tretích strán a obchodné väzby s nimi. Ak môžeme získať odmenu (napr. províziu alebo platbu za odovzdanú otázku či nákup), uvádzame to v materiáli pred prechodom na odkaz. Odmena nemení predkladané fakty, myslite však na to, že môžeme mať finančný záujem."],
["Predajcovia a produkty tretích strán","Cenu, podmienky, dostupnosť, zloženie, označenie, dodanie, vrátenie a kvalitu produktov určujú a zabezpečujú ich predajcovia a výrobcovia. Kúpnu zmluvu uzatvárate priamo s nimi a platia pre Vás ich podmienky a zásady ochrany osobných údajov vrátane zákonných práv spotrebiteľa, napríklad práva odstúpiť od zmluvy. Overte si ich pred nákupom. Zdroje tretích strán nekontrolujeme a nezodpovedáme za ich obsah ani konanie."],
["Pravidlá používania","Zaväzujete sa, že nebudete:|používať Web v rozpore so zákonom alebo s porušením práv tretích osôb;|zasahovať do prevádzky Webu, obchádzať jeho ochranu ani automatizovane zbierať dáta bez povolenia;|zasielať nepravdivé údaje či údaje iných osôb bez ich súhlasu;|šíriť škodlivý softvér."],
["Duševné vlastníctvo","Texty, dizajn, logo Useful Habit a ďalšie materiály sú chránené autorským právom. Kopírovanie, šírenie a úpravy bez písomného súhlasu sú zakázané, okrem citovania v medziach zákona s odkazom na Web. Názvy a ochranné známky produktov patria ich vlastníkom a používajú sa len na identifikáciu."],
["Zodpovednosť","V rozsahu povolenom právnymi predpismi nezodpovedáme za škody vzniknuté použitím informácií z Webu, jeho nedostupnosťou alebo konaním tretích osôb. Nič v týchto Podmienkach nevylučuje ani neobmedzuje zodpovednosť, ktorú nemožno zákonom vylúčiť či obmedziť, vrátane zodpovednosti za úmysel alebo hrubú nedbanlivosť, za smrť či ujmu na zdraví a Vašich kogentných spotrebiteľských práv."],
["Zmeny","Web aj tieto Podmienky môžeme meniť. Nová verzia platí od zverejnenia na tejto stránke s uvedeným dátumom; ďalšie používanie znamená súhlas."],
["Rozhodné právo a spory","Tieto Podmienky sa riadia právom Ukrajiny, bez toho, aby Vás zbavovali kogentných ustanovení o ochrane spotrebiteľa štátu Vášho obvyklého pobytu. Ak ste spotrebiteľom v EÚ, môžete sa domáhať práv na súdoch štátu svojho bydliska. Každú sťažnosť sa najprv snažíme vyriešiť dohodou."],
["Kontakt","S otázkami či sťažnosťami píšte na useful.habit@outlook.com."]]}};
T.hu.legal={privacy:{t:"Adatvédelmi irányelvek",s:[
["Kik vagyunk","Ez az Irányelv bemutatja, hogyan kezeli a Useful Habit (a továbbiakban „Oldal”, „mi”) a látogatók személyes adatait. Adatkezelő: Useful Habit, elérhetőség: useful.habit@outlook.com. Az Oldalt Ukrajnából üzemeltetik. Ha Önre a GDPR vonatkozik, az adatokat a (EU) 2016/679 rendelettel (GDPR) és a nemzeti jogszabályokkal összhangban kezeljük."],
["Milyen adatokat kezelünk","Ön által megadott adatok:|név, telefonszám, e-mail-cím és üzenet, ha ír nekünk vagy kérdőívet küld az Oldalon;|Automatikusan gyűjtött adatok:|IP-cím, eszköz- és böngészőtípus, nyelv, megtekintett oldalak, a látogatás ideje, a belépés forrása, UTM-címkék és hirdetési kattintásazonosítók (pl. gclid, fbclid);|sütik és hasonló technológiák (6. pont).|Különleges adatkategóriákat, így egészségügyi adatokat nem kérünk. Kérjük, ne adja meg ezeket űrlapokon vagy üzenetekben."],
["Célok és jogalapok","Az adatokat azért kezeljük, hogy:|válaszoljunk üzenetére vagy kérésére (GDPR 6. cikk (1) bekezdés b) pont — az Ön kérésére történő lépések, vagy az Ön hozzájárulása, 6. cikk (1) a) pont);|továbbítsuk kérését egy termék partneréhez vagy eladójához, ha ilyen tájékoztatást tartalmazó űrlapot küld (hozzájárulás, 6. cikk (1) a) pont);|biztosítsuk az Oldal biztonságát, megelőzzük a csalásokat és az automatizált visszaéléseket (jogos érdek, 6. cikk (1) f) pont, az Ön jogaival mérlegelve);|mérjük a forgalmat, fejlesszük az Oldalt és mérjük a hirdetések hatékonyságát (hozzájárulás, 6. cikk (1) a) pont, a süti-sávon keresztül);|teljesítsük jogi kötelezettségeinket (6. cikk (1) c) pont)."],
["Címzettek","Adatait nem adjuk el. Átadhatók:|termékek partnereinek és eladóinak — csak ha Ön maga küldött nekik kérést űrlapon; ők önálló adatkezelőként járnak el saját irányelveik szerint;|szolgáltatóknak (tárhely, e-mail, spamvédelem, elemző és hirdetési szolgáltatások, köztük a Google és a Meta), akik nevünkben vagy saját feltételeik szerint, szolgáltatásaik keretében kezelik az adatokat;|hatóságoknak, ha a jog előírja."],
["Nemzetközi adattovábbítás","Az Oldalt Ukrajnából, az EU/EGT-n kívülről üzemeltetik, és egyes szolgáltatók az EGT-n kívül találhatók (pl. az USA-ban). Ahol szükséges, az adattovábbítás a GDPR V. fejezete szerinti garanciákon, például az Európai Bizottság általános szerződési feltételein alapul, és az adatokat csak a fenti célokhoz szükséges mértékben kezeljük."],
["Sütik","A szükséges sütik az Oldal működéséhez kellenek (pl. a nyelv megjegyzése), hozzájárulást nem igényelnek. Az elemző és hirdetési sütiket csak az Ön hozzájárulása után állítjuk be; ezt bármikor, a megadással azonos egyszerűséggel módosíthatja vagy visszavonhatja, valamint a böngésző beállításaiban is. Ez megfelel a nemzeti jogba átültetett 2002/58/EK irányelvnek. A Google és a Meta a süti-adatokat saját irányelvei szerint kezeli."],
["Megőrzési idő","Az adatokat csak a szükséges ideig őrizzük:|levelezés — legfeljebb 3 év;|kérdőívek adatai — az utolsó kapcsolatfelvételtől legfeljebb 12 hónap, hacsak jogszabály vagy jogi igény hosszabb időt nem követel;|technikai naplók — legfeljebb 12 hónap;|sütik — a hozzájárulási beállításokban megadott ideig.|Ezt követően az adatokat töröljük vagy anonimizáljuk."],
["Az Ön jogai","A GDPR alapján Önnek joga van:|az adatokhoz való hozzáféréshez (15. cikk) és másolatot kapni;|a helyesbítéshez (16. cikk);|a törléshez (17. cikk);|az adatkezelés korlátozásához (18. cikk);|az adathordozhatósághoz (20. cikk);|tiltakozni a jogos érdeken alapuló adatkezelés ellen (21. cikk);|a hozzájárulását bármikor visszavonni, anélkül hogy ez érintené a korábbi adatkezelés jogszerűségét (7. cikk (3) bekezdés);|panaszt tenni a felügyeleti hatóságnál — Magyarországon a Nemzeti Adatvédelmi és Információszabadság Hatóságnál (NAIH) — vagy a szokásos tartózkodási helye, munkahelye vagy a feltételezett jogsértés helye szerinti államban (77. cikk).|Jogai gyakorlásához írjon a useful.habit@outlook.com címre. Nem hozunk kizárólag automatizált adatkezelésen alapuló, Önre nézve joghatással járó döntéseket."],
["Biztonság","Észszerű szervezési és technikai intézkedéseket alkalmazunk, beleértve a HTTPS-t és a hozzáférés korlátozását. Az interneten keresztüli adattovábbítás nem lehet teljesen biztonságos."],
["Kiskorúak","Az Oldal nem 18 év alattiaknak szól, és tudatosan nem gyűjtünk adatot róluk. Ha úgy véli, hogy gyermek adatot küldött nekünk, írjon, és töröljük."],
["Változások","Az aktuális változat mindig ezen az oldalon olvasható, dátummal. Ha a változás hozzájárulást igénylő adatkezelést érint, azt csak új hozzájárulás beszerzése után alkalmazzuk."],
["Kapcsolat","Adatvédelmi kérdésekben írjon a useful.habit@outlook.com címre."]]},
terms:{t:"Felhasználási feltételek",s:[
["Általános rendelkezések","Ezek a Feltételek a Useful Habit weboldal (a továbbiakban „Oldal”) használatát szabályozzák. Az Oldal használatával elfogadja őket; ha nem ért egyet, ne használja az Oldalt. Az Oldal 18 éven felüliek számára készült."],
["Mi az Oldal","Az Oldal tájékoztató jelleggel értékeléseket, cikkeket és tippeket tesz közzé az étrend-kiegészítőkről. A Useful Habit nem gyártója, eladója vagy szállítója étrend-kiegészítőknek, nem gyógyszertár és nem egészségügyi intézmény, és ilyen termékeket nem árul, nem szállít, és érettük fizetést nem fogad el."],
["Nem orvosi tanács","Az étrend-kiegészítők élelmiszerek, nem gyógyszerek. Anyagaink általános, oktatási jellegűek, és nem minősülnek orvosi, gyógyszerészi, táplálkozási vagy egyéb szakmai tanácsnak. Egyetlen étrend-kiegészítőt sem mutatunk be betegségek megelőzésére, kezelésére vagy gyógyítására alkalmasként. Ha egészségügyi állítást említünk, az vagy az 1924/2006/EK rendelet szerinti engedélyezett egészségügyi állítás, vagy a gyártó állítása, amelyet ekként jelölünk. Kiegészítők szedése előtt, különösen terhesség vagy szoptatás idején, gyógyszerszedés, krónikus betegség vagy allergia esetén kérje orvos tanácsát. Ne halassza el az orvosi vizsgálatot és ne hagyja abba a kezelést az Oldalon olvasottak miatt."],
["Garanciák hiánya","A szervezet reakciója egyéni. Nem garantálunk semmilyen eredményt a tárgyalt termékekkel kapcsolatban, sem az anyagok teljességét, hibamentességét vagy naprakészségét, bár erre törekszünk."],
["Kereskedelmi kapcsolatok","Az Oldal harmadik felek forrásaira mutató hivatkozásokat és velük fennálló kereskedelmi kapcsolatokat tartalmazhat. Ha jutalékot vagy más ellenértéket kaphatunk (pl. továbbított kérés vagy vásárlás után), azt az anyagban jelezzük a hivatkozás követése előtt. Az ellenérték nem változtatja meg az általunk közölt tényeket, de vegye figyelembe, hogy pénzügyi érdekeltségünk lehet."],
["Harmadik fél eladói és termékei","A termékek árát, feltételeit, elérhetőségét, összetételét, jelölését, kiszállítását, visszaküldését és minőségét az eladók és gyártók határozzák meg és biztosítják. Az adásvételi szerződést közvetlenül velük köti, rájuk az ő feltételeik és adatvédelmi irányelveik vonatkoznak, beleértve a törvényes fogyasztói jogokat, például az elállási jogot. Vásárlás előtt ellenőrizze ezeket. Harmadik felek forrásait nem ellenőrizzük, tartalmukért és tetteikért nem felelünk."],
["Használati szabályok","Vállalja, hogy nem:|használja az Oldalt jogellenesen vagy harmadik felek jogainak megsértésével;|avatkozik be az Oldal működésébe, kerüli meg védelmét vagy gyűjt adatokat automatizált eszközökkel engedély nélkül;|küld hamis adatokat vagy mások adatait azok hozzájárulása nélkül;|terjeszt kártékony szoftvert."],
["Szellemi tulajdon","A szövegek, a dizájn, a Useful Habit logó és más anyagok szerzői jogi védelem alatt állnak. Másolásuk, terjesztésük és átdolgozásuk írásbeli engedély nélkül tilos, kivéve a törvény által megengedett idézést az Oldalra való hivatkozással. A termékek nevei és védjegyei tulajdonosaikat illetik, és csak azonosításra használjuk őket."],
["Felelősség","A hatályos jog által megengedett mértékben nem felelünk az Oldal információinak használatából, az elérhetetlenségéből vagy harmadik felek tevékenységéből eredő károkért. E Feltételek egyetlen rendelkezése sem zárja ki vagy korlátozza azt a felelősséget, amelyet jogszabály nem enged kizárni vagy korlátozni, ideértve a szándékos vagy súlyosan gondatlan károkozásért, halálért vagy testi sérülésért való felelősséget és az Ön kógens fogyasztói jogait."],
["Módosítások","Az Oldalt és e Feltételeket módosíthatjuk. Az új változat az ezen az oldalon, a megjelölt dátummal történő közzététellel lép hatályba; a további használat elfogadást jelent."],
["Irányadó jog és viták","E Feltételekre Ukrajna joga az irányadó, anélkül hogy megfosztana a szokásos tartózkodási helye szerinti állam kógens fogyasztóvédelmi rendelkezéseitől. Ha Ön uniós fogyasztó, igényét a lakóhelye szerinti állam bíróságain érvényesítheti. Minden panaszt először megegyezéssel próbálunk rendezni."],
["Kapcsolat","Kérdéseivel és panaszaival írjon a useful.habit@outlook.com címre."]]}};

T.hr.legal={privacy:{t:"Politika privatnosti",s:[
["Tko smo","Ova Politika objašnjava kako Useful Habit (dalje „Stranica”, „mi”) obrađuje osobne podatke posjetitelja. Voditelj obrade: Useful Habit, kontakt: useful.habit@outlook.com. Stranica se vodi iz Ukrajine. Ako se na Vas primjenjuje GDPR, podatke obrađujemo u skladu s Uredbom (EU) 2016/679 (GDPR) i nacionalnim propisima."],
["Koje podatke obrađujemo","Podaci koje Vi dajete:|ime, broj telefona, adresa e-pošte i tekst poruke ako nam pišete ili pošaljete obrazac upita;|Podaci koji se prikupljaju automatski:|IP adresa, vrsta uređaja i preglednika, jezik, pregledane stranice, vrijeme posjeta, izvor dolaska, UTM oznake i identifikatori oglasnih klikova (npr. gclid, fbclid);|kolačići i slične tehnologije (točka 6).|Ne tražimo posebne kategorije podataka, uključujući podatke o zdravlju. Molimo ih ne unosite u obrasce i poruke."],
["Svrhe i pravne osnove","Podatke obrađujemo kako bismo:|odgovorili na Vašu poruku ili upit (čl. 6. st. 1. točka (b) GDPR-a — radnje na Vaš zahtjev, ili Vaša privola, čl. 6. st. 1. točka (a));|proslijedili Vaš upit partneru ili prodavatelju proizvoda kada pošaljete obrazac s takvom obavijesti (privola, čl. 6. st. 1. točka (a));|osigurali sigurnost Stranice te spriječili prijevare i automatiziranu zlouporabu (legitimni interes, čl. 6. st. 1. točka (f), odvagnut u odnosu na Vaša prava);|mjerili promet, poboljšavali Stranicu i mjerili oglašavanje (privola, čl. 6. st. 1. točka (a), putem trake za kolačiće);|ispunili zakonske obveze (čl. 6. st. 1. točka (c))."],
["Primatelji","Ne prodajemo Vaše podatke. Mogu se dati:|partnerima i prodavateljima proizvoda — samo ako ste im sami poslali upit putem obrasca; oni djeluju kao samostalni voditelji obrade prema vlastitim politikama;|pružateljima usluga (hosting, e-pošta, zaštita od neželjene pošte, analitičke i oglasne usluge, uključujući Google i Meta), koji podatke obrađuju u naše ime ili prema vlastitim uvjetima, u opsegu svojih usluga;|tijelima javne vlasti kada to zahtijeva zakon."],
["Međunarodni prijenosi","Stranica se vodi iz Ukrajine, izvan EU-a/EGP-a, a neki pružatelji nalaze se izvan EGP-a (npr. u SAD-u). Kada je potrebno, prijenos se temelji na zaštitnim mjerama iz poglavlja V. GDPR-a, poput standardnih ugovornih klauzula Europske komisije, a podatke obrađujemo samo u mjeri potrebnoj za navedene svrhe."],
["Kolačići","Nužni kolačići omogućuju rad Stranice (npr. pamćenje jezika) i ne traže privolu. Analitičke i oglasne kolačiće postavljamo tek nakon Vaše privole, koju možete u svakom trenutku promijeniti ili povući jednako lako kao što je dana, kao i u postavkama preglednika. To odgovara Direktivi 2002/58/EZ prenesenoj u nacionalno pravo. Google i Meta obrađuju podatke iz kolačića prema vlastitim politikama."],
["Rok čuvanja","Podatke čuvamo najdulje koliko je potrebno:|korespondencija — do 3 godine;|podaci iz obrazaca upita — do 12 mjeseci od posljednjeg kontakta, osim ako zakon ili pravni zahtjev traži dulje;|tehnički zapisi — do 12 mjeseci;|kolačići — za razdoblja navedena u postavkama privole.|Nakon toga podaci se brišu ili anonimiziraju."],
["Vaša prava","Prema GDPR-u imate pravo na:|pristup podacima (čl. 15.) i primitak preslike;|ispravak (čl. 16.);|brisanje (čl. 17.);|ograničenje obrade (čl. 18.);|prenosivost podataka (čl. 20.);|prigovor na obradu temeljenu na legitimnom interesu (čl. 21.);|povlačenje privole u bilo kojem trenutku, bez utjecaja na zakonitost prethodne obrade (čl. 7. st. 3.);|podnošenje pritužbe nadzornom tijelu — u Hrvatskoj Agenciji za zaštitu osobnih podataka (AZOP) — ili tijelu države Vašeg prebivališta, rada ili navodne povrede (čl. 77.).|Za ostvarivanje prava pišite na useful.habit@outlook.com. Ne donosimo odluke utemeljene isključivo na automatiziranoj obradi koje bi imale pravne učinke prema Vama."],
["Sigurnost","Primjenjujemo razumne organizacijske i tehničke mjere, uključujući HTTPS i ograničen pristup. Nijedan prijenos internetom nije posve siguran."],
["Maloljetnici","Stranica nije namijenjena osobama mlađim od 18 godina i svjesno ne prikupljamo njihove podatke. Ako smatrate da nam je dijete poslalo podatke, javite nam se i izbrisat ćemo ih."],
["Izmjene","Aktualna verzija uvijek je objavljena na ovoj stranici s datumom. Ako se izmjena odnosi na obradu koja traži privolu, primijenit ćemo je tek nakon nove privole."],
["Kontakt","Za pitanja o zaštiti podataka pišite na useful.habit@outlook.com."]]},
terms:{t:"Uvjeti korištenja",s:[
["Opće odredbe","Ovi Uvjeti uređuju korištenje web-stranice Useful Habit (dalje „Stranica”). Korištenjem Stranice prihvaćate ih; ako se ne slažete, ne koristite Stranicu. Stranica je namijenjena osobama starijim od 18 godina."],
["Što je Stranica","Stranica u informativne svrhe objavljuje recenzije, članke i savjete o dodacima prehrani. Useful Habit nije proizvođač, prodavatelj ni dobavljač dodataka, nije ljekarna ni zdravstvena ustanova te ne prodaje, ne isporučuje i ne prima plaćanja za takve proizvode."],
["Nije medicinski savjet","Dodaci prehrani su hrana, a ne lijekovi. Naši su materijali opći i edukativni i nisu medicinski, farmaceutski, dijetetski ni drugi stručni savjet. Nijedan dodatak prehrani ne predstavljamo kao sredstvo koje sprječava, liječi ili izliječuje bolest. Kada navodimo zdravstvenu tvrdnju, riječ je ili o odobrenoj zdravstvenoj tvrdnji u smislu Uredbe (EZ) br. 1924/2006 ili o tvrdnji proizvođača, koju tako i označavamo. Prije uporabe dodataka, osobito u trudnoći ili dojenju, uz uzimanje lijekova, kroničnu bolest ili alergiju, posavjetujte se s liječnikom. Ne odgađajte posjet liječniku niti prekidajte liječenje zbog informacija sa Stranice."],
["Bez jamstava","Reakcija organizma je individualna. Ne jamčimo nikakav rezultat obrađenih proizvoda niti potpunost, bezgrešnost ili aktualnost materijala, iako im težimo."],
["Komercijalne veze","Stranica može sadržavati poveznice na resurse trećih strana i komercijalne veze s njima. Ako možemo primiti naknadu (npr. proviziju ili plaćanje za proslijeđen upit ili kupnju), to navodimo u materijalu prije prelaska na poveznicu. Naknada ne mijenja činjenice koje iznosimo, ali imajte na umu da možemo imati financijski interes."],
["Prodavatelji i proizvodi trećih strana","Cijenu, uvjete, dostupnost, sastav, označavanje, isporuku, povrat i kvalitetu proizvoda određuju i osiguravaju njihovi prodavatelji i proizvođači. Ugovor o kupoprodaji sklapate izravno s njima i na Vas se primjenjuju njihovi uvjeti i politike privatnosti, uključujući zakonska prava potrošača, primjerice pravo na jednostrani raskid ugovora. Provjerite ih prije kupnje. Resurse trećih strana ne nadziremo i ne odgovaramo za njihov sadržaj ni postupke."],
["Pravila korištenja","Obvezujete se da nećete:|koristiti Stranicu protuzakonito ili kršeći prava trećih osoba;|ometati rad Stranice, zaobilaziti njezinu zaštitu ni automatizirano prikupljati podatke bez dopuštenja;|slati lažne podatke ni podatke drugih osoba bez njihove privole;|širiti zlonamjerni softver."],
["Intelektualno vlasništvo","Tekstovi, dizajn, logotip Useful Habit i drugi materijali zaštićeni su autorskim pravom. Kopiranje, distribucija i prerada bez pisanog dopuštenja zabranjeni su, osim citiranja u granicama dopuštenima zakonom uz upućivanje na Stranicu. Nazivi i žigovi proizvoda pripadaju njihovim vlasnicima i koriste se samo radi identifikacije."],
["Odgovornost","U mjeri dopuštenoj mjerodavnim pravom ne odgovaramo za štetu nastalu korištenjem informacija sa Stranice, njezinom nedostupnošću ili postupcima trećih strana. Ništa u ovim Uvjetima ne isključuje ni ne ograničava odgovornost koja se zakonom ne može isključiti ni ograničiti, uključujući odgovornost za namjeru ili grubu nepažnju, za smrt ili tjelesnu ozljedu te Vaša obvezna prava potrošača."],
["Izmjene","Stranicu i ove Uvjete možemo mijenjati. Nova verzija vrijedi od objave na ovoj stranici s navedenim datumom; daljnje korištenje znači prihvaćanje."],
["Mjerodavno pravo i sporovi","Ovi Uvjeti podliježu pravu Ukrajine, bez lišavanja Vas obveznih odredaba o zaštiti potrošača države Vašeg uobičajenog boravišta. Ako ste potrošač u EU-u, možete pokrenuti postupak pred sudovima države svog boravišta. Svaku pritužbu najprije pokušavamo riješiti sporazumno."],
["Kontakt","S pitanjima i pritužbama pišite na useful.habit@outlook.com."]]}};
T.sl.legal={privacy:{t:"Politika zasebnosti",s:[
["Kdo smo","Ta Politika pojasnjuje, kako Useful Habit (v nadaljevanju »Spletno mesto«, »mi«) obdeluje osebne podatke obiskovalcev. Upravljavec: Useful Habit, kontakt: useful.habit@outlook.com. Spletno mesto se upravlja iz Ukrajine. Če za vas velja GDPR, podatke obdelujemo v skladu z Uredbo (EU) 2016/679 (GDPR) in nacionalno zakonodajo."],
["Katere podatke obdelujemo","Podatki, ki jih posredujete sami:|ime, telefonska številka, e-poštni naslov in besedilo sporočila, če nam pišete ali pošljete obrazec za povpraševanje;|Samodejno zbrani podatki:|IP-naslov, vrsta naprave in brskalnika, jezik, ogledane strani, čas obiska, vir prihoda, oznake UTM in oglasni identifikatorji klikov (npr. gclid, fbclid);|piškotki in podobne tehnologije (točka 6).|Ne zahtevamo posebnih vrst podatkov, vključno s podatki o zdravju. Prosimo, da jih ne vnašate v obrazce ali sporočila."],
["Nameni in pravne podlage","Podatke obdelujemo, da bi:|odgovorili na vaše sporočilo ali povpraševanje (6. člen, odstavek 1, točka (b) GDPR — ukrepi na vašo zahtevo — ali vaša privolitev, točka (a));|posredovali vaše povpraševanje partnerju ali prodajalcu izdelka, ko pošljete obrazec s takim obvestilom (privolitev, točka (a));|zagotavljali varnost spletnega mesta ter preprečevali goljufije in samodejne zlorabe (zakoniti interes, točka (f), pretehtan glede na vaše pravice);|merili obisk, izboljševali spletno mesto in merili oglaševanje (privolitev, točka (a), prek pasice za piškotke);|izpolnjevali zakonske obveznosti (točka (c))."],
["Prejemniki","Vaših podatkov ne prodajamo. Lahko jih posredujemo:|partnerjem in prodajalcem izdelkov — samo če ste jim povpraševanje poslali sami prek obrazca; delujejo kot samostojni upravljavci po lastnih politikah;|ponudnikom storitev (gostovanje, e-pošta, zaščita pred neželeno pošto, analitične in oglaševalske storitve, vključno z Google in Meta), ki podatke obdelujejo v našem imenu ali po lastnih pogojih, v okviru svojih storitev;|javnim organom, kadar to zahteva zakon."],
["Mednarodni prenosi","Spletno mesto se upravlja iz Ukrajine, zunaj EU/EGP, nekateri ponudniki pa imajo sedež zunaj EGP (npr. v ZDA). Kjer je potrebno, se prenos opira na zaščitne ukrepe iz V. poglavja GDPR, kot so standardne pogodbene klavzule Evropske komisije, podatke pa obdelujemo le v obsegu, potrebnem za zgoraj navedene namene."],
["Piškotki","Nujni piškotki omogočajo delovanje spletnega mesta (npr. shranjevanje jezika) in ne zahtevajo privolitve. Analitične in oglaševalske piškotke nastavimo šele po vaši privolitvi, ki jo lahko kadar koli spremenite ali prekličete enako enostavno, kot je bila dana, in tudi v nastavitvah brskalnika. To ustreza Direktivi 2002/58/ES, prenesenim v nacionalno pravo. Google in Meta podatke iz piškotkov obdelujeta po lastnih politikah."],
["Obdobje hrambe","Podatke hranimo le toliko časa, kot je potrebno:|korespondenca — do 3 leta;|podatki iz obrazcev za povpraševanje — do 12 mesecev po zadnjem stiku, razen če zakon ali pravni zahtevek zahteva dlje;|tehnični dnevniki — do 12 mesecev;|piškotki — za obdobja, navedena v nastavitvah privolitve.|Nato podatke izbrišemo ali anonimiziramo."],
["Vaše pravice","Po GDPR imate pravico do:|dostopa do podatkov (15. člen) in prejema kopije;|popravka (16. člen);|izbrisa (17. člen);|omejitve obdelave (18. člen);|prenosljivosti podatkov (20. člen);|ugovora zoper obdelavo na podlagi zakonitega interesa (21. člen);|preklica privolitve kadar koli, brez vpliva na zakonitost prejšnje obdelave (7. člen, odstavek 3);|pritožbe pri nadzornem organu — v Sloveniji pri Informacijskem pooblaščencu — ali pri organu v državi vašega prebivališča, dela ali domnevne kršitve (77. člen).|Za uveljavljanje pravic pišite na useful.habit@outlook.com. Ne sprejemamo odločitev, ki temeljijo izključno na avtomatizirani obdelavi in imajo pravne učinke za vas."],
["Varnost","Uporabljamo razumne organizacijske in tehnične ukrepe, vključno s HTTPS in omejenim dostopom. Noben prenos po internetu ni povsem varen."],
["Mladoletniki","Spletno mesto ni namenjeno osebam, mlajšim od 18 let, in njihovih podatkov zavestno ne zbiramo. Če menite, da nam je otrok poslal podatke, nam pišite in jih bomo izbrisali."],
["Spremembe","Veljavna različica je vedno objavljena na tej strani z datumom. Če se sprememba nanaša na obdelavo, ki zahteva privolitev, jo bomo uporabili šele po novi privolitvi."],
["Kontakt","Za vprašanja o varstvu podatkov pišite na useful.habit@outlook.com."]]},
terms:{t:"Pogoji uporabe",s:[
["Splošne določbe","Ti Pogoji urejajo uporabo spletnega mesta Useful Habit (v nadaljevanju »Spletno mesto«). Z uporabo Spletnega mesta jih sprejemate; če se ne strinjate, ga ne uporabljajte. Spletno mesto je namenjeno osebam, starim 18 let ali več."],
["Kaj je Spletno mesto","Spletno mesto v informativne namene objavlja ocene, članke in nasvete o prehranskih dopolnilih. Useful Habit ni proizvajalec, prodajalec ali dobavitelj dopolnil, ni lekarna ali zdravstvena ustanova ter takih izdelkov ne prodaja, ne dostavlja in zanje ne sprejema plačil."],
["Ni zdravniški nasvet","Prehranska dopolnila so živila, ne zdravila. Naša gradiva so splošna in izobraževalna ter niso zdravniški, farmacevtski, dietetični ali drug strokovni nasvet. Nobenega prehranskega dopolnila ne predstavljamo kot sredstva, ki preprečuje, zdravi ali ozdravi bolezen. Kadar navedemo zdravstveno trditev, gre bodisi za odobreno zdravstveno trditev v smislu Uredbe (ES) št. 1924/2006 bodisi za trditev proizvajalca, ki jo kot tako tudi označimo. Pred uporabo dopolnil, zlasti med nosečnostjo ali dojenjem, ob jemanju zdravil, kronični bolezni ali alergiji, se posvetujte z zdravnikom. Ne odlašajte z obiskom zdravnika in ne prekinjajte zdravljenja zaradi informacij s Spletnega mesta."],
["Brez jamstev","Odziv telesa je individualen. Ne jamčimo nobenega rezultata obravnavanih izdelkov niti popolnosti, brezhibnosti ali ažurnosti gradiv, čeprav si to prizadevamo."],
["Komercialne povezave","Spletno mesto lahko vsebuje povezave na vire tretjih oseb in komercialne povezave z njimi. Če lahko prejmemo nadomestilo (npr. provizijo ali plačilo za posredovano povpraševanje ali nakup), to navedemo v gradivu pred sledenjem povezavi. Nadomestilo ne spremeni dejstev, ki jih navajamo, a upoštevajte, da imamo lahko finančni interes."],
["Prodajalci in izdelki tretjih oseb","Ceno, pogoje, razpoložljivost, sestavo, označevanje, dostavo, vračila in kakovost izdelkov določajo in zagotavljajo njihovi prodajalci in proizvajalci. Prodajno pogodbo sklenete neposredno z njimi in zanjo veljajo njihovi pogoji in politike zasebnosti, vključno z zakonskimi pravicami potrošnika, na primer pravico do odstopa od pogodbe. Preverite jih pred nakupom. Virov tretjih oseb ne nadziramo in ne odgovarjamo za njihovo vsebino ali ravnanje."],
["Pravila uporabe","Zavezujete se, da ne boste:|uporabljali Spletnega mesta protipravno ali ob kršitvi pravic tretjih oseb;|posegali v delovanje Spletnega mesta, zaobšli njegove zaščite ali samodejno zbirali podatkov brez dovoljenja;|pošiljali lažnih podatkov ali podatkov drugih oseb brez njihove privolitve;|širili zlonamerne programske opreme."],
["Intelektualna lastnina","Besedila, oblikovanje, logotip Useful Habit in druga gradiva so zaščitena z avtorskimi pravicami. Kopiranje, razširjanje in predelava brez pisnega dovoljenja so prepovedani, razen citiranja v mejah, ki jih dovoljuje zakon, s sklicem na Spletno mesto. Imena in blagovne znamke izdelkov pripadajo njihovim lastnikom in se uporabljajo le za identifikacijo."],
["Odgovornost","V obsegu, ki ga dopušča veljavno pravo, ne odgovarjamo za škodo zaradi uporabe informacij s Spletnega mesta, njegove nedosegljivosti ali ravnanj tretjih oseb. Nič v teh Pogojih ne izključuje ali omejuje odgovornosti, ki je po zakonu ni mogoče izključiti ali omejiti, vključno z odgovornostjo za naklep ali hudo malomarnost, za smrt ali telesno poškodbo ter vaših obveznih potrošniških pravic."],
["Spremembe","Spletno mesto in te Pogoje lahko spreminjamo. Nova različica velja od objave na tej strani z navedenim datumom; nadaljnja uporaba pomeni sprejem."],
["Veljavno pravo in spori","Ti Pogoji se urejajo s pravom Ukrajine, ne da bi vas prikrajšali za obvezne določbe o varstvu potrošnikov države vašega običajnega prebivališča. Če ste potrošnik v EU, lahko postopek sprožite pred sodišči države svojega prebivališča. Vsako pritožbo najprej poskušamo rešiti sporazumno."],
["Kontakt","Z vprašanji in pritožbami pišite na useful.habit@outlook.com."]]}};
T.et.legal={privacy:{t:"Privaatsuspoliitika",s:[
["Kes me oleme","See Poliitika selgitab, kuidas Useful Habit (edaspidi „Veebileht“, „meie“) töötleb külastajate isikuandmeid. Vastutav töötleja: Useful Habit, kontakt: useful.habit@outlook.com. Veebilehte hallatakse Ukrainast. Kui sinu suhtes kohaldub isikuandmete kaitse üldmäärus (GDPR), töötleme andmeid kooskõlas määrusega (EL) 2016/679 ja riigisisese õigusega."],
["Milliseid andmeid töötleme","Andmed, mille sa ise esitad:|nimi, telefoninumber, e-posti aadress ja sõnumi tekst, kui kirjutad meile või saadad päringuvormi;|Automaatselt kogutavad andmed:|IP-aadress, seadme ja brauseri tüüp, keel, vaadatud lehed, külastuse aeg, suunamisallikas, UTM-märgendid ja reklaamiklikkide identifikaatorid (nt gclid, fbclid);|küpsised ja sarnased tehnoloogiad (punkt 6).|Me ei küsi eriliiki isikuandmeid, sh terviseandmeid. Palun ära sisesta neid vormidesse ega sõnumitesse."],
["Eesmärgid ja õiguslikud alused","Töötleme andmeid, et:|vastata sinu sõnumile või päringule (GDPR art 6 lg 1 punkt b — sinu taotlusel võetavad meetmed — või sinu nõusolek, punkt a);|edastada sinu päring toote partnerile või müüjale, kui saadad vormi sellise teatega (nõusolek, punkt a);|tagada veebilehe turvalisus ning ennetada pettusi ja automatiseeritud kuritarvitusi (õigustatud huvi, punkt f, kaalutuna sinu õiguste suhtes);|mõõta liiklust, arendada veebilehte ja mõõta reklaami (nõusolek, punkt a, küpsiseriba kaudu);|täita õiguslikke kohustusi (punkt c)."],
["Vastuvõtjad","Me ei müü sinu andmeid. Neid võidakse edastada:|toodete partneritele ja müüjatele — ainult siis, kui oled neile ise vormi kaudu päringu saatnud; nad tegutsevad iseseisvate vastutavate töötlejatena oma põhimõtete alusel;|teenusepakkujatele (majutus, e-post, rämpsposti kaitse, analüütika- ja reklaamiteenused, sh Google ja Meta), kes töötlevad andmeid meie nimel või oma tingimuste alusel oma teenuste ulatuses;|ametiasutustele, kui seadus seda nõuab."],
["Rahvusvaheline edastamine","Veebilehte hallatakse Ukrainast, väljastpoolt ELi/EMPd, ja osa teenusepakkujaid asub väljaspool EMPd (nt USAs). Vajaduse korral toetub edastamine GDPR V peatüki kaitsemeetmetele, näiteks Euroopa Komisjoni tüüptingimustele, ning andmeid töödeldakse vaid ülaltoodud eesmärkide jaoks vajalikus ulatuses."],
["Küpsised","Vajalikud küpsised tagavad veebilehe toimimise (nt keele meelespidamine) ja ei vaja nõusolekut. Analüütika- ja reklaamiküpsised seatakse alles pärast sinu nõusolekut, mida saad igal ajal muuta või tagasi võtta sama lihtsalt kui anda, samuti brauseri seadetes. See vastab riigisisesesse õigusesse ülevõetud direktiivile 2002/58/EÜ. Google ja Meta töötlevad küpsiseandmeid oma põhimõtete alusel."],
["Säilitamine","Säilitame andmeid ainult nii kaua, kui vaja:|kirjavahetus — kuni 3 aastat;|päringuvormide andmed — kuni 12 kuud pärast viimast kontakti, kui seadus või õigusnõue ei nõua kauemat;|tehnilised logid — kuni 12 kuud;|küpsised — nõusolekuseadetes märgitud ajad.|Seejärel andmed kustutatakse või muudetakse anonüümseks."],
["Sinu õigused","GDPRi alusel on sul õigus:|tutvuda andmetega (art 15) ja saada koopia;|andmete parandamisele (art 16);|kustutamisele (art 17);|töötlemise piiramisele (art 18);|andmete ülekandmisele (art 20);|esitada vastuväide õigustatud huvil põhinevale töötlemisele (art 21);|nõusolek igal ajal tagasi võtta, mõjutamata varasema töötlemise seaduslikkust (art 7 lg 3);|esitada kaebus järelevalveasutusele — Eestis Andmekaitse Inspektsioonile — või oma elu-, töö- või väidetava rikkumise koha liikmesriigi asutusele (art 77).|Õiguste kasutamiseks kirjuta aadressil useful.habit@outlook.com. Me ei tee otsuseid, mis põhinevad üksnes automatiseeritud töötlemisel ja millel on sinu suhtes õiguslikud tagajärjed."],
["Turvalisus","Rakendame mõistlikke korralduslikke ja tehnilisi meetmeid, sh HTTPS ja piiratud juurdepääs. Ükski internetis toimuv edastus pole täiesti turvaline."],
["Alaealised","Veebileht ei ole mõeldud alla 18-aastastele ja me ei kogu teadlikult nende andmeid. Kui arvad, et laps on meile andmeid saatnud, kirjuta meile ja kustutame need."],
["Muudatused","Kehtiv versioon on alati sellel lehel kuupäevaga avaldatud. Kui muudatus puudutab nõusolekut vajavat töötlemist, rakendame seda alles uue nõusoleku saamisel."],
["Kontakt","Andmekaitseküsimustes kirjuta aadressil useful.habit@outlook.com."]]},
terms:{t:"Kasutustingimused",s:[
["Üldsätted","Need Tingimused reguleerivad veebilehe Useful Habit (edaspidi „Veebileht“) kasutamist. Veebilehte kasutades nõustud nendega; kui ei nõustu, ära kasuta. Veebileht on mõeldud 18-aastastele ja vanematele."],
["Mis on Veebileht","Veebileht avaldab teavitamise eesmärgil ülevaateid, artikleid ja nõuandeid toidulisandite kohta. Useful Habit ei ole toidulisandite tootja, müüja ega tarnija, apteek ega raviasutus ning ei müü, ei tarni ega võta vastu makseid selliste toodete eest."],
["Ei ole meditsiiniline nõu","Toidulisandid on toiduained, mitte ravimid. Meie materjalid on üldised ja harivad ega ole meditsiiniline, farmatseutiline, toitumisalane ega muu erialane nõu. Me ei esita ühtegi toidulisandit haiguse ennetaja, ravija ega tervendajana. Kui mainime tervisealast väidet, on see kas määruse (EÜ) nr 1924/2006 tähenduses lubatud tervisealane väide või tootja väide, mida nii ka märgime. Enne toidulisandite kasutamist, eriti raseduse või imetamise ajal, ravimite tarvitamisel, kroonilise haiguse või allergia korral pea nõu arstiga. Ära lükka arsti poole pöördumist edasi ega katkesta ravi Veebilehe teabe tõttu."],
["Garantiide puudumine","Organismi reaktsioon on individuaalne. Me ei garanteeri käsitletud toodete mingit tulemust ega materjalide täielikkust, veatust ega ajakohasust, kuigi selleks püüdleme."],
["Ärisuhted","Veebileht võib sisaldada linke kolmandate isikute ressurssidele ja ärisuhteid nendega. Kui võime saada tasu (nt vahendustasu edastatud päringu või ostu eest), märgime selle materjalis enne lingi järgimist. Tasu ei muuda esitatud fakte, kuid pea meeles, et meil võib olla rahaline huvi."],
["Kolmandate isikute müüjad ja tooted","Toodete hinna, tingimused, kättesaadavuse, koostise, märgistuse, tarne, tagastuse ja kvaliteedi määravad ja tagavad nende müüjad ja tootjad. Ostu-müügilepingu sõlmid otse nendega ning sinu suhtes kehtivad nende tingimused ja privaatsuspoliitikad, sh seaduslikud tarbijaõigused, nt taganemisõigus. Kontrolli neid enne ostu. Me ei kontrolli kolmandate isikute ressursse ega vastuta nende sisu ega tegevuse eest."],
["Kasutusreeglid","Kohustud mitte:|kasutama Veebilehte õigusvastaselt või kolmandate isikute õigusi rikkudes;|segama Veebilehe tööd, mööduma selle kaitsest ega koguma andmeid automatiseeritud vahenditega ilma loata;|saatma valeandmeid ega teiste isikute andmeid ilma nende nõusolekuta;|levitama pahavara."],
["Intellektuaalomand","Tekstid, kujundus, Useful Habit logo ja muud materjalid on kaitstud autoriõigusega. Kopeerimine, levitamine ja töötlemine ilma kirjaliku loata on keelatud, välja arvatud seadusega lubatud ulatuses tsiteerimine Veebilehele viitega. Toodete nimed ja kaubamärgid kuuluvad nende omanikele ning neid kasutatakse vaid tuvastamiseks."],
["Vastutus","Kohaldatava õigusega lubatud ulatuses ei vastuta me kahju eest, mis tuleneb Veebilehe teabe kasutamisest, selle kättesaamatusest või kolmandate isikute tegevusest. Miski neis Tingimustes ei välista ega piira vastutust, mida seadusega välistada ega piirata ei saa, sh vastutust tahtluse või raske hooletuse, surma või kehavigastuse eest ning sinu kohustuslikke tarbijaõigusi."],
["Muudatused","Võime Veebilehte ja neid Tingimusi muuta. Uus versioon kehtib selle sellel lehel märgitud kuupäevaga avaldamisest; edasine kasutamine tähendab nõustumist."],
["Kohaldatav õigus ja vaidlused","Neile Tingimustele kohaldub Ukraina õigus, ilma et see võtaks sinult sinu elukohariigi tarbijakaitse kohustuslikest sätetest. Kui oled tarbija ELis, võid hagi esitada oma elukohariigi kohtus. Püüame iga kaebuse esmalt kokkuleppel lahendada."],
["Kontakt","Küsimuste ja kaebustega kirjuta aadressil useful.habit@outlook.com."]]}};
