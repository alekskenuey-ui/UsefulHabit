<form id="leadForm" novalidate>
  <input name="name" placeholder="Ім’я" autocomplete="name" required>
  <input name="phone" type="tel" placeholder="+380 __ ___ __ __" autocomplete="tel" required>
  <input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <label><input type="checkbox" name="consent" required>
    Я погоджуюся на передачу мого імені та номера телефону партнеру й продавцю продукту, який зв’яжеться зі мною за телефоном щодо мого запиту (зокрема для оформлення замовлення), та на обробку даних відповідно до <a href="#privacy">Політики конфіденційності</a>.</label>
  <button type="submit">Надіслати</button><p id="leadMsg" role="status"></p>
</form>
<script>
document.getElementById("leadForm").addEventListener("submit", async function (e) {
  e.preventDefault(); var f = e.target, m = document.getElementById("leadMsg");
  if (!f.reportValidity()) return;
  var q = new URLSearchParams(location.search), b = {
    name: f.name.value, phone: f.phone.value, website: f.website.value, consent: f.consent.checked, consent_v: "2026-10-30",
    mobile: matchMedia("(max-width:760px)").matches ? 1 : 0, gclid: q.get("gclid"), fbclid: q.get("fbclid")
  };
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(function (k) { b[k] = q.get(k); });
  m.textContent = "Надсилаємо…";
  try {
    var r = await (await fetch("/lead.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) })).json();
    m.textContent = r.status === "ok" ? "Дякуємо! Запит надіслано." : r.message; if (r.status === "ok") f.reset();
  } catch (x) { m.textContent = "Помилка з’єднання. Спробуйте ще раз."; }
});
</script>
